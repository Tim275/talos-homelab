---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: drova-api-rate-limit
  namespace: drova
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: drova-api
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: SourceIP
  rateLimit:
    type: Global
    global:
      rules:
        - limit:
            requests: 600
            unit: Minute
          clientSelectors:
            - sourceCIDR:
                value: 0.0.0.0/0
                type: Distinct
        - limit:
            requests: 600
            unit: Minute
          clientSelectors:
            - sourceCIDR:
                value: ::/0
                type: Distinct
  healthCheck:
    active:
      timeout: 3s
      interval: 10s
      unhealthyThreshold: 2
      healthyThreshold: 1
      type: HTTP
      http:
        path: /readyz
        expectedStatuses: [200]
  circuitBreaker:
    maxConnections: 200
    maxPendingRequests: 100
    maxParallelRequests: 200
    maxParallelRetries: 5
  tcpKeepalive:
    idleTime: 30s
    interval: 5s
    probes: 3
  retry:
    numRetries: 2
    perRetry:
      backOff:
        baseInterval: 100ms
        maxInterval: 1s
    retryOn:
      triggers: [connect-failure, refused-stream, reset-before-request, retriable-status-codes]
      httpStatusCodes: [502, 503, 504]
---
