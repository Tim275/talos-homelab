---
# Grundlimit am Gateway: greift fuer jede Route ohne eigene Policy.
# Route-Policies ueberschreiben es vollstaendig (kein mergeType gesetzt).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gateway-baseline-rate-limit
  namespace: gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
  rateLimit:
    type: Global
    global:
      rules:
        - limit:
            requests: 600
            unit: Minute
          clientSelectors:
            - sourceCIDR:
                value: 0.0.0.0/0
                type: Distinct
        - limit:
            requests: 600
            unit: Minute
          clientSelectors:
            - sourceCIDR:
                value: ::/0
                type: Distinct
