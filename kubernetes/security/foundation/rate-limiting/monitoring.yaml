---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: hubble-rate-limit
  namespace: kube-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hubble
  rateLimit:
    type: Global
    global:
      rules:
        - limit:
            requests: 60
            unit: Minute
          clientSelectors:
            - sourceCIDR:
                value: 0.0.0.0/0
                type: Distinct
        - limit:
            requests: 60
            unit: Minute
          clientSelectors:
            - sourceCIDR:
                value: ::/0
                type: Distinct
