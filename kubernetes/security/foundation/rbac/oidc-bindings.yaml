#
#   - sets username to "oidc:<preferred_username>" (because oidc-username-prefix=oidc:)
#   - sets groups to "oidc-grp:<group_name>" (because oidc-groups-prefix=oidc-grp:)
#
#   - LLDAP group cluster-admins → read; cluster-admin only via --as=elevated:cluster-admin
#
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-view
  labels:
    app.kubernetes.io/part-of: rbac-oidc
    app.kubernetes.io/component: oidc-binding
subjects:
  - kind: Group
    name: "oidc-grp:platform-engineers"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "oidc-grp:sre-team"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "oidc-grp:security-team"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "oidc-grp:cluster-admins"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-cluster-reader
  labels:
    app.kubernetes.io/part-of: rbac-oidc
    app.kubernetes.io/component: oidc-binding
subjects:
  - kind: Group
    name: "oidc-grp:cluster-admins"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "oidc-grp:platform-engineers"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "oidc-grp:sre-team"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "oidc-grp:security-team"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-reader
  apiGroup: rbac.authorization.k8s.io
