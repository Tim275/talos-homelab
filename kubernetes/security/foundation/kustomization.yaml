apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac/                              # RBAC policies enabled

  - pod-security/                      # Pod Security Standards enabled

  - network-policies/

  - rate-limiting/                     # BackendTrafficPolicy per service

  # - service-mesh-authz/              # DISABLED - Not implemented yet

labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/part-of: timour-homelab
      app.kubernetes.io/domain: foundation
      app.kubernetes.io/layer: security
      team: timour

commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

