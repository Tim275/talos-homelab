apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno
    version: "3.8.2"
    releaseName: kyverno
    namespace: kyverno
    includeCRDs: true
    valuesInline:
      admissionController:
        replicas: 1
        startupProbe:
          httpGet:
            path: /health/liveness
            port: 9443
            scheme: HTTPS
          initialDelaySeconds: 2
          periodSeconds: 6
          failureThreshold: 50
      backgroundController:
        replicas: 1
      cleanupController:
        replicas: 1
      reportsController:
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
      config:
        webhooks:
          namespaceSelector:  # ersetzt Chart-Default, nicht merged
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:  # failurePolicy Fail auf 1 Replica - Recovery-Pfad muss frei bleiben
                  - kube-system
                  - rook-ceph
                  - argocd
                  - sealed-secrets
      features:
        omitEvents:
          eventTypes:  # ersetzt Chart-Default, nicht merged
            - PolicyApplied
            - PolicySkipped
            - PolicyViolation
        tuf:
          enabled: true
