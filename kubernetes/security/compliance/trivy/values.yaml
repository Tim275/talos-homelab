trivy:
  mode: ClientServer
  serverURL: "http://trivy-service.trivy-system:4954"
  serverServiceName: trivy-service
  storageClassEnabled: true
  storageClassName: rook-ceph-block-enterprise
  storageSize: 5Gi
  ignoreUnfixed: true
  timeout: 10m0s
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

operator:
  builtInTrivyServer: true
  scanJobsConcurrentLimit: 2
  scanJobTTL: 15m
  scannerReportTTL: 24h
  vulnerabilityScannerScanOnlyCurrentRevisions: true
  configAuditScannerEnabled: false
  exposedSecretScannerEnabled: false
  infraAssessmentScannerEnabled: false
  rbacAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  metricsVulnIdEnabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi

serviceMonitor:
  enabled: true

nodeCollector:
  enabled: false

excludeNamespaces: "kube-system,trivy-system"
