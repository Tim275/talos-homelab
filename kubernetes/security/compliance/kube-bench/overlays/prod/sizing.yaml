apiVersion: batch/v1
kind: CronJob
metadata:
  name: kube-bench-cis-policies
  namespace: security
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: kube-bench
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
