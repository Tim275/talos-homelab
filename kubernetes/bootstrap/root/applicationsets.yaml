apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applicationsets
  namespace: argocd
  labels:
    bootstrap.layer: applicationsets
    team: timour
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: argocd
  source:
    repoURL: https://github.com/Tim275/talos-homelab
    targetRevision: main
    path: kubernetes/applicationsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: -1
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
