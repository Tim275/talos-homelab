apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - credentials.yaml

components:
  - ../../components/kube-prometheus-stack

patches:
  - path: sizing.yaml
configMapGenerator:
  - name: cloudflared-config
    namespace: cloudflared
    files:
      - config.yaml
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "3"

images:
  - name: cloudflare/cloudflared
    newTag: 2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
