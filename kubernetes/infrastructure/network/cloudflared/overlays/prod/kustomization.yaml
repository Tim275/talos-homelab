apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - credentials.yaml

components:
  - ../../components/kube-prometheus-stack

patches:
  - path: sizing.yaml
configMapGenerator:
  - name: cloudflared-config
    namespace: cloudflared
    files:
      - config.yaml
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "3"
