apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - credentials.yaml

components:
  - ../../components/kube-prometheus-stack

patches:
  - path: sizing.yaml
configMapGenerator:
  - name: cloudflared-config
    namespace: cloudflared
    files:
      - config.yaml
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "3"

images:
  - name: cloudflare/cloudflared
    newTag: 2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
