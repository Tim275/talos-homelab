apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - credentials.yaml

components:
  - ../../components/kube-prometheus-stack

patches:
  - path: sizing.yaml
configMapGenerator:
  - name: cloudflared-config
    namespace: cloudflared
    files:
      - config.yaml
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "3"

images:
  - name: cloudflare/cloudflared
    newTag: 2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
