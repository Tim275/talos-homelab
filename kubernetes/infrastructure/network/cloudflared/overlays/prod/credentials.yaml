apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflared-credentials
  data:
  - secretKey: credentials.json
    remoteRef:
      key: cloudflared/cloudflared-credentials
      property: credentials.json
