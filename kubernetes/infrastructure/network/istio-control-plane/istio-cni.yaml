apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  version: v1.30.0
  namespace: istio-cni
  values:
    cni:
      resources:
        requests:
          cpu: 25m      # 7d peak 3.4m je Pod
          memory: 100Mi
        limits:
          memory: 256Mi
      ambient:
        enabled: true
      excludeNamespaces:
        - istio-system
        - istio-cni
        - kube-system
