apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: bgp-auth-secret-password
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: kube-system/bgp-auth-secret
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bgp-auth-secret
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: bgp-auth-secret
  data:
  - secretKey: password
    remoteRef:
      key: kube-system/bgp-auth-secret
      property: password
