---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall
spec:
  nodeSelector: {}
  ingress:
    - fromCIDR:
        - "192.168.0.0/24"
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP  # Talos API
            - port: "6443"
              protocol: TCP  # Kubernetes API
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
    - fromCIDR:
        - "100.64.0.0/10"  # Tailscale CGNAT Range
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "51871"
              protocol: UDP  # Cilium WireGuard Port
    - fromCIDR:
        - "192.168.0.0/24"
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP
    - fromEntities:
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "4244"
              protocol: TCP  # Hubble peer gRPC
            - port: "3300"
              protocol: TCP  # Ceph msgr2 (MON)
            - port: "6789"
              protocol: TCP  # Ceph msgr1 (MON)
            - port: "6800"
              endPort: 7568
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "10250"
              protocol: TCP  # Kubelet metrics (Prometheus scraping)
            - port: "9100"
              protocol: TCP  # Node exporter
            - port: "9090"
              protocol: TCP  # Vector agent metrics
            - port: "9962"
              protocol: TCP  # Cilium agent metrics
            - port: "9963"
              protocol: TCP  # Cilium operator metrics
            - port: "9964"
              protocol: TCP  # Cilium envoy metrics
            - port: "9965"
              protocol: TCP  # Hubble metrics
            - port: "2112"
              protocol: TCP  # Tetragon agent metrics
            - port: "9926"
              protocol: TCP  # Rook-Ceph exporter
            - port: "9283"
              protocol: TCP  # Rook-Ceph MGR metrics
            - port: "10257"
              protocol: TCP  # kube-controller-manager metrics
            - port: "10259"
              protocol: TCP  # kube-scheduler metrics
            - port: "2379"
              protocol: TCP  # etcd client/metrics (mTLS enforced)
    - fromEntities:
        - host
        - remote-node
