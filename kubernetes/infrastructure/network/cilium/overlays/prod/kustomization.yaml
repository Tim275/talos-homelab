apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/envoy-gateway

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.20.1
    releaseName: "cilium"
    namespace: kube-system
    includeCRDs: true
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.yaml

patches:
  - path: settings.yaml
