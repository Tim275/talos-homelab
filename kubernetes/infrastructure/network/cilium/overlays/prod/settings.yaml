apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: kube-system
spec:
  hostnames:
    - hubble.timourhomelab.org
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hubble-oidc
  namespace: kube-system
spec:
  oidc:
    provider:
      issuer: https://iam.timourhomelab.org/realms/plattform
      authorizationEndpoint: https://iam.timourhomelab.org/realms/plattform/protocol/openid-connect/auth
      tokenEndpoint: https://iam.timourhomelab.org/realms/plattform/protocol/openid-connect/token
    redirectURL: https://hubble.timourhomelab.org/oauth2/callback
  jwt:
    providers:
      - name: keycloak
        issuer: https://iam.timourhomelab.org/realms/plattform
        remoteJWKS:
          uri: https://iam.timourhomelab.org/realms/plattform/protocol/openid-connect/certs
        extractFrom:
          cookies:
            - AccessToken-Hubble
