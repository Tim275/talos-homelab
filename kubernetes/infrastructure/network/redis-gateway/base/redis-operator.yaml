apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: redis-gateway
  namespace: gateway
  labels:
    app.kubernetes.io/name: redis-gateway
    app.kubernetes.io/component: rate-limit-store
spec:
  # einzelner Pod, an dem das gesamte globale Rate-Limit haengt
  priorityClassName: platform-critical
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis
    imagePullPolicy: IfNotPresent
  redisConfig:
    additionalRedisConfig: redis-gateway-external-config
  redisExporter:
    enabled: false
    image: quay.io/opstree/redis-exporter
