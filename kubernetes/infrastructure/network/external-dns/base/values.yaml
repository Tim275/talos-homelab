provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token

sources:
  - gateway-httproute
  - crd


policy: upsert-only

registry: txt
txtOwnerId: talos-homelab
txtPrefix: _extdns-.

extraArgs:
  - --cloudflare-dns-records-per-page=100
  - --annotation-filter=external-dns.alpha.kubernetes.io/controller notin (tofu)

