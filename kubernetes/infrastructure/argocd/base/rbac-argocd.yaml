configs:
  rbac:
    create: true
    policy.default: ""
    policy.csv: |

      # ROLE: OPERATOR (No Delete!)

      p, role:operator, applications, get, */*, allow
      p, role:operator, applications, sync, */*, allow
      p, role:operator, applications, action/*, */*, allow
      p, role:operator, applications, override, */*, allow
      p, role:operator, applicationsets, get, */*, allow
      p, role:operator, logs, get, */*, allow
      p, role:operator, repositories, get, *, allow
      p, role:operator, clusters, get, *, allow
      p, role:operator, projects, get, *, allow

      g, cluster-admins, role:operator

      # ROLE: DEVELOPER (No Delete!)

      p, role:developer, applications, sync, apps/*, allow
      p, role:developer, applications, action/*, apps/*, allow
      p, role:developer, applications, sync, platform/drova-*, allow
      p, role:developer, applications, action/*, platform/drova-*, allow
      p, role:developer, applications, sync, platform/n8n-*, allow
      p, role:developer, applications, action/*, platform/n8n-*, allow
      p, role:developer, applications, sync, platform/redis-drova, allow
      p, role:developer, applications, sync, platform/redis-n8n, allow
      p, role:developer, applications, get, */*, allow

      p, role:developer, repositories, get, *, allow
      p, role:developer, repositories, list, *, allow

      p, role:developer, clusters, get, *, allow
      p, role:developer, clusters, list, *, allow

      p, role:developer, projects, get, *, allow

      p, role:developer, logs, get, apps/*, allow
      p, role:developer, logs, get, platform/drova-*, allow
      p, role:developer, logs, get, platform/n8n-*, allow
      p, role:developer, logs, get, platform/redis-drova, allow
      p, role:developer, logs, get, platform/redis-n8n, allow

      g, developers, role:developer

      # ROLE: DEPLOYER (CI/CD Bot)

      p, role:deployer, applications, get, */*, allow
      p, role:deployer, applications, sync, apps/*, allow
      p, role:deployer, applications, sync, platform/drova-*, allow
      p, role:deployer, applications, sync, platform/n8n-*, allow
      p, role:deployer, applications, sync, platform/redis-drova, allow
      p, role:deployer, applications, sync, platform/redis-n8n, allow
      p, role:deployer, applications, action/*, apps/*, allow

      g, deployers, role:deployer

      # ROLE: VIEWER (Read-Only)

      p, role:viewer, applications, get, */*, allow
      p, role:viewer, clusters, get, *, allow
      p, role:viewer, repositories, get, *, allow
      p, role:viewer, projects, get, *, allow
      p, role:viewer, logs, get, */*, allow

      p, role:stakeholder, applications, get, */*, allow
      p, role:stakeholder, projects, get, *, allow

      g, viewers, role:stakeholder
      g, platform-engineers, role:viewer
      g, sre-team, role:viewer
      g, security-team, role:viewer

      p, role:drova-admin, applications, sync, apps/drova-*, allow
      p, role:drova-admin, applications, action/*, apps/drova-*, allow
      p, role:drova-admin, applications, sync, platform/drova-*, allow
      p, role:drova-admin, applications, action/*, platform/drova-*, allow
      p, role:drova-admin, applications, sync, platform/redis-drova, allow
      p, role:drova-admin, applications, action/*, platform/redis-drova, allow
      p, role:drova-admin, repositories, get, *, allow
      p, role:drova-admin, clusters, get, *, allow
      p, role:drova-admin, applications, get, apps/drova-*, allow
      p, role:drova-admin, applications, get, platform/drova-*, allow
      p, role:drova-admin, applications, get, platform/redis-drova, allow
      p, role:drova-admin, logs, get, apps/drova-*, allow
      p, role:drova-admin, logs, get, platform/drova-*, allow
      p, role:drova-admin, logs, get, platform/redis-drova, allow
      p, role:drova-admin, exec, create, apps/drova-*, allow
      p, role:drova-admin, exec, create, platform/drova-*, allow
      g, drova-admins, role:drova-admin

      p, role:drova-viewer, applications, get, apps/drova-*, allow
      p, role:drova-viewer, applications, get, platform/drova-*, allow
      p, role:drova-viewer, applications, get, platform/redis-drova, allow
      p, role:drova-viewer, logs, get, apps/drova-*, allow
      p, role:drova-viewer, logs, get, platform/drova-*, allow
      p, role:drova-viewer, logs, get, platform/redis-drova, allow
      g, drova-viewers, role:drova-viewer

    scopes: '[groups, email]'
