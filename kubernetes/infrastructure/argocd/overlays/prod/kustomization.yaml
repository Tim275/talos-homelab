apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
commonAnnotations:
  argocd.argoproj.io/sync-wave: "3"

resources:
  - ../../base
  - argocd-slack-webhook-sealed.yaml  #  Slack webhook for ArgoCD Notifications
  - oidc-secret.yaml  # Keycloak OIDC client secret

components:
  - ../../components/envoy-gateway

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.10.3
    releaseName: "argocd"
    namespace: argocd
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - ../../components/kube-prometheus-stack/values.yaml
      - ../../components/rook-ceph/values.yaml
      - values.yaml
      - ../../base/health-checks-argocd.yaml
      - ../../base/rbac-argocd.yaml
      - ../../base/notifications-argocd.yaml
      - ../../components/kube-prometheus-stack/notifications-argocd.yaml
      - notifications-argocd.yaml

patches:
  - path: sizing.yaml
  - path: settings.yaml
