apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-orphan-check
  namespace: argocd
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: check
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      containers:
        - name: repo-server
        - name: kustomize-build-with-helm
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m     # 10x burst for Helm chart rendering
              memory: 1Gi   # 8x headroom for large manifests
