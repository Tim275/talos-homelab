apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jira-api
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: jira-api
  data:
  - secretKey: token
    remoteRef:
      key: monitoring/jira-api
      property: token
  - secretKey: user
    remoteRef:
      key: monitoring/jira-api
      property: user
