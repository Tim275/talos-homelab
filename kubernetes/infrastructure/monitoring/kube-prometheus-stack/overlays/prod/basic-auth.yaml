apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: prometheus-basic-auth-password
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: monitoring/prometheus-basic-auth
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-basic-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: prometheus-basic-auth
    template:
      engineVersion: v2
      data:
        .htpasswd: '{{ htpasswd "prometheus" .password "sha" }}'
  data:
  - secretKey: password
    remoteRef:
      key: monitoring/prometheus-basic-auth
      property: password
---
