apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - slack-webhook.yaml  # Alertmanager Slack webhook (monitoring namespace, active)
  - slack-webhook-critical.yaml  # -> #alerts-critical
  - slack-webhook-security.yaml  # -> #alerts-security

patches:
  - path: sizing.yaml

images:
