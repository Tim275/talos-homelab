apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage-rook-ceph
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: ceph-page
      interval: 30s
      rules:
        - alert: CephHealthError
          expr: ceph_health_status == 2
          for: 5m
          labels:
            severity: critical
            component: storage
          annotations:
            runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/docs/runbooks/storage.md#cephhealtherror"
            dashboard_url: "/d/ceph-cluster"
            summary: "Ceph cluster HEALTH_ERR"
            description: "Rook-Ceph reports HEALTH_ERR — data integrity at risk."
            action: "Toolbox: 'ceph health detail' → root cause; often full OSD or inconsistent PG ('ceph pg repair <id>')."

        - alert: CephMonQuorumAtRisk
          expr: ceph_health_detail{name="MON_DOWN"} == 1 and on() count(ceph_mon_quorum_status == 1) <= floor(count(ceph_mon_metadata) / 2) + 1
          for: 30s
          labels:
            severity: critical
            component: storage
          annotations:
            runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/docs/runbooks/storage.md#cephmonquorumatrisk"
            dashboard_url: "/d/ceph-cluster"
            summary: "Ceph MON quorum at risk — one more MON down and the cluster stops"
            description: "A MON is down and only the minimum quorum is left. Without quorum no I/O is possible and the mgr stops reporting, so RookCephMgrDown is the signal after that."
            action: "Toolbox: 'ceph mon stat' + 'ceph quorum_status'; ssh root@<host> systemctl status ceph-mon@<host> on msa2proxmox/nipogi/aoostar — check the host of the missing MON."

        - alert: CephOSDMajorityDown
          expr: sum(ceph_osd_up) / count(ceph_osd_up) < 0.5
          for: 1m
          labels:
            severity: critical
            component: storage
          annotations:
            runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/docs/runbooks/storage.md#cephosdmajoritydown"
            dashboard_url: "/d/ceph-cluster"
            summary: "Majority of Ceph OSDs down ({{ $value | humanizePercentage }} up)"
            description: "More than 50% of OSDs down — DATA LOSS RISK, storage unavailable."
            action: "ssh root@192.168.0.59 ceph osd tree down; check the disk of down OSDs; do NOT restart all OSDs at once."

    - name: ceph-ticket
      interval: 60s
      rules:
        - alert: CephOSDDown
          expr: ceph_osd_up == 0
          for: 10m
          labels:
            severity: warning
            component: storage
          annotations:
            dashboard_url: "/d/ceph-osd?var-osd={{ $labels.ceph_daemon }}"
            summary: "Ceph OSD {{ $labels.ceph_daemon }} down"
            description: "OSD down >10min — replication degraded (replica=2)."
            action: "ssh root@192.168.0.59 journalctl -u ceph-osd@<id> -n 100; check SMART (smartctl) of the disk behind the OSD."

        - alert: CephPGsNotActive
          expr: (ceph_pg_total - ceph_pg_active) > 0
          for: 15m
          labels:
            severity: warning
            component: storage
          annotations:
            dashboard_url: "/d/ceph-cluster"
            summary: "Ceph {{ $value }} PGs not active for 15m — data availability degraded"
            description: "PGs stuck inactive/peering — clients on them block (slow-ops cascade → RGW/CNPG timeouts). Check 'ceph pg dump_stuck inactive' + cross-node OSD heartbeats / Cilium NodeEncryption."
            action: "Toolbox: 'ceph pg dump_stuck inactive'; check cross-node OSD heartbeats + Cilium NodeEncryption (encrypt-node deadlock 2026-05-24)."

        - alert: CephOSDNearFull
          expr: ceph_osd_stat_bytes_used / ceph_osd_stat_bytes > 0.82
          for: 30m
          labels:
            severity: warning
            component: storage
          annotations:
            dashboard_url: "/d/ceph-osd?var-osd={{ $labels.ceph_daemon }}"
            summary: "Ceph OSD {{ $labels.ceph_daemon }} >82% full"
            description: "OSD at {{ $value | humanizePercentage }} — Ceph nearfull at 85%, blocks writes at 95%. Add capacity."
            action: "Toolbox 'ceph osd df'. Balancer is upmap (already optimal) — reweight won't help on same-disk OSDs; grow/add OSD capacity."

        - alert: RookCephMgrDown
          expr: absent(up{job="rook-ceph-mgr-external"}) or up{job="rook-ceph-mgr-external"} == 0
          for: 5m
          labels:
            severity: warning
            component: storage
          annotations:
            dashboard_url: "/d/ceph-cluster"
            summary: "Rook-Ceph mgr down"
            description: "Without mgr, Ceph stops exposing ceph_* metrics — every other Ceph alert goes blind."
            action: "Toolbox 'ceph mgr stat'; ssh root@<host> systemctl status ceph-mgr@<host> on the active mgr."


        - alert: CephSlowOps
          expr: ceph_health_detail{name="BLUESTORE_SLOW_OP_ALERT"} > 0
          for: 15m
          labels:
            severity: warning
            component: storage
          annotations:
            dashboard_url: "/d/ceph-cluster"
            summary: "Ceph BlueStore slow operations on OSDs"
            description: "Slow-ops sustained >15min — one or more OSDs can't keep up (SSD write pressure; often a node whose few OSDs carry a full replica plus a co-located etcd/VM disk). Degraded, not failure — check 'ceph health detail' for which OSDs."
            action: "Toolbox: 'ceph health detail' (which OSDs) + 'ceph osd perf' (latency); check disk SMART + the heaviest write-load on that node."

        - alert: CephMonClockSkew
          expr: ceph_health_detail{name="MON_CLOCK_SKEW"} > 0
          for: 10m
          labels:
            severity: warning
            component: storage
          annotations:
            dashboard_url: "/d/ceph-cluster"
            summary: "Ceph mon clock skew detected"
            description: "A Ceph mon's clock drifted — risks quorum instability + cert/token auth. Same NTP root cause as TalosNodeClockSkew."
            action: "Toolbox: 'ceph time-sync-status'; check NTP on the Proxmox hosts + Talos nodes ('talosctl time')."
