apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-openbao
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: openbao-ticket
      interval: 60s
      rules:
        - alert: OpenBaoNotReady
          expr: kube_pod_container_status_ready{namespace="openbao", pod=~"openbao-[0-9]+"} == 0
          for: 15m
          labels:
            severity: warning
            component: platform
          annotations:
            dashboard_url: "/d/openbao-metrics"
            summary: "OpenBao {{ $labels.pod }} nicht ready seit >15min"
            description: "OpenBao entsiegelt sich beim Start über Azure Key Vault und lädt dafür das Seal-Plugin von ghcr.io. Startet er nicht ready, fehlt meist das Secret openbao-unseal-azure, Azure oder ghcr.io sind nicht erreichbar oder die raft-Daten sind kaputt."
            action: "kubectl -n openbao get openbaocluster openbao; kubectl -n openbao get secret openbao-unseal-azure; kubectl -n openbao logs openbao-0 | grep -iE \"plugin|seal\"; kubectl exec -n openbao openbao-0 -- bao status. Fehlt das Secret: tofu apply -target=module.openbao."
