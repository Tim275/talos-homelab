apiVersion: v1
kind: Secret
metadata:
  name: additional-scrape-configs-proxmox
  namespace: monitoring
type: Opaque
stringData:
  prometheus-additional.yaml: |
    - job_name: proxmox-host-node
      static_configs:
        - targets:
            - 192.168.0.50:9100
            - 192.168.0.57:9100
            - 192.168.0.59:9100
          labels:
            role: hypervisor
      metric_relabel_configs:
        - source_labels: [__address__]
          regex: '([^:]+):.*'
          target_label: instance
          replacement: '$1'
    - job_name: proxmox-smart
      static_configs:
        - targets:
            - 192.168.0.50:9633
            - 192.168.0.57:9633
            - 192.168.0.59:9633
          labels:
            role: hypervisor
      metric_relabel_configs:
        - source_labels: [__address__]
          regex: '([^:]+):.*'
          target_label: instance
          replacement: '$1'
    - job_name: central-openbao
      scheme: https
      metrics_path: /v1/sys/metrics
      params:
        format: [prometheus]
      tls_config:
        server_name: bao.timourhomelab.org
        ca: |
          -----BEGIN CERTIFICATE-----
          MIIBjzCCATWgAwIBAgIUEnbKdI2DId+YLSvZ4H7TQNSqBXowCgYIKoZIzj0EAwIw
          HTEbMBkGA1UEAwwSY2VudHJhbC1vcGVuYmFvLWNhMB4XDTI2MTEyNjE3MDg1OFoX
          DTM2MTEyMzE3MDg1OFowHTEbMBkGA1UEAwwSY2VudHJhbC1vcGVuYmFvLWNhMFkw
          EwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEPQyNn+xEy/s5uWfWEJ6j+qrzjy+TCqsX
          +yKl4+6F+3PUY9iRj8yKsBJ87z+r4QCC/V9XM8+Cf5zGm9RNGgmj0qNTMFEwHQYD
          VR0OBBYEFBwv8Lro/sWQRmHbigeopkT6bXZuMB8GA1UdIwQYMBaAFBwv8Lro/sWQ
          RmHbigeopkT6bXZuMA8GA1UdEwEB/wQFMAMBAf8wCgYIKoZIzj0EAwIDSAAwRQIh
          APz5kljtuKlcqdxLVE0ccwFBECkPjB8vTxqv++e7aW6WAiAU3LUpGbKDJuXPvCQC
          ytppPBfa38df6ZyfBKzSf3qyMQ==
          -----END CERTIFICATE-----
      static_configs:
        - targets:
            - 192.168.0.60:8200
    - job_name: federate-edge
      scrape_interval: 60s
      honor_labels: true
      metrics_path: /federate
      params:
        'match[]':
          - '{__name__=~"edge:.*"}'
      static_configs:
        - targets:
            - prometheus-edge.monitoring.svc.cluster.local:9090
    - job_name: kube-etcd
      static_configs:
        - targets:
            - 192.168.0.101:2381
    - job_name: kube-controller-manager
      scheme: https
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      tls_config:
        insecure_skip_verify: true
      static_configs:
        - targets:
            - 192.168.0.101:10257
    - job_name: kube-scheduler
      scheme: https
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      tls_config:
        insecure_skip_verify: true
      static_configs:
        - targets:
            - 192.168.0.101:10259
