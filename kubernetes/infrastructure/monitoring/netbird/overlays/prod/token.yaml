apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-exporter-token
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-exporter-token
  data:
  - secretKey: api-token
    remoteRef:
      key: monitoring/netbird-exporter-token
      property: api-token
