apiVersion: batch/v1
kind: CronJob
metadata:
  name: netbird-audit-export
  namespace: netbird
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: export
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-exporter
  namespace: netbird
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: exporter
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
