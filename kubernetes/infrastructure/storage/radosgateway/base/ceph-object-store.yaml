apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: homelab-objectstore
  namespace: rook-ceph
spec:
  metadataPool:
    replicated:
      size: 3
  dataPool:
    replicated:
      size: 2
    parameters:
      min_size: "1"
  preservePoolsOnDelete: false
  allowUsersInNamespaces:
    - elastic-system
  gateway:
    port: 80
    securePort: 443
    sslCertificateRef: ceph-rgw-tls-secret
    priorityClassName: system-cluster-critical
    placement:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: rook-ceph-rgw

  healthCheck:
    readinessProbe:
      probe:
        timeoutSeconds: 10
        periodSeconds: 15
        failureThreshold: 5
    startupProbe:
      probe:
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 30

  zone:
    name: "homelab"
