

#
# - CephObjectRealm (top-level namespace for multisite)
#

---
apiVersion: ceph.rook.io/v1
kind: CephObjectRealm
metadata:
  name: homelab-realm
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:

---
apiVersion: ceph.rook.io/v1
kind: CephObjectZoneGroup
metadata:
  name: homelab-zonegroup
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  realm: homelab-realm

---
apiVersion: ceph.rook.io/v1
kind: CephObjectZone
metadata:
  name: homelab
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  zoneGroup: homelab-zonegroup
  metadataPool:
    replicated:
      size: 3
      requireSafeReplicaSize: true
    parameters:
      pg_num_min: "32"
  dataPool:
    replicated:
      size: 2
      requireSafeReplicaSize: true
    parameters:
      pg_num_min: "32"
      min_size: "1"
