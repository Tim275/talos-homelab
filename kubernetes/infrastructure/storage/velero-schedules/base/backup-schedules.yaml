# Namespaces: n8n-production, keycloak, infisical, lldap
# RPO: 6h | RTO: 2h
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: tier0-n8n-production
  namespace: velero
  labels:
    backup-tier: tier-0
    app: n8n-production
    environment: production
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  template:
    includedNamespaces:
      - n8n-prod
    storageLocation: cluster-backups
    ttl: 8760h  # 365 days retention (1 year)
    defaultVolumesToFsBackup: false
    metadata:
      labels:
        backup-tier: tier-0
        namespace: n8n-prod
        environment: production
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: tier0-keycloak
  namespace: velero
  labels:
    backup-tier: tier-0
    app: keycloak
spec:
  schedule: "0 */6 * * *"
  template:
    includedNamespaces:
      - keycloak
    storageLocation: cluster-backups
    ttl: 8760h  # 365 days retention (1 year)
    defaultVolumesToFsBackup: false
    metadata:
      labels:
        backup-tier: tier-0
        namespace: keycloak
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: tier0-lldap
  namespace: velero
  labels:
    backup-tier: tier-0
    app: lldap
spec:
  schedule: "0 */6 * * *"
  template:
    includedNamespaces:
      - lldap
    storageLocation: cluster-backups
    ttl: 8760h  # 365 days retention (1 year)
    defaultVolumesToFsBackup: true
    metadata:
      labels:
        backup-tier: tier-0
        namespace: lldap
---
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: tier1-grafana
  namespace: velero
  labels:
    backup-tier: tier-1
    app: grafana
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM
  template:
    includedNamespaces:
      - grafana
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: grafana
    storageLocation: cluster-backups
    ttl: 8760h  # 365 days retention (1 year)
    defaultVolumesToFsBackup: true
    metadata:
      labels:
        backup-tier: tier-1
        app: grafana
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: tier1-stateful-apps
  namespace: velero
  labels:
    backup-tier: tier-1
spec:
  schedule: "20 3 * * *"
  template:
    includedNamespaces:
      - openbao
      - forgejo
      - uptime-kuma
      - pgadmin
    storageLocation: cluster-backups
    ttl: 8760h  # 365 days retention (1 year)
    defaultVolumesToFsBackup: true
    metadata:
      labels:
        backup-tier: tier-1
