apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: tier0-databases-6h
  namespace: velero
  labels:
    backup.tier: tier0
    backup.type: database
  annotations:
    description: "Tier-0 mission critical database backups every 6 hours"
    rpo: "6 hours"
    rto: "15 minutes"
spec:
  schedule: "0 */6 * * *"

  template:
    includedNamespaces:
      - n8n-prod
      # - lldap     # Uncomment when deployed

    includedResources:
      - '*'

    # Reason: kein velero-plugin-for-csi installed → CSI-Snapshots würden FailedValidation
    snapshotVolumes: false
    defaultVolumesToFsBackup: true   # kopia file-system-backup für PVCs

    ttl: 168h

    storageLocation: cluster-backups

    hooks:
      resources:
        - name: postgres-backup-hook
          includedNamespaces:
            - n8n-prod
            # - lldap
          labelSelector:
            matchLabels:
              cnpg.io/cluster: n8n-postgres  # CloudNativePG cluster selector
              cnpg.io/instanceRole: primary  # skip replicas + pgbouncer poolers (no postgres container)
          pre:
            - exec:
                container: postgres
                command:
                  - /bin/bash
                  - -c
                  - |
                    echo " TIER-0 Backup: Flushing PostgreSQL WAL before backup..."
                    psql -U postgres -c "CHECKPOINT;"
                    echo " WAL flushed successfully"
                onError: Continue
                timeout: 30s
