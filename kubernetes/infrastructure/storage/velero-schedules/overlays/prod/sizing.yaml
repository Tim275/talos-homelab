apiVersion: batch/v1
kind: CronJob
metadata:
  name: velero-restore-verify
  namespace: velero
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: verify
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: 1500m, memory: 512Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quartal-dr-drill-reminder
  namespace: velero
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: reminder
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 100m, memory: 64Mi}
