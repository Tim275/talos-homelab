apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - velero-restic-credentials.yaml

components:
  - ../../components/rook-ceph
  - ../../components/kube-prometheus-stack

helmCharts:
  - name: velero
    repo: https://vmware-tanzu.github.io/helm-charts
    version: 12.2.5
    releaseName: velero
    namespace: velero
    includeCRDs: true
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - ../../components/rook-ceph/values.yaml
      - values.yaml
patches:
  - path: sizing.yaml

images:
  - name: alpine/k8s
    newTag: 1.36.6@sha256:e2d95501b5718673ba67693154fabe6c618dbe1211a32947d6d5cf16285e019b
  - name: velero/velero-plugin-for-aws
    newTag: v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
