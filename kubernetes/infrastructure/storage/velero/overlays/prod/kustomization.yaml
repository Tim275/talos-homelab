apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - velero-restic-credentials-sealedsecret.yaml

components:
  - ../../components/rook-ceph

helmCharts:
  - name: velero
    repo: https://vmware-tanzu.github.io/helm-charts
    version: 12.1.0
    releaseName: velero
    namespace: velero
    includeCRDs: true
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - ../../components/rook-ceph/values.yaml
      - values.yaml
