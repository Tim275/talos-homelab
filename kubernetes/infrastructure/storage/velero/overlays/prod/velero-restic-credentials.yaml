apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: velero-restic-credentials-repository-password
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: velero/velero-restic-credentials
        property: repository-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-restic-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: velero-restic-credentials
  data:
  - secretKey: repository-password
    remoteRef:
      key: velero/velero-restic-credentials
      property: repository-password
