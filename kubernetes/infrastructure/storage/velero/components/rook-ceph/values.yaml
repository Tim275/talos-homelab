configuration:
  backupStorageLocation:
    - name: cluster-backups
      provider: aws
      default: true
      bucket: velero-cluster-backups
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: http://rook-ceph-rgw-homelab-objectstore.rook-ceph.svc:80
        insecureSkipTLSVerify: "true"
        checksumAlgorithm: ""        # Ceph RGW rejects SDK-v2 CRC32 checksums
    - name: worm-backups
      provider: aws
      bucket: velero-worm-backups
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: http://rook-ceph-rgw-homelab-objectstore.rook-ceph.svc:80
        insecureSkipTLSVerify: "true"
        checksumAlgorithm: ""
    - name: pv-backups
      provider: aws
      bucket: velero-pv-backups
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: http://rook-ceph-rgw-homelab-objectstore.rook-ceph.svc:80
        insecureSkipTLSVerify: "true"
        checksumAlgorithm: ""        # Ceph RGW rejects SDK-v2 CRC32 checksums
