apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-cluster
  namespace: velero
spec:
  schedule: "0 3 * * *"
  template:
    labelSelector:
      matchExpressions:
        - key: reconcile.external-secrets.io/managed
          operator: NotIn
          values: ["true"]
    ttl: 720h0m0s
    storageLocation: cluster-backups
    snapshotVolumes: false
    defaultVolumesToFsBackup: false
    includedNamespaces:
      - "*"
