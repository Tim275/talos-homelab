apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: velero


resources:
  - namespace.yaml
  - velero-restic-credentials-sealedsecret.yaml
  - init-velero-buckets-job.yaml
  - velero-schedule.yaml

helmCharts:
  - name: velero
    repo: https://vmware-tanzu.github.io/helm-charts
    version: 12.1.0
    releaseName: velero
    namespace: velero
    includeCRDs: true
    valuesInline:
      upgradeCRDs: false
      credentials:
        useSecret: true
        existingSecret: velero-s3-credentials
        extraSecretRef: velero-restic-credentials
      configuration:
        features: ""  # CSI DISABLED - CSI plugin ignores uploaderType and always creates Kopia repos!
        defaultBackupTTL: 8760h
        uploaderType: kopia  # Use Kopia File System Backup (replaces deprecated restic)
        backupStorageLocation:
          - name: cluster-backups
            provider: aws
            default: true
            bucket: velero-cluster-backups
            config:
              region: us-east-1
              s3ForcePathStyle: "true"
              s3Url: http://rook-ceph-rgw-homelab-objectstore.rook-ceph.svc:80
              insecureSkipTLSVerify: "true"
              checksumAlgorithm: ""  # Ceph RGW rejects SDK-v2 CRC32 checksums
          - name: worm-backups
            provider: aws
            bucket: velero-worm-backups
            config:
              region: us-east-1
              s3ForcePathStyle: "true"
              s3Url: http://rook-ceph-rgw-homelab-objectstore.rook-ceph.svc:80
              insecureSkipTLSVerify: "true"
              checksumAlgorithm: ""
          - name: pv-backups
            provider: aws
            bucket: velero-pv-backups
            config:
              region: us-east-1
              s3ForcePathStyle: "true"
              s3Url: http://rook-ceph-rgw-homelab-objectstore.rook-ceph.svc:80
              insecureSkipTLSVerify: "true"
              checksumAlgorithm: ""  # Ceph RGW rejects SDK-v2 CRC32 checksums
          # - name: aws-s3-offsite
          #   provider: aws
          #   bucket: timour-homelab-velero-dr
          #     name: velero-aws-credentials
          #     key: cloud
          #     region: eu-central-1  # Frankfurt (closest to Germany)
        repositoryMaintenanceJob:
          repositoryConfigData:
            name: velero-repo-maintenance
            global:
              keepLatestMaintenanceJobs: 3
              podResources:
                cpuRequest: 100m
                cpuLimit: 500m
                memoryRequest: 128Mi
                memoryLimit: 512Mi
      snapshotsEnabled: false  # Disable CSI snapshots - use Restic FS backup only
      resources:
        limits:
          cpu: 1000m
          memory: 512Mi
        requests:
          cpu: 500m
          memory: 256Mi
      metrics:
        enabled: true
        scrapeInterval: 30s
        scrapeTimeout: 10s
        service:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8085"
            prometheus.io/path: "/metrics"
      deployNodeAgent: true
      nodeAgent:
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        podSecurityContext:
          runAsUser: 0
        containerSecurityContext:
          privileged: false
          allowPrivilegeEscalation: false
        extraVolumes:
          - name: udmrepo-cache
            emptyDir: {}
        extraVolumeMounts:
          - name: udmrepo-cache
            mountPath: /udmrepo
      # Note: defaultVolumesToFsBackup removed - use opt-in annotation instead
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
      extraVolumes:
        - name: udmrepo-cache
          emptyDir: {}
        - name: kopia-cache
          emptyDir: {}
      extraVolumeMounts:
        - name: udmrepo-cache
          mountPath: /udmrepo
        - name: kopia-cache
          mountPath: /.cache
      serviceAccount:
        server:
          create: true
          name: velero
      initContainers:
        - name: velero-plugin-for-aws
          image: velero/velero-plugin-for-aws:v1.14.2@sha256:0751144c1c8e52d52c48717fbd13ad5a3061e612ae4d7ad744a946cd5b139d1a
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /target
              name: plugins
