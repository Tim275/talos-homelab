upgradeCRDs: false
credentials:
  useSecret: true
  existingSecret: velero-s3-credentials
  extraSecretRef: velero-restic-credentials
configuration:
  features: ""        # CSI DISABLED - CSI plugin ignores uploaderType and always creates Kopia repos!
  defaultBackupTTL: 8760h
  defaultRepoMaintainFrequency: 6h        # default 1h
  uploaderType: kopia        # optional: restic
  repositoryMaintenanceJob:
    repositoryConfigData:
      name: velero-repo-maintenance
      global:
        keepLatestMaintenanceJobs: 3
        podResources:
          cpuRequest: 100m
          cpuLimit: 500m
          memoryRequest: 128Mi
          memoryLimit: 512Mi
snapshotsEnabled: false        # Disable CSI snapshots - use Restic FS backup only
metrics:
  enabled: true
  scrapeInterval: 30s
  scrapeTimeout: 10s
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8085"
      prometheus.io/path: "/metrics"
deployNodeAgent: true
nodeAgent:
  podSecurityContext:
    runAsUser: 0
  containerSecurityContext:
    privileged: false
    allowPrivilegeEscalation: false
  extraVolumes:
    - name: udmrepo-cache
      emptyDir: {}
  extraVolumeMounts:
    - name: udmrepo-cache
      mountPath: /udmrepo
      # Note: defaultVolumesToFsBackup removed - use opt-in annotation instead
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
extraVolumes:
  - name: udmrepo-cache
    emptyDir: {}
  - name: kopia-cache
    emptyDir: {}
extraVolumeMounts:
  - name: udmrepo-cache
    mountPath: /udmrepo
  - name: kopia-cache
    mountPath: /.cache
serviceAccount:
  server:
    create: true
    name: velero
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa         # renovate: docker=velero/velero-plugin-for-aws
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
    volumeMounts:
      - mountPath: /target
        name: plugins
