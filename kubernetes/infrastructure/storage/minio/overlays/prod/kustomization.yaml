apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minio
commonAnnotations:
  argocd.argoproj.io/sync-wave: "4"

resources:
  - ../../base

components:
  - ../../components/envoy-gateway

helmCharts:
  - name: minio
    repo: https://charts.min.io/
    version: 5.2.0
    releaseName: minio
    includeCRDs: true
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - ../../components/proxmox-csi/values.yaml
      - values.yaml
