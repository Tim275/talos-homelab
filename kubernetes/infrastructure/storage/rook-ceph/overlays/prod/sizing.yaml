apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  mon:
    count: 3
  mgr:
    count: 2
---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: obs-pool
  namespace: rook-ceph
spec:
  quotas:
    maxSize: "300G"
---
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: myfs-enterprise
  namespace: rook-ceph
spec:
  metadataServer:
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ceph-crash-archive
  namespace: rook-ceph
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ceph-crash-archiver
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: csi-orphan-omap-cleanup
  namespace: rook-ceph
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cleanup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: released-pv-cleanup
  namespace: rook-ceph
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cleanup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
