apiVersion: batch/v1
kind: CronJob
metadata:
  name: released-pv-cleanup
  namespace: rook-ceph
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cleanup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
