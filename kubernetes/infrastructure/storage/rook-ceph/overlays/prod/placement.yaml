apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  storage:
    nodes:
      - name: "worker-1"  # nipogi - 32GB RAM, stateful workloads
        config:
          storeType: bluestore
        devices:
          - name: "/dev/sdb"  # 50GB dedicated storage disk (scsi1)
      - name: "worker-2"  # nipogi - 32GB RAM, stateful workloads
        config:
          storeType: bluestore
        devices:
          - name: "/dev/sdb"  # 50GB dedicated storage disk (scsi1)
      - name: "worker-3"  # msa2proxmox - 20GB RAM, compute workloads
        config:
          storeType: bluestore
        devices:
          - name: "/dev/sdb"  # 50GB dedicated storage disk (scsi1)
      - name: "worker-4"  # msa2proxmox - 20GB RAM, compute workloads
        config:
          storeType: bluestore
        devices:
          - name: "/dev/sdb"  # 50GB dedicated storage disk (scsi1)
      - name: "worker-5"  # msa2proxmox - 20GB RAM, compute workloads
        config:
          storeType: bluestore
        devices:
          - name: "/dev/sdb"  # 50GB dedicated storage disk (scsi1)
  placement:
    mon:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: ["ctrl-0"]
    mgr:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: ["ctrl-0"]
