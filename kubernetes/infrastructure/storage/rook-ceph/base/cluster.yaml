apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
  labels:
    app.kubernetes.io/name: rook-ceph
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: storage-platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  cephVersion:
    # https://docs.ceph.com/en/latest/releases/
    image: quay.io/ceph/ceph:v19.2.3
    allowUnsupported: false

  #     enabled: true

  dataDirHostPath: /var/lib/rook

  # Ref: https://documentation.suse.com/sbp/storage/html/SBP-rook-ceph-kubernetes/

  cephConfig:
    global:
      osd_pool_default_pg_num: "16"
      osd_pool_default_pg_autoscale_mode: "off"

      osd_memory_target: "3221225472"     # 3GB - right-sized (~2Gi real + Recovery-Headroom). War 4GB (überreserviert).
      osd_memory_target_autotune: "true"  # Auto-adjust based on available memory
      bluestore_cache_autotune: "true"    # Auto-tune BlueStore cache

      osd_heartbeat_grace: "120"          # Default: 20s, increased for VM I/O latency
      osd_heartbeat_interval: "15"        # Default: 6s
      mon_osd_down_out_interval: "600"    # Wait 10 min before marking OSD out
      mon_clock_drift_allowed: "0.1"      # Default: 0.05s — homelab NTP jitter (Proxmox, no PTP)

      osd_op_complaint_time: "120"        # Default: 30s, increased to 120s for VM I/O spikes
      osd_op_log_threshold: "50"          # Default: 5, reduce log spam
      osd_op_history_slow_op_threshold: "120" # Match complaint time
      bluestore_throttle_bytes: "134217728"          # 128MB write buffer (doubled)
      bluestore_throttle_deferred_bytes: "268435456" # 256MB deferred buffer (doubled)

      bluestore_default_buffered_write: "true"
      bluestore_prefer_deferred_size: "65536"  # Defer small writes

      osd_client_op_priority: "63"
      osd_recovery_op_priority: "3"
      osd_recovery_max_active: "1"
      osd_max_backfills: "1"

      osd_scrub_begin_hour: "2"           # Start scrubbing at 2 AM
      osd_scrub_end_hour: "6"             # End scrubbing at 6 AM
      osd_scrub_during_recovery: "false"  # Never scrub during recovery

      bluestore_slow_ops_warn_threshold: "50"

      bluestore_max_blob_size_ssd: "524288"          # 512K blobs für big-writes
      bluestore_prefer_deferred_size_ssd: "32768"    # SSD-specific defer-size
      osd_op_queue: "wpq"                            # weighted priority queue
      osd_op_queue_cut_off: "high"                   # client-ops über recovery
      bluestore_csum_type: "none"                    # ⚠ disabled für SSD-perf
      bluestore_block_db_size: "1073741824"          # 1GB RocksDB

  cleanupPolicy:
    confirmation: ""  # Set to "yes-really-destroy-data" for complete cleanup
    sanitizeDisks:
      method: quick  # quick|complete
      dataSource: zero  # zero|random
      iteration: 1

  upgradeOSDRequiresHealthyPGs: true
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  waitTimeoutForHealthyOSDInMinutes: 10

  mon:
    count: 3
    allowMultiplePerNode: false

  mgr:
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: pg_autoscaler
        enabled: true  # Re-enabled after fixing overlapping CRUSH roots
      - name: balancer
        enabled: true
      - name: prometheus
        enabled: true
      - name: telemetry
        enabled: true  # Advanced cluster insights and health analytics

  dashboard:
    enabled: true
    ssl: false  # HTTP backend - Envoy Gateway handles TLS at edge (like ArgoCD, Grafana, etc.)

  monitoring:
    enabled: true

  network:
    provider: host
    connections:
      encryption:
        enabled: true  # msgr2 secure mode - encrypts all inter-daemon communication
      compression:
        enabled: false  # Disabled for security (avoid compression side-channels)

  crashCollector:
    disable: false


  # Ref: https://documentation.suse.com/sbp/storage/html/SBP-rook-ceph-kubernetes/

  resources:
    mgr:
      requests:
        cpu: "250m"        # Homelab: reduced from 500m
        memory: "1.5Gi"    # Increased: SUSE min for prod is 2GB
    mon:
      limits:
        memory: "2Gi"
      requests:
        cpu: "250m"        # Homelab: reduced from 500m
        memory: "2Gi"      # Increased: SUSE min for prod is 4GB - 1Gi caused quorum issues!
    osd:
      requests:
        cpu: "500m"
        memory: "2560Mi"  # 2Gi target + 25%; war 3840Mi/3Gi-target (ns real 15Gi)
    prepareosd:
      requests:
        cpu: "50m"    # 250m → 100m → 50m: light disk-scan, schedules even on saturated nipogi-workers
        memory: "64Mi"   # Reduced from 256Mi - fits packed msa2 worker headroom, prepare only scans disks
    crashcollector:
      requests:
        cpu: "50m"
        memory: "64Mi"

  removeOSDsIfOutAndSafeToRemove: true

  storage:
    useAllNodes: false
    useAllDevices: false  # Use specific block devices (scsi1 = /dev/sdb)
    config:
      osdsPerDevice: "1"
      encryptedDevice: "true"
      osd_memory_target: "3221225472"
      bluestore_cache_size: "1073741824"
      bluestore_min_alloc_size_hdd: "65536"
      bluestore_rocksdb_options: "compression=kNoCompression,max_write_buffer_number=4,min_write_buffer_number_to_merge=1,recycle_log_file_num=4"
    nodes:
      - name: "worker-1"  # nipogi - 32GB RAM, stateful workloads
        config:
          storeType: bluestore
        devices:
          - name: "/dev/sdb"  # 50GB dedicated storage disk (scsi1)
      - name: "worker-2"  # nipogi - 32GB RAM, stateful workloads
        config:
          storeType: bluestore
        devices:
          - name: "/dev/sdb"  # 50GB dedicated storage disk (scsi1)
      - name: "worker-3"  # msa2proxmox - 20GB RAM, compute workloads
        config:
          storeType: bluestore
        devices:
          - name: "/dev/sdb"  # 50GB dedicated storage disk (scsi1)
      - name: "worker-4"  # msa2proxmox - 20GB RAM, compute workloads
        config:
          storeType: bluestore
        devices:
          - name: "/dev/sdb"  # 50GB dedicated storage disk (scsi1)
      - name: "worker-5"  # msa2proxmox - 20GB RAM, compute workloads
        config:
          storeType: bluestore
        devices:
          - name: "/dev/sdb"  # 50GB dedicated storage disk (scsi1)

  healthCheck:
    daemonHealth:
      mon:
        disabled: false
        interval: 45s
      osd:
        disabled: false
        interval: 60s
      status:
        disabled: false
        interval: 60s

  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
    pgHealthCheckTimeout: 0

  placement:
    all:
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
    mon:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: ["worker-6"]
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: rook-ceph-mon
            topologyKey: kubernetes.io/hostname
    mgr:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: ["worker-6"]
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: rook-ceph-mgr
              topologyKey: kubernetes.io/hostname
    osd:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/worker
                  operator: Exists
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: rook-ceph-osd
              topologyKey: kubernetes.io/hostname
