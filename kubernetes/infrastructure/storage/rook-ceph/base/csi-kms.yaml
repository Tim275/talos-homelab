apiVersion: v1
kind: ConfigMap
metadata:
  name: csi-kms-connection-details
  namespace: rook-ceph
data:
  vault-openbao: |-
    {
      "encryptionKMSType": "vaulttokens",
      "vaultAddress": "http://openbao.openbao.svc.cluster.local:8200",
      "vaultBackend": "kv-v2",
      "vaultBackendPath": "ceph-csi",
      "tenantTokenName": "ceph-csi-kms-token"
    }
