apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-block-encrypted
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    storageclass.kubernetes.io/description: "LUKS2-encrypted RBD, per-volume keys from OpenBao KMS. Tenant-NS braucht Secret ceph-csi-kms-token."
provisioner: rook-ceph.rbd.csi.ceph.com
