apiVersion: apps/v1
kind: Deployment
metadata:
  name: rook-ceph-tools
  namespace: rook-ceph
  labels:
    app: rook-ceph-tools
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rook-ceph-tools
  template:
    metadata:
      labels:
        app: rook-ceph-tools
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: config-init
          image: quay.io/ceph/ceph:v20.2.5
          command:
            - /bin/bash
            - -c
            - |
              cat > /etc/ceph/ceph.conf << EOF
              [global]
              mon_host = $(sed 's/[a-z0-9_-]\+=//g' /etc/rook/mon-endpoints)
              keyring = /etc/ceph/keyring
              EOF
              printf '[%s]\nkey = %s\n' "$(cat /etc/rook-mon/ceph-username)" "$(cat /etc/rook-mon/ceph-secret)" > /etc/ceph/keyring
              chmod 600 /etc/ceph/keyring
          volumeMounts:
            - mountPath: /etc/ceph
              name: ceph-config
            - mountPath: /etc/rook
              name: mon-endpoints
            - mountPath: /etc/rook-mon
              name: mon-secret
      containers:
        - name: rook-ceph-tools
          image: quay.io/ceph/ceph:v20.2.5
          command:
            - /bin/bash
            - -c
            - tail -f /dev/null
          env:
            - name: CEPH_ARGS
              value: --id healthchecker
          volumeMounts:
            - mountPath: /etc/ceph
              name: ceph-config
      volumes:
        - name: ceph-config
          emptyDir: {}
        - name: mon-endpoints
          configMap:
            name: rook-ceph-mon-endpoints
            items:
              - key: data
                path: mon-endpoints
        - name: mon-secret
          secret:
            secretName: rook-ceph-mon
            items:
              - key: ceph-username
                path: ceph-username
              - key: ceph-secret
                path: ceph-secret
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 5
