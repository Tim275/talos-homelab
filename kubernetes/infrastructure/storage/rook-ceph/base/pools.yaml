apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: replicapool-enterprise
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  enableCrushUpdates: true
  failureDomain: host
  replicated:
    requireSafeReplicaSize: true
  parameters:
    min_size: "1"
    compression_algorithm: "lz4"
    compression_mode: "aggressive"
    compression_required_ratio: "0.875"
    compression_max_blob_size: "131072"
    compression_min_blob_size: "8192"
  mirroring:
    enabled: false
    mode: image

---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: obs-pool
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  enableCrushUpdates: true
  failureDomain: host
  replicated:
    requireSafeReplicaSize: true
  parameters:
    min_size: "1"
    pg_num: "64"
    pgp_num: "64"
    compression_algorithm: "lz4"
    compression_mode: "aggressive"
    compression_required_ratio: "0.875"
  mirroring:
    enabled: false

---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: kafka-fast
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  enableCrushUpdates: true
  failureDomain: host
  replicated:
    requireSafeReplicaSize: true
  parameters:
    min_size: "1"

---
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: myfs-enterprise
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  metadataPool:
    failureDomain: host
    replicated:
      requireSafeReplicaSize: false
    parameters:
      pg_num: "16"
      pgp_num: "16"
      min_size: "1"
  dataPools:
    - name: replicated
      failureDomain: host
      replicated:
        requireSafeReplicaSize: false
      parameters:
        pg_num: "8"
        pgp_num: "8"
        min_size: "1"
        compression_algorithm: "lz4"
        compression_mode: "aggressive"
  preserveFilesystemOnDelete: false
  metadataServer:
    activeCount: 1
    # ohne Standby ist ein einzelner MDS-Ausfall sofort HEALTH_ERR
    activeStandby: true
    priorityClassName: system-cluster-critical
