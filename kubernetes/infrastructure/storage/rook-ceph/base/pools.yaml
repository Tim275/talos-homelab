apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: replicapool-enterprise
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  failureDomain: zone
  replicated:
    size: 2
    requireSafeReplicaSize: true
  parameters:
    min_size: "1"
    compression_algorithm: "lz4"
    compression_mode: "aggressive"
    compression_required_ratio: "0.875"
    compression_max_blob_size: "131072"
    compression_min_blob_size: "8192"
  mirroring:
    enabled: false
    mode: image

---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: kafka-fast
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  failureDomain: host
  crushRoot: msa2proxmox
  replicated:
    size: 2
    requireSafeReplicaSize: true
  parameters:
    min_size: "1"

---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: replicapool-fast
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  failureDomain: host
  replicated:
    size: 3
    requireSafeReplicaSize: true
  parameters:
    min_size: "2"
    compression_algorithm: "lz4"
    compression_mode: "aggressive"
    compression_required_ratio: "0.875"
  mirroring:
    enabled: false


