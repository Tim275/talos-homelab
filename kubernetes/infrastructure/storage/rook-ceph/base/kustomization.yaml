apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-wave: "4"


namespace: rook-ceph

resources:
  - https://raw.githubusercontent.com/rook/rook/v1.18.7/deploy/examples/monitoring/rbac.yaml

  - namespace.yaml
  - priority-classes.yaml
  - cluster.yaml
  - pools.yaml
  - storage-classes.yaml
  - csi-kms.yaml
  - toolbox.yaml

  - servicemonitor-ceph-mgr.yaml
  - servicemonitor-ceph-exporter.yaml
  - ceph-dashboard-prometheus-config.yaml

  - ceph-crash-archive.yaml

  - csi-orphan-cleanup.yaml

  - released-pv-cleanup.yaml

  - csi-pdb.yaml

  - http-route.yaml

  - velero-users.yaml

helmCharts:
  - name: rook-ceph
    repo: https://charts.rook.io/release
    version: v1.20.7
    releaseName: rook-ceph
    namespace: rook-ceph
    includeCRDs: true
    valuesFile: values.yaml

  - name: ceph-csi-drivers
    repo: https://ceph.github.io/ceph-csi-operator
    version: 1.0.4
    releaseName: ceph-csi-drivers
    namespace: rook-ceph
    includeCRDs: false
    valuesFile: csi-drivers-values.yaml

patches:
  - target:
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-10"
          argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false

  - target:
      kind: Deployment
      name: rook-ceph-operator
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-5"
          argocd.argoproj.io/sync-options: Prune=false

  - target:
      kind: CephCluster
      name: rook-ceph
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "0"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

