apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-wave: "4"


namespace: rook-ceph

resources:
  # https://github.com/rook/rook/releases
  - https://raw.githubusercontent.com/rook/rook/v1.18.7/deploy/examples/crds.yaml
  - https://raw.githubusercontent.com/rook/rook/v1.18.7/deploy/examples/common.yaml
  - https://raw.githubusercontent.com/rook/rook/v1.18.7/deploy/examples/operator.yaml
  - https://raw.githubusercontent.com/rook/rook/v1.18.7/deploy/examples/csi-operator.yaml

  - priority-classes.yaml
  - cluster.yaml
  - pools.yaml
  - storage-classes.yaml
  - csi-kms.yaml
  - toolbox.yaml

  - servicemonitor-ceph-mgr.yaml
  - servicemonitor-ceph-exporter.yaml
  - ceph-dashboard-prometheus-config.yaml

  - ceph-crash-archive.yaml

  - csi-orphan-cleanup.yaml

  - released-pv-cleanup.yaml

  - csi-pdb.yaml

  - http-route.yaml

  - velero-users.yaml

patches:
  - target:
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-10"
          argocd.argoproj.io/sync-options: ServerSideApply=true

  - target:
      kind: Namespace
      name: rook-ceph
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-10"

  - target:
      kind: Deployment
      name: rook-ceph-operator
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-5"
          argocd.argoproj.io/sync-options: Prune=false

  - target:
      kind: CephCluster
      name: rook-ceph
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "0"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

  - target:
      kind: Deployment
      name: rook-ceph.rbd.csi.ceph.com-ctrlplugin
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

  - target:
      kind: DaemonSet
      name: csi-rbdplugin
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/1/resources
        value:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "10m"
            memory: "64Mi"

  - target:
      kind: ConfigMap
      name: rook-ceph-operator-config
    patch: |-
      - op: replace
        path: /data/CSI_GRPC_TIMEOUT_SECONDS
        value: "30"
      - op: replace
        path: /data/CSI_ENABLE_LIVENESS
        value: "true"
      - op: add
        path: /data/CSI_PROVISIONER_REPLICAS
        value: "3"

  - target:
      kind: Service
      name: rook-ceph-mgr
    patch: |-
      - op: add
        path: /metadata/labels/ceph_daemon_type
        value: mgr
      - op: add
        path: /metadata/labels/release
        value: prometheus-operator

  - target:
      kind: Namespace
      name: rook-ceph
    patch: |-
      - op: replace
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
          app.kubernetes.io/name: rook-ceph
          app.kubernetes.io/instance: enterprise
          environment: production
          tier: storage

  - target:
      kind: Deployment
      name: rook-ceph-operator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: "2000m"   # Increased for reconciliation under load
            memory: "2Gi"  # Increased for large cluster management
          requests:
            cpu: "500m"    # Enterprise baseline
            memory: "1Gi"  # Enterprise baseline
      - op: add
        path: /spec/template/spec/priorityClassName
        value: system-cluster-critical
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ROOK_LOG_LEVEL
          value: "INFO"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ROOK_CEPH_ALLOW_LOOP_DEVICES
          value: "false"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ROOK_ENABLE_DISCOVERY_DAEMON
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ROOK_CSI_ENABLE_CEPHFS
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ROOK_CSI_ENABLE_RBD
          value: "true"
      - op: add
        path: /spec/template/metadata/annotations
        value:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
          prometheus.io/path: "/metrics"
