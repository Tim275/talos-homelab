apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-dashboard
  namespace: rook-ceph
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=rook-ceph-mgr"
    gethomepage.dev/name: Ceph Dashboard
    gethomepage.dev/description: Storage Cluster (VPN)
    gethomepage.dev/group: Storage
    gethomepage.dev/icon: ceph.png
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - ceph.timourhomelab.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rook-ceph-mgr-dashboard
          port: 7000  # HTTP port (ssl: false)
