apiVersion: v1
kind: ServiceAccount
metadata:
  name: released-pv-cleanup
  namespace: rook-ceph
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: released-pv-cleanup
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: released-pv-cleanup
subjects:
  - kind: ServiceAccount
    name: released-pv-cleanup
    namespace: rook-ceph
roleRef:
  kind: ClusterRole
  name: released-pv-cleanup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: released-pv-cleanup
  namespace: rook-ceph
spec:
  schedule: "37 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: released-pv-cleanup
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              command:
                - /bin/bash
                - -c
                - |
                  set -eo pipefail
                  THRESHOLD_HOURS=1
                  REMOVED=0
                  NOW=$(date +%s)
                  echo "[$(date)] Scanning Released PVs older than ${THRESHOLD_HOURS}h"
                  while IFS=$'\t' read -r NAME STATUS AGE_TS; do
                    [ "$STATUS" != "Released" ] && continue
                    [ -z "$AGE_TS" ] && continue
                    TS=$(date -D "%Y-%m-%dT%H:%M:%SZ" -d "$AGE_TS" +%s) || {
                      echo "  FEHLER: konnte $AGE_TS nicht parsen" >&2; exit 1; }
                    AGE_H=$(( (NOW - TS) / 3600 ))
                    if [ $AGE_H -ge $THRESHOLD_HOURS ]; then
                      echo "  delete $NAME (Released ${AGE_H}h)"
                      kubectl delete pv "$NAME" --wait=false 2>&1 | tail -1
                      REMOVED=$((REMOVED+1))
                    fi
                  done < <(kubectl get pv -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.phase}{"\t"}{.metadata.creationTimestamp}{"\n"}{end}')
                  echo "[$(date)] Done. Removed $REMOVED Released PVs."
