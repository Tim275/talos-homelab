apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: homelab-objectstore
  namespace: rook-ceph
spec:
  gateway:
    instances: 2
    resources:
      requests:
        cpu: "100m"        # 7d peak 42m
        memory: "1Gi"      # Homelab: reduced from 2.5GB (sufficient for S3 backups)
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: homelab-objectstore
  namespace: rook-ceph
spec:
  metadataPool:
    replicated:
      size: 3
  dataPool:
    replicated:
      size: 2
---
apiVersion: ceph.rook.io/v1
kind: CephObjectZone
metadata:
  name: homelab
  namespace: rook-ceph
spec:
  metadataPool:
    replicated:
      size: 2   # 3 Kopien ueber 2 Zonen bleiben dauerhaft degraded
  dataPool:
    replicated:
      size: 2
