apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: openbao-backup-s3
  namespace: rook-ceph
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: rook-ceph-object-user-homelab-objectstore-openbao-backup
  data:
    - match:
        secretKey: AccessKey
        remoteRef:
          remoteKey: openbao/openbao-backup-s3
          property: accessKeyId
    - match:
        secretKey: SecretKey
        remoteRef:
          remoteKey: openbao/openbao-backup-s3
          property: secretAccessKey
