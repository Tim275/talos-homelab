apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-backup
  namespace: etcd-backup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: talos-backup
              env:
                - name: CUSTOM_S3_ENDPOINT
                  value: http://ceph-rgw.rook-ceph.svc
                - name: BUCKET
                  value: etcd-backup
              envFrom:
                - secretRef:
                    name: etcd-backup
