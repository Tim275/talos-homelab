apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: etcd-backup-talos-api
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: etcd-backup
            app.kubernetes.io/name: talos-backup
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
