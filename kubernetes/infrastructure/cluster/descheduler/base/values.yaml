kind: CronJob
schedule: "*/30 * * * *"

cmdOptions:
  v: 3

deschedulerPolicy:
  maxNoOfPodsToEvictTotal: 5
  profiles:
    - name: rebalance
      pluginConfig:
        - name: DefaultEvictor
          args:
            podProtections:
              defaultDisabled:
                - PodsWithLocalStorage
              extraEnabled:
                - PodsWithPVC
            nodeFit: true
            minReplicas: 2
        - name: RemoveDuplicates
        - name: RemovePodsViolatingTopologySpreadConstraint
          args:
            constraints:
              - DoNotSchedule
              - ScheduleAnyway
        - name: LowNodeUtilization
          args:
            thresholds:
              cpu: 60
              memory: 60
            targetThresholds:
              cpu: 80
              memory: 80
            numberOfNodes: 2
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - RemovePodsViolatingTopologySpreadConstraint
            - LowNodeUtilization

