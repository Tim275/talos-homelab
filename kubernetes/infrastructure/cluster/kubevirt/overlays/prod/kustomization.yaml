apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - https://github.com/kubevirt/kubevirt/releases/download/v1.8.4/kubevirt-operator.yaml

patches:
  - path: placement.yaml
  - path: sizing.yaml
  - target:
      kind: Deployment
      name: virt-operator
    patch: |-
      - op: remove
        path: /spec/template/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution
