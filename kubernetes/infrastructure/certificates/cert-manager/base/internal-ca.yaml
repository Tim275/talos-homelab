apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: homelab-internal-ca
  secretName: homelab-internal-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-internal-ca
spec:
  ca:
    secretName: homelab-internal-ca
