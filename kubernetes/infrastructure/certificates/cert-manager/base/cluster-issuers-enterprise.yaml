#
# - PRODUCTION issuer for ALL environments (dev + prod)
# - STAGING issuer ONLY for cert-manager troubleshooting and CI/CD testing
#
# - Production: 50 certificates/week (sufficient for homelab)
# - Staging: Unlimited (for testing only)

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-5"  # Deploy before any certificates
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
    certificate-authority: letsencrypt
    environment: production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "timourmiagol@outlook.de"
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
    certificate-authority: letsencrypt
    environment: staging
spec:
  acme:
    # - Testing new cert-manager configurations
    # - CI/CD pipeline testing
    # - Debugging certificate issuance problems
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: "timourmiagol@outlook.de"
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-cluster-issuer
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
    certificate-authority: selfsigned
    environment: development
spec:
  selfSigned: {}
