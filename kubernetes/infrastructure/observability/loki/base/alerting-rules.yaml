apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  namespace: monitoring
data:
  homelab-logs.yaml: |
    groups:
      - name: logs-security
        interval: 1m
        rules:
          - alert: LogsAuthFailureSpike
            expr: 'sum by (namespace, pod) (count_over_time({namespace=~"keycloak|lldap"} |~ "(?i)(invalid_user_credentials|authentication failed|invalid password)" [10m])) > 20'
            for: 5m
            labels: {severity: warning, component: security, source: loki}
            annotations:
              summary: "{{ $value }} fehlgeschlagene Logins in 10min (keycloak/lldap)"
              description: "Brute-Force oder ein kaputter Client in Schleife."
              action: "kubectl logs -n keycloak keycloak-0 | grep -i invalid; Quell-IPs gruppieren."

          - alert: LogsSensitiveFileAccess
            expr: 'sum by (pod) (count_over_time({namespace="kube-system"} |~ "process_kprobe" |~ "/etc/shadow|/etc/sudoers|authorized_keys" != "loki-gateway" != "/loki/api/" != "/usr/bin/sudo" != "/usr/sbin/unix_chkpwd" [1h])) > 0'
            labels: {severity: warning, component: security, source: loki}
            annotations:
              summary: "Zugriff auf Credential-Datei ({{ $value }} in 1h)"
              description: "Tetragon meldet Datei-Zugriff auf shadow/sudoers/authorized_keys durch einen anderen Prozess als sudo/unix_chkpwd. Der sudo-Auth-Pfad (Ceph smartctl-Polling) ist ausgefiltert, Baseline damit null."
              action: "Loki: {namespace=\"kube-system\"} |~ \"process_kprobe\" |~ \"shadow|sudoers|authorized_keys\" | json ns=\"process_kprobe.process.pod.namespace\", pod=\"process_kprobe.process.pod.name\" — zeigt betroffenen Pod."

          - alert: LogsAppSpawnedShell
            expr: 'sum by (kubernetes_pod) (count_over_time({namespace="kube-system", container="export-stdout"} |= "drova-shell-exec" | json parent="process_kprobe.parent.binary", kubernetes_pod="process_kprobe.process.pod.name" | parent!~".*/(runc|containerd-shim-runc-v2|tini|dumb-init|sh|bash|dash|ash|zsh|postgres)" [10m])) > 0'
            for: 1m
            labels: {severity: warning, component: security, source: loki}
            annotations:
              summary: "Shell aus der App gestartet: {{ $labels.kubernetes_pod }}"
              description: "Tetragon sieht in drova eine Shell, die die App selbst startet, nicht runc (exec, Probes) oder ein Init-Skript. Typisch fuer Remote Code Execution. Baseline ist null."
              action: "Loki: {namespace=\"kube-system\", container=\"export-stdout\"} |= \"drova-shell-exec\" — Elternprozess und Argumente pruefen."

          - alert: LogsAuditPodExec
            expr: 'sum by (kubernetes_namespace, kubernetes_name) (count_over_time({source="kube-audit"} | json resource="objectRef.resource", subresource="objectRef.subresource", kubernetes_namespace="objectRef.namespace", kubernetes_name="objectRef.name" | resource="pods" | subresource="exec" [1h])) > 0'
            labels: {severity: warning, component: security, source: loki}
            annotations:
              summary: "Shell in einem Pod geoeffnet ({{ $value }} in 1h)"
              description: "kubectl exec umgeht GitOps und hinterlaesst keine Spur im Repo. Im Normalbetrieb passiert das nie."
              action: "Loki: {source=\"kube-audit\"} | json | objectRef_resource=\"pods\", objectRef_subresource=\"exec\" — user.username und objectRef.namespace pruefen."

          - alert: LogsAuditAnonymousAccess
            expr: 'sum by (kubernetes_namespace, kubernetes_resource, kubernetes_name) (count_over_time({source="kube-audit"} | json user="user.username", kubernetes_namespace="objectRef.namespace", kubernetes_resource="objectRef.resource", kubernetes_name="objectRef.name" | user="system:anonymous" [1h])) > 0'
            labels: {severity: critical, component: security, source: loki}
            annotations:
              runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/kubernetes/scripts/runbooks/platform.md#logsauditanonymousaccess"
              summary: "Nicht authentifizierter API-Zugriff ({{ $value }} in 1h)"
              description: "Jemand spricht den apiserver ohne Identitaet an. Baseline ist exakt null."
              action: "Loki: {source=\"kube-audit\"} | json | user_username=\"system:anonymous\" — sourceIPs und requestURI pruefen."

          - alert: LogsAuditRBACChange
            expr: 'sum by (user_name) (count_over_time({source="kube-audit"} | json user_name="user.username", resource="objectRef.resource", verb="verb", uri="requestURI", role="requestObject.roleRef.name" | resource=~"rolebindings|clusterrolebindings" | verb!~"get|list|watch" | uri!~".*dryRun.*" | user_name!~"^system:.*" | role!="cluster-admin" [1h])) > 0'
            for: 2m
            labels: {severity: warning, component: security, source: loki}
            annotations:
              summary: "Rechte-Vergabe ausserhalb von GitOps ({{ $value }} in 1h)"
              description: "Ein Mensch hat ein RoleBinding geaendert. Reconciler-Aenderungen sind ausgefiltert, Baseline ist null."
              action: "Loki: {source=\"kube-audit\"} | json | objectRef_resource=~\"rolebindings|clusterrolebindings\" — verb und user.username pruefen."

          - alert: LogsAuditClusterAdminBinding
            expr: 'sum by (user_name, kubernetes_name) (count_over_time({source="kube-audit"} |= "cluster-admin" | json user_name="user.username", resource="objectRef.resource", verb="verb", uri="requestURI", kubernetes_name="objectRef.name", code="responseStatus.code", role="responseObject.roleRef.name" | resource=~"clusterrolebindings|rolebindings" | verb=~"create|update|patch" | role="cluster-admin" | uri!~".*dryRun.*" | user_name!="system:serviceaccount:argocd:argocd-application-controller" | code=~"2.." [10m])) > 0'
            for: 1m
            labels: {severity: critical, component: security, source: loki}
            annotations:
              summary: "cluster-admin vergeben: {{ $labels.kubernetes_name }} durch {{ $labels.user_name }}"
              description: "Volle Clusterrechte ausserhalb von GitOps, auch per patch auf ein bestehendes Binding. Nur ArgoCD ist ausgefiltert, auch Service-Accounts zaehlen. Baseline ist null."
              action: "kubectl get clusterrolebinding,rolebinding -A -o wide | grep cluster-admin — unbekannt: Binding loeschen, Token des Users sperren."

          - alert: LogsAuditHumanPrivilegedPod
            expr: 'sum by (user_name, kubernetes_namespace) (count_over_time({source="kube-audit"} |~ "\"privileged\":true|\"hostPath\"" | json user_name="user.username", resource="objectRef.resource", verb="verb", uri="requestURI", kubernetes_namespace="objectRef.namespace" | resource=~"pods|deployments|statefulsets|daemonsets" | verb=~"create|update|patch" | uri!~".*dryRun.*" | user_name!~"^system:.*" [10m])) > 0'
            for: 1m
            labels: {severity: warning, component: security, source: loki}
            annotations:
              summary: "{{ $labels.user_name }} schreibt privilegierten Workload in {{ $labels.kubernetes_namespace }}"
              description: "privileged oder hostPath in Pod, Deployment, StatefulSet oder DaemonSet, von einem Menschen geschrieben (z. B. kubectl debug node). Controller und GitOps sind ausgefiltert."
              action: "kubectl get pods -n {{ $labels.kubernetes_namespace }} -o wide — Pod und Zweck pruefen, unbekannt: loeschen und Zugang pruefen."

          - alert: LogsAuditLogSilent
            expr: 'absent_over_time({source="kube-audit"}[15m])'
            for: 5m
            labels: {severity: critical, component: security, source: loki}
            annotations:
              summary: "Seit 15 min kein API-Audit-Log in Loki"
              description: "Ohne Audit-Log bleibt ein Einbruch unsichtbar. Meist Alloy auf ctrl-0 oder der Audit-Pfad."
              action: "kubectl -n monitoring get pods -l app.kubernetes.io/name=alloy -o wide --field-selector spec.nodeName=ctrl-0; talosctl -n 192.168.0.101 read /var/log/audit/kube/kube-apiserver.log | tail -3"

          - alert: LogsAuditHumanSecretAccess
            expr: 'sum by (user_name) (count_over_time({source="kube-audit"} | json user_name="user.username", resource="objectRef.resource" | resource="secrets" | user_name!~"^system:.*" [10m])) > 40'
            for: 5m
            labels: {severity: warning, component: security, source: loki}
            annotations:
              summary: "Auffaellig viele Secret-Zugriffe durch Nutzer ({{ $value }} in 10min)"
              description: "ServiceAccounts sind ausgefiltert. Baseline liegt bei ~7 pro 10min — ein Vielfaches davon sieht nach Absammeln aus."
              action: "Loki: {source=\"kube-audit\"} | json | objectRef_resource=\"secrets\" — welche Secrets pruefen."

          - alert: LogsNetBirdAccessChange
            expr: 'sum by (pod) (count_over_time({namespace="netbird", pod=~"netbird-audit-export.*"} |~ "\"activity_code\":\"(rule|policy|route|group|nameserver)\\." [1h])) > 0'
            labels: {severity: warning, component: security, source: loki}
            annotations:
              summary: "VPN-Zugriffsregeln geaendert ({{ $value }} Events)"
              description: "Policy, Route oder Gruppe in NetBird veraendert — das steuert, wer aus dem VPN ins LAN darf. Gehoert nach tofu/netbird, nicht in die UI."
              action: "Loki: {namespace=\"netbird\", pod=~\"netbird-audit-export.*\"} | json — activity und initiator_email pruefen; gegen tofu/netbird abgleichen."

          - alert: LogsNetBirdPeerEnrollment
            expr: 'sum by (pod) (count_over_time({namespace="netbird", pod=~"netbird-audit-export.*"} |~ "\"activity_code\":\"(peer\\.setupkey\\.add|setupkey\\.add|user\\.invite|user\\.join|user\\.role\\.update)\"" [1h])) > 0'
            labels: {severity: warning, component: security, source: loki}
            annotations:
              summary: "Neues Geraet oder neuer Nutzer im VPN ({{ $value }} Events)"
              description: "Ein Peer wurde per Setup-Key angemeldet oder ein Nutzer eingeladen. Jeder neue Peer erreicht das LAN."
              action: "Loki: {namespace=\"netbird\", pod=~\"netbird-audit-export.*\"} | json — target_id und initiator_email pruefen."

          - alert: LogsSealedSecretsDecryptFailure
            expr: 'sum by (pod) (count_over_time({namespace="sealed-secrets"} |~ "(?i)(no key could decrypt|cannot decrypt|unsealing failed)" [1h])) > 0'
            for: 5m
            labels: {severity: warning, component: security, source: loki}
            annotations:
              runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/kubernetes/scripts/runbooks/platform.md#logssealedsecretsdecryptfailure"
              summary: "Sealed-Secrets kann nicht entschluesseln ({{ $value }} in 1h)"
              description: "Der Controller kommt nicht an den Key. Betrifft jedes Secret im Cluster — Single Point of Failure."
              action: "kubectl logs -n sealed-secrets -l name=sealed-secrets-controller --since=15m; Key-Backup pruefen."

      - name: logs-platform
        interval: 1m
        rules:
          - alert: LogsLeaderElectionLost
            expr: 'sum by (namespace, pod) (count_over_time({namespace=~".+", pod!~"loki.*|tetragon.*"} |= "leader election lost" [30m])) > 5'
            for: 15m
            labels: {severity: warning, component: platform, source: loki}
            annotations:
              summary: "Leader-Election-Verluste in {{ $labels.namespace }} ({{ $value }}× in 30min)"
              description: "client-go leaderelection, meist API-Server-Latenz. Operator crasht by-design und startet neu. Transiente Spikes <5× pro 30min sind erwartet unter etcd-Last, alarmen nur bei sustained Problemen (>5× für 15min)."
              action: "kubectl get pods -n {{ $labels.namespace }}; kubectl describe node ctrl-0 | grep -A5 Conditions"

          - alert: LogsOOMKillBurst
            expr: 'sum by (namespace, pod) (count_over_time({namespace=~".+", pod!~"loki.*"} |~ "(?i)out of memory: killed process" [10m])) > 3'
            for: 5m
            labels: {severity: warning, component: platform, source: loki}
            annotations:
              summary: "Mehrere OOM-Kills in 10min ({{ $value }})"
              description: "Der Kernel killt Prozesse wegen Speichermangel — steht im Log, bevor ein Restart sichtbar wird."
              action: "Loki: {namespace=~\".+\"} |~ \"out of memory: killed process\" — zeigt Pod+Prozess. Dann kubectl top pods -A --sort-by=memory."

          - alert: LogsPanicDetected
            expr: 'label_replace(sum by (namespace, pod) (count_over_time({namespace=~".+", pod!~"loki.*"} |~ "(?i)(panic:|fatal error:|runtime error:)" [15m])) > 5, "tenant", "$1", "namespace", "(drova)")'
            for: 10m
            labels: {severity: warning, component: platform, source: loki}
            annotations:
              summary: "Panics/Fatals in {{ $labels.namespace }} ({{ $value }} in 15min)"
              description: "Wiederholte Abstuerze auf Code-Ebene, auch wenn der Pod danach laeuft."
              action: "stern -n {{ $labels.namespace }} . -i 'panic|fatal' --since 15m"

          - alert: LogsCertificateIssuanceFailure
            expr: 'sum by (pod) (count_over_time({namespace="cert-manager"} |~ "(?i)(failed to finalize order|error issuing certificate|acme: error)" [1h])) > 0'
            for: 10m
            labels: {severity: warning, component: platform, source: loki}
            annotations:
              summary: "cert-manager kann nicht ausstellen ({{ $value }} in 1h)"
              description: "ACME schlaegt fehl. Wird erst in Wochen zum Ausfall — deshalb frueh melden."
              action: "kubectl get certificate,certificaterequest,order -A | grep -v True"

          - alert: LogsArgoCDSyncFailure
            expr: 'sum by (pod) (count_over_time({namespace="argocd"} |~ "(?i)(ComparisonError|failed to sync|rpc error.*repo)" [15m])) > 3'
            for: 10m
            labels: {severity: warning, component: platform, source: loki}
            annotations:
              summary: "ArgoCD kann nicht synchronisieren ({{ $value }} in 15min)"
              description: "Repo-Server oder Sync gestoert — ArgoCD wird blind fuer Drift, ohne dass eine App unhealthy wird."
              action: "kubectl logs -n argocd -l app.kubernetes.io/name=argocd-repo-server --since=15m"

          - alert: LogsErrorRateAnomaly
            expr: |
              label_replace(
                (sum by (namespace, container) (count_over_time({namespace=~".+", pod!~"loki.*"} | json | __error__="" | level=~"(?i)error" [10m])) > 50)
                and
                (sum by (namespace, container) (count_over_time({namespace=~".+", pod!~"loki.*"} | json | __error__="" | level=~"(?i)error" [10m]))
                  > 3 * (sum by (namespace, container) (count_over_time({namespace=~".+", pod!~"loki.*"} | json | __error__="" | level=~"(?i)error" [10m] offset 1d))
                    or sum by (namespace, container) (count_over_time({namespace=~".+", pod!~"loki.*"} | json | __error__="" | level=~"(?i)error" [10m])) * 0)),
                "tenant", "$1", "namespace", "(drova)")
            for: 5m
            labels: {severity: warning, component: platform, source: loki}
            annotations:
              summary: "Fehler-Sprung in {{ $labels.namespace }}/{{ $labels.container }} ({{ $value }} in 10min)"
              description: "Mehr als 50 Fehler in 10 min und mehr als dreimal so viele wie gestern um diese Zeit."
              action: "stern -n {{ $labels.namespace }} . -c {{ $labels.container }} -i error --since 10m"

          - alert: LogsVolumeSpike
            expr: 'sum by (namespace, pod) (count_over_time({namespace=~".+", namespace!="velero"}[10m])) > 80000'
            for: 5m
            labels: {severity: warning, component: platform, source: loki}
            annotations:
              summary: "{{ $labels.namespace }} loggt {{ $value }} Zeilen in 10min"
              description: "Ungefiltert nach Level — faengt Spam/Retry-Loops, die nicht als error/warn markiert sind. Baseline pro Namespace: kube-system ~53k, monitoring ~21k, argocd ~13k pro 10min (2026-09-06 gemessen). velero ausgenommen: jedes Backup loggt eine Zeile pro Objekt (~118k, 2026-09-10 gemessen) — Fehler deckt VeleroBackupPartialFailure ab."
              action: "stern -n {{ $labels.namespace }} . --since 10m | head -50; kubectl df-pv -n loki"

      - name: logs-data
        interval: 1m
        rules:
          - alert: LogsDatabaseLoginFailure
            expr: 'sum by (namespace, pod) (count_over_time({namespace=~"drova|n8n-prod|keycloak|cnpg-system"} |~ "server login has been failing|password authentication failed" [10m])) > 20'
            for: 2m
            labels: {severity: warning, component: data, source: loki}
            annotations:
              summary: "Anwendung kommt nicht an ihre DB ({{ $labels.namespace }}, {{ $value }} in 10min)"
              description: "Pooler oder App kann sich nicht an Postgres anmelden. Kurz bei Failover normal, dauerhaft trifft es Requests."
              action: "kubectl get cluster,pooler -n {{ $labels.namespace }}; kubectl logs -n {{ $labels.namespace }} -l cnpg.io/poolerName --since=15m"

          - alert: LogsVeleroBackupError
            expr: 'sum by (pod) (count_over_time({namespace="velero"} |~ "(?i)(backup failed|error backing up|failed to upload)" [1h])) > 2'
            for: 10m
            labels: {severity: warning, component: data, source: loki}
            annotations:
              summary: "Velero meldet Backup-Fehler ({{ $value }} in 1h)"
              description: "Ein 'completed' Backup kann trotzdem unvollstaendig sein — die Metrik zeigt nur, wann zuletzt gelaufen wurde."
              action: "velero backup get; velero backup logs $(velero backup get -o name | tail -1 | cut -d/ -f2)"

          - alert: LogsDiskIOError
            expr: 'sum by (pod) (count_over_time({namespace="rook-ceph"} |~ "I/O error|EXT4-fs error|Buffer I/O error|blk_update_request" [1h])) > 0'
            for: 5m
            labels: {severity: warning, component: storage, source: loki}
            annotations:
              runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/kubernetes/scripts/runbooks/storage.md#logsdiskioerror"
              summary: "Disk-I/O-Fehler in rook-ceph ({{ $value }} in 1h)"
              description: "Die OSD meldet Lese-/Schreibfehler von der Platte. Ceph-Health kann noch OK sein, waehrend die SSD schon stirbt."
              action: "stern -n rook-ceph . --since 15m -i 'i/o error'; smartctl-Dashboard fuer den Host pruefen."

          - alert: LogsCSIMountFailure
            expr: 'sum by (pod) (count_over_time({namespace="rook-ceph"} |~ "(?i)(failed to mount|rbd image.*still being used|MountVolume.*failed)" [15m])) > 3'
            for: 10m
            labels: {severity: warning, component: storage, source: loki}
            annotations:
              summary: "CSI kann Volumes nicht mounten ({{ $value }} in 15min)"
              description: "Stuck RBD-Lock oder haengender Mount — Pods bleiben Pending, ohne dass ein PVC-Alert greift."
              action: "kubectl get pods -A --field-selector status.phase=Pending; kubectl get volumeattachments | grep false"

          - alert: LogsVeleroRestoreFailure
            expr: 'sum by (pod) (count_over_time({namespace="velero"} |~ "(?i)(restore failed|error restoring|restore.*PartiallyFailed)" [1h])) > 0'
            for: 10m
            labels: {severity: warning, component: data, source: loki}
            annotations:
              summary: "Velero-Restore fehlgeschlagen ({{ $value }} in 1h)"
              description: "Betrifft auch die restore-verify-CronJobs — ein Backup ist erst dann eins, wenn der Restore laeuft."
              action: "velero restore get; velero restore logs $(velero restore get -o name | tail -1 | cut -d/ -f2)"

          - alert: LogsDatabaseFailover
            expr: 'sum by (namespace, pod) (count_over_time({namespace=~"cnpg-system|drova|n8n-prod|keycloak"} |~ "(?i)(promoted to primary|switchover|new primary)" [1h])) > 0'
            for: 0m
            labels: {severity: warning, component: data, source: loki}
            annotations:
              summary: "Postgres-Failover in {{ $labels.namespace }}"
              description: "Ein Replica wurde zum Primary befoerdert. Geplant beim Update, ungeplant heisst: der alte Primary ist gestorben."
              action: "kubectl get cluster -n {{ $labels.namespace }}; kubectl cnpg status <cluster> -n {{ $labels.namespace }}"

          - alert: LogsElasticsearchClusterBlock
            expr: 'sum by (namespace, pod) (count_over_time({namespace="elastic-system", pod=~"production-cluster.*"} |~ "(?i)(cluster_block_exception|circuit_breaking_exception|index_not_found)" [1h])) > 0'
            for: 5m
            labels: {severity: warning, component: data, source: loki}
            annotations:
              summary: "Elasticsearch blockt Schreibzugriffe ({{ $value }} in 1h)"
              description: "Read-only-Block oder Circuit-Breaker — Log- und Trace-Ingest laeuft ins Leere."
              action: "kubectl exec -n elastic-system production-cluster-es-master-data-0 -- curl -s localhost:9200/_cluster/allocation/explain"

      - name: logs-network
        interval: 1m
        rules:
          - alert: LogsNoHealthyUpstream
            expr: 'sum by (pod) (count_over_time({namespace="gateway"} |~ "no_healthy_upstream|upstream_reset_before_response_started" [10m])) > 5'
            for: 5m
            labels: {severity: warning, component: network, source: loki}
            annotations:
              summary: "Envoy findet keinen gesunden Upstream ({{ $value }} in 10min)"
              description: "Backend-Pods weg oder nicht ready — Nutzer sehen 503, bevor eine App-Metrik das zeigt."
              action: "kubectl get httproute -A; kubectl get endpointslices -A | grep -v ' 1 '"

          - alert: LogsCloudflaredTunnelFailure
            expr: 'sum by (pod) (count_over_time({namespace="cloudflared"} |~ "(?i)(failed to connect|unregistered tunnel|connection terminated)" [15m])) > 5'
            for: 10m
            labels: {severity: warning, component: network, source: loki}
            annotations:
              summary: "cloudflared verliert Tunnel-Verbindungen ({{ $value }} in 15min)"
              description: "Betrifft die oeffentlich exponierten Dienste (drova, n8n) — VPN-only-Dienste bleiben erreichbar."
              action: "kubectl logs -n cloudflared -l app=cloudflared --since=15m | grep -i 'connect'"

          - alert: LogsMeshRedirectionLost
            expr: 'sum by (pod) (count_over_time({namespace="istio-system", pod=~"ztunnel.*"} |= "Connection refused" [10m])) > 20'
            for: 5m
            labels: {severity: warning, component: network, source: loki}
            annotations:
              summary: "ztunnel erreicht Ziel-Pods nicht ({{ $value }} in 10min)"
              description: "Baseline ist null. Ein Pod hat seine ambient-Umleitung verloren — meist nach einem Node-Reboot, bei dem istio-cni sie fuer laufende Pods nicht neu setzt. Der Pod bleibt Running, ztunnel meldet im eigenen Log nichts, nur die Gegenstelle sieht Connection refused."
              action: "Ziel-Pod finden: kubectl -n istio-system logs -l app=ztunnel --since=10m | grep 'Connection refused' | grep -oE 'dst.workload=\"[^\"]*\"' | sort | uniq -c. Danach diesen Pod NEU ERSTELLEN (delete pod), nicht nur den Container neu starten. Betrifft mehrere Ziele auf demselben Node: ztunnel dieses Nodes neu erstellen."

          - alert: LogsGatewayRoutesDisabled
            expr: 'sum(count_over_time({namespace="gateway"} |= "setting 500 direct response in routes" [5m])) > 0'
            for: 2m
            labels: {severity: critical, component: network, source: loki}
            annotations:
              runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/kubernetes/scripts/runbooks/network.md#logsgatewayroutesdisabled"
              summary: "Envoy Gateway hat Routen auf 500 gesetzt"
              description: "Der Controller konnte eine Extension- oder SecurityPolicy nicht aufloesen und ersetzt betroffene Routen durch eine 500-Direktantwort. Bei der WAF genuegt ein einmalig fehlgeschlagener WASM-Download: envoyproxy/gateway#5619 retried nicht, der Zustand bleibt bis zum Neustart."
              action: "kubectl -n gateway rollout restart deploy envoy-gateway"
