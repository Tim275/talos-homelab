apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  namespace: monitoring
data:
  homelab-logs.yaml: |
    groups:
      - name: logs-security
        interval: 1m
        rules:
          - alert: LogsAuthFailureSpike
            expr: 'sum(count_over_time({namespace=~"keycloak|lldap"} |~ "(?i)(invalid_user_credentials|authentication failed|invalid password)" [10m])) > 20'
            for: 5m
            labels: {severity: warning, component: security, priority: P2, source: loki}
            annotations:
              summary: "{{ $value }} fehlgeschlagene Logins in 10min (keycloak/lldap)"
              description: "Brute-Force oder ein kaputter Client in Schleife."
              action: "kubectl logs -n keycloak keycloak-0 | grep -i invalid; Quell-IPs gruppieren."

          - alert: LogsSensitiveFileAccess
            expr: 'sum by (pod) (count_over_time({namespace="kube-system"} |~ "/etc/shadow|/etc/sudoers|authorized_keys" [10m])) > 0'
            labels: {severity: warning, component: security, priority: P2, source: loki}
            annotations:
              summary: "Zugriff auf Credential-Datei ({{ $labels.pod }})"
              description: "Tetragon meldet Zugriff auf shadow/sudoers/authorized_keys — passiert im Normalbetrieb nie."
              action: "kubectl logs -n kube-system -l app.kubernetes.io/name=tetragon --since=15m | grep -E 'shadow|sudoers'"

          - alert: LogsAuditPodExec
            expr: 'sum(count_over_time({service_name="kube-audit"} |~ "pods/exec" [10m])) > 0'
            labels: {severity: warning, component: security, priority: P2, source: loki}
            annotations:
              summary: "Shell in einem Pod geoeffnet ({{ $value }} in 10min)"
              description: "kubectl exec umgeht GitOps und hinterlaesst keine Spur im Repo. Im Normalbetrieb passiert das nie."
              action: "Loki: {service_name=\"kube-audit\"} |~ \"pods/exec\" | json — user.name und kubernetes.namespace pruefen."

          - alert: LogsAuditAnonymousAccess
            expr: 'sum(count_over_time({service_name="kube-audit"} |~ "system:anonymous" [10m])) > 0'
            labels: {severity: critical, component: security, priority: P1, source: loki}
            annotations:
              summary: "Nicht authentifizierter API-Zugriff ({{ $value }} in 10min)"
              description: "Jemand spricht den apiserver ohne Identitaet an. Baseline ist exakt null."
              action: "Loki: {service_name=\"kube-audit\"} |~ \"system:anonymous\" | json — sourceIPs und requestURI pruefen."

          - alert: LogsAuditRBACChange
            expr: 'sum(count_over_time({service_name="kube-audit"} |~ "clusterrolebindings|rolebindings" !~ "system:serviceaccount|system:node" !~ "\"verb\":\"(get|list|watch)\"" [15m])) > 0'
            for: 2m
            labels: {severity: warning, component: security, priority: P2, source: loki}
            annotations:
              summary: "Rechte-Vergabe ausserhalb von GitOps ({{ $value }} in 15min)"
              description: "Ein Mensch hat ein RoleBinding geaendert. Reconciler-Aenderungen sind ausgefiltert, Baseline ist null."
              action: "Loki: {service_name=\"kube-audit\"} |~ \"rolebindings\" | json — user.name und verb pruefen."

          - alert: LogsAuditHumanSecretAccess
            expr: 'sum(count_over_time({service_name="kube-audit"} |~ "\"kubernetes.resource\":\"secrets\"" !~ "system:serviceaccount|system:node" [10m])) > 25'
            for: 5m
            labels: {severity: warning, component: security, priority: P2, source: loki}
            annotations:
              summary: "Auffaellig viele Secret-Zugriffe durch Nutzer ({{ $value }} in 10min)"
              description: "ServiceAccounts sind ausgefiltert. Baseline liegt bei ~7 pro 10min — ein Vielfaches davon sieht nach Absammeln aus."
              action: "Loki: {service_name=\"kube-audit\"} |~ \"secrets\" !~ \"serviceaccount\" | json — user.name gruppieren."

          - alert: LogsNetBirdAccessChange
            expr: 'sum(count_over_time({namespace="netbird", pod=~"netbird-audit-export.*"} |~ "\"activity_code\":\"(rule|policy|route|group|nameserver)\\." [20m])) > 0'
            labels: {severity: warning, component: security, priority: P2, source: loki}
            annotations:
              summary: "VPN-Zugriffsregeln geaendert ({{ $value }} Events)"
              description: "Policy, Route oder Gruppe in NetBird veraendert — das steuert, wer aus dem VPN ins LAN darf. Gehoert nach tofu/netbird, nicht in die UI."
              action: "Loki: {namespace=\"netbird\", pod=~\"netbird-audit-export.*\"} | json — activity und initiator_email pruefen; gegen tofu/netbird abgleichen."

          - alert: LogsNetBirdPeerEnrollment
            expr: 'sum(count_over_time({namespace="netbird", pod=~"netbird-audit-export.*"} |~ "\"activity_code\":\"(peer\\.setupkey\\.add|setupkey\\.add|user\\.invite|user\\.join|user\\.role\\.update)\"" [20m])) > 0'
            labels: {severity: warning, component: security, priority: P2, source: loki}
            annotations:
              summary: "Neues Geraet oder neuer Nutzer im VPN ({{ $value }} Events)"
              description: "Ein Peer wurde per Setup-Key angemeldet oder ein Nutzer eingeladen. Jeder neue Peer erreicht das LAN."
              action: "Loki: {namespace=\"netbird\", pod=~\"netbird-audit-export.*\"} | json — target_id und initiator_email pruefen."

          - alert: LogsSealedSecretsDecryptFailure
            expr: 'sum(count_over_time({namespace="sealed-secrets"} |~ "(?i)(no key could decrypt|cannot decrypt|unsealing failed)" [15m])) > 0'
            for: 5m
            labels: {severity: critical, component: security, priority: P1, source: loki}
            annotations:
              summary: "Sealed-Secrets kann nicht entschluesseln ({{ $value }} in 15min)"
              description: "Der Controller kommt nicht an den Key. Betrifft jedes Secret im Cluster — Single Point of Failure."
              action: "kubectl logs -n sealed-secrets -l name=sealed-secrets-controller --since=15m; Key-Backup pruefen."

      - name: logs-platform
        interval: 1m
        rules:
          - alert: LogsOOMKillBurst
            expr: 'sum(count_over_time({namespace=~".+", pod!~"loki.*"} |~ "(?i)out of memory: killed process" [10m])) > 3'
            for: 5m
            labels: {severity: warning, component: platform, priority: P2, source: loki}
            annotations:
              summary: "Mehrere OOM-Kills in 10min ({{ $value }})"
              description: "Der Kernel killt Prozesse wegen Speichermangel — steht im Log, bevor ein Restart sichtbar wird."
              action: "kubectl top pods -A --sort-by=memory; Limits der Top-Verbraucher pruefen."

          - alert: LogsPanicDetected
            expr: 'sum by (namespace) (count_over_time({namespace=~".+", pod!~"loki.*"} |~ "(?i)(panic:|fatal error:|runtime error:)" [15m])) > 5'
            for: 10m
            labels: {severity: warning, component: platform, priority: P2, source: loki}
            annotations:
              summary: "Panics/Fatals in {{ $labels.namespace }} ({{ $value }} in 15min)"
              description: "Wiederholte Abstuerze auf Code-Ebene, auch wenn der Pod danach laeuft."
              action: "stern -n {{ $labels.namespace }} . -i 'panic|fatal' --since 15m"

          - alert: LogsCertificateIssuanceFailure
            expr: 'sum(count_over_time({namespace="cert-manager"} |~ "(?i)(failed to finalize order|error issuing certificate|acme: error)" [30m])) > 0'
            for: 10m
            labels: {severity: warning, component: platform, priority: P2, source: loki}
            annotations:
              summary: "cert-manager kann nicht ausstellen ({{ $value }} in 30min)"
              description: "ACME schlaegt fehl. Wird erst in Wochen zum Ausfall — deshalb frueh melden."
              action: "kubectl get certificate,certificaterequest,order -A | grep -v True"

          - alert: LogsArgoCDSyncFailure
            expr: 'sum(count_over_time({namespace="argocd"} |~ "(?i)(ComparisonError|failed to sync|rpc error.*repo)" [15m])) > 3'
            for: 10m
            labels: {severity: warning, component: platform, priority: P2, source: loki}
            annotations:
              summary: "ArgoCD kann nicht synchronisieren ({{ $value }} in 15min)"
              description: "Repo-Server oder Sync gestoert — ArgoCD wird blind fuer Drift, ohne dass eine App unhealthy wird."
              action: "kubectl logs -n argocd -l app.kubernetes.io/name=argocd-repo-server --since=15m"

          - alert: LogsErrorRateAnomaly
            expr: 'sum by (namespace, pod) (count_over_time({namespace=~".+"} | json | level=~"(?i)error" [10m])) > 30'
            for: 5m
            labels: {severity: warning, component: platform, priority: P2, source: loki}
            annotations:
              summary: "{{ $labels.pod }} loggt auffaellig viele Errors ({{ $value }} in 10min)"
              description: "Pod laeuft, crasht nicht — kein spezifisches Muster der anderen Regeln passt, aber die Error-Rate im Log ist erhoeht. Baseline clusterweit ~21/10min ueber ALLE Pods verteilt (2026-08-26 gemessen); ein einzelner Pod ueber 30 ist konzentriert genug, um kein Rauschen zu sein."
              action: "stern -n {{ $labels.namespace }} {{ $labels.pod }} -i error --since 10m"

      - name: logs-data
        interval: 1m
        rules:
          - alert: LogsDatabaseLoginFailure
            expr: 'sum by (namespace) (count_over_time({namespace=~"drova|n8n-prod|keycloak|cnpg-system"} |~ "server login has been failing|password authentication failed" [10m])) > 20'
            for: 2m
            labels: {severity: warning, component: data, priority: P2, source: loki}
            annotations:
              summary: "Anwendung kommt nicht an ihre DB ({{ $labels.namespace }}, {{ $value }} in 10min)"
              description: "Pooler oder App kann sich nicht an Postgres anmelden. Kurz bei Failover normal, dauerhaft trifft es Requests."
              action: "kubectl get cluster,pooler -n {{ $labels.namespace }}; kubectl logs -n {{ $labels.namespace }} -l cnpg.io/poolerName --since=15m"

          - alert: LogsVeleroBackupError
            expr: 'sum(count_over_time({namespace="velero"} |~ "(?i)(backup failed|error backing up|failed to upload)" [1h])) > 2'
            for: 10m
            labels: {severity: warning, component: data, priority: P2, source: loki}
            annotations:
              summary: "Velero meldet Backup-Fehler ({{ $value }} in 1h)"
              description: "Ein 'completed' Backup kann trotzdem unvollstaendig sein — die Metrik zeigt nur, wann zuletzt gelaufen wurde."
              action: "velero backup get; velero backup logs $(velero backup get -o name | tail -1 | cut -d/ -f2)"

          - alert: LogsDiskIOError
            expr: 'sum by (pod) (count_over_time({namespace="rook-ceph"} |~ "I/O error|EXT4-fs error|Buffer I/O error|blk_update_request" [15m])) > 0'
            for: 5m
            labels: {severity: critical, component: storage, priority: P1, source: loki}
            annotations:
              summary: "Disk-I/O-Fehler auf {{ $labels.pod }} ({{ $value }} in 15min)"
              description: "Die OSD meldet Lese-/Schreibfehler von der Platte. Ceph-Health kann noch OK sein, waehrend die SSD schon stirbt."
              action: "kubectl logs -n rook-ceph {{ $labels.pod }} --since=15m | grep -i 'i/o error'; smartctl-Dashboard fuer den Host pruefen."

          - alert: LogsCSIMountFailure
            expr: 'sum(count_over_time({namespace="rook-ceph"} |~ "(?i)(failed to mount|rbd image.*still being used|MountVolume.*failed)" [15m])) > 3'
            for: 10m
            labels: {severity: warning, component: storage, priority: P2, source: loki}
            annotations:
              summary: "CSI kann Volumes nicht mounten ({{ $value }} in 15min)"
              description: "Stuck RBD-Lock oder haengender Mount — Pods bleiben Pending, ohne dass ein PVC-Alert greift."
              action: "kubectl get pods -A --field-selector status.phase=Pending; kubectl get volumeattachments | grep false"

          - alert: LogsVeleroRestoreFailure
            expr: 'sum(count_over_time({namespace="velero"} |~ "(?i)(restore failed|error restoring|restore.*PartiallyFailed)" [1h])) > 0'
            for: 10m
            labels: {severity: warning, component: data, priority: P2, source: loki}
            annotations:
              summary: "Velero-Restore fehlgeschlagen ({{ $value }} in 1h)"
              description: "Betrifft auch die restore-verify-CronJobs — ein Backup ist erst dann eins, wenn der Restore laeuft."
              action: "velero restore get; velero restore logs $(velero restore get -o name | tail -1 | cut -d/ -f2)"

          - alert: LogsDatabaseFailover
            expr: 'sum by (namespace) (count_over_time({namespace=~"cnpg-system|drova|n8n-prod|keycloak"} |~ "(?i)(promoted to primary|switchover|new primary)" [15m])) > 0'
            for: 0m
            labels: {severity: warning, component: data, priority: P2, source: loki}
            annotations:
              summary: "Postgres-Failover in {{ $labels.namespace }}"
              description: "Ein Replica wurde zum Primary befoerdert. Geplant beim Update, ungeplant heisst: der alte Primary ist gestorben."
              action: "kubectl get cluster -n {{ $labels.namespace }}; kubectl cnpg status <cluster> -n {{ $labels.namespace }}"

          - alert: LogsElasticsearchClusterBlock
            expr: 'sum(count_over_time({namespace="elastic-system", pod=~"production-cluster.*"} |~ "(?i)(cluster_block_exception|circuit_breaking_exception|index_not_found)" [15m])) > 0'
            for: 5m
            labels: {severity: warning, component: data, priority: P2, source: loki}
            annotations:
              summary: "Elasticsearch blockt Schreibzugriffe ({{ $value }} in 15min)"
              description: "Read-only-Block oder Circuit-Breaker — Log- und Trace-Ingest laeuft ins Leere."
              action: "kubectl exec -n elastic-system production-cluster-es-master-data-0 -- curl -s localhost:9200/_cluster/allocation/explain"

      - name: logs-network
        interval: 1m
        rules:
          - alert: LogsNoHealthyUpstream
            expr: 'sum(count_over_time({namespace="gateway"} |~ "no_healthy_upstream|upstream_reset_before_response_started" [10m])) > 5'
            for: 5m
            labels: {severity: warning, component: network, priority: P2, source: loki}
            annotations:
              summary: "Envoy findet keinen gesunden Upstream ({{ $value }} in 10min)"
              description: "Backend-Pods weg oder nicht ready — Nutzer sehen 503, bevor eine App-Metrik das zeigt."
              action: "kubectl get httproute -A; kubectl get endpointslices -A | grep -v ' 1 '"

          - alert: LogsCloudflaredTunnelFailure
            expr: 'sum(count_over_time({namespace="cloudflared"} |~ "(?i)(failed to connect|unregistered tunnel|connection terminated)" [15m])) > 5'
            for: 10m
            labels: {severity: warning, component: network, priority: P2, source: loki}
            annotations:
              summary: "cloudflared verliert Tunnel-Verbindungen ({{ $value }} in 15min)"
              description: "Betrifft die oeffentlich exponierten Dienste (drova, n8n) — VPN-only-Dienste bleiben erreichbar."
              action: "kubectl logs -n cloudflared -l app=cloudflared --since=15m | grep -i 'connect'"
