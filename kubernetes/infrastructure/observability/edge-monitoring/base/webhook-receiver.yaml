# Stellvertreter fuer "lokale Zustellung ohne zentrale Konnektivitaet" — auf
# einem echten Fog-Node waere das ein lokales Display/eine Sirene/ein Relais.
# Haelt empfangene Alerts einfach in einer Datei fest, um den Drill beweisbar
# zu machen (kubectl exec ... cat /data/alerts.log).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-webhook-receiver
  namespace: edge-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-webhook-receiver
  template:
    metadata:
      labels:
        app: edge-webhook-receiver
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                { printf 'HTTP/1.1 200 OK\r\nContent-Length: 0\r\n\r\n'; cat >> /data/alerts.log; printf '\n---\n' >> /data/alerts.log; } | nc -l -p 8080
              done
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-webhook-receiver
  namespace: edge-monitoring
spec:
  selector:
    app: edge-webhook-receiver
  ports:
    - port: 8080
      targetPort: 8080
