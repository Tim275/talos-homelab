apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-prometheus
  namespace: edge-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edge-prometheus
  namespace: edge-monitoring
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edge-prometheus
  namespace: edge-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: edge-prometheus
subjects:
  - kind: ServiceAccount
    name: edge-prometheus
    namespace: edge-monitoring
