apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hubble-oidc
  namespace: kube-system
spec:
  oidc:
    provider:
      issuer: https://iam.timourhomelab.org/realms/kubernetes
      authorizationEndpoint: https://iam.timourhomelab.org/realms/kubernetes/protocol/openid-connect/auth
      tokenEndpoint: https://iam.timourhomelab.org/realms/kubernetes/protocol/openid-connect/token
    redirectURL: https://hubble.timourhomelab.org/oauth2/callback
  jwt:
    providers:
      - name: keycloak
        issuer: https://iam.timourhomelab.org/realms/kubernetes
        remoteJWKS:
          uri: https://iam.timourhomelab.org/realms/kubernetes/protocol/openid-connect/certs
        extractFrom:
          cookies:
            - AccessToken-Hubble
