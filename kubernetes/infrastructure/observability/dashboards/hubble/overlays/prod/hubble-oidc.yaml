apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: hubble-oidc-credentials-cookie-secret
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: kube-system/hubble-oidc-credentials
        property: cookie-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hubble-oidc-credentials
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hubble-oidc-credentials
    template:
      engineVersion: v2
      data:
        client-id: hubble
        client-secret: '{{ index . "client-secret" }}'
        cookie-secret: '{{ index . "cookie-secret" }}'
  data:
  - secretKey: client-secret
    remoteRef:
      key: keycloak/keycloak-hubble-client-secret
      property: clientSecret
  - secretKey: cookie-secret
    remoteRef:
      key: kube-system/hubble-oidc-credentials
      property: cookie-secret
