apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
spec:
  config:
    server:
      root_url: https://grafana.timourhomelab.org
    auth:
      signout_redirect_url: "https://iam.timourhomelab.org/realms/kubernetes/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.timourhomelab.org&client_id=grafana"
    auth.generic_oauth:
      auth_url: "https://iam.timourhomelab.org/realms/kubernetes/protocol/openid-connect/auth"
      token_url: "https://iam.timourhomelab.org/realms/kubernetes/protocol/openid-connect/token"
      api_url: "https://iam.timourhomelab.org/realms/kubernetes/protocol/openid-connect/userinfo"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-envoy
  namespace: grafana
spec:
  hostnames:
    - grafana.timourhomelab.org
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-envoy-http
  namespace: grafana
spec:
  hostnames:
    - grafana.timourhomelab.org
