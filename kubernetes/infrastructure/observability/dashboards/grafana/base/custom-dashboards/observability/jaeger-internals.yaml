apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: jaeger-internals
  namespace: grafana
spec:
  uid: jaeger-internals
  instanceSelector:
    matchLabels:
      app: grafana
  allowCrossNamespaceImport: true
  folder: Observability
  json: |
    {
      "title": "Jaeger v2 — Ingest, Storage, Sampling",
      "uid": "jaeger-internals",
      "tags": ["observability","jaeger","tracing"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-3h", "to": "now"},
      "templating": {"list": []},
      "panels": [
        {"id":1,"type":"stat","title":"Spans empfangen","gridPos":{"x":0,"y":0,"w":6,"h":4},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"sum(rate(otelcol_receiver_accepted_spans{job=\"jaeger-collector-monitoring\"}[5m]))"}],
         "fieldConfig":{"defaults":{"unit":"reqps"}}},
        {"id":2,"type":"stat","title":"Spans abgewiesen","gridPos":{"x":6,"y":0,"w":6,"h":4},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"sum(rate(otelcol_receiver_refused_spans{job=\"jaeger-collector-monitoring\"}[5m]))"}],
         "fieldConfig":{"defaults":{"unit":"reqps","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":0.1}]}}}},
        {"id":3,"type":"stat","title":"Export-Fehler (Storage)","gridPos":{"x":12,"y":0,"w":6,"h":4},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"sum(rate(otelcol_exporter_send_failed_spans{job=\"jaeger-collector-monitoring\"}[5m])) or vector(0)"}],
         "fieldConfig":{"defaults":{"unit":"reqps","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":0.1}]}}}},
        {"id":4,"type":"stat","title":"Spans → Elasticsearch","gridPos":{"x":18,"y":0,"w":6,"h":4},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"sum(rate(otelcol_exporter_sent_spans{job=\"jaeger-collector-monitoring\"}[5m]))"}],
         "fieldConfig":{"defaults":{"unit":"reqps"}}},

        {"id":10,"type":"timeseries","title":"Span-Fluss: Eingang vs. Export","gridPos":{"x":0,"y":4,"w":12,"h":8},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[
           {"expr":"sum(rate(otelcol_receiver_accepted_spans{job=\"jaeger-collector-monitoring\"}[5m]))","legendFormat":"empfangen"},
           {"expr":"sum(rate(otelcol_exporter_sent_spans{job=\"jaeger-collector-monitoring\"}[5m]))","legendFormat":"nach ES exportiert"},
           {"expr":"sum(rate(otelcol_receiver_refused_spans{job=\"jaeger-collector-monitoring\"}[5m]))","legendFormat":"abgewiesen"}],
         "fieldConfig":{"defaults":{"unit":"reqps"}}},
        {"id":11,"type":"timeseries","title":"Laufende Export-Requests","gridPos":{"x":12,"y":4,"w":12,"h":8},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"sum by (exporter) (otelcol_exporter_in_flight_requests{job=\"jaeger-collector-monitoring\"})","legendFormat":"{{exporter}}"}]},

        {"id":19,"type":"row","title":"Elasticsearch-Storage","gridPos":{"x":0,"y":12,"w":24,"h":1}},
        {"id":20,"type":"timeseries","title":"ES Bulk-Index Latenz","gridPos":{"x":0,"y":13,"w":12,"h":8},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[
           {"expr":"histogram_quantile(0.99, sum by (le) (rate(jaeger_storage_bulk_index_latency_ok_bucket[5m])))","legendFormat":"p99"},
           {"expr":"histogram_quantile(0.50, sum by (le) (rate(jaeger_storage_bulk_index_latency_ok_bucket[5m])))","legendFormat":"p50"}],
         "fieldConfig":{"defaults":{"unit":"s"}}},
        {"id":21,"type":"timeseries","title":"ES Inserts vs. Fehler","gridPos":{"x":12,"y":13,"w":12,"h":8},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[
           {"expr":"sum(rate(jaeger_storage_bulk_index_inserts[5m]))","legendFormat":"inserts"},
           {"expr":"sum(rate(jaeger_storage_bulk_index_errors[5m]))","legendFormat":"errors"}],
         "fieldConfig":{"defaults":{"unit":"reqps"}}},

        {"id":29,"type":"row","title":"Tail-Sampling (OTel-Gateway)","gridPos":{"x":0,"y":21,"w":24,"h":1}},
        {"id":30,"type":"timeseries","title":"Behaltene Traces je Policy","gridPos":{"x":0,"y":22,"w":12,"h":8},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"sum by (policy) (rate(otelcol_processor_tail_sampling_count_traces_sampled{sampled=\"true\"}[5m]))","legendFormat":"{{policy}}"}],
         "fieldConfig":{"defaults":{"unit":"reqps"}}},
        {"id":31,"type":"timeseries","title":"Verworfene Traces je Policy","gridPos":{"x":12,"y":22,"w":12,"h":8},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"sum by (policy) (rate(otelcol_processor_tail_sampling_count_traces_sampled{sampled=\"false\"}[5m]))","legendFormat":"{{policy}}"}],
         "fieldConfig":{"defaults":{"unit":"reqps"}}},
        {"id":32,"type":"stat","title":"Traces im Sampling-Puffer","gridPos":{"x":0,"y":30,"w":8,"h":4},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"max(otelcol_processor_tail_sampling_sampling_traces_on_memory)"}],
         "fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":45000},{"color":"red","value":50000}]}}}},
        {"id":33,"type":"stat","title":"Neue Trace-IDs","gridPos":{"x":8,"y":30,"w":8,"h":4},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"sum(rate(otelcol_processor_tail_sampling_new_trace_id_received[5m]))"}],
         "fieldConfig":{"defaults":{"unit":"reqps"}}},
        {"id":34,"type":"stat","title":"Zu frueh verworfen","gridPos":{"x":16,"y":30,"w":8,"h":4},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"sum(rate(otelcol_processor_tail_sampling_sampling_trace_dropped_too_early[5m]))"}],
         "fieldConfig":{"defaults":{"unit":"reqps","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":0.1}]}}}},

        {"id":39,"type":"row","title":"Collector-Runtime","gridPos":{"x":0,"y":34,"w":24,"h":1}},
        {"id":40,"type":"timeseries","title":"Speicher (RSS / Heap)","gridPos":{"x":0,"y":35,"w":12,"h":8},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[
           {"expr":"otelcol_process_memory_rss{job=\"jaeger-collector-monitoring\"}","legendFormat":"RSS"},
           {"expr":"otelcol_process_runtime_heap_alloc_bytes{job=\"jaeger-collector-monitoring\"}","legendFormat":"heap"}],
         "fieldConfig":{"defaults":{"unit":"bytes"}}},
        {"id":41,"type":"timeseries","title":"Batch-Groesse p99","gridPos":{"x":12,"y":35,"w":12,"h":8},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"histogram_quantile(0.99, sum by (le) (rate(otelcol_processor_batch_batch_send_size_bucket{job=\"jaeger-collector-monitoring\"}[5m])))","legendFormat":"p99 spans/batch"}]}
      ]
    }
