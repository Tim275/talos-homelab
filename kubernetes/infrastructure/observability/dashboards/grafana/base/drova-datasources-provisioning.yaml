apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-drova-datasources-provisioning
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: datasource
data:
  drova-datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Postgres Drova Trips
        type: postgres
        access: proxy
        url: drova-postgres-ro.drova.svc.cluster.local:5432
        database: drova_trips
        user: grafana_reader
        isDefault: false
        uid: postgres-drova-trips
        jsonData:
          sslmode: prefer
          postgresVersion: 1601
          timescaledb: false
        secureJsonData:
          password: $__env{DROVA_POSTGRES_GRAFANA_READER_PASSWORD}
      - name: Postgres Drova Payments
        type: postgres
        access: proxy
        url: drova-postgres-ro.drova.svc.cluster.local:5432
        database: drova_payments
        user: grafana_reader
        isDefault: false
        uid: postgres-drova-payments
        jsonData:
          sslmode: prefer
          postgresVersion: 1601
          timescaledb: false
        secureJsonData:
          password: $__env{DROVA_POSTGRES_GRAFANA_READER_PASSWORD}
      - name: Postgres Drova Drivers
        type: postgres
        access: proxy
        url: drova-postgres-ro.drova.svc.cluster.local:5432
        database: drova_drivers
        user: grafana_reader
        isDefault: false
        uid: postgres-drova-drivers
        jsonData:
          sslmode: prefer
          postgresVersion: 1601
          timescaledb: false
        secureJsonData:
          password: $__env{DROVA_POSTGRES_GRAFANA_READER_PASSWORD}
      - name: Postgres Drova Users
        type: postgres
        access: proxy
        url: drova-postgres-ro.drova.svc.cluster.local:5432
        database: drova_users
        user: grafana_reader
        isDefault: false
        uid: postgres-drova-users
        jsonData:
          sslmode: prefer
          postgresVersion: 1601
          timescaledb: false
        secureJsonData:
          password: $__env{DROVA_POSTGRES_GRAFANA_READER_PASSWORD}
      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: https://production-cluster-es-http.elastic-system.svc.cluster.local:9200
        isDefault: false
        uid: elasticsearch
        basicAuth: true
        basicAuthUser: grafana_reader
        jsonData:
          timeField: "@timestamp"
          esVersion: "8.0.0"
          logMessageField: message
          logLevelField: level
          tlsSkipVerify: true
          index: "logs-*"
          interval: Daily
          timeInterval: "30s"
          maxConcurrentShardRequests: 5
        secureJsonData:
          basicAuthPassword: $__env{ES_GRAFANA_READER_PASSWORD}
