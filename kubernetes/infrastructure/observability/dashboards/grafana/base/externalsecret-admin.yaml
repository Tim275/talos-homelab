apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-openbao
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-admin-openbao
  data:
    - secretKey: GF_SECURITY_ADMIN_USER
      remoteRef:
        key: grafana/admin
        property: user
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: grafana/admin
        property: password
