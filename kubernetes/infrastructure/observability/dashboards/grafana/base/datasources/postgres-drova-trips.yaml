apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: postgres-drova-trips
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: datasource
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      app: grafana
  datasource:
    name: Postgres Drova Trips
    type: postgres
    access: proxy
    url: drova-postgres-ro.drova.svc.cluster.local:5432
    database: drova_trips
    user: grafana_reader
    isDefault: false
    uid: postgres-drova-trips
    jsonData:
      sslmode: prefer
      postgresVersion: 1601
      timescaledb: false
    secureJsonData:
      password: "$__env{DROVA_POSTGRES_GRAFANA_READER_PASSWORD}"
