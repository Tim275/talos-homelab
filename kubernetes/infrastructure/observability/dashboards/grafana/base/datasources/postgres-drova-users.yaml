apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: postgres-drova-users
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: datasource
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      app: grafana
  valuesFrom:
    - targetPath: secureJsonData.password
      valueFrom:
        secretKeyRef:
          name: drova-postgres-grafana-credentials
          key: password
  datasource:
    name: Postgres Drova Users
    type: postgres
    access: proxy
    url: drova-postgres-ro.drova.svc.cluster.local:5432
    database: drova_users
    user: grafana_reader
    isDefault: false
    uid: postgres-drova-users
    jsonData:
      sslmode: prefer
      postgresVersion: 1601
      timescaledb: false
