apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: tempo-writes
  namespace: grafana
spec:
  uid: tempo-writes
  instanceSelector:
    matchLabels:
      app: grafana
  allowCrossNamespaceImport: true
  folder: "Observability"
  resyncPeriod: 5m
  url: "https://raw.githubusercontent.com/grafana/tempo/v2.9.0/operations/tempo-mixin-compiled/dashboards/tempo-writes.json"
