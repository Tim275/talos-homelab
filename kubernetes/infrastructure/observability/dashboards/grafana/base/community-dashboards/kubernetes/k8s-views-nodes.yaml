apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: k8s-views-nodes
  namespace: grafana
spec:
  uid: k8s-views-nodes
  instanceSelector:
    matchLabels:
      app: grafana
  allowCrossNamespaceImport: true
  folder: "Kubernetes"
  resyncPeriod: 5m
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "prometheus"
    - inputName: "DS_LOKI"
      datasourceName: "loki"
  # replaces k8s-kubelet.yaml (grafana.com 12119, rev 1 from 2020) — dead metric
  # names (:sum_rate instead of :sum_rate5m, _cpu_cores suffix kube-state-metrics
  # dropped years ago). dotdc's Nodes view, actively maintained.
  url: "https://grafana.com/api/dashboards/15759/revisions/40/download"
