apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: etcd
  namespace: grafana
spec:
  uid: etcd
  instanceSelector:
    matchLabels:
      app: grafana
  allowCrossNamespaceImport: true
  folder: "Kubernetes"
  resyncPeriod: 5m
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "prometheus"
  # etcd scraped via additionalScrapeConfigs static_config (kubeEtcd.enabled: false,
  # not scrapeable via ServiceMonitor on single-node Talos, see cluster.yaml comments).
  url: "https://grafana.com/api/dashboards/22236/revisions/4/download"
