apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-dns
  namespace: grafana
spec:
  uid: external-dns
  instanceSelector:
    matchLabels:
      app: grafana
  allowCrossNamespaceImport: true
  folder: "Network"
  resyncPeriod: 5m
  url: "https://grafana.com/api/dashboards/23969/revisions/1/download"
