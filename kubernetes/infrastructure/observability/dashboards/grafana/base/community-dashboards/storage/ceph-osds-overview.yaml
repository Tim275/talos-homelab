apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ceph-osds-overview
  namespace: grafana
spec:
  uid: ceph-osds-overview
  instanceSelector:
    matchLabels:
      app: grafana
  allowCrossNamespaceImport: true
  folder: "Storage"
  resyncPeriod: 5m
  url: "https://raw.githubusercontent.com/ceph/ceph/v19.2.3/monitoring/ceph-mixin/dashboards_out/osds-overview.json"
