---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: grafana-db-daily-backup
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  schedule: "0 30 3 * * *"
  backupOwnerReference: self
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: grafana-db
