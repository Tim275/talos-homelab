apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: grafana-db-backup-store
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  configuration:
    destinationPath: s3://cnpg-grafana-backup/
    endpointURL: http://rook-ceph-rgw-homelab-objectstore.rook-ceph.svc:80
    s3Credentials:
      accessKeyId:
        name: cnpg-grafana-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-grafana-backup
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
      jobs: 1
  retentionPolicy: "30d"
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
