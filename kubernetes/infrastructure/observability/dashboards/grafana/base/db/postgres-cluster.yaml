---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: grafana-db
    app.kubernetes.io/component: database
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.2
  # Guaranteed QoS — 512Mi = 4x shared_buffers 128MB (CNPG-Regel)
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 100m
  storage:
    size: 5Gi
    storageClass: rook-ceph-block-enterprise
  postgresql:
    parameters:
      max_connections: '100'
      shared_buffers: 128MB
      effective_cache_size: 384MB
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
      secret:
        name: grafana-db-credentials
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: grafana-db-backup-store
        serverName: grafana-db
  monitoring:
    enablePodMonitor: true
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
