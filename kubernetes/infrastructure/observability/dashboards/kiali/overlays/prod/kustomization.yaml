apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: istio-system

resources:
  - ../../base
  - basic-auth-sealed.yaml

components:
  - ../../components/envoy-gateway

helmCharts:
  - name: kiali-server
    repo: https://kiali.org/helm-charts
    version: 2.30.0
    releaseName: kiali
    namespace: istio-system
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.yaml

patches:
  - path: settings.yaml
