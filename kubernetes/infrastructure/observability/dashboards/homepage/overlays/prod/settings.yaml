apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  services.yaml: |
    - Init:
        - Calendar:
            icon: mdi-calendar-month
            widget:
              type: calendar
              view: monthly
              maxEvents: 10
    - Productivity:
        - Excalidraw:
            icon: excalidraw.png
            href: https://excalidraw.com
            description: Drawing & Diagrams
    - Observability:
        - Loki:
            icon: loki.png
            href: https://grafana.timourhomelab.org/a/grafana-lokiexplore-app/explore
            description: Log Aggregation (VPN-only via NetBird)
        - Tempo:
            icon: tempo.png
            href: https://grafana.timourhomelab.org/a/grafana-exploretraces-app/explore
            description: Distributed Traces (VPN-only via NetBird)
        - Vector:
            icon: vector.png
            href: https://grafana.timourhomelab.org/dashboards?query=vector
            description: Log Pipeline (VPN-only via NetBird)
    - Data:
        - Elasticsearch:
            icon: elasticsearch.png
            href: https://kibana.timourhomelab.org
            description: Search & SIEM Store (VPN-only via NetBird)
    - Storage:
        - Velero:
            icon: velero.png
            href: https://github.com/Tim275/talos-homelab/tree/main/kubernetes/infrastructure/storage/velero-schedules
            description: Backup Schedules (GitOps)
    - Platform:
        - Sealed Secrets:
            icon: mdi-lock-outline
            href: https://github.com/Tim275/talos-homelab/tree/main/kubernetes/security
            description: Secret Encryption (GitOps)
        - cert-manager:
            icon: cert-manager.png
            href: https://grafana.timourhomelab.org/dashboards?query=cert
            description: TLS Certificates (VPN-only via NetBird)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
spec:
  hostnames:
    - homepage.timourhomelab.org
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage-health
  namespace: homepage
spec:
  hostnames:
    - homepage.timourhomelab.org
