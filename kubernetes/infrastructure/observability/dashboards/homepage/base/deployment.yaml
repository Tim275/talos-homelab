apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    argocd.argoproj.io/sync-wave: "60"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13.2@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,homepage.timourhomelab.org"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - { mountPath: /app/config/custom.js, name: config, subPath: custom.js }
            - { mountPath: /app/config/custom.css, name: config, subPath: custom.css }
            - { mountPath: /app/config/bookmarks.yaml, name: config, subPath: bookmarks.yaml }
            - { mountPath: /app/config/docker.yaml, name: config, subPath: docker.yaml }
            - { mountPath: /app/config/kubernetes.yaml, name: config, subPath: kubernetes.yaml }
            - { mountPath: /app/config/services.yaml, name: config, subPath: services.yaml }
            - { mountPath: /app/config/settings.yaml, name: config, subPath: settings.yaml }
            - { mountPath: /app/config/widgets.yaml, name: config, subPath: widgets.yaml }
            - { mountPath: /app/config/logs, name: logs }
      volumes:
        - name: config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
