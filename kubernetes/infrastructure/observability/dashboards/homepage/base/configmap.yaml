apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Tims Homelab
    headerStyle: boxed
    hideVersion: true
    theme: dark
    color: slate
    layout:
      Init:
        icon: mdi-rocket-launch
        style: column
      Apps:
        icon: mdi-apps
        style: column
      Platform:
        icon: mdi-server
        style: column
      Observability:
        icon: mdi-chart-line
        style: row
        columns: 4
      Identity:
        icon: mdi-account-key
        style: column
      Storage:
        icon: mdi-database
        style: column
      Data:
        icon: mdi-table
        style: column
      Productivity:
        icon: mdi-pencil-ruler
        style: column
      Developer:
        icon: mdi-code-braces
        style: column
      NetBird:
        icon: mdi-vpn
        style: column

  kubernetes.yaml: |
    mode: cluster
    gateway: true

  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank
    # DACHS-Layout: Titel links, Uhr + Wetter rechts.
    - openmeteo:
        label: Duesseldorf
        latitude: 51.2277
        longitude: 6.7735
        timezone: Europe/Berlin
        units: metric
        cache: 10
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23

  bookmarks.yaml: |
    - Developer:
        - GitHub Repo:
            - icon: github.png
              href: https://github.com/Tim275/talos-homelab
    - NetBird:
        - VPN Dashboard:
            - icon: netbird.png
              href: https://app.netbird.io

  services.yaml: |
    - Init:
        - Calendar:
            icon: mdi-calendar-month
            widget:
              type: calendar
              view: monthly
              maxEvents: 10
    - Productivity:
        - Excalidraw:
            icon: excalidraw.png
            href: https://excalidraw.com
            description: Drawing & Diagrams
    - Observability:
        - Loki:
            icon: loki.png
            href: https://grafana.timourhomelab.org/a/grafana-lokiexplore-app/explore
            description: Log Aggregation (VPN-only via NetBird)
        - Tempo:
            icon: tempo.png
            href: https://grafana.timourhomelab.org/a/grafana-exploretraces-app/explore
            description: Distributed Traces (VPN-only via NetBird)
        - Vector:
            icon: vector.png
            href: https://grafana.timourhomelab.org/dashboards?query=vector
            description: Log Pipeline (VPN-only via NetBird)
    - Data:
        - Postgres:
            icon: mdi-database-outline
            href: https://pgadmin.timourhomelab.org
            description: CloudNativePG Replication
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Replication-Lag
                  query: max(cnpg_pg_replication_lag)
                  format: number
                  suffix: "s"
        - Elasticsearch:
            icon: elasticsearch.png
            href: https://kibana.timourhomelab.org
            description: Search & SIEM Store (VPN-only via NetBird)
    - Storage:
        - Velero:
            icon: velero.png
            href: https://github.com/Tim275/talos-homelab/tree/main/kubernetes/infrastructure/storage/velero-schedules
            description: Backup Schedules (GitOps)
    - Platform:
        - Cluster:
            icon: mdi-chart-box-outline
            href: https://prometheus.timourhomelab.org
            description: Scrape-Targets, Alerts, Ceph
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Targets down
                  query: count(up == 0) or vector(0)
                  format: number
                - label: Alerts
                  query: max(alertmanager_alerts{state="active"})
                  format: number
                - label: OSDs
                  query: sum(ceph_osd_up)
                  format: number
                - label: Ceph
                  query: round(100 * (ceph_cluster_total_used_bytes / ceph_cluster_total_bytes))
                  format: number
                  suffix: "%"
        - Sealed Secrets:
            icon: mdi-lock-outline
            href: https://github.com/Tim275/talos-homelab/tree/main/kubernetes/security
            description: Secret Encryption (GitOps)
        - cert-manager:
            icon: cert-manager.png
            href: https://grafana.timourhomelab.org/dashboards?query=cert
            description: TLS Certificates (VPN-only via NetBird)

  docker.yaml: ""
  proxmox.yaml: ""

  custom.css: ""
  custom.js: ""
