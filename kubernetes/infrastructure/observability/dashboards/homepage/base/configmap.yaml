apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Tims Homelab
    headerStyle: boxed
    hideVersion: true
    theme: dark
    color: slate
    layout:
      # Standard-Icons je Domaene (DACHS-Stil). VPN-Zugang ist Cluster-Realitaet,
      # kein Header-Thema — dafuer gibt es die NetBird-Kachel unter Bookmarks.
      Apps:
        icon: mdi-apps
        style: row
        columns: 2
      Init:
        icon: mdi-rocket-launch
        style: row
        columns: 1
      Platform:
        icon: mdi-server
        style: row
        columns: 2
      Observability:
        icon: mdi-chart-line
        style: row
        columns: 3
      Identity:
        icon: mdi-account-key
        style: row
        columns: 2
      Storage:
        icon: mdi-database
        style: row
        columns: 2
      Data:
        icon: mdi-table
        style: row
        columns: 2

  kubernetes.yaml: |
    mode: cluster
    gateway: true

  widgets.yaml: |
    # DACHS-Layout: Titel links, Uhr + Wetter rechts.
    - openmeteo:
        label: Duesseldorf
        latitude: 51.2277
        longitude: 6.7735
        timezone: Europe/Berlin
        units: metric
        cache: 10
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23

  # Auto-Discovery via gateway:true (kubernetes.yaml) liest die HTTPRoutes selbst —
  # keine statisch gepflegte Liste noetig. Nur externe, nicht-K8s-Links kommen hier rein.
  bookmarks.yaml: |
    - Developer:
        - GitHub Repo:
            - icon: github.png
              href: https://github.com/Tim275/talos-homelab
        - Excalidraw:
            - icon: excalidraw.png
              href: https://excalidraw.com
        - Mermaid Live:
            - icon: si-mermaid
              href: https://mermaid.live
    - NetBird:
        - VPN Dashboard:
            - icon: netbird.png
              href: https://app.netbird.io

  services.yaml: |
    # Init-Spalte wie beim DACHS-Vorbild: Monatskalender oben links.
    - Init:
        - Calendar:
            icon: mdi-calendar-month
            widget:
              type: calendar
              view: monthly
              maxEvents: 10

  # docker.yaml + proxmox.yaml: Homepage haelt BEIDE fuer Pflicht (verifiziert via
  # /app/src/skeleton/ im Image, v1.13.2 — die offizielle Doku nennt nur 8 von 9
  # Dateien, proxmox.yaml fehlte dort). Ohne sie versucht der Container, sein
  # eigenes Default-Skeleton reinzukopieren -> scheitert am Read-Only-ConfigMap-
  # Mount (EACCES) -> CrashLoopBackOff. Wir nutzen weder Docker noch Proxmox-
  # Widget, daher bewusst leer.
  docker.yaml: ""
  proxmox.yaml: ""

  custom.css: ""
  custom.js: ""
