apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: homelab
    theme: dark
    color: slate
    layout:
      # icon: netbird.png markiert Gruppen, die nur via NetBird-VPN erreichbar sind
      # (Beschreibungstext pro Kachel traegt zusaetzlich 🔒/🌍 — Homepage kann nur
      # 1 Icon pro Kachel, aber pro GRUPPE, darum hier statt auf jeder einzelnen Karte).
      Platform:
        icon: netbird.png
        style: row
        columns: 2
      Observability:
        icon: netbird.png
        style: row
        columns: 3
      Identity:
        icon: netbird.png
        style: row
        columns: 2
      Storage:
        icon: netbird.png
        style: row
        columns: 2
      Data:
        icon: netbird.png
        style: row
        columns: 2
      Apps:
        style: row
        columns: 2

  kubernetes.yaml: |
    mode: cluster
    gateway: true

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23

  # Auto-Discovery via gateway:true (kubernetes.yaml) liest die HTTPRoutes selbst —
  # keine statisch gepflegte Liste noetig. Nur externe, nicht-K8s-Links kommen hier rein.
  bookmarks.yaml: |
    - Developer:
        - GitHub Repo:
            - icon: github.png
              href: https://github.com/Tim275/talos-homelab

  services.yaml: |
    []

  # Ohne diese Datei bricht der Container beim Start: Homepage haelt sie fuer
  # PFLICHT und versucht sonst, sein eigenes Default-Skeleton reinzukopieren —
  # scheitert am Read-Only-ConfigMap-Mount (EACCES) -> CrashLoopBackOff.
  # Wir nutzen kein Docker, daher bewusst leer.
  docker.yaml: ""

  custom.css: ""
  custom.js: ""
