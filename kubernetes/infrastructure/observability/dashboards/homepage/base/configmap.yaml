apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Tims Homelab
    headerStyle: boxed
    hideVersion: true
    theme: dark
    color: slate
    layout:
      # DACHS-Layout: ALLE Gruppen als Spalten nebeneinander — der Kalender
      # (Init) steht schmal ganz links, statt als Vollbreiten-Zeile zu wuchern.
      Init:
        icon: mdi-rocket-launch
        style: column
      Apps:
        icon: mdi-apps
        style: column
      Productivity:
        icon: mdi-pencil-ruler
        style: column
      Platform:
        icon: mdi-server
        style: column
      Observability:
        icon: mdi-chart-line
        style: row
        columns: 4
      Identity:
        icon: mdi-account-key
        style: column
      Storage:
        icon: mdi-database
        style: column
      Data:
        icon: mdi-table
        style: column

  kubernetes.yaml: |
    mode: cluster
    gateway: true

  widgets.yaml: |
    # DACHS-Layout: Titel links, Uhr + Wetter rechts.
    - openmeteo:
        label: Duesseldorf
        latitude: 51.2277
        longitude: 6.7735
        timezone: Europe/Berlin
        units: metric
        cache: 10
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23

  # Auto-Discovery via gateway:true (kubernetes.yaml) liest die HTTPRoutes selbst —
  # keine statisch gepflegte Liste noetig. Nur externe, nicht-K8s-Links kommen hier rein.
  bookmarks.yaml: |
    - Developer:
        - GitHub Repo:
            - icon: github.png
              href: https://github.com/Tim275/talos-homelab
    - NetBird:
        - VPN Dashboard:
            - icon: netbird.png
              href: https://app.netbird.io

  services.yaml: |
    # Init-Spalte wie beim DACHS-Vorbild: Monatskalender oben links.
    - Init:
        - Calendar:
            icon: mdi-calendar-month
            widget:
              type: calendar
              view: monthly
              maxEvents: 10
    # Statische Kacheln: Komponenten OHNE eigene HTTPRoute/UI. Auto-Discovery
    # sieht nur HTTPRoutes — der Rest des Stacks wird hier gepflegt und
    # verlinkt auf die beste vorhandene Sicht (Grafana/Kibana).
    - Productivity:
        - Excalidraw:
            icon: excalidraw.png
            href: https://excalidraw.com
            description: Drawing & Diagrams
        - Mermaid Live:
            icon: si-mermaid
            href: https://mermaid.live
            description: Diagramming
    - Observability:
        - Loki:
            icon: loki.png
            href: https://grafana.timourhomelab.org/a/grafana-lokiexplore-app/explore
            description: Log Aggregation (VPN-only via NetBird)
        - Tempo:
            icon: tempo.png
            href: https://grafana.timourhomelab.org/a/grafana-exploretraces-app/explore
            description: Distributed Traces (VPN-only via NetBird)
        - Vector:
            icon: vector.png
            href: https://grafana.timourhomelab.org/dashboards?query=vector
            description: Log Pipeline (VPN-only via NetBird)
    - Data:
        - Elasticsearch:
            icon: elasticsearch.png
            href: https://grafana.timourhomelab.org/d/elasticsearch
            description: Search & SIEM Store (VPN-only via NetBird)
    - Storage:
        - Velero:
            icon: velero.png
            href: https://grafana.timourhomelab.org/dashboards?query=velero
            description: Backup & Restore (VPN-only via NetBird)
    - Platform:
        - Sealed Secrets:
            icon: mdi-lock-outline
            href: https://github.com/Tim275/talos-homelab/tree/main/kubernetes/security
            description: Secret Encryption (GitOps)
        - cert-manager:
            icon: cert-manager.png
            href: https://grafana.timourhomelab.org/dashboards?query=cert
            description: TLS Certificates (VPN-only via NetBird)
        - CloudNative-PG:
            icon: postgres.png
            href: https://grafana.timourhomelab.org/dashboards?query=cnpg
            description: Postgres Operator (VPN-only via NetBird)

  # docker.yaml + proxmox.yaml: Homepage haelt BEIDE fuer Pflicht (verifiziert via
  # /app/src/skeleton/ im Image, v1.13.2 — die offizielle Doku nennt nur 8 von 9
  # Dateien, proxmox.yaml fehlte dort). Ohne sie versucht der Container, sein
  # eigenes Default-Skeleton reinzukopieren -> scheitert am Read-Only-ConfigMap-
  # Mount (EACCES) -> CrashLoopBackOff. Wir nutzen weder Docker noch Proxmox-
  # Widget, daher bewusst leer.
  docker.yaml: ""
  proxmox.yaml: ""

  custom.css: ""
  custom.js: ""
