apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - jaeger-client.yaml  # Dedicated 'jaeger' user with jaeger_writer role
  - basic-auth.yaml  # Sealed credentials (jaeger user)

components:
  - ../../components/envoy-gateway
  - ../../components/kube-prometheus-stack

patches:
  - path: sizing.yaml
  - path: settings.yaml
