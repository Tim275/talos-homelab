apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: jaeger
  namespace: jaeger
spec:
  replicas: 2  # HA: 2 replicas (ES backend handles durability)
  resources:
    limits:
      cpu: 1000m
      memory: 3Gi
    requests:
      cpu: 10m
      memory: 192Mi   # 7d max 136Mi

