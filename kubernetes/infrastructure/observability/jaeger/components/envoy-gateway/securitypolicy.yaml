apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: jaeger-basic-auth
  namespace: jaeger
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: jaeger
  basicAuth:
    users:
      name: jaeger-basic-auth
