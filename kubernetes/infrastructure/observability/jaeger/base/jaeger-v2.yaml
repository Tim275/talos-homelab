apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: jaeger
  namespace: jaeger
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "14269"
spec:
  mode: deployment
  image: docker.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17   # renovate: docker=docker.io/jaegertracing/jaeger

  env:
    - name: ES_USERNAME
      valueFrom:
        secretKeyRef:
          name: jaeger-elasticsearch-credentials
          key: username
    - name: ES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: jaeger-elasticsearch-credentials
          key: password

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
          thrift_compact:
            endpoint: 0.0.0.0:6831
          thrift_binary:
            endpoint: 0.0.0.0:6832

    processors:
      batch:
        timeout: 5s
        send_batch_size: 10000
      memory_limiter:
        check_interval: 1s
        limit_mib: 2048

    extensions:
      jaeger_storage:
        backends:
          primary_store:
            elasticsearch:
              server_urls:
                - https://production-cluster-es-http.elastic-system.svc:9200
              auth:
                basic:
                  username: "${env:ES_USERNAME}"
                  password: "${env:ES_PASSWORD}"
              tls:
                insecure: false
                insecure_skip_verify: true
      jaeger_query:
        storage:
          traces: primary_store
        ui:
          config_file: /etc/jaeger/ui-config.json
      zpages:
        endpoint: 0.0.0.0:55679

    exporters:
      jaeger_storage_exporter:
        trace_storage: primary_store
      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200

    service:
      extensions: [jaeger_storage, jaeger_query, zpages]
      pipelines:
        traces:
          receivers: [otlp, jaeger]
          processors: [memory_limiter, batch]
          exporters: [jaeger_storage_exporter]

  ports:
    - name: jaeger-ui
      port: 16686
      protocol: TCP
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      protocol: TCP
      targetPort: 4317
    - name: otlp-http
      port: 4318
      protocol: TCP
      targetPort: 4318
    - name: jaeger-grpc
      port: 14250
      protocol: TCP
      targetPort: 14250
    - name: jaeger-http
      port: 14268
      protocol: TCP
      targetPort: 14268
    - name: admin
      port: 14269
      protocol: TCP
      targetPort: 14269


  podAnnotations:
    sidecar.istio.io/inject: "false"

  volumeMounts:
    - name: ui-config
      mountPath: /etc/jaeger
      readOnly: true

  volumes:
    - name: ui-config
      configMap:
        name: jaeger-ui-config
        items:
          - key: ui-config.json
            path: ui-config.json

  # the operator labels pods app.kubernetes.io/name=jaeger-collector, so a selector
  # on "jaeger" matched nothing and all replicas piled onto the two nipogi nodes
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: jaeger.jaeger
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: jaeger.jaeger
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-ui-config
  namespace: jaeger
