#
#
#
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jaeger-retention-cleanup
  namespace: elastic-system
  labels:
    app.kubernetes.io/name: jaeger-retention
    app.kubernetes.io/part-of: observability
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: jaeger-retention
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: ES_URL
                  value: "https://production-cluster-es-http.elastic-system.svc.cluster.local:9200"
                - name: ES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: production-cluster-es-elastic-user
                      key: elastic
                - name: RETENTION_DAYS
                  value: "7"
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== Jaeger Index Cleanup ==="
                  echo "Retention: $RETENTION_DAYS days"
                  echo ""

                  CUTOFF_EPOCH=$(($(date +%s) - RETENTION_DAYS * 86400))

                  INDICES=$(curl -sk -u "elastic:${ES_PASSWORD}" \
                    "${ES_URL}/_cat/indices/jaeger-*?h=index" 2>/dev/null | sort -u)

                  if [ -z "$INDICES" ]; then
                    echo "✓ No jaeger-* indices found"
                    exit 0
                  fi

                  DELETED=0
                  KEPT=0
                  for idx in $INDICES; do
                    DATE=$(echo "$idx" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
                    [ -z "$DATE" ] && { echo "  skip $idx (no date)"; continue; }

                    IDX_EPOCH=$(date -d "$DATE" +%s 2>/dev/null || \
                                date -j -f "%Y-%m-%d" "$DATE" +%s 2>/dev/null)
                    [ -z "$IDX_EPOCH" ] && { echo "  skip $idx (date parse)"; continue; }

                    if [ "$IDX_EPOCH" -lt "$CUTOFF_EPOCH" ]; then
                      echo "  ✗ DELETE $idx (older than $RETENTION_DAYS days)"
                      curl -sk -X DELETE -u "elastic:${ES_PASSWORD}" \
                        "${ES_URL}/$idx" 2>/dev/null || true
                      DELETED=$((DELETED + 1))
                    else
                      echo "  ✓ keep $idx"
                      KEPT=$((KEPT + 1))
                    fi
                  done

                  echo ""
                  echo "=== Summary ==="
                  echo "Deleted: $DELETED"
                  echo "Kept:    $KEPT"
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits:   { cpu: 100m, memory: 64Mi }
