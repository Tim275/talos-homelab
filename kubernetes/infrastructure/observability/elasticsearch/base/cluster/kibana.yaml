apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: production-kibana
  namespace: elastic-system
spec:
  # UPGRADED: 8.16.1 8.17.0 (Match Elasticsearch version!)
  version: 8.17.0
  count: 1
  elasticsearchRef:
    name: production-cluster
  config:
    server.publicBaseUrl: "https://kibana.timourhomelab.org"
  podTemplate:
    spec:
      # nipogi host is CPU-overcommitted (22 vCPU / 16 cores); cilium crash-loops
      # there under load, taking the node's networking with it
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - worker-1
                      - worker-2
      containers:
        - name: kibana
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 1
  http:
    service:
      spec:
        type: ClusterIP
    tls:
      selfSignedCertificate:
        disabled: true
