
---
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-configure-slm-policy
  namespace: elastic-system
spec:
  template:
    spec:
      containers:
        - name: configure-slm
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
