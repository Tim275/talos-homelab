apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: elasticsearch-users-jaeger
  namespace: elastic-system
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: elastic-system/users
        property: jaeger
---
