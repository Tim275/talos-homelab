apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - multi-filerealm-sealed.yaml
  - elasticsearch-exporter-credentials-sealed.yaml

components:
  - ../../components/rook-ceph

patches:
  - path: sizing.yaml
  - path: settings.yaml
  - target:
      group: elasticsearch.k8s.elastic.co
      version: v1
      kind: Elasticsearch
      name: production-cluster
      namespace: elastic-system
    patch: |
      - op: add
        path: /spec/nodeSets/0/count
        value: 1
      # 7d max 2032Mi against a 2Gi limit. Heap stays 1g — what was missing is
      # the off-heap room next to it (Lucene, direct buffers).
      - op: add
        path: /spec/nodeSets/0/podTemplate/spec/containers/0/resources
        value:
          requests:
            memory: 2Gi
            cpu: 500m
          limits:
            memory: 3Gi
            cpu: "2"
      - op: add
        path: /spec/nodeSets/0/volumeClaimTemplates/0/spec/resources
        value:
          requests:
            storage: 100Gi
  - target:
      group: kibana.k8s.elastic.co
      version: v1
      kind: Kibana
      name: production-kibana
      namespace: elastic-system
    patch: |
      - op: add
        path: /spec/podTemplate/spec/containers/0/resources
        value:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 1
