apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana
  namespace: elastic-system
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/component: log-visualization
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "common.k8s.elastic.co/type=kibana"
    gethomepage.dev/name: Kibana
    gethomepage.dev/description: 🔒 Log Analytics (VPN-only via NetBird)
    gethomepage.dev/group: Observability
    gethomepage.dev/icon: kibana.png
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - "kibana.timourhomelab.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: production-kibana-kb-http
          port: 5601
