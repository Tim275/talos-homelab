apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana
  namespace: elastic-system
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
      # ohne sectionName haengt die Route auch am :80-Listener und schlaegt
      # dort den *.timourhomelab.org-Redirect — Login im Klartext
      sectionName: https
