apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-wave: "5"

namespace: monitoring

resources:
  - rbac.yaml
  - daemonset.yaml

configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy

labels:
  - pairs:
      app.kubernetes.io/part-of: observability-stack
      app.kubernetes.io/component: log-collection
