apiVersion: batch/v1
kind: CronJob
metadata:
  name: dead-alert-check
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: check
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
