apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - ../../base
  - telegram-bot-sealed.yaml
  - jira-api-sealed.yaml
  - watchdog-webhook-sealed.yaml
  - etcd-client-cert-sealed.yaml

components:
  - ../../components/envoy-gateway

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    includeCRDs: true
    namespace: monitoring
    version: 88.6.5
    releaseName: kube-prometheus-stack
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - ../../components/rook-ceph/values.yaml
      - values.yaml
      - ../../base/alertmanager.yaml
      - ../../components/rook-ceph/alertmanager.yaml
      - alertmanager.yaml

patches:
  # /livez delegiert an den Apiserver — ein Apiserver-Hakler killt sonst KSM und
  # reisst genau dann die kube_*-Metriken weg, wenn man sie braucht. /healthz ist
  # das Selbst-Signal.
  - path: ksm-liveness-patch.yaml
  - path: settings.yaml
