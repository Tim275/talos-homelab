apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - ../../base
  - telegram-bot-sealed.yaml
  - watchdog-webhook-sealed.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    includeCRDs: true
    namespace: monitoring
    version: 88.5.4
    releaseName: kube-prometheus-stack
    valuesFile: ./values-prod.yaml
    additionalValuesFiles:
      - ./alertmanager-prod.yaml

patches:
  # /livez delegiert an den Apiserver — ein Apiserver-Hakler killt sonst KSM und
  # reisst genau dann die kube_*-Metriken weg, wenn man sie braucht. /healthz ist
  # das Selbst-Signal.
  - path: ksm-liveness-patch.yaml
