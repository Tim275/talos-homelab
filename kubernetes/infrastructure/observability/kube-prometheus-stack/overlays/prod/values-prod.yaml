
prometheus:

  podDisruptionBudget:
    enabled: true
    minAvailable: null
    maxUnavailable: 1
  prometheusSpec:
    replicas: 2

    podAntiAffinity: hard
    nodeSelector:
      node-pool: stateful

    secrets:
      - etcd-client-cert

    additionalScrapeConfigsSecret:
      enabled: true
      name: additional-scrape-configs-proxmox
      key: prometheus-additional.yaml

    externalLabels:
      cluster: prod-talos
      environment: prod
      region: homelab-de
      grafana_url: "https://grafana.timourhomelab.org"

    retention: 15d
    retentionSize: "45GB"

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    containers:
      - name: prometheus
        startupProbe:
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 300
        livenessProbe:
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 6
        readinessProbe:
          timeoutSeconds: 10
          periodSeconds: 15
          failureThreshold: 6

    additionalArgs:
      - name: web.enable-remote-write-receiver
        value: ""
      - name: enable-feature
        value: exemplar-storage

    tsdb:
      outOfOrderTimeWindow: 10m

    podMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-block-enterprise
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50G

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false
  serviceMonitor:
    relabelings:
      - sourceLabels: [ __meta_kubernetes_pod_node_name ]
        separator: ;
        regex: ^(.*)$
        targetLabel: nodename
        replacement: $1
        action: replace
    metricRelabelings:
      - action: labeldrop
        regex: pod

nodeExporter:
  enabled: true

grafana:
  enabled: false
  forceDeployDatasources: false
  forceDeployDashboards: false
  defaultDashboardsEnabled: false
  defaultDashboardsTimezone: Europe/Berlin
  operator:
    dashboardsConfigMapRefEnabled: true
    matchLabels:
      app: grafana
    folder: Kubernetes

defaultRules:
  create: true

  disabled:
    AlertmanagerFailedToSendAlerts: true
    AlertmanagerClusterFailedToSendAlerts: true
    NodeDiskIOSaturation: true
    KubeContainerWaiting: true
    TargetDown: true
    KubeAPIDown: true
    KubeNodeNotReady: true
    KubeNodePressure: true
    KubePodCrashLooping: true
    KubePodNotReady: true
    KubePersistentVolumeFillingUp: true
    PrometheusRuleFailures: true
    CPUThrottlingHigh: true
    KubeCPUOvercommit: true
    KubeMemoryOvercommit: true
    NodeSystemdServiceFailed: true
    NodeSystemdServiceCrashlooping: true
    NodeRAIDDegraded: true
    NodeRAIDDiskFailure: true
    KubeletServerCertificateExpiration: true
    KubeletServerCertificateRenewalErrors: true
    KubeletPlegDurationHigh: true
    PrometheusRemoteStorageFailures: true
    PrometheusRemoteWriteBehind: true
    PrometheusRemoteWriteDesiredShards: true
    PrometheusSDRefreshFailure: true
    KubeletDown: true
  rules:
    alertmanager: true
    configReloaders: true
    general: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeStateMetrics: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

    etcd: false
    k8s: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubelet: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    network: false
    node: false
    windows: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
    certManager:
      enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

kubelet:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - action: replace
        targetLabel: cluster
        replacement: prod-talos

kube-state-metrics:

  prometheus:
    monitor:
      metricRelabelings:
        - action: replace
          targetLabel: cluster
          replacement: prod-talos
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

  rbac:
    extraRules:
      - apiGroups: ["postgresql.cnpg.io"]
        resources: ["backups"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: postgresql.cnpg.io
              version: v1
              kind: Backup
            metricNamePrefix: cnpg_backup
            labelsFromPath:
              namespace: [metadata, namespace]
              name: [metadata, name]
              cluster: [spec, cluster, name]
            metrics:
              - name: stopped_at_timestamp_seconds
                help: "CNPG Backup stoppedAt as a unix timestamp, per Backup CR"
                each:
                  type: Gauge
                  gauge:
                    path: [status, stoppedAt]
                    labelsFromPath:
                      phase: [status, phase]
