
prometheus:

  podDisruptionBudget:
    enabled: true
    minAvailable: null
    maxUnavailable: 1
  prometheusSpec:
    replicas: 2

    podAntiAffinity: hard
    nodeSelector:
      node-pool: stateful

    secrets:
      - etcd-client-cert

    additionalScrapeConfigsSecret:
      enabled: true
      name: additional-scrape-configs-proxmox
      key: prometheus-additional.yaml

    externalLabels:
      cluster: prod-talos
      environment: prod
      region: homelab-de
      grafana_url: "https://grafana.timourhomelab.org"

    retention: 15d
    retentionSize: "45GB"

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    containers:
      - name: prometheus
        startupProbe:
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 300
        livenessProbe:
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 6
        readinessProbe:
          timeoutSeconds: 10
          periodSeconds: 15
          failureThreshold: 6

    additionalArgs:
      - name: web.enable-remote-write-receiver
        value: ""
      - name: enable-feature
        value: exemplar-storage

    tsdb:
      outOfOrderTimeWindow: 10m

    podMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-block-enterprise
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50G

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false
  serviceMonitor:
    relabelings:
      - sourceLabels: [ __meta_kubernetes_pod_node_name ]
        separator: ;
        regex: ^(.*)$
        targetLabel: nodename
        replacement: $1
        action: replace
    metricRelabelings:
      - action: labeldrop
        regex: pod

nodeExporter:
  enabled: true

grafana:
  enabled: false
  forceDeployDatasources: false
  forceDeployDashboards: false
  defaultDashboardsEnabled: false
  defaultDashboardsTimezone: Europe/Berlin
  operator:
    dashboardsConfigMapRefEnabled: true
    matchLabels:
      app: grafana
    folder: Kubernetes

defaultRules:
  create: true

  disabled:
    AlertmanagerFailedToSendAlerts: true
    AlertmanagerClusterFailedToSendAlerts: true
    NodeDiskIOSaturation: true
    KubeContainerWaiting: true
    TargetDown: true
    KubeAPIDown: true
    KubeNodeNotReady: true
    KubeNodePressure: true
    KubePodCrashLooping: true
    KubePodNotReady: true
    KubePersistentVolumeFillingUp: true
    PrometheusRuleFailures: true
    CPUThrottlingHigh: true
    KubeCPUOvercommit: true
    KubeMemoryOvercommit: true
    NodeSystemdServiceFailed: true
    NodeSystemdServiceCrashlooping: true
    NodeRAIDDegraded: true
    NodeRAIDDiskFailure: true
    KubeletServerCertificateExpiration: true
    KubeletServerCertificateRenewalErrors: true
    KubeletPlegDurationHigh: true
    PrometheusRemoteStorageFailures: true
    PrometheusRemoteWriteBehind: true
    PrometheusRemoteWriteDesiredShards: true
    PrometheusSDRefreshFailure: true
  rules:
    alertmanager: true
    configReloaders: true
    general: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeStateMetrics: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

    etcd: false
    k8s: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubelet: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    network: false
    node: false
    windows: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
    certManager:
      enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

kube-state-metrics:

  prometheus:
    monitor:
      metricRelabelings:
        - action: replace
          targetLabel: cluster
          replacement: prod-talos
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

  rbac:
    extraRules:
      - apiGroups: ["postgresql.cnpg.io"]
        resources: ["backups"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: postgresql.cnpg.io
              version: v1
              kind: Backup
            metricNamePrefix: cnpg_backup
            labelsFromPath:
              namespace: [metadata, namespace]
              name: [metadata, name]
              cluster: [spec, cluster, name]
            metrics:
              - name: stopped_at_timestamp_seconds
                help: "CNPG Backup stoppedAt as a unix timestamp, per Backup CR"
                each:
                  type: Gauge
                  gauge:
                    path: [status, stoppedAt]
                    labelsFromPath:
                      phase: [status, phase]

alertmanager:
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  alertmanagerSpec:
    replicas: 3
    retention: 720h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-block-enterprise
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    secrets:
      - slack-webhook-url
      - slack-webhook-critical
      - slack-webhook-security
      - watchdog-webhook-url
      - telegram-bot-token
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/slack-webhook-url/url

    templates:
      - '/etc/alertmanager/config/*.tmpl'

    route:
      receiver: 'slack-default'
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:
        - matchers:
            - alertname="Watchdog"
          receiver: 'watchdog-heartbeat'
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
        - matchers:
            - alertname="InfoInhibitor"
          receiver: 'null'
        - matchers:
            - alertname=~"TargetDown|KubeDeploymentReplicasMismatch|KubeJobFailed"
          receiver: 'slack-default'
          group_wait: 5m
          group_interval: 30m
          repeat_interval: 12h
          continue: false

        - matchers:
            - severity="critical"
            - priority=~"p0|P0"
          receiver: 'slack-critical'
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 30m
          continue: true

        - matchers:
            - severity="critical"
          receiver: 'slack-critical'
          group_wait: 10s
          group_interval: 2m
          repeat_interval: 1h
          continue: true

        - matchers:
            - priority=~"p1|P1"
          receiver: 'slack-critical'
          group_wait: 15s
          group_interval: 3m
          repeat_interval: 1h
          continue: true

        - matchers:
            - component=~"security|kyverno|trivy|identity"
          receiver: 'slack-security'
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          continue: false

        - matchers:
            - severity="warning"
          receiver: 'slack-default'
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 2h
          continue: false

        - matchers:
            - priority=~"p2|P2"
          receiver: 'slack-default'
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 2h
          continue: false

        - matchers:
            - severity="info"
          receiver: 'null'
          continue: false

        - matchers:
            - priority=~"p3|P3|p4|P4"
          receiver: 'slack-info'
          group_wait: 1m
          group_interval: 10m
          repeat_interval: 12h
          continue: false

    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ['alertname', 'namespace']
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="info"
        equal: ['alertname', 'namespace']

      - source_matchers:
          - alertname=~"ClusterAPIServerDown|ControlPlaneNodeDown"
        target_matchers:
          - severity="warning"

      - source_matchers:
          - alertname="ProxmoxHostDown"
        target_matchers:
          - alertname=~"KubeNodeNotReady|CiliumNodeUnreachable|PodNotReady|PodCrashLooping|ImagePullBackoff|ContainerOOMKilled|PrometheusTargetDown|VectorPipelineDown|GatusEndpointDown|GatusEndpointSlow|TalosNodeRebootedRecently|NodeMemoryPressure|NodeDiskPressure|CephOSDDown|CephOSDFlapping|CephSlowOps|CephPGsNotActive|EnvoyGatewayNoEndpoints"

      - source_matchers:
          - alertname="InternetConnectivityLost"
        target_matchers:
          - alertname=~"CloudflaredAllDown|ExternalDNSResolutionFailed"

      - source_matchers:
          - alertname=~"CephHealthError|CephQuorumLost"
        target_matchers:
          - alertname=~"CephOSDDown|CephOSDNearFull|CephPGsNotActive|CephSlowOps|CephMonClockSkew|CephOSDFlapping"

      - source_matchers:
          - alertname="EnvoyEdgeSLOFastBurn"
        target_matchers:
          - alertname=~"EnvoyEdgeSLOSlowBurn|EnvoyGateway5xxRateHigh"

      - source_matchers:
          - alertname="KeycloakDown"
        target_matchers:
          - alertname="KeycloakHttp5xxRateHigh"
        equal: ['namespace']

      - source_matchers:
          - alertname="CnpgPrimaryDown"
        target_matchers:
          - alertname="CnpgReplicationLagHigh"
        equal: ['namespace']

      - source_matchers:
          - alertname="KafkaQuorumLeaderless"
        target_matchers:
          - alertname=~"KafkaUnderMinISR|KafkaConsumerLagCritical"

      - source_matchers:
          - alertname="VeleroDown"
        target_matchers:
          - alertname=~"VeleroNoRecentBackup|VeleroNoRecentWeeklyBackup|VeleroBackupPartialFailure"

      - source_matchers:
          - alertname="CoreDNSDown"
        target_matchers:
          - alertname=~"CoreDNSHighSERVFAIL|CoreDNSForwardUnhealthy|ExternalDNSResolutionFailed"

    receivers:
      - name: 'null'

      - name: 'watchdog-heartbeat'
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/watchdog-webhook-url/url
            send_resolved: false
            max_alerts: 1

      - name: 'slack-critical'
        slack_configs:
          - channel: '#alerts-critical'
            api_url_file: /etc/alertmanager/secrets/slack-webhook-critical/url
            send_resolved: true
            title: '{{ template "slack.title" . }}'
            text: '{{ template "slack.body" . }}'
            color: '{{ template "slack.color" . }}'
            actions: &critical-actions
              - type: button
                text: 'Runbook :book:'
                url: '{{ if (index .Alerts 0).Annotations.runbook_url }}{{ (index .Alerts 0).Annotations.runbook_url }}{{ else }}https://github.com/Tim275/talos-homelab/tree/main/docs/runbooks{{ end }}'
              - type: button
                text: 'Dashboard :bar_chart:'
                url: '{{ if (index .Alerts 0).Annotations.dashboard_url }}{{ template "alert.dashboard_url" . }}{{ else }}{{ if .CommonLabels.grafana_url }}{{ .CommonLabels.grafana_url }}{{ else }}https://grafana.timourhomelab.org{{ end }}{{ end }}'
              - type: button
                text: 'Explore :mag:'
                url: 'https://grafana.timourhomelab.org/explore'
              - type: button
                text: 'Silence :no_bell:'
                url: '{{ template "slack.silenceURL" . }}'
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram-bot-token/token
            chat_id: 8449184586
            parse_mode: ""
            send_resolved: true
            message: '{{ template "telegram.body" . }}'

      - name: 'slack-default'
        slack_configs:
          - channel: '#alerts'
            send_resolved: true
            title: '{{ template "slack.title" . }}'
            text: '{{ template "slack.body" . }}'
            color: '{{ template "slack.color" . }}'
            actions: *critical-actions

      - name: 'slack-security'
        slack_configs:
          - channel: '#alerts-security'
            api_url_file: /etc/alertmanager/secrets/slack-webhook-security/url
            send_resolved: true
            title: ':lock: {{ template "slack.title" . }}'
            text: '{{ template "slack.body" . }}'
            color: '{{ template "slack.color" . }}'
            actions: *critical-actions

      - name: 'slack-info'
        slack_configs:
          - channel: '#alerts'
            send_resolved: false
            title: '{{ template "slack.title" . }}'
            text: '{{ template "slack.body" . }}'
            color: '{{ template "slack.color" . }}'
            actions:
              - type: button
                text: 'Explore :mag:'
                url: 'https://grafana.timourhomelab.org/explore'
              - type: button
                text: 'Silence :no_bell:'
                url: '{{ template "slack.silenceURL" . }}'

  templateFiles:
    homelab.tmpl: |-
      {{ define "slack.icon" -}}
      {{ if eq .Status "resolved" }}:white_check_mark:
      {{- else if eq .CommonLabels.severity "critical" }}:rotating_light:
      {{- else if eq .CommonLabels.severity "warning" }}:warning:
      {{- else }}:information_source:
      {{- end -}}
      {{ end }}

      {{ define "slack.title" -}}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] [{{ .CommonLabels.cluster | toUpper | reReplaceAll "-TALOS" "" }}] {{ template "slack.icon" . }} {{ .CommonLabels.alertname }}
      {{- end }}

      {{ define "slack.color" -}}
      {{ if eq .Status "resolved" }}good
      {{- else if eq .CommonLabels.severity "critical" }}danger
      {{- else if eq .CommonLabels.severity "warning" }}warning
      {{- else }}#439FE0
      {{- end -}}
      {{ end }}

      {{ define "resource.slack" -}}
      {{ if .Labels.deployment }}*Resource:* `deployment/{{ .Labels.deployment }}`
      {{- else if .Labels.statefulset }}*Resource:* `statefulset/{{ .Labels.statefulset }}`
      {{- else if .Labels.daemonset }}*Resource:* `daemonset/{{ .Labels.daemonset }}`
      {{- else if .Labels.persistentvolumeclaim }}*Resource:* `pvc/{{ .Labels.persistentvolumeclaim }}`
      {{- else if and .Labels.pod (ne .Labels.job "kube-state-metrics") (ne .Labels.service "kube-state-metrics") }}*Resource:* `pod/{{ .Labels.pod }}`
      {{- else if .Labels.instance }}*Resource:* `instance/{{ .Labels.instance }}`
      {{- else if .Labels.node }}*Resource:* `node/{{ .Labels.node }}`
      {{- end -}}
      {{ end }}

      {{ define "resource.telegram" -}}
      {{ if .Labels.deployment }}<b>Resource:</b> <code>deployment/{{ .Labels.deployment }}</code>
      {{- else if .Labels.statefulset }}<b>Resource:</b> <code>statefulset/{{ .Labels.statefulset }}</code>
      {{- else if .Labels.daemonset }}<b>Resource:</b> <code>daemonset/{{ .Labels.daemonset }}</code>
      {{- else if .Labels.persistentvolumeclaim }}<b>Resource:</b> <code>pvc/{{ .Labels.persistentvolumeclaim }}</code>
      {{- else if and .Labels.pod (ne .Labels.job "kube-state-metrics") (ne .Labels.service "kube-state-metrics") }}<b>Resource:</b> <code>pod/{{ .Labels.pod }}</code>
      {{- else if .Labels.instance }}<b>Resource:</b> <code>instance/{{ .Labels.instance }}</code>
      {{- else if .Labels.node }}<b>Resource:</b> <code>node/{{ .Labels.node }}</code>
      {{- end -}}
      {{ end }}

      {{ define "slack.body" -}}
      {{ range .Alerts -}}
      *Severity:* `{{ .Labels.severity | toUpper }}`{{ if .Labels.priority }}  ·  *Priority:* `{{ .Labels.priority | toUpper }}`{{ end }}{{ if .Labels.component }}  ·  *Component:* `{{ .Labels.component }}`{{ end }}
      {{ if .Labels.namespace }}*Namespace:* `{{ .Labels.namespace }}`  {{ end }}{{ template "resource.slack" . }}

      *Summary:* {{ .Annotations.summary }}
      {{ if .Annotations.description }}*Description:* {{ .Annotations.description }}
      {{ end }}{{ if .Annotations.impact }}*Impact:* {{ .Annotations.impact }}
      {{ end }}{{ if .Annotations.action }}*Action:* {{ .Annotations.action }}
      {{ end }}
      {{ end -}}
      {{ end }}

      {{ define "telegram.body" -}}
      {{ if eq .Status "firing" }}🔥 [FIRING:{{ .Alerts.Firing | len }}]{{ else }}✅ [RESOLVED]{{ end }} {{ .CommonLabels.alertname }}

      {{ range $i, $a := .Alerts -}}
      {{- if lt $i 5 -}}
      ━━━━━━━━━━━━━━━━━━━━
      Severity: {{ .Labels.severity | toUpper }}{{ if .Labels.priority }} · Priority: {{ .Labels.priority | toUpper }}{{ end }}
      {{ if .Labels.namespace }}Namespace: {{ .Labels.namespace }}
      {{ end }}{{ template "resource.telegram" . }}
      Summary: {{ .Annotations.summary }}
      {{ if .Annotations.dashboard_url }}{{ .Annotations.dashboard_url }}{{ else }}https://grafana.timourhomelab.org{{ end }}
      {{ end -}}
      {{ end -}}
      {{ if gt (len .Alerts) 5 }}…and more alerts in this group (see Slack){{ end }}
      {{ end }}

      {{ define "slack.silenceURL" -}}
      https://grafana.timourhomelab.org/alerting/silence/new?alertmanager=Alertmanager
      {{- range $k, $v := .CommonLabels }}&matcher={{ $k }}%3D{{ $v | urlquery }}{{ end -}}
      {{- end }}

      {{ define "alert.dashboard_url" -}}
      {{- $grafana := "https://grafana.timourhomelab.org" -}}
      {{- if .CommonLabels.grafana_url -}}{{- $grafana = .CommonLabels.grafana_url -}}{{- end -}}
      {{ $grafana }}{{ (index .Alerts 0).Annotations.dashboard_url }}
      {{- end }}
