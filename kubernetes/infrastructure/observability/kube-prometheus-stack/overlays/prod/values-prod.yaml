
prometheus:

  podDisruptionBudget:
    enabled: true
    minAvailable: null
    maxUnavailable: 1
  service:
    sessionAffinity: ClientIP
  prometheusSpec:
    # gleiche Begruendung wie beim node-exporter weiter unten: wer nichts sieht,
    # kann nicht reagieren — Prometheus darf nicht vor dem Rest verdraengt werden
    priorityClassName: platform-critical
    replicas: 2
    externalUrl: https://prometheus.timourhomelab.org

    podAntiAffinity: hard
    podAntiAffinityTopologyKey: topology.kubernetes.io/zone
    nodeSelector:
      node-pool: stateful

    secrets:
      - etcd-client-cert

    additionalScrapeConfigsSecret:
      enabled: true
      name: additional-scrape-configs-proxmox
      key: prometheus-additional.yaml

    externalLabels:
      cluster: prod-talos
      environment: prod
      region: homelab-de
      grafana_url: "https://grafana.timourhomelab.org"

    retention: 30d
    retentionSize: "45GB"

    # 7d: p95 3203Mi, max 4091Mi against a 4096Mi limit — 5Mi from an OOMKill
    resources:
      requests:
        cpu: 500m
        memory: 3584Mi
      limits:
        cpu: 2000m
        memory: 6Gi

    containers:
      - name: prometheus
        startupProbe:
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 300
        livenessProbe:
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 6
        readinessProbe:
          timeoutSeconds: 10
          periodSeconds: 15
          failureThreshold: 6

    additionalArgs:
      - name: web.enable-remote-write-receiver
        value: ""
      - name: enable-feature
        value: exemplar-storage

    tsdb:
      outOfOrderTimeWindow: 10m

    podMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-block-enterprise
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50G

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false
  serviceMonitor:
    relabelings:
      - sourceLabels: [ __meta_kubernetes_pod_node_name ]
        separator: ;
        regex: ^(.*)$
        targetLabel: nodename
        replacement: $1
        action: replace
    metricRelabelings:
      - action: labeldrop
        regex: pod

nodeExporter:
  enabled: true

grafana:
  enabled: false
  forceDeployDatasources: false
  forceDeployDashboards: false
  defaultDashboardsEnabled: false
  defaultDashboardsTimezone: Europe/Berlin
  operator:
    dashboardsConfigMapRefEnabled: true
    matchLabels:
      app: grafana
    folder: Kubernetes

defaultRules:
  create: true
  additionalRuleGroupAnnotations:
    alertmanager:
      dashboard_url: "https://grafana.timourhomelab.org/d/alertmanager-state"
    configReloaders:
      dashboard_url: "https://grafana.timourhomelab.org/d/prometheus-stats"
    kubeStateMetrics:
      dashboard_url: "https://grafana.timourhomelab.org/d/prometheus-stats"
    kubernetesApps:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-pod-overview"
    kubernetesResources:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-cluster-overview"
    kubernetesStorage:
      dashboard_url: "https://grafana.timourhomelab.org/d/ceph-cluster"
    kubernetesSystem:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-cluster-overview"
    nodeExporterAlerting:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-node-overview"
    prometheus:
      dashboard_url: "https://grafana.timourhomelab.org/d/prometheus-stats"
    prometheusOperator:
      dashboard_url: "https://grafana.timourhomelab.org/d/prometheus-stats"

  disabled:
    # info-Alerts unterdrueckt hier die Route severity=info -> null, nicht dieser Alert;
    # als Inhibition-Quelle wird er von keiner inhibit_rule genutzt, feuert also dauerhaft ohne Wirkung
    InfoInhibitor: true
    AlertmanagerFailedToSendAlerts: true
    AlertmanagerClusterFailedToSendAlerts: true
    # replaced by TalosNodeMemoryHigh — same 85% threshold, homelab-specific runbook
    NodeMemoryHighUtilization: true
    KubeContainerWaiting: true
    TargetDown: true
    KubeAPIDown: true
    KubeNodeNotReady: true
    KubeNodePressure: true
    KubePodCrashLooping: true
    KubePodNotReady: true
    # client-go 0.36 hat kein list_total mehr, nur watch_total -> kann nie feuern
    KubeStateMetricsListErrors: true
    KubePersistentVolumeFillingUp: true
    PrometheusRuleFailures: true
    CPUThrottlingHigh: true
    NodeSystemdServiceFailed: true
    NodeSystemdServiceCrashlooping: true
    NodeRAIDDegraded: true
    NodeRAIDDiskFailure: true
    KubeletServerCertificateExpiration: true
    KubeletServerCertificateRenewalErrors: true
    PrometheusRemoteStorageFailures: true
    PrometheusRemoteWriteBehind: true
    PrometheusRemoteWriteDesiredShards: true
    KubeletDown: true
  rules:
    alertmanager: true
    configReloaders: true
    general: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeStateMetrics: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

    etcd: false
    k8s: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: false
    kubeApiserverSlos: true
    kubeControllerManager: false
    kubelet: true
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    network: false
    node: false
    windows: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
    certManager:
      enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values: [nipogi]

kubelet:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - action: replace
        targetLabel: cluster
        replacement: prod-talos
    cAdvisorMetricRelabelings:
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_cpu_(load_average_10s|system_seconds_total|user_seconds_total)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_memory_(mapped_file|swap)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_(file_descriptors|tasks_state|threads_max)'
      - sourceLabels: [__name__, scope]
        action: drop
        regex: 'container_memory_failures_total;hierarchy'
      - sourceLabels: [__name__, interface]
        action: drop
        regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_spec.*'
      - sourceLabels: [id, pod]
        action: drop
        regex: '.+;'
      - action: replace
        targetLabel: cluster
        replacement: prod-talos

alertmanager:
  alertmanagerSpec:
    priorityClassName: platform-critical

prometheus-node-exporter:
  # ohne Request war er BestEffort und flog bei MemoryPressure auf ctrl-0 als erster raus
  priorityClassName: system-node-critical
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi
  prometheus:
    monitor:
      relabelings:
        - action: replace
          targetLabel: cluster
          replacement: prod-talos

kube-state-metrics:
  selfMonitor:
    enabled: true
  metricLabelsAllowlist:
    - pods=[app.kubernetes.io/name]
    - nodes=[topology.kubernetes.io/zone,kubernetes.io/arch,node-role.kubernetes.io/control-plane]

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values: [nipogi]

  prometheus:
    monitor:
      metricRelabelings:
        - action: replace
          targetLabel: cluster
          replacement: prod-talos
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

  rbac:
    extraRules:
      - apiGroups: ["postgresql.cnpg.io"]
        resources: ["backups", "clusters"]
        verbs: ["list", "watch"]
      - apiGroups: ["velero.io"]
        resources: ["schedules"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: velero.io
              version: v1
              kind: Schedule
            metricNamePrefix: velero_schedule
            labelsFromPath:
              namespace: [metadata, namespace]
              schedule: [metadata, name]
            metrics:
              - name: info
                help: "Existing Velero Schedule CRs"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      phase: [status, phase]
          - groupVersionKind:
              group: postgresql.cnpg.io
              version: v1
              kind: Backup
            metricNamePrefix: cnpg_backup
            labelsFromPath:
              namespace: [metadata, namespace]
              name: [metadata, name]
              cluster: [spec, cluster, name]
            metrics:
              - name: stopped_at_timestamp_seconds
                help: "CNPG Backup stoppedAt as a unix timestamp, per Backup CR"
                each:
                  type: Gauge
                  gauge:
                    path: [status, stoppedAt]
                    labelsFromPath:
                      phase: [status, phase]
          - groupVersionKind:
              group: postgresql.cnpg.io
              version: v1
              kind: Cluster
            metricNamePrefix: cnpg_cluster
            labelsFromPath:
              namespace: [metadata, namespace]
              cnpg_cluster: [metadata, name]
            metrics:
              - name: spec_instances
                help: "CNPG Cluster spec.instances"
                each:
                  type: Gauge
                  gauge:
                    path: [spec, instances]
