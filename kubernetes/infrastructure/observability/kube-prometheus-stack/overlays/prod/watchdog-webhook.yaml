apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: watchdog-webhook-url
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: watchdog-webhook-url
  data:
  - secretKey: url
    remoteRef:
      key: monitoring/watchdog-webhook-url
      property: url
