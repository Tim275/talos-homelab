alertmanager:
  alertmanagerSpec:
    replicas: 3
    retention: 720h
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  config:
    receivers:
      - name: 'null'

      - name: 'watchdog-heartbeat'
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/watchdog-webhook-url/url
            send_resolved: false
            max_alerts: 1

      - name: 'slack-critical'
        slack_configs:
          - channel: '#alerts-critical'
            api_url_file: /etc/alertmanager/secrets/slack-webhook-critical/url
            send_resolved: true
            title: '{{ template "slack.title" . }}'
            text: '{{ template "slack.body" . }}'
            color: '{{ template "slack.color" . }}'
            actions: &critical-actions
              - type: button
                text: 'Runbook :book:'
                url: '{{ if (index .Alerts 0).Annotations.runbook_url }}{{ (index .Alerts 0).Annotations.runbook_url }}{{ else }}https://github.com/Tim275/talos-homelab/tree/main/kubernetes/scripts/runbooks{{ end }}'
              - type: button
                text: 'Dashboard :bar_chart:'
                url: '{{ if (index .Alerts 0).Annotations.dashboard_url }}{{ template "alert.dashboard_url" . }}{{ else }}{{ if .CommonLabels.grafana_url }}{{ .CommonLabels.grafana_url }}{{ else }}https://grafana.timourhomelab.org{{ end }}{{ end }}'
              - type: button
                text: 'Explore :mag:'
                url: '{{ template "explore.url" . }}'
              - type: button
                text: 'Silence :no_bell:'
                url: '{{ template "slack.silenceURL" . }}'

      - name: 'telegram-oncall'
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram-bot-token/token
            chat_id: 8449184586
            parse_mode: ""
            send_resolved: true
            message: '{{ template "telegram.body" . }}'

      - name: 'slack-default'
        slack_configs:
          - channel: '#alerts'
            send_resolved: true
            title: '{{ template "slack.title" . }}'
            text: '{{ template "slack.body" . }}'
            color: '{{ template "slack.color" . }}'
            actions: *critical-actions

      - name: 'slack-security'
        slack_configs:
          - channel: '#alerts-security'
            api_url_file: /etc/alertmanager/secrets/slack-webhook-security/url
            send_resolved: true
            title: ':lock: {{ template "slack.title" . }}'
            text: '{{ template "slack.body" . }}'
            color: '{{ template "slack.color" . }}'
            actions: *critical-actions

      - name: 'jira-ticket'
        jira_configs:
          - api_url: https://timourmiagol.atlassian.net/rest/api/2/
            api_type: cloud
            project: SCRUM
            issue_type: Task
            summary: '{{ template "jira.summary" . }}'
            description: '{{ template "jira.description" . }}'
            labels: ['alertmanager', '{{ or .CommonLabels.tenant "platform" }}']
            resolve_transition: Erledigt
            reopen_transition: Zu erledigen
            reopen_duration: 24h
            send_resolved: true
            http_config:
              basic_auth:
                username: timour.miagol@outlook.de
                password_file: /etc/alertmanager/secrets/jira-api/token
  templateFiles:
    homelab.tmpl: |-
      {{ define "slack.icon" -}}
      {{ if eq .Status "resolved" }}:white_check_mark:
      {{- else if eq .CommonLabels.severity "critical" }}:rotating_light:
      {{- else if eq .CommonLabels.severity "warning" }}:warning:
      {{- else }}:information_source:
      {{- end -}}
      {{ end }}

      {{ define "slack.title" -}}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] [{{ .CommonLabels.cluster | toUpper | reReplaceAll "-TALOS" "" }}] {{ template "slack.icon" . }} {{ .CommonLabels.alertname }}
      {{- end }}

      {{ define "slack.color" -}}
      {{ if eq .Status "resolved" }}good
      {{- else if eq .CommonLabels.severity "critical" }}danger
      {{- else if eq .CommonLabels.severity "warning" }}warning
      {{- else }}#439FE0
      {{- end -}}
      {{ end }}

      {{ define "resource.slack" -}}
      {{- $pod := "" }}{{ if and .Labels.pod (not (match "kube-state-metrics" .Labels.pod)) }}{{ $pod = .Labels.pod }}{{ end -}}
      {{ if .Labels.deployment }}*Resource:* `deployment/{{ .Labels.deployment }}`
      {{- else if .Labels.statefulset }}*Resource:* `statefulset/{{ .Labels.statefulset }}`
      {{- else if .Labels.daemonset }}*Resource:* `daemonset/{{ .Labels.daemonset }}`
      {{- else if .Labels.persistentvolumeclaim }}*Resource:* `pvc/{{ .Labels.persistentvolumeclaim }}`
      {{- else if .Labels.job_name }}*Resource:* `job/{{ .Labels.job_name }}`
      {{- else if $pod }}*Resource:* `pod/{{ $pod }}`
      {{- else if .Labels.node }}*Resource:* `node/{{ .Labels.node }}`
      {{- else if and .Labels.instance (ne .Labels.job "kube-state-metrics") }}*Resource:* `instance/{{ .Labels.instance }}`
      {{- end -}}
      {{ end }}

      {{ define "resource.telegram" -}}
      {{- $pod := "" }}{{ if and .Labels.pod (not (match "kube-state-metrics" .Labels.pod)) }}{{ $pod = .Labels.pod }}{{ end -}}
      {{ if .Labels.deployment }}<b>Resource:</b> <code>deployment/{{ .Labels.deployment }}</code>
      {{- else if .Labels.statefulset }}<b>Resource:</b> <code>statefulset/{{ .Labels.statefulset }}</code>
      {{- else if .Labels.daemonset }}<b>Resource:</b> <code>daemonset/{{ .Labels.daemonset }}</code>
      {{- else if .Labels.persistentvolumeclaim }}<b>Resource:</b> <code>pvc/{{ .Labels.persistentvolumeclaim }}</code>
      {{- else if .Labels.job_name }}<b>Resource:</b> <code>job/{{ .Labels.job_name }}</code>
      {{- else if $pod }}<b>Resource:</b> <code>pod/{{ $pod }}</code>
      {{- else if .Labels.node }}<b>Resource:</b> <code>node/{{ .Labels.node }}</code>
      {{- else if and .Labels.instance (ne .Labels.job "kube-state-metrics") }}<b>Resource:</b> <code>instance/{{ .Labels.instance }}</code>
      {{- end -}}
      {{ end }}

      {{ define "slack.body" -}}
      {{ range .Alerts -}}
      *Severity:* `{{ .Labels.severity | toUpper }}`  ·  *Seit:* {{ .StartsAt | tz "Europe/Berlin" | date "02.01. 15:04" }}{{ if .Labels.component }}  ·  *Component:* `{{ .Labels.component }}`{{ end }}
      {{ if .Labels.namespace }}*Namespace:* `{{ .Labels.namespace }}`  {{ end }}{{ template "resource.slack" . }}

      *Summary:* {{ .Annotations.summary }}
      {{ if .Annotations.description }}*Description:* {{ .Annotations.description }}
      {{ end }}{{ if .Annotations.impact }}*Impact:* {{ .Annotations.impact }}
      {{ end }}{{ if .Annotations.action }}*Action:* {{ .Annotations.action }}
      {{ end }}
      {{ end -}}
      {{ end }}

      {{ define "telegram.body" -}}
      {{ if eq .Status "firing" }}🔥 [FIRING:{{ .Alerts.Firing | len }}]{{ else }}✅ [RESOLVED]{{ end }} {{ .CommonLabels.alertname }}

      {{ range $i, $a := .Alerts -}}
      {{- if lt $i 5 -}}
      ━━━━━━━━━━━━━━━━━━━━
      Severity: {{ .Labels.severity | toUpper }}  ·  Seit: {{ .StartsAt | tz "Europe/Berlin" | date "02.01. 15:04" }}
      {{ if .Labels.namespace }}Namespace: {{ .Labels.namespace }}
      {{ end }}{{ template "resource.telegram" . }}
      Summary: {{ .Annotations.summary }}
      {{ if .Annotations.dashboard_url }}{{ template "dashboard.link" . }}{{ else }}https://grafana.timourhomelab.org{{ end }}
      {{ end -}}
      {{ end -}}
      {{ if gt (len .Alerts) 5 }}…and more alerts in this group (see Slack){{ end }}
      {{ end }}

      {{ define "slack.silenceURL" -}}
      https://grafana.timourhomelab.org/alerting/silence/new?alertmanager=Alertmanager
      {{- range $k, $v := .CommonLabels }}&matcher={{ $k }}%3D{{ $v | urlquery }}{{ end -}}
      {{- end }}

      {{ define "dashboard.link" -}}
      {{- $u := .Annotations.dashboard_url -}}
      {{ $u }}{{ if match "^https://grafana\\.timourhomelab\\.org/d/" $u }}{{ if match "\\?" $u }}&{{ else }}?{{ end }}from={{ (.StartsAt.Add -3600000000000).UnixMilli }}&to=now{{ end }}
      {{- end }}

      {{ define "alert.dashboard_url" -}}
      {{ template "dashboard.link" (index .Alerts 0) }}
      {{- end }}

      {{ define "explore.url" -}}
      {{- $a := index .Alerts 0 -}}
      {{- $pod := "" }}{{ if and $a.Labels.pod (not (match "kube-state-metrics" $a.Labels.pod)) }}{{ $pod = $a.Labels.pod }}{{ end -}}
      {{- $ns := $a.Labels.namespace -}}
      {{- $from := ($a.StartsAt.Add -3600000000000).UnixMilli -}}
      {{- if and $ns $pod -}}
      https://grafana.timourhomelab.org/explore?schemaVersion=1&orgId=1&panes={{ printf `{"ex":{"datasource":"loki","queries":[{"refId":"A","expr":"{namespace=\"%s\",pod=\"%s\"}","datasource":{"type":"loki","uid":"loki"}}],"range":{"from":"%d","to":"now"}}}` $ns $pod $from | urlquery }}
      {{- else if and $ns (not $a.Labels.node) -}}
      https://grafana.timourhomelab.org/explore?schemaVersion=1&orgId=1&panes={{ printf `{"ex":{"datasource":"loki","queries":[{"refId":"A","expr":"{namespace=\"%s\"}","datasource":{"type":"loki","uid":"loki"}}],"range":{"from":"%d","to":"now"}}}` $ns $from | urlquery }}
      {{- else -}}
      https://grafana.timourhomelab.org/explore
      {{- end -}}
      {{- end }}

      {{ define "jira.summary" -}}
      {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} · {{ . }}{{ end }}{{ if eq (len .Alerts.Firing) 1 }}{{ with (index .Alerts.Firing 0).Annotations.summary }} — {{ . }}{{ end }}{{ end }}
      {{- end }}

      {{ define "jira.description" -}}
      h3. Was ist los
      {{ range .Alerts.Firing }}* {{ .Annotations.summary }}
      {{ end }}
      {{ with (index .Alerts 0).Annotations.description }}{{ . }}
      {{ end }}
      h3. Was tun
      {{ with (index .Alerts 0).Annotations.action }}{noformat}{{ . }}{noformat}{{ else }}Runbook lesen.{{ end }}

      h3. Links
      {{ with (index .Alerts 0).Annotations.runbook_url }}* [Runbook|{{ . }}]
      {{ end }}{{ if (index .Alerts 0).Annotations.dashboard_url }}* [Dashboard|{{ template "alert.dashboard_url" . }}]
      {{ end }}* [Abfrage in Prometheus|{{ (index .Alerts 0).GeneratorURL }}]
      * [Stummschalten|{{ template "slack.silenceURL" . }}]

      _{{ .CommonLabels.severity }} · schließt sich selbst, wenn der Alarm endet_
      {{- end }}
