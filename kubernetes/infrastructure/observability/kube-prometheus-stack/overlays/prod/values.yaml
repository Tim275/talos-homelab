prometheus:
  prometheusSpec:
    replicas: 2
    externalUrl: https://prometheus.timourhomelab.org
    externalLabels:
      grafana_url: "https://grafana.timourhomelab.org"
    retention: 30d
    retentionSize: "45GB"
    # 7d: p95 3203Mi, max 4091Mi against a 4096Mi limit — 5Mi from an OOMKill
    resources:
      requests:
        cpu: 500m
        memory: 3584Mi
      limits:
        cpu: 2000m
        memory: 6Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50G
defaultRules:
  additionalRuleGroupAnnotations:
    alertmanager:
      dashboard_url: "https://grafana.timourhomelab.org/d/alertmanager-state"
    configReloaders:
      dashboard_url: "https://grafana.timourhomelab.org/d/prometheus-stats"
    kubeApiserverSlos:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-apiserver"
    kubeStateMetrics:
      dashboard_url: "https://grafana.timourhomelab.org/d/prometheus-stats"
    kubernetesApps:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-pod-overview?var-namespace={{ $labels.namespace }}"
    kubernetesResources:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-cluster-overview"
    kubernetesStorage:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-persistent-volumes?var-namespace={{ $labels.namespace }}&var-volume={{ $labels.persistentvolumeclaim }}"
    kubernetesSystem:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-cluster-overview"
    network:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-node-overview"
    nodeExporterAlerting:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-node-overview"
    prometheus:
      dashboard_url: "https://grafana.timourhomelab.org/d/prometheus-stats"
    prometheusOperator:
      dashboard_url: "https://grafana.timourhomelab.org/d/prometheus-stats"
  additionalRuleAnnotations:
    KubeAPIInstanceUnreachable:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-apiserver"
    KubeAPITerminatedRequests:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-apiserver"
    KubeAggregatedAPIDown:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-apiserver"
    KubeAggregatedAPIErrors:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-apiserver"
    KubeClientCertificateExpiration:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-apiserver"
    KubeClientErrors:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-apiserver"
    KubeNodeEviction:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-views-nodes?var-node={{ $labels.node }}"
    KubeNodeReadinessFlapping:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-views-nodes?var-node={{ $labels.node }}"
    KubeNodeUnreachable:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-views-nodes?var-node={{ $labels.node }}"
    KubeletClientCertificateExpiration:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-views-nodes?var-node={{ $labels.node }}"
    KubeletClientCertificateRenewalErrors:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-views-nodes?var-node={{ $labels.node }}"
    KubeletInstanceUnreachable:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-views-nodes?var-node={{ $labels.node }}"
    KubeletPlegDurationHigh:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-views-nodes?var-node={{ $labels.node }}"
    KubeletPodStartUpLatencyHigh:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-views-nodes?var-node={{ $labels.node }}"
    KubeletTooManyPods:
      dashboard_url: "https://grafana.timourhomelab.org/d/k8s-views-nodes?var-node={{ $labels.node }}"
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
