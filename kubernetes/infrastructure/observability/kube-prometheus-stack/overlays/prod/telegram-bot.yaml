apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telegram-bot-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: telegram-bot-token
  data:
  - secretKey: token
    remoteRef:
      key: monitoring/telegram-bot-token
      property: token
