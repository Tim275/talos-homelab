apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-client-cert
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: etcd-client-cert
  data:
  - secretKey: ca.crt
    remoteRef:
      key: monitoring/etcd-client-cert
      property: ca.crt
  - secretKey: server.crt
    remoteRef:
      key: monitoring/etcd-client-cert
      property: server.crt
  - secretKey: server.key
    remoteRef:
      key: monitoring/etcd-client-cert
      property: server.key
