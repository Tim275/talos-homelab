# Long-Term-Store fuer Prometheus: der Thanos-Sidecar laedt fertige TSDB-Bloecke
# hierher hoch. Damit ueberleben Metriken sowohl die 15d-Retention als auch den
# Verlust der (single-replica) Prometheus-Instanz.
# Rook erzeugt Bucket + Secret <name> mit AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: thanos-metrics
  namespace: monitoring
spec:
  bucketName: thanos-metrics
  storageClassName: rook-ceph-bucket
  additionalConfig:
    bucketclass: standard
