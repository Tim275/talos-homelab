            description: "Sustained >6% of requests over 500ms on both 30m AND 6h windows."
            dashboard_url: "/d/drova-slo-burnrate"

        - alert: DrovaApiGatewayLatencyBurnRateFast
          expr: |
            (1 - slo:drova_api_gateway_latency:ratio_rate5m) > (14.4 * (1 - 0.99))
            and
            (1 - slo:drova_api_gateway_latency:ratio_rate1h) > (14.4 * (1 - 0.99))
