          labels:
            severity: warning
            priority: P2
            tenant: drova
            slo: api-gateway-latency
          annotations:
            summary: "Drova api-gateway: latency SLO fast burn (>14.4% slower than 500ms)"
            description: "Customer-facing: over 14.4% of requests breach 500ms on both 5m AND 1h windows."
            dashboard_url: "/d/drova-slo-burnrate"
        - alert: DrovaApiGatewayLatencyBurnRateSlow
          expr: |
