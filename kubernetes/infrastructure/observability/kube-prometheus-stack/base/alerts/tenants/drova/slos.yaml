            and
            (1 - slo:drova_api_gateway_latency:ratio_rate6h) > (6 * (1 - 0.99))
          for: 15m
          labels:
            severity: warning
            priority: P2
            tenant: drova
            slo: api-gateway-latency
          annotations:
            summary: "Drova api-gateway: latency SLO slow burn (>6% slower than 500ms)"
            description: "Sustained customer-facing latency: >6% of requests over 500ms on both 30m AND 6h windows."
            dashboard_url: "/d/drova-slo-burnrate"

        - alert: DrovaUserServiceLatencyBurnRateFast
          expr: |
            (1 - slo:drova_user_service_latency:ratio_rate5m) > (14.4 * (1 - 0.99))
            and
            (1 - slo:drova_user_service_latency:ratio_rate1h) > (14.4 * (1 - 0.99))
          for: 2m
          labels:
            severity: warning
