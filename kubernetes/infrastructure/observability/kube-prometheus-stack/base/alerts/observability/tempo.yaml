apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: observability-tempo
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: tempo
      interval: 60s
      rules:
        - alert: TempoDistributorDown
          expr: absent(up{job="monitoring/distributor"}) or up{job="monitoring/distributor"} == 0
          for: 5m
          labels:
            severity: warning
            component: tempo
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/tempo-service-graph"
            summary: "Tempo distributor down — traces being dropped"
            description: "Apps cannot push traces; OTel-Collector queue grows. (Tracing only — no user impact.)"
            action: "kubectl -n tempo get pod -l app.kubernetes.io/component=distributor + logs; the OTel queue grows until restored (tracing only)."

        - alert: TempoMetricsGeneratorNotProcessing
          expr: |
            sum(tempo_metrics_generator_registry_active_series) == 0
            and
            sum(rate(tempo_metrics_generator_spans_received_total[15m])) > 0
          for: 15m
          labels:
            severity: warning
            component: tempo
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/tempo-service-graph"
            summary: "Tempo metrics-generator bekommt Spans, erzeugt aber keine Serien"
            description: "active_series=0 bei laufendem Span-Eingang \u2014 span-metrics/service-graphs liefern nichts. Trace-Suche funktioniert weiter, deshalb faellt es sonst nicht auf."
            action: "tempo_metrics_generator_spans_discarded_total nach reason aufschluesseln; bei outside_metrics_ingestion_slack den Wert ingestion_time_range_slack in den overrides pruefen."
