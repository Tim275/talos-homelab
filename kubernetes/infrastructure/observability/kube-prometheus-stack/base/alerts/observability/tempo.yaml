apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: observability-tempo
  labels:
    release: kube-prometheus-stack
spec:
  # Tracing is observability infra → ticket. Distributor-down (no trace ingest) is the
  # symptom; ingester-internals → Grafana "Tempo" dashboard.
  groups:
    - name: tempo
      interval: 60s
      rules:
        - alert: TempoDistributorDown
          expr: up{job=~".*tempo.*distributor.*"} == 0
          for: 5m
          labels:
            severity: warning
            component: tempo
            priority: P2
          annotations:
            dashboard_url: "/d/tempo-service-graph"
            summary: "Tempo distributor down — traces being dropped"
            description: "Apps cannot push traces; OTel-Collector queue grows. (Tracing only — no user impact.)"
            action: "kubectl -n tempo get pod -l app.kubernetes.io/component=distributor + logs; the OTel queue grows until restored (tracing only)."

        # Spans kommen an, aber kein Prozessor erzeugt Serien. ZWEI bekannte Ursachen:
        # (a) 2026-08-06: Overrides-Schema-Mismatch (legacy vs new) — behoben, siehe
        #     tempo/base/values.yaml. Pruefen via 'type mismatch' im Log.
        # (b) 2026-08-19 bestaetigt: Tempo-2.9.0-Upstream-Bug, single-tenant-mode
        #     (multitenancy_enabled: false). Nach jedem metrics-generator-Neustart
        #     bleibt active_series bei 0 — Prozessoren zeigen "aktiv", WAL bleibt leer.
        #     Log zeigt "instance not found in the ring" + stale memberlist-Peer der
        #     alten Pod-IP. Von den Tempo-Maintainern als "not planned" geschlossen:
        #     https://github.com/grafana/tempo/issues/5479 — kein Fix vorgesehen.
        #     Workaround (multitenancy_enabled: true) NICHT blind anwenden — bricht
        #     Trace-Ingest komplett, falls OTel-Clients keinen Tenant-Header senden.
        #     Trace-SUCHE funktioniert in beiden Faellen weiter, nur Span-Metrics/
        #     Service-Graphs/TraceQL-Metrics fehlen.
        - alert: TempoMetricsGeneratorNotProcessing
          expr: |
            sum(tempo_metrics_generator_registry_active_series) == 0
            and
            sum(rate(tempo_metrics_generator_spans_received_total[15m])) > 0
          for: 15m
          labels:
            severity: warning
            component: tempo
            priority: P2
          annotations:
            dashboard_url: "/d/tempo-service-graph"
            summary: "Tempo metrics-generator bekommt Spans, erzeugt aber keine Serien"
            description: "active_series=0 bei laufendem Span-Eingang — span-metrics/service-graphs/local-blocks liefern nichts. TraceQL-Metrics geben leere Serien zurueck, Traces Drilldown bleibt leer. Trace-SUCHE funktioniert weiter, deshalb faellt es sonst nicht auf."
            action: "ZUERST pruefen: https://github.com/grafana/tempo/issues/5479 (bestaetigter 2.9.0-Bug, kein Fix). Nur falls Log 'type mismatch' zeigt, ist es stattdessen das 08-06-Schema-Problem — dann overrides.defaults/per_tenant_overrides in tempo/base/values.yaml auf Verschachtelung pruefen."
