apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: observability-tracing
  labels:
    release: kube-prometheus-stack
spec:
  # Drova trace-presence/volume → Grafana "Drova Tracing" + Jaeger. Queue-full folded into
  # export-failing (the queue fills because export fails). Kept the OTel pipeline symptom.
  groups:
    - name: tracing.pipeline
      interval: 60s
      rules:
        - alert: OtelCollectorExportFailing
          # OTel-Collector exportiert diese Counter OHNE _total-Suffix.
          # Mit _total gab es die Serie nicht → Alert konnte nie feuern.
          expr: rate(otelcol_exporter_send_failed_spans[5m]) > 0
          for: 10m
          labels:
            severity: warning
            component: tracing
            priority: P2
          annotations:
            dashboard_url: "/d/jaeger-internals"
            summary: "OTel-Collector failing to export spans"
            description: "Spans dropped — backend (Jaeger/Tempo) unreachable or rate-limited. All tracing affected."
            action: "kubectl logs -n opentelemetry -l app.kubernetes.io/component=opentelemetry-collector | grep -i export; check Jaeger/Tempo reachability."
