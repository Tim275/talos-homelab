apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: observability-tracing
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: tracing.pipeline
      interval: 60s
      rules:
        - alert: OtelCollectorExportFailing
          expr: rate(otelcol_exporter_send_failed_spans[5m]) > 0
          for: 10m
          labels:
            severity: warning
            component: tracing
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/jaeger-internals"
            summary: "OTel-Collector failing to export spans"
            description: "Spans dropped — backend (Jaeger/Tempo) unreachable or rate-limited. All tracing affected."
            action: "kubectl logs -n opentelemetry -l app.kubernetes.io/component=opentelemetry-collector | grep -i export; check Jaeger/Tempo reachability."

        - alert: TracingPipelineSilent
          expr: (sum(rate(otelcol_receiver_accepted_spans[15m])) or vector(0)) == 0
          for: 15m
          labels:
            severity: warning
            component: tracing
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/jaeger-internals"
            summary: "Keine Spans mehr — Tracing ist blind"
            description: "Ueber 15m erreicht kein einziger Span den Collector. Gemessen am Receiver-Zaehler, nicht an den Span-Metriken: seit dem Health-Span-Filter faellt deren Rate in ruhigen Phasen auf null, der Receiver-Zaehler lag in 7 Tagen nie unter 53/min."
            action: "kubectl -n opentelemetry logs -l app.kubernetes.io/component=opentelemetry-collector; pruefen ob die Services noch OTLP senden (OTEL_EXPORTER_OTLP_ENDPOINT)."

    - name: tracing.spans
      interval: 60s
      rules:
        - alert: DrovaSpanErrorRateHigh
          expr: |
            (
              sum by (service_name) (rate(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR", span_name!~"ping|grpc.health.v1.Health/Check"}[15m]))
              /
              sum by (service_name) (rate(traces_span_metrics_calls_total{span_name!~"ping|grpc.health.v1.Health/Check"}[15m]))
            ) > 0.05
            and
            sum by (service_name) (increase(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR", span_name!~"ping|grpc.health.v1.Health/Check"}[15m])) > 10
          for: 15m
          labels:
            severity: warning
            component: tracing
            tenant: drova
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/drova-service-detail"
            summary: "{{ $labels.service_name }}: {{ $value | humanizePercentage }} Spans mit Fehler-Status"
            description: "Deckt gRPC, Redis, Postgres und Kafka mit ab — Pfade, die die HTTP-SLOs nicht sehen. Redis-ping und gRPC-Health sind ausgenommen, die stellten 45k der rund 50k Spans pro Tag und waren reines Rauschen. Die Schwelle von 5% stammt noch aus der Messung MIT diesem Rauschen und gehoert nach einer Woche echter Daten nachgezogen."
            action: "In Jaeger nach Spans mit error=true filtern: https://jaeger.timourhomelab.org"
