apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      release: kube-prometheus-stack
    includeSelectors: false

resources:
  - kubernetes
  - infrastructure
  - hardware
  - storage
  - data
  - network
  - apps
  - business           # multi-tenant app alerts (n8n, keycloak)
  - platform
  - observability
  - compliance
  - tenants/drova
