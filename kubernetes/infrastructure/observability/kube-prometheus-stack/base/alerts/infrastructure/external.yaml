apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hypervisor-external
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: external-connectivity
      interval: 1m
      rules:
        - alert: InternetConnectivityLost
          # ein einzelnes flatterndes Ziel ist kein ISP-Ausfall — erst die Mehrheit zaehlt
          expr: |
            count(probe_success{job="blackbox-external"} == 0)
              / count(probe_success{job="blackbox-external"}) > 0.5
          for: 5m
          labels:
            severity: critical
            priority: P0
            component: network
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/blackbox-exporter"
            summary: "External connectivity lost: {{ $value | humanizePercentage }} der Blackbox-Ziele unerreichbar"
            description: "Mehr als die Haelfte der externen Ziele faellt seit >5min aus. ISP/router/firewall issue."
            action: "Check ISP/router/modem; welche Ziele betroffen sind zeigt probe_success{job=\"blackbox-external\"}; this is upstream of the cluster."

        - alert: ExternalDNSResolutionFailed
          expr: probe_dns_lookup_time_seconds{job="blackbox-dns"} > 5 or probe_success{job="blackbox-dns"} == 0
          for: 10m
          labels:
            severity: warning
            priority: P2
            component: dns
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/blackbox-exporter"
            summary: "External DNS slow/failing: {{ $labels.instance }} ({{ $value | humanizeDuration }} lookup)"
            description: "Blackbox-Probe gegen CoreDNS: Lookup >5s oder gescheitert. Externe Aufloesung bricht, interne svc-DNS kann noch gehen."
            action: "kubectl logs -n kube-system -l k8s-app=kube-dns; the probe tests CoreDNS resolving externally — check upstream/Gateway."

        - alert: TLSCertificateExpiringSoonExternal
          expr: probe_ssl_earliest_cert_expiry{job=~"blackbox-.*"} - time() < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
            priority: P2
            component: ingress
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/blackbox-exporter"
            summary: "External TLS cert expires in {{ $value | humanizeDuration }} (<14d): {{ $labels.instance }}"
            description: "Zertifikat eines oeffentlichen Endpunkts laeuft in unter 14 Tagen ab — nach Ablauf schlaegt TLS fuer Besucher fehl."
            action: "Check the cert for {{ $labels.instance }}; cert-manager (internal) or the external CA; <14d to expiry."

    - name: homelab-services
      interval: 1m
      rules:
        - alert: HomelabPublicServiceDown
          expr: probe_success{job="blackbox-homelab"} == 0
          for: 5m
          labels:
            severity: warning
            priority: P2
            component: ingress
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/blackbox-exporter"
            summary: "Homelab service unreachable: {{ $labels.instance }}"
            description: "Blackbox probe to {{ $labels.instance }} returned no valid HTTP response for >5min (refused/timeout/5xx)."
            action: "curl --resolve HOST:443:192.168.0.152 https://HOST/ ; check app pod + HTTPRoute + Envoy filter-chain."

        - alert: HomelabEdgeDown
          expr: |
            count(probe_success{job="blackbox-homelab"} == 0)
              / count(probe_success{job="blackbox-homelab"}) > 0.5
          for: 2m
          labels:
            severity: critical
            priority: P1
            component: ingress
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/blackbox-exporter"
            summary: "{{ $value | humanizePercentage }} of public services down at once"
            description: "Unrelated apps do not fail together. Shared path: Envoy Gateway, cloudflared or DNS."
            action: "kubectl -n gateway logs -l control-plane=envoy-gateway | grep 'direct response' — if present: kubectl -n gateway rollout restart deploy envoy-gateway"
