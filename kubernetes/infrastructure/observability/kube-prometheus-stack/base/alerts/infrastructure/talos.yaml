apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hypervisor-talos
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: talos-os
      interval: 1m
      rules:
        - alert: TalosFilesystemReadOnly
          expr: |
            node_filesystem_readonly{
              fstype!~"tmpfs|squashfs|nfs|rootfs|overlay|cgroup|cgroup2|proc|sysfs|devtmpfs|configfs|debugfs|tracefs|pstore|securityfs|bpf|fusectl|hugetlbfs|mqueue|autofs|ramfs",
              mountpoint!~"/etc/.*|/usr/lib/.*|/boot.*|/system.*|/run/.*"
            } == 1
          for: 5m
          labels:
            severity: warning
            component: hypervisor
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/talos-os"
            summary: "Talos filesystem read-only on {{ $labels.instance }}:{{ $labels.mountpoint }}"
            description: "Real data-disk went read-only — likely disk failure or corruption."
            action: "talosctl -n <node> dmesg | grep -iE 'read-only|I/O error'; likely disk failure — check the Proxmox VM disk + Ceph."

        - alert: TalosNodeClockSkew
          expr: abs(node_timex_offset_seconds) > 0.5
          for: 10m
          labels:
            severity: warning
            component: hypervisor
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/talos-os"
            summary: "Talos node {{ $labels.instance }} clock skew {{ $value }}s"
            description: "NTP sync issue — service-account / SVID tokens may fail (breaks SPIRE mTLS, webhook auth)."
            action: "talosctl -n <node> time; NTP broken → SPIRE/SA-tokens fail; check the host clock + NTP server."

        - alert: TalosNodeRebootedRecently
          # ohne job-Filter feuern die Proxmox-Hosts hier als Talos-Node
          expr: (time() - node_boot_time_seconds{job="node-exporter"}) < 600
          for: 1m
          labels:
            severity: warning
            component: hypervisor
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/talos-os"
            summary: "Talos node {{ $labels.instance }} rebooted recently"
            description: "Node uptime <10min — investigate if unplanned."
            action: "talosctl -n <node> get events / dmesg; if unplanned: check the Proxmox VM + host stability."

        # replaces the upstream NodeMemoryHighUtilization (disabled in values-prod.yaml)
        # so the runbook can name nipogi's packing problem instead of a generic node warning
        - alert: TalosNodeMemoryHigh
          expr: 100 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"} * 100) > 85
          for: 30m
          labels:
            severity: warning
            component: hypervisor
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/talos-os"
            summary: "Talos node {{ $labels.instance }} below 15% available memory"
            description: "MemAvailable <15% for 30min — page-cache is already excluded, so this is real pressure."
            action: "Compare all nodes first: the cluster usually has 40G free elsewhere while nipogi is packed — check topologySpreadConstraints before adding capacity. nipogi itself has no spare RAM (77G host, 66G assigned); never raise VM RAM in place (that destroyed worker-3 once)."
