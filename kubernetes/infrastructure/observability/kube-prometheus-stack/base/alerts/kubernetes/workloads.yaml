apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-workloads
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: kubernetes-workloads
      interval: 1m
      rules:
        - alert: PodCrashLooping
          expr: |
            max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) == 1
          for: 5m
          labels:
            severity: warning
            component: application
            priority: P2
          annotations:
            dashboard_url: "/d/k8s-pod-overview"
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in CrashLoopBackOff >5min."
            action: "kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} --previous; describe for the crash reason; fix config/image/resources."

        - alert: ContainerOOMKilled
          expr: increase(kube_pod_container_status_terminated_reason{reason="OOMKilled"}[15m]) > 0
          labels:
            severity: warning
            component: application
            priority: P2
          annotations:
            dashboard_url: "/d/k8s-pod-overview"
            summary: "OOM kill: {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}"
            description: "Container OOM-killed in last 15min — raise memory limit or fix a leak."
            action: "Raise {{ $labels.container }}'s memory limit or fix the leak; kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}."

        - alert: PodNotReady
          expr: kube_pod_status_phase{phase!~"Running|Succeeded|Failed"} == 1
          for: 15m
          labels:
            severity: warning
            component: application
            priority: P2
          annotations:
            dashboard_url: "/d/k8s-pod-overview"
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
            description: "Pod stuck in {{ $labels.phase }} for 15+ min — scheduling failure or PVC unbound."
            action: "kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}; check events — scheduling, PVC-unbound, or failing readiness."

        - alert: ContainerWaitingStuck
          expr: |
            kube_pod_container_status_waiting_reason{reason!="CrashLoopBackOff"} == 1
            and on (namespace, pod) kube_pod_status_phase{phase=~"Pending|Running"} == 1
          for: 1h
          labels:
            severity: warning
            component: application
            priority: P2
          annotations:
            dashboard_url: "/d/k8s-pod-overview"
            summary: "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} waiting: {{ $labels.reason }}"
            description: "Container stuck waiting ({{ $labels.reason }}) for 1h+ while the pod is still Pending/Running."
            action: "kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}; check image pull, config mount, or init container failures."

        - alert: ContainerCPUThrottlingHigh
          expr: |
            sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total{container!=""}[5m]))
              /
            sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total{container!=""}[5m]))
              > 0.75
          for: 15m
          labels:
            severity: warning
            component: application
            priority: P2
          annotations:
            dashboard_url: "/d/k8s-pod-overview"
            summary: "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} throttled {{ $value | humanizePercentage }}"
            description: "Container throttled >75% of CFS periods for 15min — busy-loop or under-sized CPU limit."
            action: "kubectl top pod -n {{ $labels.namespace }} {{ $labels.pod }} --containers; busy-loop → fix root cause, else raise the cpu limit."

        - alert: ContainerMemoryHigh
          expr: |
            sum by (namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="memcached"})
              /
            sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
              > 0.95
          for: 30m
          labels:
            severity: warning
            component: application
            priority: P2
          annotations:
            dashboard_url: "/d/k8s-pod-overview"
            summary: "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} memory at {{ $value | humanizePercentage }} of limit"
            description: "Container working set >95% of its memory limit for 30min — OOM-kill risk."
            action: "kubectl top pod -n {{ $labels.namespace }} {{ $labels.pod }} --containers; raise the memory limit or fix the leak."

        - alert: ContainerMemoryLeakSuspected
          expr: |
            (
              sum by (namespace, pod, container) (
                predict_linear(container_memory_working_set_bytes{container!="",container!="memcached"}[6h], 6 * 3600)
              )
                >
              sum by (namespace, pod, container) (
                kube_pod_container_resource_limits{resource="memory"}
              )
            )
            and
            sum by (namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="memcached"})
              / sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
              > 0.60
            and on (namespace, pod, container)
            sum by (namespace, pod, container) (count_over_time(container_memory_working_set_bytes{container!="",container!="memcached"}[6h])) > 2000
          for: 1h
          labels:
            severity: warning
            component: application
            priority: P2
          annotations:
            dashboard_url: "/d/k8s-pod-overview"
            summary: "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} memory trending to OOM"
            description: "Working set is climbing; at the current 6h trend it exceeds the memory limit within ~24h — likely a leak."
            action: "Check the pod's 24h memory graph; steady ramp (not sawtooth) = leak → restart to mitigate, then fix the root cause."
