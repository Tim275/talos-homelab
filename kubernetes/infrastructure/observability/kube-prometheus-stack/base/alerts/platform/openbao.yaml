apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-openbao
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: openbao-ticket
      interval: 60s
      rules:
        - alert: OpenBaoNotReady
          expr: kube_pod_container_status_ready{namespace="openbao", pod=~"openbao-[0-9]+"} == 0
          for: 15m
          labels:
            severity: warning
            component: platform
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/openbao-metrics"
            summary: "OpenBao {{ $labels.pod }} nicht ready seit >15min"
            description: "Seit dem static seal entsiegelt sich OpenBao selbst. Startet er trotzdem nicht ready, fehlt meist das Secret openbao-seal-key oder die raft-Daten sind kaputt."
            action: "kubectl -n openbao get secret openbao-seal-key; kubectl exec -n openbao openbao-0 -- bao status. Fehlt das Secret: tofu apply -target=module.openbao."
