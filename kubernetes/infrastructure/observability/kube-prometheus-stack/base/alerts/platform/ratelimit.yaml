apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-ratelimit
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: ratelimit
    rules:
    - alert: RateLimitServiceDown
      expr: sum(up{job="envoy-ratelimit"}) == 0
      for: 5m
      labels:
        severity: warning
        component: gateway
      annotations:
        runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/kubernetes/scripts/runbooks/network.md#ratelimitservicedown"
        dashboard_url: "https://grafana.timourhomelab.org/d/envoy-global"
        summary: Rate-Limit-Dienst ist weg — Envoy laesst alles durch
        description: Der Envoy-Filter faellt offen aus. Kein Limit greift mehr, auch nicht auf den oeffentlichen Routen.
    - alert: RateLimitRedisErrors
      expr: |
        sum(rate(ratelimit_service_should_rate_limit_error[15m]))
          / (sum(rate(ratelimit_service_total_requests[15m])) > 0)
          > 0.05
      for: 15m
      labels:
        severity: warning
        component: gateway
      annotations:
        dashboard_url: "https://grafana.timourhomelab.org/d/envoy-global"
        summary: "Rate-Limit-Pruefung scheitert fuer {{ $value | humanizePercentage }} der Anfragen"
        description: Diese Anfragen laufen ungebremst durch. Einzelne Abbrueche am Envoy-Timeout sind normal.
    - alert: RateLimitRedisDisconnected
      expr: sum(ratelimit_redis_pool_cx_active) == 0
      for: 10m
      labels:
        severity: warning
        component: gateway
      annotations:
        dashboard_url: "https://grafana.timourhomelab.org/d/envoy-global"
        summary: Keine Redis-Verbindung im Rate-Limit-Pool
    - alert: GatewayThrottlingClients
      expr: sum(rate(ratelimit_service_rate_limit_over_limit[10m])) > 1
      for: 15m
      labels:
        severity: warning
        component: gateway
      annotations:
        summary: Gateway drosselt dauerhaft — Limit zu eng oder jemand klopft
        description: Anhaltendes over_limit. Entweder ein Limit passt nicht zur Nutzung, oder da laeuft etwas gegen die oeffentlichen Routen.
