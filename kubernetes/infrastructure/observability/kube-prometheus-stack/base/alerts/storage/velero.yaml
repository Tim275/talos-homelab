apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage-velero
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: velero-page
      interval: 60s
      rules:
        - alert: VeleroNoRecentBackup
          expr: time() - velero_backup_last_successful_timestamp{schedule!="",schedule!~"tier2-.*|.*-weekly"} > 86400
          for: 10m
          labels:
            severity: critical
            component: backup
          annotations:
            dashboard_url: "/d/velero-overview"
            summary: "No successful Velero backup in 24h for {{ $labels.schedule }}"
            description: "RPO exceeded — covers failed/partial/not-running causes. DR-readiness compromised."
            action: "velero backup get ; velero backup logs <name> ; check RGW bucket quota + creds"
        - alert: VeleroNoRecentWeeklyBackup
          expr: time() - velero_backup_last_successful_timestamp{schedule=~"tier2-.*|.*-weekly"} > 691200
          for: 10m
          labels:
            severity: critical
            component: backup
          annotations:
            dashboard_url: "/d/velero-overview"
            summary: "No successful weekly Velero backup in 8d for {{ $labels.schedule }}"
            description: "Weekly-tier RPO exceeded (>8d). DR-readiness compromised."
            action: "velero backup get ; velero backup logs <name> ; check RGW bucket quota + creds"

    - name: velero-ticket
      interval: 60s
      rules:
        - alert: VeleroDown
          expr: up{job="velero"} == 0
          for: 5m
          labels:
            severity: warning
            component: backup
            priority: P2
          annotations:
            dashboard_url: "/d/velero-overview"
            summary: "Velero controller down"
            description: "Velero unreachable >5min — no backups will run until restored."

        - alert: VeleroBackupPartialFailure
          expr: sum(increase(velero_backup_partial_failure_total[1h])) > 0
          for: 30m
          labels:
            severity: warning
            component: backup
            priority: P2
          annotations:
            dashboard_url: "/d/velero-overview"
            summary: "Velero partial-failure backup ({{ $value }})"
            description: "Backup completed with errors — some volumes may be missing from the restore point."
