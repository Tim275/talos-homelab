apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage-velero
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: velero-page
      interval: 60s
      rules:
        - alert: VeleroNoRecentBackup
          expr: |
            (
              (time() - velero_backup_last_successful_timestamp{schedule=~"tier0-.*"} > 13 * 3600)
              or
              (time() - velero_backup_last_successful_timestamp{schedule!="",schedule!~"tier0-.*|tier2-.*|.*-weekly"} > 86400)
            ) and on (schedule) velero_schedule_info
            or sum(increase(velero_backup_attempt_total[26h])) == 0
          for: 10m
          labels:
            severity: warning
            priority: P2
            component: backup
          annotations:
            runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/kubernetes/scripts/runbooks/storage.md#veleronorecentbackup"
            dashboard_url: "https://grafana.timourhomelab.org/d/velero-overview"
            summary: "Kein erfolgreiches Velero-Backup für {{ $labels.schedule }} seit {{ $value | humanizeDuration }}"
            description: "RPO überschritten: tier0 nach 13 h (zwei 6-h-Läufe), sonst 24 h. PartiallyFailed zählt nicht als Erfolg."
            action: "velero backup get ; velero backup logs <name> ; check RGW bucket quota + creds"
        - alert: VeleroNoRecentWeeklyBackup
          expr: time() - velero_backup_last_successful_timestamp{schedule=~"tier2-.*|.*-weekly"} > 691200
          for: 10m
          labels:
            severity: warning
            priority: P2
            component: backup
          annotations:
            runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/kubernetes/scripts/runbooks/storage.md#veleronorecentweeklybackup"
            dashboard_url: "https://grafana.timourhomelab.org/d/velero-overview"
            summary: "No successful weekly Velero backup in 8d for {{ $labels.schedule }} ({{ $value | humanizeDuration }} ago)"
            description: "Weekly-tier RPO exceeded (>8d). DR-readiness compromised."
            action: "velero backup get ; velero backup logs <name> ; check RGW bucket quota + creds"

    - name: velero-ticket
      interval: 60s
      rules:
        - alert: VeleroDown
          expr: absent(up{job="velero"}) or up{job="velero"} == 0
          for: 5m
          labels:
            severity: warning
            component: backup
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/velero-overview"
            summary: "Velero controller down"
            description: "Velero unreachable >5min — no backups will run until restored."

        - alert: VeleroScheduleNeverSucceeded
          expr: velero_schedule_info unless on (schedule) velero_backup_last_successful_timestamp
          for: 8d
          labels:
            severity: warning
            component: backup
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/velero-overview"
            summary: "Velero-Zeitplan {{ $labels.schedule }} hat noch nie erfolgreich gesichert"
            description: "Ohne Erfolg fehlt der Zeitstempel, VeleroNoRecentBackup sieht den Zeitplan dann nicht. 8 Tage decken Wochen-Zeitpläne ab."

        - alert: VeleroBackupPartialFailure
          expr: sum by (schedule) (increase(velero_backup_partial_failure_total{schedule!=""}[1h]) + increase(velero_backup_failure_total{schedule!=""}[1h])) > 0
          for: 30m
          labels:
            severity: warning
            component: backup
            priority: P2
          annotations:
            dashboard_url: "https://grafana.timourhomelab.org/d/velero-overview"
            summary: "Velero-Backup von {{ $labels.schedule }} teilweise oder ganz gescheitert"
            description: "Welches Volume fehlt: kubectl get podvolumebackups -n velero -l velero.io/schedule-name={{ $labels.schedule }}"
