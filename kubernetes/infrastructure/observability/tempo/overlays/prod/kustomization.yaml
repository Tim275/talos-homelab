apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-wave: "6"

resources:
  - ../../base
  - s3-credentials-sealed.yaml  # Sealed secret with S3 credentials

components:
  - ../../components/rook-ceph

helmCharts:
  - name: tempo-distributed
    repo: https://grafana.github.io/helm-charts
    version: "1.61.3"
    releaseName: tempo
    namespace: monitoring
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - ../../components/kube-prometheus-stack/values.yaml
      - ../../components/rook-ceph/values.yaml
      - values.yaml
