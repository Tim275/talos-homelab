traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true
  jaeger:
    thriftCompact:
      enabled: true
    thriftHttp:
      enabled: true
    grpc:
      enabled: true

metricsGenerator:
  enabled: true
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - configMapRef:
        name: tempo-traces  # BUCKET_NAME, BUCKET_HOST, BUCKET_PORT
    - secretRef:
        name: tempo-traces  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  config:
    processor:
      local_blocks:
        flush_to_storage: true
    traces_storage:
      path: /var/tempo/traces
    storage:
      path: /var/tempo/wal
      remote_write:
        - url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/write

# tempo-distributed ignoriert tempo.storage/retention (Schema des Single-Binary-Charts); Bucket und Keys aus der OBC tempo-traces
storage:
  trace:
    backend: s3
    s3:
      bucket: ${BUCKET_NAME}
      endpoint: rook-ceph-rgw-homelab-objectstore.rook-ceph.svc:80  # BUCKET_PORT der OBC ist 443 (TLS)
      access_key: ${AWS_ACCESS_KEY_ID}
      secret_key: ${AWS_SECRET_ACCESS_KEY}
      insecure: true  # HTTP endpoint (not HTTPS)
      forcepathstyle: true  # Required for Ceph RGW

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
        - local-blocks
      max_active_series: 50000
      ingestion_time_range_slack: 2m
    ingestion:
      rate_limit_bytes: 20000000
      burst_size_bytes: 30000000
      max_traces_per_user: 50000
  per_tenant_override_config: /runtime-config/overrides.yaml

per_tenant_overrides: {}

distributor:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - configMapRef:
        name: tempo-traces  # BUCKET_NAME, BUCKET_HOST, BUCKET_PORT
    - secretRef:
        name: tempo-traces  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

ingester:
  replicas: 2
  maxUnavailable: 1
  affinity: |
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                {{- include "tempo.selectorLabels" (dict "ctx" . "component" "ingester") | nindent 12 }}
            topologyKey: kubernetes.io/hostname
        - weight: 75
          podAffinityTerm:
            labelSelector:
              matchLabels:
                {{- include "tempo.selectorLabels" (dict "ctx" . "component" "ingester") | nindent 12 }}
            topologyKey: topology.kubernetes.io/zone
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values: [nipogi]
  config:
    replication_factor: 2
  persistence:
    enabled: true
    size: 10Gi
    storageClass: rook-ceph-block-obs
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2560Mi
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - configMapRef:
        name: tempo-traces  # BUCKET_NAME, BUCKET_HOST, BUCKET_PORT
    - secretRef:
        name: tempo-traces  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

compactor:
  replicas: 1
  config:
    compaction:
      block_retention: 720h  # 30 days (same as Loki)
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              {{- include "tempo.selectorLabels" (dict "ctx" . "component" "compactor") | nindent 10 }}
          topologyKey: kubernetes.io/hostname
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                {{- include "tempo.selectorLabels" (dict "ctx" . "component" "compactor") | nindent 12 }}
            topologyKey: topology.kubernetes.io/zone
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values: [nipogi]
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - configMapRef:
        name: tempo-traces  # BUCKET_NAME, BUCKET_HOST, BUCKET_PORT
    - secretRef:
        name: tempo-traces  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

querier:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi   # 7d max 106Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - configMapRef:
        name: tempo-traces  # BUCKET_NAME, BUCKET_HOST, BUCKET_PORT
    - secretRef:
        name: tempo-traces  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

queryFrontend:
  replicas: 1
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - configMapRef:
        name: tempo-traces  # BUCKET_NAME, BUCKET_HOST, BUCKET_PORT
    - secretRef:
        name: tempo-traces  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              {{- include "tempo.selectorLabels" (dict "ctx" . "component" "query-frontend") | nindent 10 }}
          topologyKey: kubernetes.io/hostname
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                {{- include "tempo.selectorLabels" (dict "ctx" . "component" "query-frontend") | nindent 12 }}
            topologyKey: topology.kubernetes.io/zone
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values: [nipogi]
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

gateway:
  enabled: true
  replicas: 1
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              {{- include "tempo.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 10 }}
          topologyKey: kubernetes.io/hostname
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                {{- include "tempo.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 12 }}
            topologyKey: topology.kubernetes.io/zone
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values: [nipogi]
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 256Mi

metaMonitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack  # Required for Prometheus Operator discovery
    interval: 30s
    scrapeTimeout: 10s

global:
  clusterDomain: cluster.local
