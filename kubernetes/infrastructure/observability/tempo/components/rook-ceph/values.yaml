storage:
  trace:
    s3:
      bucket: ${BUCKET_NAME}
      endpoint: rook-ceph-rgw-homelab-objectstore.rook-ceph.svc:80  # BUCKET_PORT der OBC ist 443 (TLS)
      access_key: ${AWS_ACCESS_KEY_ID}
      secret_key: ${AWS_SECRET_ACCESS_KEY}
      insecure: true  # HTTP endpoint (not HTTPS)
      forcepathstyle: true  # Required for Ceph RGW
ingester:
  persistence:
    storageClass: rook-ceph-block-obs
