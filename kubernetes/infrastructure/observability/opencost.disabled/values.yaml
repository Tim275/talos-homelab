
opencost:
  exporter:
    replicas: 2  # HA for enterprise

    customPricing:
      enabled: true
      costModel:
        description: "Self-hosted homelab pricing model"
        CPU: 0.031  # ~$0.031/hour per vCPU (typical server depreciation)
        RAM: 0.004  # ~$0.004/hour per GB RAM
        storage: 0.000138  # ~$0.10/month per GB
        GPU: 0.50  # Adjust based on your GPU setup

    prometheus:
      external:
        enabled: true
        url: "http://prometheus-server.monitoring.svc.cluster.local"

    resources:
      limits:
        cpu: 999m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 55Mi

  ui:
    enabled: true
    replicas: 2

    resources:
      limits:
        cpu: 999m
        memory: 1Gi
      requests:
        cpu: 10m
        memory: 55Mi

    ingress:
      enabled: false  # Will use Gateway API

    grafana:
      enabled: true

serviceMonitor:
  enabled: true
  namespace: monitoring
  labels:
    app.kubernetes.io/component: opencost
    app.kubernetes.io/part-of: timour-homelab

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
