apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-audit-token
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-audit-token
  data:
  - secretKey: NB_API_KEY
    remoteRef:
      key: netbird/netbird-audit-token
      property: NB_API_KEY
