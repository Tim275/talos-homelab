apiVersion: batch/v1
kind: CronJob
metadata:
  name: netbird-audit-export
  namespace: netbird
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: export
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
