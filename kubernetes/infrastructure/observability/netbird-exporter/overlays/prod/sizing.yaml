apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-exporter
  namespace: monitoring
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: exporter
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
