apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-edge
  namespace: monitoring
stringData:
  alertmanager.yaml: |
    route:
      receiver: local-webhook
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 15m
    receivers:
      - name: local-webhook
        webhook_configs:
          - url: http://edge-webhook-receiver.monitoring.svc:8080/
            send_resolved: true
---
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: edge
  namespace: monitoring
spec:
  replicas: 1
  configSecret: alertmanager-edge
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-edge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-edge
spec:
  selector:
    app.kubernetes.io/instance: edge
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http-web
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-webhook-receiver
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-webhook-receiver
  template:
    metadata:
      labels:
        app: edge-webhook-receiver
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -c
            - |
              while true; do
                { printf 'HTTP/1.1 200 OK\r\nContent-Length: 0\r\n\r\n'; cat >> /data/alerts.log; printf '\n---\n' >> /data/alerts.log; } | nc -l -p 8080
              done
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-webhook-receiver
  namespace: monitoring
spec:
  selector:
    app: edge-webhook-receiver
  ports:
    - port: 8080
      targetPort: 8080
