apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: edge
  namespace: monitoring
spec:
  replicas: 1
  retention: 24h
  retentionSize: 2GB
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    volumeClaimTemplate:
      spec:
        resources:
          requests:
            storage: 5Gi
---
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: edge
  namespace: monitoring
spec:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-webhook-receiver
  namespace: monitoring
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: receiver
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
