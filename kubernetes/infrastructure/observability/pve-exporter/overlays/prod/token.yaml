apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pve-exporter-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: pve-exporter-token
  data:
  - secretKey: token_value
    remoteRef:
      key: monitoring/pve-exporter-token
      property: token_value
