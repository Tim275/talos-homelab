apiVersion: v1
kind: Secret
metadata:
  name: additional-scrape-configs-proxmox
  namespace: monitoring
type: Opaque
stringData:
  prometheus-additional.yaml: |
    - job_name: proxmox-host-node
      static_configs:
        - targets:
            - 192.168.0.50:9100
            - 192.168.0.57:9100
            - 192.168.0.58:9100
          labels:
            role: hypervisor
      metric_relabel_configs:
        - source_labels: [__address__]
          regex: '([^:]+):.*'
          target_label: instance
          replacement: '$1'
    - job_name: proxmox-smart
      static_configs:
        - targets:
            - 192.168.0.50:9633
            - 192.168.0.57:9633
            - 192.168.0.58:9633
          labels:
            role: hypervisor
      metric_relabel_configs:
        - source_labels: [__address__]
          regex: '([^:]+):.*'
          target_label: instance
          replacement: '$1'
    # Holt NUR die Aggregate vom Edge-Prometheus, keine rohen Serien.
    # honor_labels behaelt instance/tier aus dem Edge statt sie zu ueberschreiben.
    - job_name: federate-edge
      scrape_interval: 60s
      honor_labels: true
      metrics_path: /federate
      params:
        'match[]':
          - '{__name__=~"edge:.*"}'
      static_configs:
        - targets:
            - prometheus-edge.monitoring.svc.cluster.local:9090
