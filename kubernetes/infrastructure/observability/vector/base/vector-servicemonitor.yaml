#
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vector-logging-metrics
  namespace: elastic-system
  labels:
    prometheus: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
