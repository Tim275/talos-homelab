apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-agent
  namespace: elastic-system
spec:
  template:
    spec:
      containers:
        - name: vector
          resources:
            requests:
              memory: 128Mi
              cpu: 200m
            limits:
              memory: 1536Mi
              cpu: 1000m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-aggregator
  namespace: elastic-system
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: vector
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 1Gi
              cpu: 500m
