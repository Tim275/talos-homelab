# raft metastore hat kein Selbstheilungs-Mechanismus bei "not the leader"-Stillstand,
# nur die readinessProbe existiert (markiert NotReady, restartet aber nie)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pyroscope
spec:
  template:
    spec:
      containers:
        - name: pyroscope
          livenessProbe:
            httpGet:
              path: /ready
              port: http2
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
