pyroscope:
  # components leer = single binary ("all"-Target). Microservices-Split lohnt
  # erst bei deutlich mehr Profil-Volumen als hier anfaellt.
  components: {}
  replicaCount: 1

  persistence:
    enabled: true
    size: 20Gi
    storageClassName: rook-ceph-block-enterprise
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  extraArgs:
    # 14d — Profile sind fuer Regressionsvergleich da, nicht als Langzeitarchiv.
    retention-period: 336h

  nodeSelector:
    node-pool: stateful

# Alloy scrapt pprof von Pods mit profiles.grafana.com/<typ>.scrape Annotation.
alloy:
  enabled: true
  alloy:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  controller:
    type: daemonset

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

minio:
  enabled: false
