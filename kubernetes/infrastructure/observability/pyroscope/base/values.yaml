pyroscope:
  components: {}

  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce



  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-pool
                operator: In
                values: [stateful]
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values: [nipogi]

  podSecurityContext:
    fsGroupChangePolicy: OnRootMismatch

alloy:
  enabled: true
  controller:
    type: daemonset
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - worker-6

serviceMonitor:
  enabled: true

minio:
  enabled: false
