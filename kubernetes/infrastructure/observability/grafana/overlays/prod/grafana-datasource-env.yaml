apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-datasource-env
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-datasource-env
  data:
  - secretKey: DROVA_POSTGRES_GRAFANA_READER_PASSWORD
    remoteRef:
      key: drova/drova-postgres-grafana-reader
      property: password
  - secretKey: ES_GRAFANA_READER_PASSWORD
    remoteRef:
      key: elastic-system/users
      property: grafana_reader
