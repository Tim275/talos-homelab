apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: business-kpis
  namespace: grafana
spec:
  uid: business-kpis
  instanceSelector:
    matchLabels:
      app: grafana
  allowCrossNamespaceImport: true
  folder: Business
  json: |
    {
      "uid": "business-kpis",
      "title": "Business KPIs",
      "tags": [
        "business"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Trip-Events (alle Topics)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "custom": {
                "fillOpacity": 12,
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "business:trip_events:rate5m",
              "refId": "A",
              "legendFormat": "Trip-Events (alle Topics)"
            }
          ]
        },
        {
          "id": 2,
          "title": "Edge: erfolgreiche Requests",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 12,
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "business:edge_success_requests:rate5m",
              "refId": "A",
              "legendFormat": "Edge: erfolgreiche Requests"
            }
          ]
        },
        {
          "id": 3,
          "title": "Trips completed /h",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 8,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "business:trips_completed:rate1h * 3600",
              "refId": "A",
              "legendFormat": "Trips completed /h"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 4,
          "title": "Trips cancelled /h",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 8,
            "w": 8,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "business:trips_cancelled:rate1h * 3600",
              "refId": "A",
              "legendFormat": "Trips cancelled /h"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 5,
          "title": "Payments succeeded /h",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 8,
            "w": 8,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "business:payments_succeeded:rate1h * 3600",
              "refId": "A",
              "legendFormat": "Payments succeeded /h"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 6,
          "title": "drova API-Requests",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 12,
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "business:drova_api_requests:rate5m",
              "refId": "A",
              "legendFormat": "drova API-Requests"
            }
          ]
        }
      ]
    }
