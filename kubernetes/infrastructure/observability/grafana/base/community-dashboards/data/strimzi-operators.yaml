apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: strimzi-operators
  namespace: grafana
spec:
  uid: strimzi-operators
  instanceSelector:
    matchLabels:
      app: grafana
  allowCrossNamespaceImport: true
  folder: "Data"
  resyncPeriod: 5m
  url: "https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.1.0/packaging/examples/metrics/grafana-dashboards/strimzi-operators.json"
