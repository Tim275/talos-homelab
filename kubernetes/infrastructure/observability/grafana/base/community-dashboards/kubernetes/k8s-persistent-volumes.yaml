apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: k8s-persistent-volumes
  namespace: grafana
spec:
  uid: k8s-persistent-volumes
  instanceSelector:
    matchLabels:
      app: grafana
  allowCrossNamespaceImport: true
  folder: "Kubernetes"
  resyncPeriod: 5m
  url: "https://raw.githubusercontent.com/monitoring-mixins/website/1b7017d3a93458bf2da30eabb877686e2ad0b004/assets/kubernetes/dashboards/persistentvolumesusage.json"
