apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-secrets
  namespace: grafana
spec:
  uid: external-secrets
  instanceSelector:
    matchLabels:
      app: grafana
  allowCrossNamespaceImport: true
  folder: "Security"
  resyncPeriod: 5m
  url: "https://raw.githubusercontent.com/external-secrets/external-secrets/v2.11.0/deploy/charts/external-secrets/files/monitoring/grafana-dashboard.json"
