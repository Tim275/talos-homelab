apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sealed-secrets-bootstrap-key
  namespace: sealed-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: sealed-secrets-bootstrap-key
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      metadata:
        labels:
          sealedsecrets.bitnami.com/sealed-secrets-key: active
  data:
    - secretKey: tls.crt
      remoteRef:
        key: sealed-secrets/sealed-secrets-bootstrap-key
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: sealed-secrets/sealed-secrets-bootstrap-key
        property: tls.key
