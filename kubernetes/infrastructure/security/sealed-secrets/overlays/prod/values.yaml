resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
# startet erst, wenn die Schluessel aus OpenBao da sind, sonst erzeugt der Controller einen eigenen
additionalVolumes:
  - name: key-gate
    secret:
      secretName: sealed-secrets-bootstrap-key
      items:
        - key: tls.crt
          path: tls.crt
  - name: key-gate-2026
    secret:
      secretName: sealed-secrets-bootstrap-key-2026
      items:
        - key: tls.crt
          path: tls.crt
additionalVolumeMounts:
  - name: key-gate
    mountPath: /key-gate/current
    readOnly: true
  - name: key-gate-2026
    mountPath: /key-gate/2026
    readOnly: true
