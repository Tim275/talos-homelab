---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-central
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  conditions:
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: external-secrets
  provider:
    vault:
      server: https://192.168.0.60:8200
      caProvider:
        type: ConfigMap
        name: central-openbao-ca
        namespace: external-secrets
        key: ca.crt
      path: kv
      version: v2
      auth:
        jwt:
          path: k8s-prod
          role: external-secrets
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: eso
              namespace: external-secrets
            audiences:
            - central-openbao
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-bootstrap-values
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '3'
