apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-tenants
  namespace: external-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-tenants
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  conditions:
    - namespaces:
        - drova
        - drova-staging
        - postgres
        - grafana
        - keycloak
        - harbor
        - kyverno
  provider:
    vault:
      server: https://openbao-active.openbao.svc.cluster.local:8200
      caProvider:
        type: Secret
        name: openbao-tls-ca
        namespace: openbao
        key: ca.crt
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-operator
          role: eso-tenants
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: eso-tenants
              namespace: external-secrets
            audiences:
              - openbao
            expirationSeconds: 600
