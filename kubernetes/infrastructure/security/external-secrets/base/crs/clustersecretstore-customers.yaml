apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-customers
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          platform.tim275.github.io/customer: "true"
  provider:
    vault:
      server: https://openbao-active.openbao.svc.cluster.local:8200
      caProvider:
        type: Secret
        name: openbao-tls-ca
        namespace: openbao
        key: ca.crt
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-operator
          role: eso-customer-namespace
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: eso
            audiences:
              - openbao
            expirationSeconds: 600
