apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: openbao-bootstrap-values
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    secret:
      name: openbao-bootstrap-values
  data:
  - match:
      secretKey: arc-runners.github-runner-secret.github_app_id
      remoteRef:
        remoteKey: arc-runners/github-runner-secret
        property: github_app_id
  - match:
      secretKey: arc-runners.github-runner-secret.github_app_installation_id
      remoteRef:
        remoteKey: arc-runners/github-runner-secret
        property: github_app_installation_id
  - match:
      secretKey: arc-runners.github-runner-secret.github_app_private_key
      remoteRef:
        remoteKey: arc-runners/github-runner-secret
        property: github_app_private_key
  - match:
      secretKey: argocd.argocd-notifications-secret.slack-token
      remoteRef:
        remoteKey: argocd/argocd-notifications-secret
        property: slack-token
  - match:
      secretKey: cloudflared.cloudflared-credentials.credentials.json
      remoteRef:
        remoteKey: cloudflared/cloudflared-credentials
        property: credentials.json
  - match:
      secretKey: keycloak.keycloak-smtp.from
      remoteRef:
        remoteKey: keycloak/keycloak-smtp
        property: from
  - match:
      secretKey: keycloak.keycloak-smtp.password
      remoteRef:
        remoteKey: keycloak/keycloak-smtp
        property: password
  - match:
      secretKey: keycloak.keycloak-smtp.replyTo
      remoteRef:
        remoteKey: keycloak/keycloak-smtp
        property: replyTo
  - match:
      secretKey: keycloak.keycloak-smtp.user
      remoteRef:
        remoteKey: keycloak/keycloak-smtp
        property: user
  - match:
      secretKey: monitoring.jira-api.token
      remoteRef:
        remoteKey: monitoring/jira-api
        property: token
  - match:
      secretKey: monitoring.jira-api.user
      remoteRef:
        remoteKey: monitoring/jira-api
        property: user
  - match:
      secretKey: monitoring.netbird-exporter-token.api-token
      remoteRef:
        remoteKey: monitoring/netbird-exporter-token
        property: api-token
  - match:
      secretKey: monitoring.pve-exporter-token.token_value
      remoteRef:
        remoteKey: monitoring/pve-exporter-token
        property: token_value
  - match:
      secretKey: monitoring.slack-webhook-critical.url
      remoteRef:
        remoteKey: monitoring/slack-webhook-critical
        property: url
  - match:
      secretKey: monitoring.slack-webhook-security.url
      remoteRef:
        remoteKey: monitoring/slack-webhook-security
        property: url
  - match:
      secretKey: monitoring.slack-webhook-url.url
      remoteRef:
        remoteKey: monitoring/slack-webhook-url
        property: url
  - match:
      secretKey: monitoring.telegram-bot-token.token
      remoteRef:
        remoteKey: monitoring/telegram-bot-token
        property: token
  - match:
      secretKey: monitoring.watchdog-webhook-url.url
      remoteRef:
        remoteKey: monitoring/watchdog-webhook-url
        property: url
  - match:
      secretKey: n8n-prod.n8n-workflow-creds.ANTHROPIC_API_KEY
      remoteRef:
        remoteKey: n8n-prod/n8n-workflow-creds
        property: ANTHROPIC_API_KEY
  - match:
      secretKey: n8n-prod.n8n-workflow-creds.GITHUB_TOKEN
      remoteRef:
        remoteKey: n8n-prod/n8n-workflow-creds
        property: GITHUB_TOKEN
  - match:
      secretKey: n8n-prod.n8n-workflow-creds.TELEGRAM_TOKEN
      remoteRef:
        remoteKey: n8n-prod/n8n-workflow-creds
        property: TELEGRAM_TOKEN
  - match:
      secretKey: netbird.netbird-audit-token.NB_API_KEY
      remoteRef:
        remoteKey: netbird/netbird-audit-token
        property: NB_API_KEY
  - match:
      secretKey: netbird.netbird-mgmt-api-key.NB_API_KEY
      remoteRef:
        remoteKey: netbird/netbird-mgmt-api-key
        property: NB_API_KEY
  - match:
      secretKey: renovate-operator.renovate-secret.DOCKERHUB_TOKEN
      remoteRef:
        remoteKey: renovate-operator/renovate-secret
        property: DOCKERHUB_TOKEN
  - match:
      secretKey: renovate-operator.renovate-secret.DOCKERHUB_USERNAME
      remoteRef:
        remoteKey: renovate-operator/renovate-secret
        property: DOCKERHUB_USERNAME
  - match:
      secretKey: renovate-operator.renovate-secret.GITHUB_COM_TOKEN
      remoteRef:
        remoteKey: renovate-operator/renovate-secret
        property: GITHUB_COM_TOKEN
  - match:
      secretKey: renovate-operator.renovate-secret.GITHUB_COM_USER
      remoteRef:
        remoteKey: renovate-operator/renovate-secret
        property: GITHUB_COM_USER
  - match:
      secretKey: renovate-operator.renovate-secret.RENOVATE_HOST_RULES
      remoteRef:
        remoteKey: renovate-operator/renovate-secret
        property: RENOVATE_HOST_RULES
  - match:
      secretKey: renovate-operator.renovate-secret.RENOVATE_TOKEN
      remoteRef:
        remoteKey: renovate-operator/renovate-secret
        property: RENOVATE_TOKEN
  - match:
      secretKey: cloudflare.api-token.api-token
      remoteRef:
        remoteKey: cloudflare/api-token
        property: api-token
  - match:
      secretKey: monitoring.etcd-client-cert.ca.crt
      remoteRef:
        remoteKey: monitoring/etcd-client-cert
        property: ca.crt
  - match:
      secretKey: monitoring.etcd-client-cert.server.crt
      remoteRef:
        remoteKey: monitoring/etcd-client-cert
        property: server.crt
  - match:
      secretKey: monitoring.etcd-client-cert.server.key
      remoteRef:
        remoteKey: monitoring/etcd-client-cert
        property: server.key
  - match:
      secretKey: sealed-secrets.sealed-secrets-bootstrap-key.tls.crt
      remoteRef:
        remoteKey: sealed-secrets/sealed-secrets-bootstrap-key
        property: tls.crt
  - match:
      secretKey: sealed-secrets.sealed-secrets-bootstrap-key.tls.key
      remoteRef:
        remoteKey: sealed-secrets/sealed-secrets-bootstrap-key
        property: tls.key
  - match:
      secretKey: sealed-secrets.sealed-secrets-bootstrap-key-2026.tls.crt
      remoteRef:
        remoteKey: sealed-secrets/sealed-secrets-bootstrap-key-2026
        property: tls.crt
  - match:
      secretKey: sealed-secrets.sealed-secrets-bootstrap-key-2026.tls.key
      remoteRef:
        remoteKey: sealed-secrets/sealed-secrets-bootstrap-key-2026
        property: tls.key
