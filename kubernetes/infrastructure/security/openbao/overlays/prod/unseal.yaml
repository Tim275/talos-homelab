    credentialsSecretRef:
      name: openbao-unseal-azure
    azureKeyVault:
      vaultName: kv-homelab-unseal
      keyName: openbao-unseal
  plugins:
    - type: kms
      name: azurekeyvault
      image: ghcr.io/openbao/openbao-plugin-kms-azure:v0.1.1@sha256:505c99420e6c55722f7892e0ab367ab36712ddd54fe554c80b225e405e3f3a78
  configuration:
    plugin:
      autoDownload: true
  recoveryKeys:
    initial:
      shares: 1
      threshold: 1
      recipients:
