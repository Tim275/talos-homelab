apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-restore-targets
  namespace: openbao
spec:
  podSelector:
    matchExpressions:
      - key: openbao.org/cluster
        operator: Exists
      - key: openbao.org/cluster
        operator: NotIn
        values:
          - openbao
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: openbao.org/cluster
                operator: Exists
              - key: openbao.org/cluster
                operator: NotIn
                values:
                  - openbao
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao-operator-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao-operator
      ports:
        - port: 8200
          protocol: TCP
        - port: 8201
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchExpressions:
              - key: openbao.org/cluster
                operator: Exists
              - key: openbao.org/cluster
                operator: NotIn
                values:
                  - openbao
      ports:
        - port: 8200
          protocol: TCP
        - port: 8201
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 192.168.0.59/32
      ports:
        - port: 7480
          protocol: TCP
