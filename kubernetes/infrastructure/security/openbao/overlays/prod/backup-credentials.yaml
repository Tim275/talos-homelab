apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-backup-s3
  namespace: openbao
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openbao-backup-s3
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: openbao/openbao-backup-s3
        property: accessKeyId
    - secretKey: secretAccessKey
      remoteRef:
        key: openbao/openbao-backup-s3
        property: secretAccessKey
