apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openbao
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

resources:
  - ../../base
  - backup-credentials.yaml
  - restore-test-network.yaml
components:
  - ../../components/cilium
patches:
  - path: sizing.yaml
  - path: settings.yaml
  - path: backup.yaml
  - path: restore-test-namespace.yaml
  - path: config-admin-role.yaml
    target:
      kind: OpenBaoCluster
      name: openbao
