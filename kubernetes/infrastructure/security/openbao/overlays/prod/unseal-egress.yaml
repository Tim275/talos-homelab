apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-unseal-egress
  namespace: openbao
spec:
  endpointSelector:
    matchExpressions:
      - key: openbao.org/cluster
        operator: Exists
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: kv-homelab-unseal.vault.azure.net
        - matchName: login.microsoftonline.com
        - matchName: ghcr.io
        - matchName: pkg-containers.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
