apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-seal-key
  namespace: openbao
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-central-seal
    kind: ClusterSecretStore
  target:
    name: openbao-seal-key
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          velero.io/exclude-from-backup: "true"
  data:
  - secretKey: key
    remoteRef:
      key: prod/platform/openbao/openbao-seal-key
      property: key
