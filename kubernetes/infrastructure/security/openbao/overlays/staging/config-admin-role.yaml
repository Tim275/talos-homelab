- op: add
  path: /spec/selfInit/requests/-
  value:
    name: role-config-admin
    operation: update
    path: auth/jwt-operator/role/config-admin
    data:
      role_type: jwt
      user_claim: sub
      bound_subject: system:serviceaccount:openbao:openbao-config
      bound_audiences: [https://kubernetes.default.svc.cluster.local]
      token_policies: [config-admin]
      token_no_default_policy: true
      token_ttl: 10m
