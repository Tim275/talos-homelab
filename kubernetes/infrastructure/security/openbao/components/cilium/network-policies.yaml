apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-kube-apiserver
  namespace: openbao
spec:
  endpointSelector:
    matchLabels:
      openbao.org/cluster: openbao
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
