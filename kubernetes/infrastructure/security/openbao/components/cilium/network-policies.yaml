apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-kube-apiserver
  namespace: openbao
spec:
  endpointSelector:
    matchExpressions:
      - key: openbao.org/cluster
        operator: Exists
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
