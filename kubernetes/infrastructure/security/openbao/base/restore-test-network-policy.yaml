apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restore-test-boundary
  namespace: openbao
spec:
  podSelector:
    matchExpressions:
      - key: openbao.org/cluster
        operator: NotIn
        values: [openbao]
      - key: openbao.org/cluster
        operator: Exists
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: openbao.org/cluster
                operator: NotIn
                values: [openbao]
              - key: openbao.org/cluster
                operator: Exists
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao-operator-system
