apiVersion: openbao.org/v1alpha1
kind: OpenBaoCluster
metadata:
  name: openbao
  namespace: openbao
spec:
  version: "2.7.2"
  profile: Development
  controllerJWTMode: Target
  deletionPolicy: Retain
  unseal:
    type: static
    credentialsSecretRef:
      name: openbao-seal-key
    static:
      currentKeyID: homelab-1
  tls:
    enabled: true
    rotationPeriod: 720h
  storage:
    storageClassName: rook-ceph-block-enterprise
  network:
    trustedIngressPeers:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: external-secrets
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: vault-config-operator
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: envoy-gateway
  observability:
    metrics:
      enabled: true
      scrapeProfile: AllNodes
      metricsOnlyListener:
        unauthenticatedMetricsAccess: true
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
  audit:
    - type: file
      path: stdout
      description: Audit-Log nach stdout, Loki sammelt es
      fileOptions:
        filePath: stdout
  configuration:
    ui: true
    logLevel: info
  gateway:
    enabled: true
    gatewayRef:
      name: envoy-gateway
      namespace: gateway
    listenerName: https
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/pod-selector: "app.kubernetes.io/name=openbao"
      gethomepage.dev/name: OpenBao
      gethomepage.dev/description: Secrets Management (VPN-only via NetBird)
      gethomepage.dev/group: Platform
      gethomepage.dev/icon: openbao.png
  selfInit:
    enabled: true
    oidc:
      enabled: true
    requests:
      - name: mount-kv
        operation: update
        path: sys/mounts/kv
        secretEngine:
          type: kv
          options:
            version: "2"
      - name: policy-config-admin
        operation: update
        path: sys/policies/acl/config-admin
        policy:
          policy: |
            path "sys/policies/acl/*" {
              capabilities = ["create", "read", "update", "delete", "list"]
            }
            path "auth/jwt-operator/role/*" {
              capabilities = ["create", "read", "update", "delete", "list"]
            }
