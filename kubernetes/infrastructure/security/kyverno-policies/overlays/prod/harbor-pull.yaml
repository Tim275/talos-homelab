apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  namespace: kyverno
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: harbor-pull
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{{ dict "auths" (dict "harbor.timourhomelab.org" (dict "username" .username "password" .password)) | toJson }}'
  dataFrom:
    - extract:
        key: harbor/robot-drova-pull
