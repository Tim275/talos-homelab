apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineConfig
metadata:
  name: oidc
  namespace: openbao
spec:
  OIDCDiscoveryURL: https://iam.staging.timourhomelab.org/realms/plattform
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineRole
metadata:
  name: oidc-admin
  namespace: openbao
spec:
  allowedRedirectURIs:
    - https://openbao.staging.timourhomelab.org/v1/auth/oidc/callback
    - https://openbao.staging.timourhomelab.org/ui/vault/auth/oidc/oidc/callback
    - http://localhost:8250/oidc/callback
