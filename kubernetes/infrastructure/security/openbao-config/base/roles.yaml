apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineRole
metadata:
  name: eso
  namespace: openbao
spec:
  authentication:
    path: jwt-operator
    role: config-admin
    serviceAccount:
      name: openbao-config
  connection:
    address: https://openbao-active.openbao.svc.cluster.local:8200
    tLSConfig:
      tlsSecret:
        name: openbao-tls-ca
  path: jwt-operator
  name: eso
  roleType: jwt
  userClaim: sub
  boundSubject: system:serviceaccount:external-secrets:external-secrets
  boundAudiences:
    - openbao
  tokenPolicies:
    - eso
  tokenNoDefaultPolicy: true
  tokenTTL: 1h
---
