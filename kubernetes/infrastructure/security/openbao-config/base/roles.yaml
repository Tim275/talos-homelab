apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineRole
metadata:
  name: admin
  namespace: openbao
spec:
  authentication:
    path: jwt-operator
    role: config-admin
    serviceAccount:
      name: openbao-config
  connection:
    address: https://openbao-active.openbao.svc.cluster.local:8200
    tLSConfig:
      tlsSecret:
        name: openbao-tls-ca
  path: jwt-operator
  name: admin
  roleType: jwt
  userClaim: sub
  boundSubject: system:serviceaccount:openbao:openbao-admin
  boundAudiences:
    - openbao
  tokenPolicies:
    - admin
  tokenNoDefaultPolicy: true
  tokenTTL: 1h
---
