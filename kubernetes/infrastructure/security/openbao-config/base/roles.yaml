apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineRole
metadata:
  name: eso-customer-namespace
  namespace: openbao
spec:
  authentication:
    path: jwt-operator
    role: config-admin
    serviceAccount:
      name: openbao-config
  connection:
    address: https://openbao-active.openbao.svc.cluster.local:8200
    tLSConfig:
      tlsSecret:
        name: openbao-tls-ca
  path: jwt-operator
  name: eso-customer-namespace
  roleType: jwt
  userClaim: sub
  boundAudiences:
    - openbao
  boundClaimsType: glob
  boundClaims:
    sub: system:serviceaccount:*:eso
  claimMappings:
    /kubernetes.io/namespace: namespace
  tokenPolicies:
    - eso-customer-namespace
  tokenNoDefaultPolicy: true
  tokenTTL: 1h
