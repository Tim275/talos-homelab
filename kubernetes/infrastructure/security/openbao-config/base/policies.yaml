apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: eso
  namespace: openbao
spec:
  authentication:
    path: jwt-operator
    role: config-admin
    serviceAccount:
      name: openbao-config
  connection:
    address: https://openbao-active.openbao.svc.cluster.local:8200
    tLSConfig:
      tlsSecret:
        name: openbao-tls-ca
  type: acl
  policy: |
    path "kv/data/platform/*" {
      capabilities = ["create", "read", "update"]
    }
    path "kv/data/platform/keycloak/customers/*" {
      capabilities = ["create", "read", "update", "delete"]
    }
    path "kv/metadata/platform/*" {
      capabilities = ["create", "read", "list", "update", "delete"]
    }
    path "auth/token/lookup-self" {
      capabilities = ["read"]
    }
    path "auth/token/renew-self" {
      capabilities = ["update"]
    }
    path "auth/token/revoke-self" {
      capabilities = ["update"]
    }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: admin
  namespace: openbao
spec:
  authentication:
    path: jwt-operator
    role: config-admin
    serviceAccount:
      name: openbao-config
  connection:
    address: https://openbao-active.openbao.svc.cluster.local:8200
    tLSConfig:
      tlsSecret:
        name: openbao-tls-ca
  type: acl
  policy: |
    path "*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: openbao-operator-backup
  namespace: openbao
spec:
  authentication:
    path: jwt-operator
    role: config-admin
    serviceAccount:
      name: openbao-config
  connection:
    address: https://openbao-active.openbao.svc.cluster.local:8200
    tLSConfig:
      tlsSecret:
        name: openbao-tls-ca
  type: acl
  policy: |
    path "sys/storage/raft/snapshot" { capabilities = ["read"] }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: config-admin
  namespace: openbao
spec:
  authentication:
    path: jwt-operator
    role: config-admin
    serviceAccount:
      name: openbao-config
  connection:
    address: https://openbao-active.openbao.svc.cluster.local:8200
    tLSConfig:
      tlsSecret:
        name: openbao-tls-ca
  type: acl
  policy: |
    path "sys/policies/acl/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    path "auth/jwt-operator/role/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    path "sys/auth" {
      capabilities = ["read", "list"]
    }
    path "sys/auth/oidc" {
      capabilities = ["create", "read", "update", "delete", "sudo"]
    }
    path "sys/auth/oidc/tune" {
      capabilities = ["read", "update", "sudo"]
    }
    path "auth/oidc/config" {
      capabilities = ["create", "read", "update"]
    }
    path "auth/oidc/role/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
---
