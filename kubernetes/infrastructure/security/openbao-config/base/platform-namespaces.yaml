apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: eso-platform-self
  namespace: openbao
spec:
  authentication:
    path: jwt-operator
    role: config-admin
    serviceAccount:
      name: openbao-config
  connection:
    address: https://openbao-active.openbao.svc.cluster.local:8200
    tLSConfig:
      tlsSecret:
        name: openbao-tls-ca
  type: acl
  policy: |
    path "auth/token/lookup-self" {
      capabilities = ["read"]
    }
    path "auth/token/renew-self" {
      capabilities = ["update"]
    }
    path "auth/token/revoke-self" {
      capabilities = ["update"]
    }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineRole
metadata:
  name: eso-platform-namespace
  namespace: openbao
spec:
  authentication:
    path: jwt-operator
    role: config-admin
    serviceAccount:
      name: openbao-config
  connection:
    address: https://openbao-active.openbao.svc.cluster.local:8200
    tLSConfig:
      tlsSecret:
        name: openbao-tls-ca
  path: jwt-operator
  name: eso-platform-namespace
  roleType: jwt
  userClaim: sub
  boundAudiences:
    - openbao
  boundClaimsType: string
  boundClaims:
    sub:
      - system:serviceaccount:arc-runners:eso
      - system:serviceaccount:argocd:eso
      - system:serviceaccount:cert-manager:eso
      - system:serviceaccount:cloudflared:eso
      - system:serviceaccount:crossplane-system:eso
      - system:serviceaccount:crossview:eso
      - system:serviceaccount:elastic-system:eso
      - system:serviceaccount:excalidraw:eso
      - system:serviceaccount:external-dns:eso
      - system:serviceaccount:external-secrets:eso
      - system:serviceaccount:gateway:eso
      - system:serviceaccount:grafana:eso
      - system:serviceaccount:harbor:eso
      - system:serviceaccount:istio-system:eso
      - system:serviceaccount:jaeger:eso
      - system:serviceaccount:keycloak:eso
      - system:serviceaccount:kube-system:eso
      - system:serviceaccount:lldap:eso
      - system:serviceaccount:monitoring:eso
      - system:serviceaccount:n8n:eso
      - system:serviceaccount:netbird:eso
      - system:serviceaccount:openbao:eso
      - system:serviceaccount:pgadmin:eso
      - system:serviceaccount:postgres:eso
      - system:serviceaccount:renovate-operator:eso
      - system:serviceaccount:rook-ceph:eso
      - system:serviceaccount:sealed-secrets:eso
      - system:serviceaccount:velero:eso
  tokenPolicies:
    - eso-platform-self
  tokenNoDefaultPolicy: true
  tokenTTL: 1h
---
