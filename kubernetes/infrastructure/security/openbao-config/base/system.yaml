apiVersion: redhatcop.redhat.io/v1alpha1
kind: KeyRotationConfig
metadata:
  name: encryption-key-rotation
spec:
  authentication:
    path: jwt-operator
    role: config-admin
    serviceAccount:
      name: openbao-config
  connection:
    address: https://openbao-active.openbao.svc.cluster.local:8200
    tLSConfig:
      tlsSecret:
        name: openbao-tls-ca
  enabled: true
  interval: 4320h
  maxOperations: 3865470566
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: QuotaConfig
metadata:
  name: quotas
spec:
  authentication:
    path: jwt-operator
    role: config-admin
    serviceAccount:
      name: openbao-config
  connection:
    address: https://openbao-active.openbao.svc.cluster.local:8200
    tLSConfig:
      tlsSecret:
        name: openbao-tls-ca
  enableRateLimitAuditLogging: true
  enableRateLimitResponseHeaders: true
  rateLimitExemptPaths:
    - sys/generate-recovery-token/attempt
    - sys/generate-recovery-token/update
    - sys/generate-root/attempt
    - sys/generate-root/update
    - sys/health
    - sys/seal-status
    - sys/unseal
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RateLimitQuota
metadata:
  name: global
spec:
  authentication:
    path: jwt-operator
    role: config-admin
    serviceAccount:
      name: openbao-config
  connection:
    address: https://openbao-active.openbao.svc.cluster.local:8200
    tLSConfig:
      tlsSecret:
        name: openbao-tls-ca
  rate: "200"
  interval: 1s
