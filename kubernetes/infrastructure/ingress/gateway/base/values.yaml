
config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    provider:
      type: Kubernetes
      kubernetes:
        rateLimitDeployment:
          replicas: 2
          container:
            resources:
              requests:
                cpu: 50m
                memory: 96Mi
              limits:
                memory: 384Mi
          pod:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: NotIn
                          values: [worker-1, worker-2]
    logging:
      level:
        default: info
    extensionApis:
      enableBackend: true
    rateLimit:
      backend:
        type: Redis
        redis:
          url: redis://redis-gateway.gateway.svc.cluster.local:6379

deployment:
  replicas: 2
  pod:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: [worker-1, worker-2]

topologyInjector:
  enabled: false

certgen:
  job:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=false
