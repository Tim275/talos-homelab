
config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    provider:
      type: Kubernetes
      kubernetes:
        rateLimitDeployment:
          replicas: 2
    logging:
      level:
        default: info
    extensionApis:
      enableBackend: true
    rateLimit:
      backend:
        type: Redis
        redis:
          url: redis://redis-gateway.gateway.svc.cluster.local:6379

deployment:
  replicas: 2

topologyInjector:
  enabled: false

certgen:
  job:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=false
