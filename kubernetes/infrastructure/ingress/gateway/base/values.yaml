
config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    provider:
      type: Kubernetes
      kubernetes:
        rateLimitDeployment:
          replicas: 2
          container:
            env:
              # ueberschrittene Schluessel lokal merken — genau der Verkehr,
              # den man abweisen will, kostet dann kein Redis mehr
              - name: LOCAL_CACHE_SIZE_IN_BYTES
                value: "26214400"
            resources:
              requests:
                cpu: 50m
                memory: 96Mi
              limits:
                memory: 384Mi
          # pod.priorityClassName wird fuer dieses Deployment ignoriert
          # (container.env aus demselben Block greift) — deshalb per patch
          patch:
            type: StrategicMerge
            value:
              spec:
                template:
                  spec:
                    priorityClassName: platform-critical
          pod:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: NotIn
                          values: [worker-1, worker-2]
    logging:
      level:
        default: info
    extensionApis:
      enableBackend: true
    rateLimit:
      backend:
        type: Redis
        redis:
          url: redis://redis-gateway.gateway.svc.cluster.local:6379

deployment:
  replicas: 2
  priorityClassName: platform-critical
  pod:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: [worker-1, worker-2]

topologyInjector:
  enabled: false

certgen:
  job:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=false
