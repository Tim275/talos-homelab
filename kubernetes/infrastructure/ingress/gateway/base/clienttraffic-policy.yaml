apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: ddos-protection
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
  # failClosed: false → intra-cluster pods (Grafana/ArgoCD → KC backchannel) reach
  clientIPDetection:
    customHeader:
      name: CF-Connecting-IP
      failClosed: false
  connection:
    connectionLimit:
      value: 10000
      closeDelay: 5s
  tcpKeepalive:
    idleTime: 60s
    interval: 10s
    probes: 6
  http2:
    maxConcurrentStreams: 100
  timeout:
    http:
      requestReceivedTimeout: 10s
      idleTimeout: 300s
