apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: ddos-protection
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        - 10.244.0.0/16   # nur Pods duerfen XFF setzen; LAN/VPN-Clients nicht
  connection:
    connectionLimit:
      value: 10000
      closeDelay: 5s
  tcpKeepalive:
    idleTime: 60s
    interval: 10s
    probes: 6
  http2:
    maxConcurrentStreams: 100
  timeout:
    http:
      requestReceivedTimeout: 10s
      idleTimeout: 300s
