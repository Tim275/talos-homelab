apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml  # MUST stay in source — chart has createNamespace:false; sonst pruned ArgoCD die ns + killt den gateway
  - envoy-gatewayclass.yaml
  - envoy-proxy-config.yaml  # EnvoyProxy CR — replicas=2 for HA
  - gateway.yaml
  - http-redirect-to-https.yaml
  - clienttraffic-policy.yaml
  - pdb.yaml  # PodDisruptionBudgets — Talos-upgrade-resilience
  - podmonitor.yaml
  - waf  # Coraza WAF, gateway-wide, DetectionOnly. drova-safe via SecResponseBodyAccess Off (rig-verified drova frontend 200 through Coraza, SQLi 942100 detected, WS 101). failOpen. Rollback: re-comment + merge -> ArgoCD prunes.
