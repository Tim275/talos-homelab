apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-gateway-proxy
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: envoy-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: envoy_cluster_upstream_rq_(xx|total)|envoy_http_downstream_rq_(xx|total)
          action: keep
