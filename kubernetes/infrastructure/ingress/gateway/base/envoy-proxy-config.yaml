apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gateway-ha
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        # no memory limit before: unbounded, and invisible to ContainerMemoryHigh /
        # ContainerMemoryLeakSuspected (both divide by the limit). 7d max 1118Mi.
        container:
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 1536Mi
        pod:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        gateway.envoyproxy.io/owning-gateway-name: envoy-gateway
                    topologyKey: kubernetes.io/hostname
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: envoy-gateway
      envoyService:
        externalTrafficPolicy: Cluster
