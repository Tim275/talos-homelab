apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway
  namespace: gateway
spec:
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.timourhomelab.org"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: timourhomelab-wildcard-tls
            namespace: gateway
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.timourhomelab.org"
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: gateway
spec:
  hostnames:
    - "*.timourhomelab.org"
