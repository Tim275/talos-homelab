apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gateway-ha
  namespace: gateway
spec:
  provider:
    kubernetes:
      envoyDeployment:
        replicas: 2
        # no memory limit before: unbounded, and invisible to ContainerMemoryHigh /
        # ContainerMemoryLeakSuspected (both divide by the limit). 7d max 1118Mi.
        container:
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 1536Mi
