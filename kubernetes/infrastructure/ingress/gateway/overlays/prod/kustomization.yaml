commonAnnotations:
  argocd.argoproj.io/sync-wave: "1"

resources:
  - ../../base
  - sealed-cloudflare-api-token.yaml

components:
  - ../../components/cert-manager
  - ../../components/kube-prometheus-stack

helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: 1.9.2
    releaseName: eg
    namespace: gateway
    includeCRDs: true
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.yaml

patches:
  - path: sizing.yaml
  - path: settings.yaml
