apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-secret
  namespace: renovate-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: renovate-secret
  data:
  - secretKey: DOCKERHUB_TOKEN
    remoteRef:
      key: renovate-operator/renovate-secret
      property: DOCKERHUB_TOKEN
  - secretKey: DOCKERHUB_USERNAME
    remoteRef:
      key: renovate-operator/renovate-secret
      property: DOCKERHUB_USERNAME
  - secretKey: GITHUB_COM_TOKEN
    remoteRef:
      key: renovate-operator/renovate-secret
      property: GITHUB_COM_TOKEN
  - secretKey: GITHUB_COM_USER
    remoteRef:
      key: renovate-operator/renovate-secret
      property: GITHUB_COM_USER
  - secretKey: RENOVATE_HOST_RULES
    remoteRef:
      key: renovate-operator/renovate-secret
      property: RENOVATE_HOST_RULES
  - secretKey: RENOVATE_TOKEN
    remoteRef:
      key: renovate-operator/renovate-secret
      property: RENOVATE_TOKEN
