apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-talos-homelab
  namespace: renovate-operator
spec:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      # kein CPU-Limit: Batch-Job, nutzt real ~573m und lief in 115k CFS-Throttles/7d.
      # Der 200m-Request deckelt ihn unter Node-Druck ohnehin ueber CPU-Shares.
      memory: 2Gi
---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-drova
  namespace: renovate-operator
spec:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      # kein CPU-Limit: Batch-Job, nutzt real ~573m und lief in 115k CFS-Throttles/7d.
      # Der 200m-Request deckelt ihn unter Node-Druck ohnehin ueber CPU-Shares.
      memory: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-orphan-pr-opener
  namespace: renovate-operator
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: opener
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 200m, memory: 128Mi}
