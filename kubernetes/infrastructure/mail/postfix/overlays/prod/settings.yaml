apiVersion: apps/v1
kind: Deployment
metadata:
  name: postfix-relay
  namespace: mail
spec:
  template:
    spec:
      containers:
        - name: postfix
          env:
            - name: ALLOWED_SENDER_DOMAINS
              value: "timourhomelab.org"
            - name: POSTFIX_myhostname
              value: "mail.timourhomelab.org"
