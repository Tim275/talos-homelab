apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: redis-operator
  labels:
spec:
  namespaceSelector:
    matchNames:
      - redis-operator-system
  selector:
    matchLabels:
      name: redis-operator
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
