apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-operator
  namespace: keda
spec:
  template:
    spec:
      containers:
        - name: keda-operator
          resources:
            requests:
              cpu: 10m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-operator-metrics-apiserver
  namespace: keda
spec:
  template:
    spec:
      containers:
        - name: keda-operator-metrics-apiserver
          resources:
            requests:
              cpu: 10m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-admission-webhooks
  namespace: keda
spec:
  template:
    spec:
      containers:
        - name: keda-admission-webhooks
          resources:
            requests:
              cpu: 10m
