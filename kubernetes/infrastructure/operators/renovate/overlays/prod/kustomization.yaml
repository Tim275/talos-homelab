apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

helmCharts:
  - name: renovate-operator
    repo: oci://ghcr.io/mogenius/helm-charts
    version: "4.7.1"
    releaseName: renovate-operator
    namespace: renovate-operator
    includeCRDs: true
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - ../../components/envoy-gateway/values.yaml
      - ../../components/kube-prometheus-stack/values.yaml
      - values.yaml
