---
apiVersion: v1
data:
  policy.yaml: |
    apiVersion: "descheduler/v1alpha2"
    kind: "DeschedulerPolicy"
    profiles:
    - name: rebalance
      pluginConfig:
      - args:
          evictLocalStoragePods: false
          evictSystemCriticalPods: false
          ignorePvcPods: true
          minReplicas: 2
          nodeFit: true
        name: DefaultEvictor
      - name: RemoveDuplicates
      - args:
          constraints:
          - DoNotSchedule
          - ScheduleAnyway
        name: RemovePodsViolatingTopologySpreadConstraint
      - args:
          numberOfNodes: 2
          targetThresholds:
            cpu: 80
            memory: 80
          thresholds:
            cpu: 60
            memory: 60
        name: LowNodeUtilization
      plugins:
        balance:
          enabled:
          - RemoveDuplicates
          - RemovePodsViolatingTopologySpreadConstraint
          - LowNodeUtilization
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: descheduler
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: descheduler
    app.kubernetes.io/version: 0.36.0
    helm.sh/chart: descheduler-0.36.0
  name: descheduler
  namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: descheduler
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: descheduler
    app.kubernetes.io/version: 0.36.0
    helm.sh/chart: descheduler-0.36.0
  name: descheduler
  namespace: kube-system
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            checksum/config: f9278f45d784f31d6f66900e4d8d47888a86ffa9099f30ea6673adefe12868ab
          labels:
            app.kubernetes.io/instance: descheduler
            app.kubernetes.io/name: descheduler
          name: descheduler
        spec:
          containers:
          - args:
            - --policy-config-file=/policy-dir/policy.yaml
            - --dry-run=true
            - --v=3
            command:
            - /bin/descheduler
            image: registry.k8s.io/descheduler/descheduler:v0.36.0
            imagePullPolicy: IfNotPresent
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /healthz
                port: 10258
                scheme: HTTPS
              initialDelaySeconds: 5
              periodSeconds: 20
              timeoutSeconds: 5
            name: descheduler
            ports:
            - containerPort: 10258
              protocol: TCP
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
            volumeMounts:
            - mountPath: /policy-dir
              name: policy-volume
          priorityClassName: system-cluster-critical
          restartPolicy: Never
          serviceAccountName: descheduler
          volumes:
          - configMap:
              name: descheduler
            name: policy-volume
  schedule: '*/30 * * * *'
