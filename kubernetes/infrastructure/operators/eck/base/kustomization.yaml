apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

helmCharts:
  - name: eck-operator
    repo: https://helm.elastic.co
    version: "3.5.0"
    releaseName: eck-operator
    namespace: elastic-system
    includeCRDs: true
    valuesInline:
      config:
        metrics:
          port: "9090"
        elasticsearchObservationInterval: 60s
      podMonitor:
        enabled: true
        namespace: monitoring
        interval: 30s
