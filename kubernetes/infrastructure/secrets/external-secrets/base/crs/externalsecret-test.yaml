apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-smoketest
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: eso-smoketest
  data:
    - secretKey: canary
      remoteRef:
        key: smoketest
        property: canary
