apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    vault:
      server: http://openbao-public.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-operator
          role: eso
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: external-secrets
              namespace: external-secrets
            audiences:
              - openbao
            expirationSeconds: 600
