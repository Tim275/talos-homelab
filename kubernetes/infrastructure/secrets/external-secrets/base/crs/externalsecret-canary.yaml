apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-canary
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openbao-canary
  data:
    - secretKey: value
      remoteRef:
        key: canary
        property: value
