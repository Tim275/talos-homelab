apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

helmCharts:
  - name: openbao-operator
    repo: oci://ghcr.io/kubebao/charts
    version: 0.6.1
    releaseName: openbao-operator
    namespace: openbao-operator-system
    includeCRDs: true
    kubeVersion: 1.36.0
    valuesFile: values.yaml
