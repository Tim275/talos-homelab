apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-bootstrap
  namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-bootstrap
  namespace: openbao
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-bootstrap
  namespace: openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-bootstrap
subjects:
  - kind: ServiceAccount
    name: openbao-bootstrap
    namespace: openbao
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-bootstrap
  namespace: openbao
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: openbao-bootstrap
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: alpine/k8s:1.36.4@sha256:358ddfc2d6ff3f00dd461dbd79aaa6d6738709f225b8da0945bb63bd4dbc304e
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: BAO
              value: http://openbao.openbao.svc.cluster.local:8200
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/bin/sh", "-e", "-c"]
          args:
            - |
              until curl -sf "$BAO/v1/sys/seal-status" >/dev/null; do sleep 3; done

              if [ "$(curl -sf "$BAO/v1/sys/seal-status" | jq -r .initialized)" = "true" ]; then
                echo "bereits initialisiert, nichts zu tun"; exit 0
              fi

              curl -sf -X PUT "$BAO/v1/sys/init" \
                -d '{"recovery_shares":5,"recovery_threshold":3}' > /tmp/init.json
              T=$(jq -r .root_token /tmp/init.json)
              [ -n "$T" ] && [ "$T" != "null" ]

              kubectl create secret generic openbao-init -n openbao \
                --from-file=init.json=/tmp/init.json \
                --dry-run=client -o yaml | kubectl apply -f -

              api() { curl -sf -H "X-Vault-Token: $T" -X "$1" "$BAO/v1/$2" -d "$3" >/dev/null; }

              api POST sys/mounts/kv '{"type":"kv","options":{"version":"2"}}'
              api POST sys/auth/kubernetes '{"type":"kubernetes"}'
              api POST auth/kubernetes/config \
                "{\"kubernetes_host\":\"https://$KUBERNETES_SERVICE_HOST:443\"}"

              api PUT sys/policies/acl/eso \
                '{"policy":"path \"kv/data/*\" { capabilities = [\"read\"] }\npath \"kv/metadata/*\" { capabilities = [\"read\",\"list\"] }"}'
              api POST auth/kubernetes/role/eso \
                '{"bound_service_account_names":"external-secrets","bound_service_account_namespaces":"external-secrets","token_policies":"eso","ttl":"1h"}'

              api PUT sys/policies/acl/snapshot \
                '{"policy":"path \"sys/storage/raft/snapshot\" { capabilities = [\"read\"] }"}'
              api POST auth/kubernetes/role/snapshot \
                '{"bound_service_account_names":"openbao-snapshot-agent,openbao","bound_service_account_namespaces":"openbao","token_policies":"snapshot","ttl":"1h"}'

              api POST kv/data/canary \
                '{"data":{"value":"chain-alive"}}'

              echo "init + kv + kubernetes-auth + policies eso/snapshot + canary fertig"
      volumes:
        - name: tmp
          emptyDir: {}
