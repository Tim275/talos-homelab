apiVersion: openbao.org/v1alpha1
kind: OpenBaoCluster
metadata:
  name: openbao
  namespace: openbao
spec:
  version: "2.7.2"
  profile: Development
  controllerJWTMode: Target
  deletionPolicy: Retain
  unseal:
    type: static
    credentialsSecretRef:
      name: openbao-seal-key
    static:
      currentKeyID: homelab-1
  tls:
    enabled: false
  storage:
    storageClassName: rook-ceph-block-enterprise
  network:
    trustedIngressPeers:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: external-secrets
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: envoy-gateway
  observability:
    metrics:
      enabled: true
      scrapeProfile: AllNodes
      metricsOnlyListener:
        unauthenticatedMetricsAccess: true
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
  audit:
    - type: file
      path: stdout
      description: Audit-Log nach stdout, Loki sammelt es
      fileOptions:
        filePath: stdout
  configuration:
    ui: true
    logLevel: info
  gateway:
    enabled: true
    gatewayRef:
      name: envoy-gateway
      namespace: gateway
    listenerName: https
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/pod-selector: "app.kubernetes.io/name=openbao"
      gethomepage.dev/name: OpenBao
      gethomepage.dev/description: Secrets Management (VPN-only via NetBird)
      gethomepage.dev/group: Platform
      gethomepage.dev/icon: openbao.png
  selfInit:
    enabled: true
    oidc:
      enabled: true
    requests:
      - name: mount-kv
        operation: update
        path: sys/mounts/kv
        secretEngine:
          type: kv
          options:
            version: "2"
      - name: policy-eso
        operation: update
        path: sys/policies/acl/eso
        policy:
          policy: |
            path "kv/data/*" {
              capabilities = ["create", "read", "update"]
            }
            path "kv/metadata/*" {
              capabilities = ["read", "list", "update", "delete"]
            }
      - name: policy-admin
        operation: update
        path: sys/policies/acl/admin
        policy:
          policy: |
            path "*" {
              capabilities = ["create", "read", "update", "delete", "list", "sudo"]
            }
      - name: role-eso
        operation: update
        path: auth/jwt-operator/role/eso
        data:
          role_type: jwt
          user_claim: sub
          bound_subject: system:serviceaccount:external-secrets:external-secrets
          bound_audiences: [openbao]
          token_policies: [eso]
          token_no_default_policy: true
          token_ttl: 1h
      - name: role-admin
        operation: update
        path: auth/jwt-operator/role/admin
        data:
          role_type: jwt
          user_claim: sub
          bound_subject: system:serviceaccount:openbao:openbao-admin
          bound_audiences: [openbao]
          token_policies: [admin]
          token_no_default_policy: true
          token_ttl: 1h
