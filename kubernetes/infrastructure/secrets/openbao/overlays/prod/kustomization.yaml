apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openbao
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

resources:
  - ../../base

components:
  - ../../components/envoy-gateway
  - ../../components/rook-ceph

helmCharts:
  - name: openbao
    repo: https://openbao.github.io/openbao-helm
    version: 0.29.6
    releaseName: openbao
    namespace: openbao
    includeCRDs: true
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - ../../components/rook-ceph/values.yaml
      - values.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Pod
      metadata:
        name: openbao-server-test
    target:
      kind: Pod
      name: openbao-server-test

  - path: sizing.yaml
  - path: settings.yaml
