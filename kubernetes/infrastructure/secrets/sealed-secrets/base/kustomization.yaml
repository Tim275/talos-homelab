apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []

commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

namespace: sealed-secrets


helmCharts:
  - name: sealed-secrets
    repo: https://bitnami.github.io/sealed-secrets
    version: 2.19.1
    releaseName: sealed-secrets-controller
    namespace: sealed-secrets
    includeCRDs: true
    valuesFile: values.yaml
