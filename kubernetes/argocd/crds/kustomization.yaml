apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false,Delete=false
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.crds.yaml
  - https://raw.githubusercontent.com/external-secrets/external-secrets/v2.11.0/deploy/crds/bundle.yaml
helmCharts:
  - name: gateway-crds-helm
    repo: oci://docker.io/envoyproxy
    version: 1.9.2
    releaseName: eg
    valuesInline:
      crds:
        gatewayAPI:
          enabled: true
          channel: experimental
        envoyGateway:
          enabled: true
  - name: prometheus-operator-crds
    repo: https://prometheus-community.github.io/helm-charts
    version: 31.0.1
    releaseName: prometheus-operator-crds
