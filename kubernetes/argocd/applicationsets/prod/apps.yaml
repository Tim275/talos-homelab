apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  environment: prod
          - list:
              elements:
                - { app: excalidraw,  path: kubernetes/apps/excalidraw/overlays/prod,  namespace: excalidraw }
                - { app: forgejo,     path: kubernetes/apps/forgejo/overlays/prod,     namespace: forgejo }
                - { app: homepage,    path: kubernetes/apps/homepage/overlays/prod,    namespace: homepage }
                - { app: n8n,         path: kubernetes/apps/n8n/overlays/prod,         namespace: n8n }
                - { app: n8n-redis,   path: kubernetes/apps/n8n/redis/overlays/prod,   namespace: n8n }
                - { app: pgadmin,     path: kubernetes/apps/pgadmin/overlays/prod,     namespace: pgadmin }
                - { app: uptime-kuma, path: kubernetes/apps/uptime-kuma/overlays/prod, namespace: uptime-kuma }
  template:
    metadata:
      labels:
        environment: prod
