apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  environment: staging
          - list:
              elements:
                - { app: customers-n8n, path: kubernetes/customers/n8n/overlays/staging, namespace: crossplane-system }
                - { app: customers,     path: kubernetes/customers/orders/staging,       namespace: crossplane-system }
                - { app: excalidraw,  path: kubernetes/apps/excalidraw/overlays/staging,  namespace: excalidraw }
                - { app: forgejo,     path: kubernetes/apps/forgejo/overlays/staging,     namespace: forgejo }
                - { app: homepage,    path: kubernetes/apps/homepage/overlays/staging,    namespace: homepage }
                - { app: n8n,         path: kubernetes/apps/n8n/overlays/staging,         namespace: n8n }
                - { app: n8n-redis,   path: kubernetes/apps/n8n/redis/overlays/staging,   namespace: n8n }
                - { app: pgadmin,     path: kubernetes/apps/pgadmin/overlays/staging,     namespace: pgadmin }
                - { app: uptime-kuma, path: kubernetes/apps/uptime-kuma/overlays/staging, namespace: uptime-kuma }
  template:
    metadata:
      labels:
        environment: staging
