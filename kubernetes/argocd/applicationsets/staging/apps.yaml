apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  environment: staging
          - list:
              elements:
                - { app: customers,   path: staging,                                 namespace: crossplane-system, repoURL: git@github.com:Tim275/talos-homelab-customers.git }
                - { app: excalidraw,  path: kubernetes/apps/excalidraw/overlays/staging,  namespace: excalidraw, repoURL: https://github.com/Tim275/talos-homelab }
                - { app: forgejo,     path: kubernetes/apps/forgejo/overlays/staging,     namespace: forgejo, repoURL: https://github.com/Tim275/talos-homelab }
                - { app: homepage,    path: kubernetes/apps/homepage/overlays/staging,    namespace: homepage, repoURL: https://github.com/Tim275/talos-homelab }
                - { app: n8n,         path: kubernetes/apps/n8n/overlays/staging,         namespace: n8n, repoURL: https://github.com/Tim275/talos-homelab }
                - { app: n8n-redis,   path: kubernetes/apps/n8n/redis/overlays/staging,   namespace: n8n, repoURL: https://github.com/Tim275/talos-homelab }
                - { app: pgadmin,     path: kubernetes/apps/pgadmin/overlays/staging,     namespace: pgadmin, repoURL: https://github.com/Tim275/talos-homelab }
                - { app: uptime-kuma, path: kubernetes/apps/uptime-kuma/overlays/staging, namespace: uptime-kuma, repoURL: https://github.com/Tim275/talos-homelab }
  template:
    metadata:
      labels:
        environment: staging
