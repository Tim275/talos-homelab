apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  environment: staging
          - list:
              elements:
                - { app: drova-console,  path: kubernetes/tenants/drova/console/overlays/staging,  namespace: drova, appProject: drova, repoURL: https://github.com/Tim275/talos-homelab }
                - { app: drova-kafka,    path: kubernetes/tenants/drova/kafka/overlays/staging,    namespace: drova, appProject: drova, repoURL: https://github.com/Tim275/talos-homelab }
                - { app: drova,          path: kubernetes/tenants/drova/overlays/staging,          namespace: drova, appProject: drova, repoURL: https://github.com/Tim275/talos-homelab }
                - { app: drova-redis,    path: kubernetes/tenants/drova/redis/overlays/staging,    namespace: drova, appProject: drova, repoURL: https://github.com/Tim275/talos-homelab }
  template:
    metadata:
      labels:
        environment: staging
