apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  environment: staging
          - list:
              elements:
                - { app: openbao-config,          path: kubernetes/infrastructure/security/openbao-config/overlays/staging,          namespace: openbao }
                - { app: openbao-operator,        path: kubernetes/infrastructure/security/openbao-operator/rendered/staging,        namespace: openbao-operator-system }
                - { app: openbao,                 path: kubernetes/infrastructure/security/openbao/overlays/staging,                 namespace: openbao }
                - { app: vault-config-operator,   path: kubernetes/infrastructure/security/vault-config-operator/rendered/staging,   namespace: vault-config-operator }
                - { app: descheduler,             path: kubernetes/infrastructure/cluster/descheduler/rendered/staging,              namespace: kube-system }
                - { app: metrics-server,          path: kubernetes/infrastructure/cluster/metrics-server/overlays/staging,           namespace: kube-system }
                - { app: reloader,                path: kubernetes/infrastructure/cluster/reloader/rendered/staging,                 namespace: reloader }
                - { app: sail-operator,           path: kubernetes/infrastructure/network/sail-operator/rendered/staging,            namespace: sail-operator }
                - { app: external-secrets,        path: kubernetes/infrastructure/security/external-secrets/overlays/staging,        namespace: external-secrets }
                - { app: kyverno,                 path: kubernetes/infrastructure/security/kyverno/overlays/staging,                 namespace: kyverno }
                - { app: cert-manager,            path: kubernetes/infrastructure/security/cert-manager/rendered/staging,            namespace: cert-manager }
                - { app: alerting,                path: kubernetes/infrastructure/monitoring/alerting/overlays/staging,              namespace: monitoring }
                - { app: istio-control-plane,     path: kubernetes/infrastructure/network/istio-control-plane/overlays/staging,      namespace: istio-system }
                - { app: rate-limiting,           path: kubernetes/infrastructure/network/rate-limiting/overlays/staging,            namespace: argocd }
                - { app: redis-gateway,           path: kubernetes/infrastructure/network/redis-gateway/overlays/staging,            namespace: gateway }
                - { app: kube-bench,              path: kubernetes/infrastructure/security/kube-bench/overlays/staging,              namespace: security }
                - { app: kyverno-policies,        path: kubernetes/infrastructure/security/kyverno-policies/overlays/staging,        namespace: kyverno }
                - { app: rbac,                    path: kubernetes/infrastructure/security/rbac/overlays/staging,                    namespace: argocd }
                - { app: sealed-secrets,          path: kubernetes/infrastructure/security/sealed-secrets/overlays/staging,          namespace: sealed-secrets }
                - { app: tetragon,                path: kubernetes/infrastructure/security/tetragon/overlays/staging,                namespace: kube-system }
                - { app: tetragon-namespaced,     path: kubernetes/infrastructure/security/tetragon-namespaced/overlays/staging,     namespace: drova }
                - { app: blackbox-exporter,       path: kubernetes/infrastructure/monitoring/blackbox-exporter/rendered/staging,     namespace: monitoring }
                - { app: netbird,                 path: kubernetes/infrastructure/monitoring/netbird/overlays/staging,               namespace: netbird }
                - { app: external-dns,            path: kubernetes/infrastructure/network/external-dns/rendered/staging,             namespace: external-dns }
                - { app: local-path,              path: kubernetes/infrastructure/storage/local-path/overlays/staging,               namespace: local-path-storage }
                - { app: kube-prometheus-stack,   path: kubernetes/infrastructure/monitoring/kube-prometheus-stack/overlays/staging, namespace: monitoring }
                - { app: trivy,                   path: kubernetes/infrastructure/security/trivy/overlays/staging,                   namespace: trivy-system }
                - { app: velero,                  path: kubernetes/infrastructure/storage/velero/overlays/staging,                   namespace: velero }
                - { app: csi-snapshot-controller, path: kubernetes/infrastructure/storage/csi-snapshot-controller/overlays/staging,  namespace: kube-system }
                - { app: velero-schedules,        path: kubernetes/infrastructure/storage/velero-schedules/overlays/staging,         namespace: velero }
  template:
    metadata:
      labels:
        environment: staging
