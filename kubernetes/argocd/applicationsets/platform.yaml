apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  environment: prod
          - list:
              elements:
                - { app: github-runner-controller, path: kubernetes/platform/automation/github-runner-controller/overlays/prod,   namespace: arc-systems }
                - { app: github-runner-scale-set,  path: kubernetes/platform/automation/github-runner-scale-set/overlays/prod,    namespace: arc-runners }
                - { app: renovate-jobs,            path: kubernetes/platform/automation/renovate-jobs/overlays/prod,              namespace: renovate-operator }
                - { app: renovate,                 path: kubernetes/platform/automation/renovate/rendered,                        namespace: renovate-operator }
                - { app: cloudnative-pg,           path: kubernetes/platform/data/cloudnative-pg/rendered,                        namespace: cnpg-system }
                - { app: redis,                    path: kubernetes/platform/data/redis/rendered,                                 namespace: redis-operator-system }
                - { app: strimzi,                  path: kubernetes/platform/data/strimzi/overlays/prod,                          namespace: kafka }
                - { app: argo-rollouts,            path: kubernetes/platform/delivery/argo-rollouts/rendered,                     namespace: argo-rollouts }
                - { app: keda,                     path: kubernetes/platform/delivery/keda/rendered,                              namespace: keda }
                - { app: keycloak-operator,        path: kubernetes/platform/identity/keycloak-operator/overlays/prod,            namespace: keycloak }
                - { app: keycloak-db,              path: kubernetes/platform/identity/keycloak/db/overlays/prod,                  namespace: keycloak }
                - { app: keycloak,                 path: kubernetes/platform/identity/keycloak/overlays/prod,                     namespace: keycloak }
                - { app: lldap,                    path: kubernetes/platform/identity/lldap/overlays/prod,                        namespace: lldap }
                - { app: alloy,                    path: kubernetes/platform/observability/alloy/overlays/prod,                   namespace: monitoring }
                - { app: eck,                      path: kubernetes/platform/observability/eck/rendered,                          namespace: elastic-system }
                - { app: elasticsearch,            path: kubernetes/platform/observability/elasticsearch/overlays/prod,           namespace: elastic-system }
                - { app: grafana-operator,         path: kubernetes/platform/observability/grafana-operator/rendered,             namespace: grafana }
                - { app: grafana,                  path: kubernetes/platform/observability/grafana/overlays/prod,                 namespace: grafana }
                - { app: jaeger,                   path: kubernetes/platform/observability/jaeger/overlays/prod,                  namespace: jaeger }
                - { app: kiali,                    path: kubernetes/platform/observability/kiali/overlays/prod,                   namespace: istio-system }
                - { app: kibana,                   path: kubernetes/platform/observability/kibana/overlays/prod,                  namespace: elastic-system }
                - { app: loki,                     path: kubernetes/platform/observability/loki/overlays/prod,                    namespace: monitoring }
                - { app: opentelemetry-collector,  path: kubernetes/platform/observability/opentelemetry-collector/overlays/prod, namespace: opentelemetry }
                - { app: opentelemetry-operator,   path: kubernetes/platform/observability/opentelemetry-operator/rendered,       namespace: opentelemetry }
                - { app: tempo,                    path: kubernetes/platform/observability/tempo/overlays/prod,                   namespace: monitoring }
                - { app: vector,                   path: kubernetes/platform/observability/vector/overlays/prod,                  namespace: monitoring }
  template:
    metadata:
      name: '{{.app}}'
      labels:
        app.kubernetes.io/name: '{{.app}}'
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/managed-by: argocd
    spec:
      project: platform
      source:
        repoURL: https://github.com/Tim275/talos-homelab
        targetRevision: main
        path: '{{.path}}'
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      ignoreDifferences:
        - group: monitoring.coreos.com
          kind: ServiceMonitor
          jsonPointers:
          - /metadata/annotations
          - /metadata/labels
      syncPolicy:
        automated: { prune: True, selfHeal: True }
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: -1
          backoff: { duration: 5s, factor: 2, maxDuration: 3m }
