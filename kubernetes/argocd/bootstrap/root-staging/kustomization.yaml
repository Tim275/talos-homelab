apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../root-prod

patches:
  - target:
      kind: Application
      name: clusters
    patch: |-
      - op: replace
        path: /spec/source/path
        value: kubernetes/argocd/clusters/staging
  - target:
      kind: Application
      name: argocd
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: argocd
        namespace: argocd
