apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      environment: staging

resources:
  - ../prod

patches:
  - target:
      kind: Application
      name: root
    patch: |-
      - op: replace
        path: /spec/source/path
        value: kubernetes/argocd/bootstrap/staging
  - target:
      kind: Application
      name: clusters
    patch: |-
      - op: replace
        path: /spec/source/path
        value: kubernetes/argocd/clusters/staging
  - target:
      kind: Application
      name: applicationsets
    patch: |-
      - op: replace
        path: /spec/source/path
        value: kubernetes/argocd/applicationsets/staging
  - target:
      kind: Application
      name: argocd
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: argocd
        namespace: argocd
