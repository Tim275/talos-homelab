apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-orphan-check
  namespace: argocd
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: check
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 256Mi
