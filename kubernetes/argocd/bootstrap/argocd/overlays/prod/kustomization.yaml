apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - ../../base
  - argocd-slack-webhook.yaml
  - oidc-secret.yaml

components:
  - ../../components/envoy-gateway

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.11.6
    releaseName: "argocd"
    namespace: argocd
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - ../../components/kube-prometheus-stack/values.yaml
      - values.yaml
      - ../../base/health-checks-argocd.yaml
      - ../../base/rbac-argocd.yaml
      - ../../base/notifications-argocd.yaml
      - ../../components/kube-prometheus-stack/notifications-argocd.yaml
      - notifications-argocd.yaml
      - placement.yaml

patches:
  - path: sizing.yaml
  - path: settings.yaml

images:
  - name: docker.io/alpine/k8s
    newTag: 1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
