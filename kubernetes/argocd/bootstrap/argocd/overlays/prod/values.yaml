configs:
  cm:
    url: https://argo.timourhomelab.org
    oidc.config: |
      name: Keycloak
      issuer: https://iam.timourhomelab.org/realms/plattform
      clientID: argocd
      clientSecret: $argocd-oidc-secret:clientSecret
      # der Keycloak-Client verlangt pkce.code.challenge.method S256
      enablePKCEAuthentication: true
      requestedScopes: ["openid", "profile", "email", "groups"]
      requestedIDTokenClaims:
        groups:
          essential: true
      logoutURL: https://iam.timourhomelab.org/realms/plattform/protocol/openid-connect/logout?id_token_hint={{token}}&post_logout_redirect_uri={{logoutRedirectURL}}
controller:
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 8Gi
server:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 192Mi
    limits:
      memory: 2Gi
redis:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
