apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: argocd-oidc-secret
  data:
  - secretKey: clientSecret
    remoteRef:
      key: keycloak/argocd-oidc-client-secret
      property: clientSecret
