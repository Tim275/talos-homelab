apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-talos-homelab-customers
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: repo-talos-homelab-customers
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: git@github.com:Tim275/talos-homelab-customers.git
        sshPrivateKey: '{{ .sshPrivateKey }}'
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: platform/argocd/customers-repo
        property: sshPrivateKey
