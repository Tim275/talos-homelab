apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: argocd
  source:
    repoURL: https://github.com/Tim275/talos-homelab
    targetRevision: main
    path: kubernetes/argocd/bootstrap/root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: -1
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
