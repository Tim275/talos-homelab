apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: drova
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/layer: tenants
spec:
  description: 'tenant drova: its namespace, its data services and its own repository'
  syncWindows:
    - kind: deny
      schedule: '0 2 * * *'
      duration: 3h
      timeZone: Europe/Berlin
      applications:
        - '*'
      manualSync: true
  sourceRepos:
    - 'https://github.com/Tim275/talos-homelab'
    - 'https://github.com/Tim275/drova-gitops'
  destinations:
    - namespace: 'dr-verify'
      server: https://kubernetes.default.svc
    - namespace: 'drova'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
