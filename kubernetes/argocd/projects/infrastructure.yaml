apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/layer: infrastructure
spec:
  description: 'what the cluster runs on: network, storage, security, cluster services'
  syncWindows:
    - kind: deny
      schedule: '0 2 * * *'
      duration: 3h
      timeZone: Europe/Berlin
      applications:
        - '*'
      manualSync: true
  sourceRepos:
    - 'https://github.com/Tim275/talos-homelab'
  destinations:
    - namespace: 'argocd'
      server: https://kubernetes.default.svc
    - namespace: 'cert-manager'
      server: https://kubernetes.default.svc
    - namespace: 'cilium-secrets'
      server: https://kubernetes.default.svc
    - namespace: 'cloudflared'
      server: https://kubernetes.default.svc
    - namespace: 'drova'
      server: https://kubernetes.default.svc
    - namespace: 'elastic-system'
      server: https://kubernetes.default.svc
    - namespace: 'external-dns'
      server: https://kubernetes.default.svc
    - namespace: 'external-secrets'
      server: https://kubernetes.default.svc
    - namespace: 'gateway'
      server: https://kubernetes.default.svc
    - namespace: 'grafana'
      server: https://kubernetes.default.svc
    - namespace: 'istio-system'
      server: https://kubernetes.default.svc
    - namespace: 'jaeger'
      server: https://kubernetes.default.svc
    - namespace: 'keycloak'
      server: https://kubernetes.default.svc
    - namespace: 'kube-system'
      server: https://kubernetes.default.svc
    - namespace: 'kubevirt'
      server: https://kubernetes.default.svc
    - namespace: 'kyverno'
      server: https://kubernetes.default.svc
    - namespace: 'monitoring'
      server: https://kubernetes.default.svc
    - namespace: 'netbird'
      server: https://kubernetes.default.svc
    - namespace: 'openbao'
      server: https://kubernetes.default.svc
    - namespace: 'openbao-operator-system'
      server: https://kubernetes.default.svc
    - namespace: 'reloader'
      server: https://kubernetes.default.svc
    - namespace: 'rook-ceph'
      server: https://kubernetes.default.svc
    - namespace: 'sail-operator'
      server: https://kubernetes.default.svc
    - namespace: 'sealed-secrets'
      server: https://kubernetes.default.svc
    - namespace: 'security'
      server: https://kubernetes.default.svc
    - namespace: 'trivy-system'
      server: https://kubernetes.default.svc
    - namespace: 'vault-config-operator'
      server: https://kubernetes.default.svc
    - namespace: 'velero'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'admissionregistration.k8s.io'
      kind: MutatingWebhookConfiguration
    - group: 'admissionregistration.k8s.io'
      kind: ValidatingAdmissionPolicy
    - group: 'admissionregistration.k8s.io'
      kind: ValidatingAdmissionPolicyBinding
    - group: 'admissionregistration.k8s.io'
      kind: ValidatingWebhookConfiguration
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
    - group: 'apiregistration.k8s.io'
      kind: APIService
    - group: 'aquasecurity.github.io'
      kind: ClusterComplianceReport
    - group: 'cert-manager.io'
      kind: ClusterIssuer
    - group: 'cilium.io'
      kind: CiliumClusterwideNetworkPolicy
    - group: 'cilium.io'
      kind: CiliumL2AnnouncementPolicy
    - group: 'cilium.io'
      kind: CiliumLoadBalancerIPPool
    - group: 'cilium.io'
      kind: TracingPolicy
    - group: 'external-secrets.io'
      kind: ClusterSecretStore
    - group: 'gateway.networking.k8s.io'
      kind: GatewayClass
    - group: 'generators.external-secrets.io'
      kind: ClusterGenerator
    - group: 'kyverno.io'
      kind: ClusterPolicy
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'scheduling.k8s.io'
      kind: PriorityClass
    - group: 'snapshot.storage.k8s.io'
      kind: VolumeSnapshotClass
    - group: 'storage.k8s.io'
      kind: StorageClass
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Pod
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: 'apps'
      kind: DaemonSet
    - group: 'apps'
      kind: Deployment
    - group: 'apps'
      kind: StatefulSet
    - group: 'batch'
      kind: CronJob
    - group: 'batch'
      kind: Job
    - group: 'ceph.rook.io'
      kind: CephCluster
    - group: 'ceph.rook.io'
      kind: CephObjectStore
    - group: 'ceph.rook.io'
      kind: CephObjectStoreUser
    - group: 'cert-manager.io'
      kind: Certificate
    - group: 'cert-manager.io'
      kind: Issuer
    - group: 'cilium.io'
      kind: CiliumNetworkPolicy
    - group: 'cilium.io'
      kind: TracingPolicyNamespaced
    - group: 'csi.ceph.io'
      kind: Driver
    - group: 'csi.ceph.io'
      kind: OperatorConfig
    - group: 'external-secrets.io'
      kind: ExternalSecret
    - group: 'external-secrets.io'
      kind: PushSecret
    - group: 'gateway.envoyproxy.io'
      kind: BackendTrafficPolicy
    - group: 'gateway.envoyproxy.io'
      kind: ClientTrafficPolicy
    - group: 'gateway.envoyproxy.io'
      kind: EnvoyExtensionPolicy
    - group: 'gateway.envoyproxy.io'
      kind: EnvoyProxy
    - group: 'gateway.envoyproxy.io'
      kind: SecurityPolicy
    - group: 'gateway.networking.k8s.io'
      kind: Gateway
    - group: 'gateway.networking.k8s.io'
      kind: HTTPRoute
    - group: 'grafana.integreatly.org'
      kind: GrafanaDashboard
    - group: 'kubevirt.io'
      kind: KubeVirt
    - group: 'monitoring.coreos.com'
      kind: Alertmanager
    - group: 'monitoring.coreos.com'
      kind: PodMonitor
    - group: 'monitoring.coreos.com'
      kind: Probe
    - group: 'monitoring.coreos.com'
      kind: Prometheus
    - group: 'monitoring.coreos.com'
      kind: PrometheusRule
    - group: 'monitoring.coreos.com'
      kind: ScrapeConfig
    - group: 'monitoring.coreos.com'
      kind: ServiceMonitor
    - group: 'networking.k8s.io'
      kind: NetworkPolicy
    - group: 'openbao.org'
      kind: OpenBaoCluster
    - group: 'policy'
      kind: PodDisruptionBudget
    - group: 'rbac.authorization.k8s.io'
      kind: Role
    - group: 'rbac.authorization.k8s.io'
      kind: RoleBinding
    - group: 'redis.redis.opstreelabs.in'
      kind: Redis
    - group: 'sailoperator.io'
      kind: Istio
    - group: 'sailoperator.io'
      kind: IstioCNI
    - group: 'sailoperator.io'
      kind: ZTunnel
    - group: 'telemetry.istio.io'
      kind: Telemetry
    - group: 'velero.io'
      kind: BackupStorageLocation
    - group: 'velero.io'
      kind: Schedule
  roles:
    - name: infrastructure-admin
      description: Full infrastructure management access
      policies:
      - p, proj:infrastructure:infrastructure-admin, applications, *, infrastructure/*, allow
      - p, proj:infrastructure:infrastructure-admin, applicationsets, *, infrastructure/*, allow
      - p, proj:infrastructure:infrastructure-admin, exec, *, infrastructure/*, allow
      - p, proj:infrastructure:infrastructure-admin, logs, *, infrastructure/*, allow
      groups:
      - platform-engineers
    - name: infrastructure-operator
      description: Infrastructure monitoring and troubleshooting
      policies:
      - p, proj:infrastructure:infrastructure-operator, applications, get, infrastructure/*, allow
      - p, proj:infrastructure:infrastructure-operator, applications, sync, infrastructure/*, allow
      - p, proj:infrastructure:infrastructure-operator, logs, get, infrastructure/*, allow
      groups:
      - sre-team
    - name: infrastructure-viewer
      description: Read-only infrastructure access
      policies:
      - p, proj:infrastructure:infrastructure-viewer, applications, get, infrastructure/*, allow
      groups:
      - developers
      - viewers
