apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: timour-homelab
    team: timour
spec:
  description: "Fail-secure default: only the projects app (AppProjects into argocd), nothing else"

  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc

  sourceRepos:
    - 'https://github.com/Tim275/talos-homelab'

  clusterResourceWhitelist: []

  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
