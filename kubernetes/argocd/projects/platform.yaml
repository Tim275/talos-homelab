apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/layer: platform
spec:
  description: 'what teams and apps consume: identity, observability, data, delivery, automation'
  syncWindows:
    - kind: deny
      schedule: '0 2 * * *'
      duration: 3h
      timeZone: Europe/Berlin
      applications:
        - '*'
      manualSync: true
  sourceRepos:
    - 'https://github.com/Tim275/talos-homelab'
  destinations:
    - namespace: 'arc-runners'
      server: https://kubernetes.default.svc
    - namespace: 'arc-systems'
      server: https://kubernetes.default.svc
    - namespace: 'argo-rollouts'
      server: https://kubernetes.default.svc
    - namespace: 'cnpg-system'
      server: https://kubernetes.default.svc
    - namespace: 'elastic-system'
      server: https://kubernetes.default.svc
    - namespace: 'grafana'
      server: https://kubernetes.default.svc
    - namespace: 'istio-system'
      server: https://kubernetes.default.svc
    - namespace: 'jaeger'
      server: https://kubernetes.default.svc
    - namespace: 'kafka'
      server: https://kubernetes.default.svc
    - namespace: 'keda'
      server: https://kubernetes.default.svc
    - namespace: 'keycloak'
      server: https://kubernetes.default.svc
    - namespace: 'kube-system'
      server: https://kubernetes.default.svc
    - namespace: 'lldap'
      server: https://kubernetes.default.svc
    - namespace: 'monitoring'
      server: https://kubernetes.default.svc
    - namespace: 'opentelemetry'
      server: https://kubernetes.default.svc
    - namespace: 'redis-operator-system'
      server: https://kubernetes.default.svc
    - namespace: 'renovate-operator'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'admissionregistration.k8s.io'
      kind: MutatingWebhookConfiguration
    - group: 'admissionregistration.k8s.io'
      kind: ValidatingWebhookConfiguration
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
    - group: 'apiregistration.k8s.io'
      kind: APIService
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: LimitRange
    - group: ''
      kind: PersistentVolumeClaim
    - group: ''
      kind: Pod
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: 'actions.github.com'
      kind: AutoscalingRunnerSet
    - group: 'apps'
      kind: DaemonSet
    - group: 'apps'
      kind: Deployment
    - group: 'apps'
      kind: StatefulSet
    - group: 'barmancloud.cnpg.io'
      kind: ObjectStore
    - group: 'batch'
      kind: CronJob
    - group: 'batch'
      kind: Job
    - group: 'ceph.rook.io'
      kind: CephObjectStoreUser
    - group: 'cert-manager.io'
      kind: Certificate
    - group: 'cert-manager.io'
      kind: Issuer
    - group: 'cilium.io'
      kind: CiliumNetworkPolicy
    - group: 'elasticsearch.k8s.elastic.co'
      kind: Elasticsearch
    - group: 'external-secrets.io'
      kind: ExternalSecret
    - group: 'external-secrets.io'
      kind: PushSecret
    - group: 'gateway.envoyproxy.io'
      kind: SecurityPolicy
    - group: 'gateway.networking.k8s.io'
      kind: HTTPRoute
    - group: 'gateway.networking.k8s.io'
      kind: ReferenceGrant
    - group: 'grafana.integreatly.org'
      kind: Grafana
    - group: 'grafana.integreatly.org'
      kind: GrafanaAlertRuleGroup
    - group: 'grafana.integreatly.org'
      kind: GrafanaDashboard
    - group: 'grafana.integreatly.org'
      kind: GrafanaDatasource
    - group: 'grafana.integreatly.org'
      kind: GrafanaFolder
    - group: 'k8s.keycloak.org'
      kind: Keycloak
    - group: 'kibana.k8s.elastic.co'
      kind: Kibana
    - group: 'monitoring.coreos.com'
      kind: PodMonitor
    - group: 'monitoring.coreos.com'
      kind: ServiceMonitor
    - group: 'networking.k8s.io'
      kind: NetworkPolicy
    - group: 'objectbucket.io'
      kind: ObjectBucketClaim
    - group: 'opentelemetry.io'
      kind: OpenTelemetryCollector
    - group: 'policy'
      kind: PodDisruptionBudget
    - group: 'postgresql.cnpg.io'
      kind: Cluster
    - group: 'postgresql.cnpg.io'
      kind: Pooler
    - group: 'postgresql.cnpg.io'
      kind: ScheduledBackup
    - group: 'rbac.authorization.k8s.io'
      kind: Role
    - group: 'rbac.authorization.k8s.io'
      kind: RoleBinding
    - group: 'renovate-operator.mogenius.com'
      kind: RenovateJob
  roles:
    - name: platform-admin
      description: Full access to platform services
      policies:
      - p, proj:platform:platform-admin, applications, *, platform/*, allow
      - p, proj:platform:platform-admin, exec, *, platform/*, allow
      groups:
      - platform-engineers
    - name: platform-operator
      description: Operational access to platform services
      policies:
      - p, proj:platform:platform-operator, applications, get, platform/*, allow
      - p, proj:platform:platform-operator, applications, sync, platform/*, allow
      groups:
      - sre-team
