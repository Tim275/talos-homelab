apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elasticsearch-exporter-credentials
  namespace: elastic-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: elasticsearch-exporter-credentials
    template:
      engineVersion: v2
      data:
        username: prometheus-exporter
        password: '{{ .password }}'
  data:
  - secretKey: password
    remoteRef:
      key: elastic-system/users
      property: prometheus-exporter
