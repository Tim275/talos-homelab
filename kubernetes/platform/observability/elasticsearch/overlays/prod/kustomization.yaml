apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - multi-filerealm.yaml
  - elasticsearch-exporter-credentials.yaml

components:
  - ../../components/rook-ceph
  - ../../components/kube-prometheus-stack

patches:
  - path: sizing.yaml
  - path: settings.yaml
  - target:
      group: elasticsearch.k8s.elastic.co
      version: v1
      kind: Elasticsearch
      name: production-cluster
      namespace: elastic-system
    patch: |
      - op: add
        path: /spec/nodeSets/0/count
        value: 1
      # 7d max 2032Mi against a 2Gi limit. Heap stays 1g — what was missing is
      # the off-heap room next to it (Lucene, direct buffers).
      - op: add
        path: /spec/nodeSets/0/podTemplate/spec/containers/0/resources
        value:
          requests:
            memory: 2Gi
            cpu: 500m
          limits:
            memory: 3Gi
            cpu: "2"
      - op: add
        path: /spec/nodeSets/0/podTemplate/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution/nodeSelectorTerms/0/matchExpressions/-
        value:
          key: kubernetes.io/hostname
          operator: NotIn
          values: [worker-1, worker-2]
      - op: add
        path: /spec/nodeSets/0/volumeClaimTemplates/0/spec/resources
        value:
          requests:
            storage: 100Gi
  - target:
      group: kibana.k8s.elastic.co
      version: v1
      kind: Kibana
      name: production-kibana
      namespace: elastic-system
    patch: |
      - op: add
        path: /spec/podTemplate/spec/containers/0/resources
        value:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 1
      - op: add
        path: /spec/podTemplate/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values: [worker-1, worker-2]

images:
  - name: alpine/k8s
    newTag: 1.36.6@sha256:e2d95501b5718673ba67693154fabe6c618dbe1211a32947d6d5cf16285e019b
  - name: curlimages/curl
    newTag: 8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
  - name: quay.io/prometheuscommunity/elasticsearch-exporter
    newTag: v1.10.0@sha256:a6a4d4403f670faf6a94b8c7f9adbca3ead91f26dd64e5ccf95fa69025dc6e58
