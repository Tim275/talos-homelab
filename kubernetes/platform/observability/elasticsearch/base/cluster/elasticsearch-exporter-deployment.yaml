
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-exporter
  namespace: elastic-system
  labels:
    app: elasticsearch-exporter
    component: metrics-exporter
  annotations:
    secret.reloader.stakater.com/reload: elasticsearch-exporter-credentials
spec:
  selector:
    matchLabels:
      app: elasticsearch-exporter
  template:
    metadata:
      labels:
        app: elasticsearch-exporter
        component: metrics-exporter
    spec:
      containers:
        - name: elasticsearch-exporter
          image: quay.io/prometheuscommunity/elasticsearch-exporter
          args:
            - '--es.uri=https://production-cluster-es-http:9200'
            - '--es.ssl-skip-verify'
            - '--web.listen-address=:9114'
            - '--collector.slm'
          env:
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-exporter-credentials
                  key: username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-exporter-credentials
                  key: password
          ports:
            - name: metrics
              containerPort: 9114
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9114
            initialDelaySeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9114
            initialDelaySeconds: 10
            timeoutSeconds: 10
