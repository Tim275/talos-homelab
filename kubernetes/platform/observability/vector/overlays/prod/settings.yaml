apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-agent
  namespace: elastic-system
spec:
  template:
    spec:
      containers:
        - name: vector
          env:
            - name: CLUSTER_NAME
              value: talos-homelab
            - name: ENVIRONMENT
              value: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-aggregator
  namespace: elastic-system
spec:
  template:
    spec:
      containers:
        - name: vector
          env:
            - name: CLUSTER_NAME
              value: talos-homelab
            - name: ENVIRONMENT
              value: production
