apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
helmCharts:
  - name: eck-operator
    repo: https://helm.elastic.co
    version: "3.2.0"
    releaseName: eck-operator
    namespace: elastic-system
    includeCRDs: true
    valuesFile: ../../base/values.yaml
