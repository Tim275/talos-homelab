distributor:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
ingester:
  replicas: 2
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2560Mi
compactor:
  replicas: 1
  config:
    compaction:
      block_retention: 720h  # 30 days (same as Loki)
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
querier:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi   # 7d max 106Mi
    limits:
      cpu: 1000m
      memory: 2Gi
queryFrontend:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
gateway:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 256Mi
