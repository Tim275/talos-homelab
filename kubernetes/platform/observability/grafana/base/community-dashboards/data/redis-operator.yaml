apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: redis-operator
  namespace: grafana
spec:
  uid: redis-operator
  instanceSelector:
    matchLabels:
      app: grafana
  allowCrossNamespaceImport: true
  folder: "Data"
  resyncPeriod: 5m
  datasources:
    - inputName: "DS_PROM"
      datasourceName: "prometheus"
  url: "https://raw.githubusercontent.com/oliver006/redis_exporter/v1.75.0/contrib/grafana_prometheus_redis_dashboard.json"
