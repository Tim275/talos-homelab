apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jaeger-elasticsearch-credentials
  namespace: jaeger
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: jaeger-elasticsearch-credentials
    template:
      engineVersion: v2
      data:
        username: jaeger
        password: '{{ .password }}'
  data:
  - secretKey: password
    remoteRef:
      key: elastic-system/users
      property: jaeger
