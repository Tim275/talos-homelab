lokiCanary:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 128Mi
loki:
  limits_config:
    retention_period: 30d
  compactor:
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
singleBinary:
  replicas: 3
  persistence:
    size: 10Gi
  resources:
    limits:
      cpu: 2000m
      memory: 3Gi
    requests:
      cpu: 300m
      memory: 768Mi
chunksCache:
  # chart default is a hardcoded 500m in the memcached template; krr measures 3m
  resources:
    requests:
      cpu: 50m
      memory: 1229Mi
resultsCache:
  resources:
    requests:
      cpu: 50m
      memory: 614Mi
gateway:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 256Mi
