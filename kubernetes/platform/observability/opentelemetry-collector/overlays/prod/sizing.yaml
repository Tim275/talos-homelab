apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: opentelemetry
spec:
  resources:
    requests:
      memory: 160Mi
      cpu: 100m        # 7d: steady 3m, p99 10m, max 37m; DaemonSet -> x7 Nodes
    limits:
      memory: 768Mi
      cpu: 1000m       # bleibt: 0 Throttling gemessen, Limit stoert hier nicht
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: opentelemetry
spec:
  replicas: 3
  resources:
    requests:
      memory: 512Mi
      cpu: 50m      # krr: 3m real
    limits:
      memory: 1Gi
      cpu: 1000m
