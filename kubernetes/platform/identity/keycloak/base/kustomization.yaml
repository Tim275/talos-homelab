apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak

resources:
  - namespace.yaml

  - keycloak-cr.yaml
  - pdb.yaml                              # PodDisruptionBudget (Operator macht keine auto)

  - keycloak-config-cli.yaml
  - homepage-referencegrant.yaml

  - realm-export-cronjob.yaml

  - httproute.yaml

configMapGenerator:
  - name: keycloak-realm-config
    files:
      - realm-kubernetes.yaml
      - realm-master.yaml
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: platform-identity
      app.kubernetes.io/managed-by: argocd
