---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: oidc-provider
    app.kubernetes.io/part-of: platform-identity
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=keycloak"
    gethomepage.dev/name: Keycloak
    gethomepage.dev/description: SSO / Identity Provider (VPN-only via NetBird)
    gethomepage.dev/group: Identity
    gethomepage.dev/icon: keycloak.png
spec:
  hostnames:
  - iam.timourhomelab.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway
    namespace: gateway
    sectionName: https  # TLS termination at Gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 60s
      backendRequest: 55s
    backendRefs:
    - group: ""
      kind: Service
      name: keycloak-service          # ← Operator-managed (was: keycloak from plain Deployment)
      port: 8080
      weight: 1
