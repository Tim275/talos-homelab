---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: oidc-provider
    app.kubernetes.io/part-of: platform-identity
spec:
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /realms/plattform
    - path:
        type: PathPrefix
        value: /resources/
    - path:
        type: PathPrefix
        value: /.well-known/
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-For
          value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
    timeouts:
      request: 60s
      backendRequest: 55s
    backendRefs:
    - group: ""
      kind: Service
      name: keycloak-service          # ← Operator-managed (was: keycloak from plain Deployment)
      port: 8080
      weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-customers
  namespace: keycloak
  annotations:
    external-dns.alpha.kubernetes.io/controller: tofu
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: oidc-provider
    app.kubernetes.io/part-of: platform-identity
spec:
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /realms/customers
    - path:
        type: PathPrefix
        value: /resources/
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-For
          value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
    timeouts:
      request: 60s
      backendRequest: 55s
    backendRefs:
    - group: ""
      kind: Service
      name: keycloak-service
      port: 8080
      weight: 1
