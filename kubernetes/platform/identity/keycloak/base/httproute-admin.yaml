---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-admin
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: admin-console
    app.kubernetes.io/part-of: platform-identity
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=keycloak"
    gethomepage.dev/name: Keycloak
    gethomepage.dev/description: SSO / Identity Provider (VPN-only via NetBird)
    gethomepage.dev/group: Identity
    gethomepage.dev/icon: keycloak.png
spec:
  rules:
  - matches:
    - path:
        type: Exact
        value: /
    - path:
        type: PathPrefix
        value: /admin/
    - path:
        type: PathPrefix
        value: /realms/master
    - path:
        type: PathPrefix
        value: /resources/
    timeouts:
      request: 60s
      backendRequest: 55s
    backendRefs:
    - group: ""
      kind: Service
      name: keycloak-service
      port: 8080
      weight: 1
