apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  hostname:
    hostname: https://iam.timourhomelab.org
    admin: https://iam-admin.timourhomelab.org
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  hostnames:
    - iam.timourhomelab.org
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-admin
  namespace: keycloak
  annotations:
    gethomepage.dev/href: https://iam-admin.timourhomelab.org/admin/
spec:
  hostnames:
    - iam-admin.timourhomelab.org
