apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - admin-sealed-secret.yaml  # KC admin login
  - db-credentials-sealed.yaml  # KC ↔ Postgres
  - lldap-admin-sealed-secret.yaml  # LDAP-Federation bindCredential
  - argocd-oidc-client-secret-sealed.yaml  # argocd OIDC client secret
  - grafana-client-sealed-secret.yaml  # grafana OIDC client secret (Phase D iter-2)
  - kubectl-client-sealed-secret.yaml  # kubernetes (kubectl OIDC) client secret
  - smtp-sealed-secret.yaml  # Resend SMTP creds (User-Onboarding emails)
  - hubble-client-sealed-secret.yaml  # hubble OIDC client secret (Envoy SecurityPolicy)
  - homepage-client-sealed-secret.yaml  # homepage OIDC client secret (einzige Quelle, per ReferenceGrant gelesen)
  - config-automation-client-sealed-secret.yaml  # config-cli service account
  - config-automation-master-sealed-secret.yaml  # config-cli service account, Realm master
  - realm-export-client-sealed-secret.yaml  # realm-export service account

components:
  - ../../components/cert-manager
  - ../../components/envoy-gateway
  - ../../components/rook-ceph

patches:
  - path: sizing.yaml
  - path: settings.yaml
