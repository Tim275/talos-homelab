apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: keycloak-homepage-client-secret-clientsecret
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: keycloak/keycloak-homepage-client-secret
        property: clientSecret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-homepage-client-secret
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-homepage-client-secret
  data:
  - secretKey: client-secret
    remoteRef:
      key: keycloak/keycloak-homepage-client-secret
      property: clientSecret
  - secretKey: clientSecret
    remoteRef:
      key: keycloak/keycloak-homepage-client-secret
      property: clientSecret
