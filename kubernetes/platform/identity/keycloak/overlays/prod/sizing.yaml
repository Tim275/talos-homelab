apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 3
  resources:
    requests:
      cpu: 150m      # krr: 2m real; limit bleibt 2 Kerne fuer Start/Login-Spitzen
      memory: 1250Mi # 7d max 524Mi
    limits:
      cpu: 2
      memory: 3Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config-cli
  namespace: keycloak
spec:
  template:
    spec:
      containers:
        - name: config-cli
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config-cli-master
  namespace: keycloak
spec:
  template:
    spec:
      containers:
        - name: config-cli
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-realm-export
  namespace: keycloak
spec:
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-realm-export
  namespace: keycloak
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: export
              resources:
                requests: {cpu: 50m, memory: 256Mi}
                limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: keycloak-quota
  namespace: keycloak
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "12"
    limits.memory: 24Gi
    persistentvolumeclaims: "15"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: keycloak-limits
  namespace: keycloak
spec:
  limits:
    - max:
        cpu: "4"
        memory: 4Gi
      min:
        cpu: 10m
        memory: 32Mi
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
