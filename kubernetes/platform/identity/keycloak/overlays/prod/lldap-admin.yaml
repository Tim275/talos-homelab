apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-lldap-admin
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-lldap-admin
  data:
  - secretKey: password
    remoteRef:
      key: lldap/lldap-secrets
      property: admin-password
  - secretKey: svc-bind-password
    remoteRef:
      key: lldap/lldap-secrets
      property: svc-keycloak-password
