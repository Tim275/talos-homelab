apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-smtp
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-smtp
  data:
  - secretKey: from
    remoteRef:
      key: keycloak/keycloak-smtp
      property: from
  - secretKey: password
    remoteRef:
      key: keycloak/keycloak-smtp
      property: password
  - secretKey: replyTo
    remoteRef:
      key: keycloak/keycloak-smtp
      property: replyTo
  - secretKey: user
    remoteRef:
      key: keycloak/keycloak-smtp
      property: user
