apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: keycloak-db-credentials-password
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: keycloak/keycloak-db-credentials
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-credentials
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-db-credentials
    template:
      engineVersion: v2
      data:
        username: keycloak
        password: '{{ .password }}'
  data:
  - secretKey: password
    remoteRef:
      key: keycloak/keycloak-db-credentials
      property: password
