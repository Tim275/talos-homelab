apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-credentials
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-db-credentials
    template:
      engineVersion: v2
      data:
        username: keycloak
        password: '{{ .password }}'
  data:
  - secretKey: password
    remoteRef:
      key: keycloak/keycloak-db-credentials
      property: password
