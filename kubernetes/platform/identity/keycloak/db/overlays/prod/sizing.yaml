apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  instances: 3
  # Guaranteed QoS — 1Gi = 4x shared_buffers 256MB (CNPG-Regel)
  resources:
    requests:
      memory: 1Gi     # production: 16Gi+
      cpu: 250m       # production: 0.35-0.7 vCPU je 100 req/s (Keycloak-Doku)
    limits:
      memory: 1Gi
      cpu: 250m
  storage:
    size: 20Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: keycloak-db-pooler
  namespace: keycloak
spec:
  instances: 2
