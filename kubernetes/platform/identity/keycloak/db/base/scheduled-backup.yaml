apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-db-daily-backup
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  # CNPG-Cron braucht 6 Felder (sec min hour day month weekday), sonst friert der Schedule ein
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: keycloak-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
