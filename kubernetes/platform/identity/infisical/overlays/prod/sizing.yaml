apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: infisical-redis
  namespace: infisical
spec:
  kubernetesConfig:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  storage:
    volumeClaimTemplate:
      spec:
        resources:
          requests:
            storage: 1Gi

  redisExporter:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
