apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Bootstrap: SealedSecrets (encrypted) Infisical (runtime)

resources:
  - namespace.yaml
  - infisical-secrets-sealed.yaml
  - redis-secret-sealed.yaml
  - redis.yaml
  - infisical-config.yaml
  - operator-config.yaml

namespace: infisical

commonLabels:
  app.kubernetes.io/name: infisical
  app.kubernetes.io/component: secrets-management
  app.kubernetes.io/part-of: platform-identity

commonAnnotations:
  argocd.argoproj.io/sync-wave: "17"

helmCharts:
  - name: infisical-standalone
    repo: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    version: "1.7.5"
    releaseName: infisical
    namespace: infisical
    valuesInline:
      postgresql:
        enabled: false

      redis:
        enabled: false

      ingress:
        enabled: false
        nginx:
          enabled: false

      infisical:
        enabled: true
        name: infisical
        fullnameOverride: infisical
        replicaCount: 1  # Minimal config

        autoDatabaseSchemaMigration: true

        kubeSecretRef: "infisical-secrets"

        image:
          repository: infisical/infisical
          tag: "v0.93.1-postgres"
          pullPolicy: IfNotPresent

        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"

        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        service:
          type: ClusterIP
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8080"

  - name: secrets-operator
    repo: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    version: "0.11.1"
    releaseName: infisical-secrets-operator
    namespace: infisical
    valuesInline:
      controllerManager:
        manager:
          image:
            repository: infisical/kubernetes-operator
            tag: v0.10.1

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

        replicas: 1

      kubernetesClusterDomain: cluster.local

      metricsService:
        ports:
          - name: https
            port: 8443
            protocol: TCP
            targetPort: https
