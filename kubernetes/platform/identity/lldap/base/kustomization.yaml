apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lldap

resources:
  - namespace.yaml
  - deployment.yaml
  - pdb.yaml
  - service.yaml
  - configmap.yaml
  - bootstrap-config.yaml
  - bootstrap-job.yaml
  - httproute.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - eso-serviceaccount.yaml

labels:
  - pairs:
      app.kubernetes.io/name: lldap
      app.kubernetes.io/component: identity-service
      app.kubernetes.io/part-of: platform-identity
    includeSelectors: true

