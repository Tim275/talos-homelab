apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lldap-ldaps
  namespace: lldap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: lldap-ldaps-tls
  dnsNames:
    - lldap-ldap.lldap.svc.cluster.local
    - lldap-ldap.lldap.svc
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
  issuerRef:
    name: homelab-internal-ca
    kind: ClusterIssuer
