apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lldap-data
  namespace: lldap
spec:
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
  namespace: lldap
spec:
  replicas: 1  # Single instance for resource savings
  template:
    spec:
      containers:
        - name: lldap
          resources:
            requests:
              cpu: 10m      # Ultra minimal für homelab
              memory: 32Mi  # LLDAP ist sehr lightweight
            limits:
              cpu: 100m     # Reduziert von 200m
              memory: 128Mi # Reduziert von 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lldap-bootstrap
  namespace: lldap
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: bootstrap
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
