apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lldap-data
  namespace: lldap
spec:
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
  namespace: lldap
spec:
  replicas: 1  # Single instance for resource savings
  template:
    spec:
      containers:
        - name: lldap
          resources:
            requests:
              cpu: 10m      # Ultra minimal für homelab
              memory: 32Mi  # LLDAP ist sehr lightweight
            limits:
              cpu: 100m     # Reduziert von 200m
              memory: 128Mi # Reduziert von 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lldap-bootstrap
  namespace: lldap
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: bootstrap
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lldap-quota
  namespace: lldap
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    persistentvolumeclaims: "5"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lldap-limits
  namespace: lldap
spec:
  limits:
    - max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 10m
        memory: 32Mi
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      type: Container
