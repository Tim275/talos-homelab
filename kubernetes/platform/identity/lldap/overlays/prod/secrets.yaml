---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-secrets
  namespace: lldap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: lldap-secrets
  data:
  - secretKey: admin-password
    remoteRef:
      key: lldap/lldap-secrets
      property: admin-password
  - secretKey: jwt-secret
    remoteRef:
      key: lldap/lldap-secrets
      property: jwt-secret
  - secretKey: key-seed
    remoteRef:
      key: lldap/lldap-secrets
      property: key-seed
  - secretKey: svc-keycloak-password
    remoteRef:
      key: lldap/lldap-secrets
      property: svc-keycloak-password
