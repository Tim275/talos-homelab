apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: lldap-secrets-admin-password
  namespace: lldap
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: platform/lldap/lldap-secrets
        property: admin-password
---
