apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-secrets
  namespace: lldap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: lldap-secrets
  data:
  - secretKey: admin-password
    remoteRef:
      key: platform/lldap/lldap-secrets
      property: admin-password
  - secretKey: jwt-secret
    remoteRef:
      key: platform/lldap/lldap-secrets
      property: jwt-secret
  - secretKey: key-seed
    remoteRef:
      key: platform/lldap/lldap-secrets
      property: key-seed
  - secretKey: svc-keycloak-password
    remoteRef:
      key: platform/lldap/lldap-secrets
      property: svc-keycloak-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-database
  namespace: lldap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: lldap-database
    template:
      engineVersion: v2
      data:
        url: 'postgres://lldap:{{ .password }}@postgres-rw.postgres.svc.cluster.local:5432/lldap'
  data:
  - secretKey: password
    remoteRef:
      key: platform/lldap/lldap-postgres-credentials
      property: password
