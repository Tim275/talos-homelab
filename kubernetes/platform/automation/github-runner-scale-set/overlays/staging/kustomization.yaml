apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - secret-github-app.yaml
helmCharts:
  - name: gha-runner-scale-set
    repo: oci://ghcr.io/actions/actions-runner-controller-charts
    version: "0.15.1"
    releaseName: tofu-staging
    namespace: arc-runners
    valuesFile: ../../base/values.yaml
    valuesInline:
      runnerScaleSetName: tofu-staging

images:
  - name: ghcr.io/actions/actions-runner
    newTag: 2.338.2
