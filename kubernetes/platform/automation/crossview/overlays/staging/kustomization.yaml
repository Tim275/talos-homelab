apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - secrets.yaml

patches:
  - path: settings.yaml

helmCharts:
  - name: crossview
    repo: https://crossplane-contrib.github.io/crossview
    version: "4.8.0"
    releaseName: crossview
    namespace: crossview
    skipTests: true
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.yaml
