apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: crossview-session-secret
  namespace: crossview
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: platform/crossview/crossview-secrets
        property: session-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crossview-secrets
  namespace: crossview
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: crossview-secrets
  data:
  - secretKey: session-secret
    remoteRef:
      key: platform/crossview/crossview-secrets
      property: session-secret
  - secretKey: oidc-client-secret
    remoteRef:
      key: platform/keycloak/keycloak-crossview-client-secret
      property: clientSecret
