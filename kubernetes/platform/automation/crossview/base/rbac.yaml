# read-only, without secrets (the chart role reads everything)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossview
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, services, configmaps, events, nodes, persistentvolumeclaims, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups:
      - apiextensions.crossplane.io
      - pkg.crossplane.io
      - protection.crossplane.io
      - ops.crossplane.io
      - platform.tim275.github.io
      - customers.tim275.github.io
      - apps
      - gateway.networking.k8s.io
      - external-secrets.io
      - postgresql.cnpg.io
      - cilium.io
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossview
subjects:
  - kind: ServiceAccount
    name: crossview-sa
    namespace: crossview
