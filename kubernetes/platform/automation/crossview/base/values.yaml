global:
  namespace: crossview
  createNamespace: false

image:
  pullPolicy: IfNotPresent

database:
  enabled: false

config:
  database:
    enabled: false
  server:
    auth:
      mode: session
    session:
      cookie:
        secure: true
  sso:
    oidc:
      enabled: true
      clientId: crossview
      providerName: Keycloak
      scope: openid profile email

secrets:
  adminUsername: ""
  adminPassword: ""
  sessionSecret:
    secretKeyRef:
      name: crossview-secrets
      key: session-secret
  OIDCClientSecret:
    secretKeyRef:
      name: crossview-secrets
      key: oidc-client-secret

rbac:
  create: false

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi
