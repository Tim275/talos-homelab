apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crossview
  namespace: crossview
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=crossview"
    gethomepage.dev/name: Crossview
    gethomepage.dev/description: Crossplane (VPN-only)
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: crossplane.png
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
      sectionName: https
  rules:
    - backendRefs:
        - name: crossview-service
          port: 80
