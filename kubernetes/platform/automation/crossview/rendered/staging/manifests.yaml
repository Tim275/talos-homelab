apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/name: crossview
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
  name: crossview
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: crossview
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: crossview
    app.kubernetes.io/version: v4.8.0
    helm.sh/chart: crossview-4.8.0
  name: crossview-sa
  namespace: crossview
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossview
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - pods
  - services
  - configmaps
  - events
  - nodes
  - persistentvolumeclaims
  - resourcequotas
  - limitranges
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.crossplane.io
  - pkg.crossplane.io
  - protection.crossplane.io
  - ops.crossplane.io
  - platform.tim275.github.io
  - customers.tim275.github.io
  - apps
  - gateway.networking.k8s.io
  - external-secrets.io
  - postgresql.cnpg.io
  - cilium.io
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossview
subjects:
- kind: ServiceAccount
  name: crossview-sa
  namespace: crossview
---
apiVersion: v1
data:
  AUTH_CREATE_USERS: "true"
  AUTH_DEFAULT_ROLE: viewer
  AUTH_MODE: session
  AUTH_TRUSTED_HEADER: X-Auth-User
  CONTEXT_ALIASES: '{}'
  CORS_ORIGIN: https://crossview.staging.timourhomelab.org
  DB_ENABLED: "false"
  DB_HOST: crossview-postgres
  DB_NAME: crossview
  DB_PORT: "5432"
  DB_SSL_CERT: ""
  DB_SSL_KEY: ""
  DB_SSL_MODE: disable
  DB_SSL_ROOT_CERT: ""
  DB_USER: postgres
  LOG_LEVEL: info
  MANAGED_CACHE_TTL_SECONDS: "300"
  MANAGED_MAX_CONCURRENCY: "10"
  MANAGED_MAX_ITEMS_PER_TYPE: "5000"
  MANAGED_PAGE_SIZE: "1000"
  OIDC_AUTHORIZATION_URL: ""
  OIDC_CALLBACK_URL: https://crossview.staging.timourhomelab.org/api/auth/oidc/callback
  OIDC_CLIENT_ID: crossview
  OIDC_EMAIL_ATTRIBUTE: email
  OIDC_ENABLED: "true"
  OIDC_FIRSTNAME_ATTRIBUTE: given_name
  OIDC_ISSUER: https://iam.staging.timourhomelab.org/realms/plattform
  OIDC_LASTNAME_ATTRIBUTE: family_name
  OIDC_PROVIDER_ICON: ""
  OIDC_PROVIDER_NAME: Keycloak
  OIDC_SCOPE: openid profile email
  OIDC_TOKEN_URL: ""
  OIDC_USERINFO_URL: ""
  OIDC_USERNAME_ATTRIBUTE: preferred_username
  PORT: "3001"
  SAML_CALLBACK_URL: http://localhost:3001/api/auth/saml/callback
  SAML_EMAIL_ATTRIBUTE: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
  SAML_ENABLED: "false"
  SAML_ENTRY_POINT: http://localhost:8080/realms/crossview/protocol/saml
  SAML_FIRSTNAME_ATTRIBUTE: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname
  SAML_ISSUER: crossview
  SAML_LASTNAME_ATTRIBUTE: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname
  SAML_PROVIDER_ICON: ""
  SAML_PROVIDER_NAME: ""
  SAML_USERNAME_ATTRIBUTE: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: crossview
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: crossview
    app.kubernetes.io/version: v4.8.0
    helm.sh/chart: crossview-4.8.0
  name: crossview-config
  namespace: crossview
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: crossview
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: crossview
    app.kubernetes.io/version: v4.8.0
    helm.sh/chart: crossview-4.8.0
  name: crossview-service
  namespace: crossview
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 3001
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/instance: crossview
    app.kubernetes.io/name: crossview
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: crossview
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: crossview
    app.kubernetes.io/version: v4.8.0
    helm.sh/chart: crossview-4.8.0
  name: crossview
  namespace: crossview
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/instance: crossview
      app.kubernetes.io/name: crossview
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations: null
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/instance: crossview
        app.kubernetes.io/name: crossview
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - crossview
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - env:
        - name: DB_ENABLED
          valueFrom:
            configMapKeyRef:
              key: DB_ENABLED
              name: crossview-config
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              key: DB_HOST
              name: crossview-config
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              key: DB_PORT
              name: crossview-config
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              key: DB_NAME
              name: crossview-config
        - name: DB_USER
          valueFrom:
