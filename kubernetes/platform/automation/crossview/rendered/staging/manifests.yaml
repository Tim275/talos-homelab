        image: ghcr.io/crossplane-contrib/crossview:v4.8.0@sha256:98b790624b8dc04fc768ba19a9bff464f4dd812510482f59619008359d13abd9
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: crossview
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /app/logs
          name: logs
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: crossview-sa
      volumes:
      - emptyDir: {}
        name: logs
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crossview-secrets
  namespace: crossview
spec:
  data:
  - remoteRef:
      key: platform/crossview/crossview-secrets
      property: session-secret
    secretKey: session-secret
  - remoteRef:
      key: platform/keycloak/keycloak-crossview-client-secret
      property: clientSecret
    secretKey: oidc-client-secret
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: crossview-secrets
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: crossview-session-secret
  namespace: crossview
spec:
  data:
  - match:
      remoteRef:
        property: session-secret
        remoteKey: platform/crossview/crossview-secrets
      secretKey: password
  refreshInterval: 1h
  secretStoreRefs:
  - kind: ClusterSecretStore
    name: openbao
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  updatePolicy: IfNotExists
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Crossplane (VPN-only)
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Platform
    gethomepage.dev/href: https://crossview.staging.timourhomelab.org
    gethomepage.dev/icon: crossplane.png
    gethomepage.dev/name: Crossview
    gethomepage.dev/pod-selector: app.kubernetes.io/name=crossview
  name: crossview
  namespace: crossview
spec:
  hostnames:
  - crossview.staging.timourhomelab.org
  parentRefs:
  - name: envoy-gateway
    namespace: gateway
    sectionName: https
  rules:
  - backendRefs:
    - name: crossview-service
      port: 80
