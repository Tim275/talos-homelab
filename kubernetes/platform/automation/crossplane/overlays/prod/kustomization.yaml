apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - functions.yaml
  - providers.yaml
  - configuration.yaml
  - environment.yaml

helmCharts:
  - name: crossplane
    repo: https://charts.crossplane.io/stable
    version: "2.4.4"
    releaseName: crossplane
    namespace: crossplane-system
    valuesFile: ../../base/values.yaml
