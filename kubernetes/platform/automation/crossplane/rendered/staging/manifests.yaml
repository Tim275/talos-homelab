apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: crossplane
    app.kubernetes.io/component: cloud-infrastructure-controller
    app.kubernetes.io/instance: crossplane
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/part-of: crossplane
    app.kubernetes.io/version: 2.4.3
    helm.sh/chart: crossplane-2.4.3
    release: crossplane
  name: crossplane
  namespace: crossplane-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crossplane
      release: crossplane
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: crossplane
        app.kubernetes.io/component: cloud-infrastructure-controller
        app.kubernetes.io/instance: crossplane
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: crossplane
        app.kubernetes.io/part-of: crossplane
        app.kubernetes.io/version: 2.4.3
        helm.sh/chart: crossplane-2.4.3
        release: crossplane
    spec:
      containers:
      - args:
        - core
        - start
        env:
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              containerName: crossplane
              divisor: "1"
              resource: limits.cpu
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              containerName: crossplane
              divisor: "1"
              resource: limits.memory
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: LEADER_ELECTION
          value: "true"
        - name: TLS_SERVER_SECRET_NAME
          value: crossplane-tls-server
        - name: TLS_SERVER_CERTS_DIR
          value: /tls/server
        - name: TLS_CLIENT_SECRET_NAME
          value: crossplane-tls-client
        - name: TLS_CLIENT_CERTS_DIR
          value: /tls/client
        image: xpkg.crossplane.io/crossplane/crossplane:v2.4.3
        imagePullPolicy: IfNotPresent
        name: crossplane
        ports:
        - containerPort: 8081
          name: readyz
        - containerPort: 9443
          name: webhooks
        resources:
          limits:
            cpu: 500m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
