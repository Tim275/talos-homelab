apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:compose-keycloak
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: [openidclient.keycloak.m.crossplane.io]
    resources: [clients]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [group.keycloak.m.crossplane.io]
    resources: [groups]
    verbs: [get, list, watch, create, update, patch, delete]
