# no providers, compositions only use plain Kubernetes resources
provider:
  defaultActivations: []

podSecurityContextCrossplane:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
podSecurityContextRBACManager:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContextCrossplane:
  capabilities:
    drop: [ALL]
securityContextRBACManager:
  capabilities:
    drop: [ALL]
