apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: renovate-basic-auth
  namespace: renovate-operator
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: renovate-operator-renovate-operator
  basicAuth:
    users:
      name: renovate-basic-auth
