apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-talos-homelab
  namespace: renovate-operator
spec:
  discoveryFilters:
    - Tim275/talos-homelab
  provider:
    name: github
    endpoint: ""  # defaults to https://api.github.com
  image: ghcr.io/renovatebot/renovate
  parallelism: 1
  schedule: "0 * * * *"
  secretRef: renovate-secret
  extraEnv:
    - name: LOG_LEVEL
      value: info
    - name: RENOVATE_DOCKER_MAX_PAGES
      value: "10"  # Docker Hub returns 403 from page 11
    - name: RENOVATE_GIT_AUTHOR
      value: "Renovate Bot <tim275@users.noreply.github.com>"
    - name: RENOVATE_ALLOWED_COMMANDS
      value: '["^kustomize build kubernetes/[a-z0-9/-]+/overlays/(prod|staging) --enable-helm --load-restrictor=LoadRestrictionsNone -o kubernetes/[a-z0-9/-]+/rendered/(prod|staging)/manifests\\.yaml$"]'
