apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-talos-homelab
  namespace: renovate-operator
spec:
  discoveryFilters:
    - Tim275/talos-homelab
  provider:
    name: github
    endpoint: ""  # defaults to https://api.github.com
  image: ghcr.io/renovatebot/renovate:44.239.1@sha256:7dba1a3b916a2cf302ba0df458ddcc8fcbac3c92d0fe9882ac13ba0363de656b   # renovate: docker=ghcr.io/renovatebot/renovate
  parallelism: 1
  schedule: "0 */6 * * *"
  secretRef: renovate-secret
  extraEnv:
    - name: LOG_LEVEL
      value: info
    - name: RENOVATE_GIT_AUTHOR
      value: "Renovate Bot <tim275@users.noreply.github.com>"
    - name: RENOVATE_ALLOWED_COMMANDS
      value: '["^kustomize build kubernetes/[a-z0-9/-]+/overlays/prod --enable-helm --load-restrictor=LoadRestrictionsNone -o kubernetes/[a-z0-9/-]+/overlays/prod/\\.\\./\\.\\./rendered/manifests\\.yaml$"]'
