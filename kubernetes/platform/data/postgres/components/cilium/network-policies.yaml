---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-lock
  namespace: postgres
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: postgres
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: keycloak
        - matchLabels:
            io.kubernetes.pod.namespace: n8n
        - matchLabels:
            io.kubernetes.pod.namespace: pgadmin
        - matchLabels:
            io.kubernetes.pod.namespace: drova
        - matchLabels:
            io.kubernetes.pod.namespace: grafana
        - matchLabels:
            io.kubernetes.pod.namespace: harbor
        - matchLabels:
            io.kubernetes.pod.namespace: lldap
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.postgres-access: "true"
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
            - port: "9127"
              protocol: TCP
    - fromEntities:
        - host
