apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-backup-store
  namespace: postgres
spec:
  configuration:
    destinationPath: s3://cnpg-postgres-backup/
    endpointURL: http://ceph-rgw.rook-ceph.svc:80
    s3Credentials:
      accessKeyId:
        name: cnpg-postgres-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-postgres-backup
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
      jobs: 2
  retentionPolicy: "90d"
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 256Mi
