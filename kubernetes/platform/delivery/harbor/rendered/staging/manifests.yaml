apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-harbor
  namespace: harbor
spec:
  endpointSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - redis-harbor
      - redis-harbor-sentinel
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: harbor
    - matchLabels:
        io.kubernetes.pod.namespace: redis-operator-system
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP
      - port: "26379"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
        io.kubernetes.pod.namespace: monitoring
    toPorts:
    - ports:
      - port: "9121"
        protocol: TCP
  - fromEntities:
    - host
