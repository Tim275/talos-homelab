apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
  annotations:
    # DNS lives in the Cloudflare stack
    external-dns.alpha.kubernetes.io/controller: tofu
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=harbor,component=core"
    gethomepage.dev/name: Harbor
    gethomepage.dev/description: Container registry
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: harbor.png
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # layer uploads and downloads take longer than the default
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: harbor
          port: 80
