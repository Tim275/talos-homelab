expose:
  type: clusterIP
  tls:
    enabled: false
  clusterIP:
    name: harbor

persistence:
  enabled: true
  imageChartStorage:
    # S3 endpoint is not reachable by clients
    disableredirect: true
    type: s3
    s3:
      region: us-east-1
      bucket: harbor-registry
      v4auth: true

existingSecretAdminPassword: harbor-secrets
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-secrets

core:
  existingSecret: harbor-secrets
  extraEnvVars:
    - name: CONFIG_OVERWRITE_JSON
      valueFrom:
        secretKeyRef:
          name: harbor-oidc
          key: CONFIG_OVERWRITE_JSON
  existingXsrfSecret: harbor-secrets
  existingXsrfSecretKey: CSRF_KEY
  secretName: harbor-core-token

jobservice:
  existingSecret: harbor-secrets
  existingSecretKey: JOBSERVICE_SECRET
  jobLoggers:
    - database

registry:
  existingSecret: harbor-secrets
  existingSecretKey: REGISTRY_HTTP_SECRET
  credentials:
    username: harbor_registry_user
    existingSecret: harbor-secrets

trivy:
  enabled: false

database:
  type: external
  external:
    host: postgres-rw.postgres.svc.cluster.local
    port: "5432"
    username: harbor
    coreDatabase: harbor
    existingSecret: harbor-database
    sslmode: require
  maxIdleConns: 5
  maxOpenConns: 10

redis:
  type: internal

metrics:
  enabled: true
