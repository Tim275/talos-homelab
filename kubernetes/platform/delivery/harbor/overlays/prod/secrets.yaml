apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secrets
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: harbor-secrets
    template:
      engineVersion: v2
      data:
        HARBOR_ADMIN_PASSWORD: '{{ .HARBOR_ADMIN_PASSWORD }}'
        secretKey: '{{ .SECRET_KEY | trunc 16 }}'
        secret: '{{ .CORE_SECRET | trunc 16 }}'
        CSRF_KEY: '{{ .CSRF_KEY | trunc 32 }}'
        JOBSERVICE_SECRET: '{{ .JOBSERVICE_SECRET | trunc 16 }}'
        REGISTRY_HTTP_SECRET: '{{ .REGISTRY_HTTP_SECRET | trunc 16 }}'
        REGISTRY_PASSWD: '{{ .REGISTRY_PASSWD }}'
        REGISTRY_HTPASSWD: '{{ htpasswd "harbor_registry_user" .REGISTRY_PASSWD }}'
  dataFrom:
    - extract:
        key: harbor/harbor-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-database
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: harbor-database
  data:
    - secretKey: password
      remoteRef:
        key: harbor/harbor-postgres-credentials
        property: password
