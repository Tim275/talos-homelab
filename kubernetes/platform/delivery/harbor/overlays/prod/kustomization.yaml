apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - secrets.yaml

components:
  - ../../components/cert-manager
  - ../../components/envoy-gateway
  - ../../components/kube-prometheus-stack
  - ../../components/rook-ceph

patches:
  - path: settings.yaml

helmCharts:
  - name: harbor
    repo: https://helm.goharbor.io
    version: "1.19.4"
    releaseName: harbor
    namespace: harbor
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.yaml
