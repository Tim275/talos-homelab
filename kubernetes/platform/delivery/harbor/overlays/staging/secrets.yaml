apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secrets
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: harbor-secrets
    template:
      engineVersion: v2
      data:
        HARBOR_ADMIN_PASSWORD: '{{ .HARBOR_ADMIN_PASSWORD }}'
        secretKey: '{{ .SECRET_KEY | trunc 16 }}'
        secret: '{{ .CORE_SECRET | trunc 16 }}'
        CSRF_KEY: '{{ .CSRF_KEY | trunc 32 }}'
        JOBSERVICE_SECRET: '{{ .JOBSERVICE_SECRET | trunc 16 }}'
        REGISTRY_HTTP_SECRET: '{{ .REGISTRY_HTTP_SECRET | trunc 16 }}'
        REGISTRY_PASSWD: '{{ .REGISTRY_PASSWD }}'
        REGISTRY_HTPASSWD: '{{ htpasswd "harbor_registry_user" .REGISTRY_PASSWD "bcrypt" }}'
  dataFrom:
    - extract:
        key: harbor/harbor-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-database
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: harbor-database
  data:
    - secretKey: password
      remoteRef:
        key: harbor/harbor-postgres-credentials
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-oidc
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: harbor-oidc
    template:
      engineVersion: v2
      data:
        CONFIG_OVERWRITE_JSON: |
          {{ dict
            "auth_mode" "oidc_auth"
            "oidc_name" "Keycloak"
            "oidc_endpoint" "https://iam.staging.timourhomelab.org/realms/plattform"
            "oidc_client_id" "harbor"
            "oidc_client_secret" .clientSecret
            "oidc_scope" "openid,profile,email,groups,offline_access"
            "oidc_groups_claim" "groups"
            "oidc_admin_group" "cluster-admins"
            "oidc_user_claim" "preferred_username"
            "oidc_verify_cert" true
            "oidc_auto_onboard" true
            "project_creation_restriction" "adminonly"
            | toJson }}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: keycloak/keycloak-harbor-client-secret
        property: clientSecret
---
# source secret is written when the robot account is created
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: harbor-robot-drova-pull
  namespace: harbor
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: harbor-robot-drova-pull
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: harbor/robot-drova-pull
          property: username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: harbor/robot-drova-pull
          property: password
