apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - secrets.yaml

components:
  - ../../components/cert-manager
  - ../../components/cilium
  - ../../components/envoy-gateway
  - ../../components/kube-prometheus-stack
  - ../../components/rook-ceph

patches:
  - path: settings.yaml
  - path: sizing.yaml
  - path: images.yaml

helmCharts:
  - name: harbor
    repo: https://helm.goharbor.io
    version: "1.19.4"
    releaseName: harbor
    namespace: harbor
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.yaml

images:
  - name: docker.io/alpine/k8s
    newTag: 1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
