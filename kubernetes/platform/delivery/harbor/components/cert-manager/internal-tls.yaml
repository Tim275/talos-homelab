apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-core-internal-tls
  namespace: harbor
spec:
  secretName: harbor-core-internal-tls
  commonName: harbor-core
  dnsNames:
    - harbor-core
    - localhost
  ipAddresses:
    - 127.0.0.1
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: homelab-internal-ca
---
