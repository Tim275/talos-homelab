apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-core-token
  namespace: harbor
spec:
  secretName: harbor-core-token
  commonName: harbor-token-service
  duration: 87600h
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Never
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-cluster-issuer
