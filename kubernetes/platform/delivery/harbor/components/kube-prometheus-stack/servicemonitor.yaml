apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: harbor
  namespace: harbor
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app: harbor
  endpoints:
    - port: https-metrics
      honorLabels: true
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-harbor
  namespace: harbor
spec:
  selector:
    matchLabels:
      app: redis-harbor
      app.kubernetes.io/component: metrics
  endpoints:
    - port: redis-exporter
      interval: 60s
      honorLabels: true
