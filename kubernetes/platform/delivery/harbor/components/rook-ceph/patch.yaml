apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-registry
  namespace: harbor
spec:
  template:
    spec:
      containers:
        - name: registry
          env:
            - name: REGISTRY_STORAGE_S3_REGIONENDPOINT
              value: http://ceph-rgw.rook-ceph.svc
            - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE
              value: "true"
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: harbor-s3
                  key: AWS_ACCESS_KEY_ID
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: harbor-s3
                  key: AWS_SECRET_ACCESS_KEY
        - name: registryctl
          env:
            - name: REGISTRY_STORAGE_S3_REGIONENDPOINT
              value: http://ceph-rgw.rook-ceph.svc
            - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE
              value: "true"
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: harbor-s3
                  key: AWS_ACCESS_KEY_ID
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: harbor-s3
                  key: AWS_SECRET_ACCESS_KEY
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: redis-harbor
  namespace: harbor
spec:
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: rook-ceph-block-enterprise
