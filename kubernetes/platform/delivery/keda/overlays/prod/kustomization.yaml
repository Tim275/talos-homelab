apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/kube-prometheus-stack
helmCharts:
  - name: keda
    repo: https://kedacore.github.io/charts
    version: "2.20.2"
    releaseName: keda
    namespace: keda
    includeCRDs: true
    valuesFile: ../../base/values.yaml
