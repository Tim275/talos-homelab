apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO-PVC
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:12-rootless
          env:
            - name: FORGEJO__server__DOMAIN
              value: forgejo.timourhomelab.org
            - name: FORGEJO__server__ROOT_URL
              value: https://forgejo.timourhomelab.org/
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            # sqlite bewusst statt CNPG: Single-User-Git, eine Abhaengigkeit
            # weniger im Restore-Pfad. Daten+app.ini (enthaelt generierte Keys)
            # liegen BEIDE auf dem PVC — /etc/gitea als emptyDir wuerde bei
            # jedem Restart neue SECRET_KEYs erzeugen und Sessions/Tokens killen.
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__server__SSH_DOMAIN
              value: forgejo.timourhomelab.org
            - name: FORGEJO__server__START_SSH_SERVER
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
              subPath: data
            - name: data
              mountPath: /etc/gitea
              subPath: config
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
