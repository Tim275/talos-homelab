apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  services.yaml: |
    - Init:
        - Calendar:
            icon: mdi-calendar-month
            widget:
              type: calendar
              view: monthly
              maxEvents: 10
    - Observability:
        - Loki:
            icon: loki.png
            href: https://grafana.staging.timourhomelab.org/a/grafana-lokiexplore-app/explore
            description: Log Aggregation (VPN-only via NetBird)
        - Tempo:
            icon: tempo.png
            href: https://grafana.staging.timourhomelab.org/a/grafana-exploretraces-app/explore
            description: Distributed Traces (VPN-only via NetBird)
        - Vector:
            icon: vector.png
            href: https://grafana.staging.timourhomelab.org/dashboards?query=vector
            description: Log Pipeline (VPN-only via NetBird)
    - Data:
        - Elasticsearch:
            icon: elasticsearch.png
            href: https://kibana.staging.timourhomelab.org
            description: Search & SIEM Store (VPN-only via NetBird)
    - Proxmox:
        - msa2proxmox:
            icon: proxmox.png
            href: https://msa2proxmox.staging.timourhomelab.org:8006
            description: Compute (VPN-only via NetBird)
        - nipogi:
            icon: proxmox.png
            href: https://nipogi.staging.timourhomelab.org:8006
            description: Compute (VPN-only via NetBird)
        - aoostar:
            icon: proxmox.png
            href: https://aoostar.staging.timourhomelab.org:8006
            description: Ceph-Storage (VPN-only via NetBird)
    - Storage:
        - Ceph:
            icon: ceph.png
            href: https://aoostar.staging.timourhomelab.org:8006
            description: Proxmox, Knoten, Ceph (VPN-only via NetBird)
        - Velero:
            icon: velero.png
            href: https://github.com/Tim275/talos-homelab/tree/main/kubernetes/infrastructure/storage/velero-schedules
            description: Backup Schedules (GitOps)
    - Platform:
        - Sealed Secrets:
            icon: mdi-lock-outline
            href: https://github.com/Tim275/talos-homelab/tree/main/kubernetes/infrastructure/security/sealed-secrets
            description: Secret Encryption (GitOps)
        - cert-manager:
            icon: cert-manager.png
            href: https://grafana.staging.timourhomelab.org/dashboards?query=cert
            description: TLS Certificates (VPN-only via NetBird)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
spec:
  hostnames:
    - homepage.staging.timourhomelab.org
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage-health
  namespace: homepage
spec:
  hostnames:
    - homepage.staging.timourhomelab.org
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  template:
    spec:
      containers:
        - name: homepage
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,homepage.staging.timourhomelab.org"
