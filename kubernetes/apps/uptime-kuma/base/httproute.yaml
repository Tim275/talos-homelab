apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-kuma
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=uptime-kuma"
    gethomepage.dev/name: Status Page
    gethomepage.dev/description: Uptime Monitoring (VPN-only via NetBird)
    gethomepage.dev/group: Observability
    gethomepage.dev/icon: uptime-kuma.png
    # Widget (Sites up/down + Uptime, DACHS-Stil) GEPARKT: braucht eine
    # Status-Page mit Slug 'homelab', und die kann NUR im Kuma-UI entstehen
    # (kein API/IaC-Weg — der dokumentierte Kuma-Trade-off). Bis dahin zeigte
    # die Kachel einen API-Fehler. Aktivieren: im UI Status Pages -> New ->
    # Slug 'homelab' -> Monitore zuweisen, dann die 3 Zeilen einkommentieren.
    # gethomepage.dev/widget.type: uptimekuma
    # gethomepage.dev/widget.url: http://uptime-kuma.uptime-kuma.svc:3001
    # gethomepage.dev/widget.slug: homelab
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - status.timourhomelab.org
  rules:
    - backendRefs:
        - name: uptime-kuma
          port: 3001
