apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: excalidraw
spec:
  hostnames:
    - excalidraw.timourhomelab.org
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: excalidraw-oidc
spec:
  oidc:
    provider:
      issuer: https://iam.timourhomelab.org/realms/kubernetes
      authorizationEndpoint: https://iam.timourhomelab.org/realms/kubernetes/protocol/openid-connect/auth
      tokenEndpoint: https://iam.timourhomelab.org/realms/kubernetes/protocol/openid-connect/token
    redirectURL: https://excalidraw.timourhomelab.org/oauth2/callback
