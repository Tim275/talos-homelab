apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: excalidraw
spec:
  hostnames:
    - excalidraw.staging.timourhomelab.org
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: excalidraw-sw
spec:
  hostnames:
    - excalidraw.staging.timourhomelab.org
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: excalidraw-oidc
spec:
  oidc:
    provider:
      issuer: https://iam.staging.timourhomelab.org/realms/plattform
      authorizationEndpoint: https://iam.staging.timourhomelab.org/realms/plattform/protocol/openid-connect/auth
      tokenEndpoint: https://iam.staging.timourhomelab.org/realms/plattform/protocol/openid-connect/token
    redirectURL: https://excalidraw.staging.timourhomelab.org/oauth2/callback
