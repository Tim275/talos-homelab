apiVersion: apps/v1
kind: Deployment
metadata:
  name: excalidraw
  labels:
    app.kubernetes.io/name: excalidraw
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: excalidraw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: excalidraw
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-pool
                    operator: In
                    values:
                      - stateless
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: excalidraw
          image: excalidraw/excalidraw
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
          volumeMounts:
            - name: sw
              mountPath: /usr/share/nginx/html/sw.js
              subPath: sw.js
              readOnly: true
      volumes:
        - name: sw
          configMap:
            name: excalidraw-sw
