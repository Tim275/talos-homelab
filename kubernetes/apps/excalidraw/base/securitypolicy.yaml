apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: excalidraw-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: excalidraw
  oidc:
    clientIDRef:
      name: excalidraw-oidc-credentials
      group: ""
      kind: Secret
    clientSecret:
      name: excalidraw-oidc-credentials
    cookieNames:
      accessToken: AccessToken-Excalidraw
      idToken: IdToken-Excalidraw
    logoutPath: /oauth2/logout
    refreshToken: true
    scopes:
      - openid
      - profile
      - email
