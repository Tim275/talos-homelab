apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cloudbeaver-credentials-password
  namespace: cloudbeaver
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: cloudbeaver/cloudbeaver-credentials
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudbeaver-credentials
  namespace: cloudbeaver
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudbeaver-credentials
  data:
  - secretKey: password
    remoteRef:
      key: cloudbeaver/cloudbeaver-credentials
      property: password
