apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - secrets.yaml
  - workflow-creds.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: staging
  - pairs:
      environment: staging
    includeSelectors: true

commonAnnotations:
  environment: staging

components:
  - ../../components/envoy-gateway
  - ../../components/kube-prometheus-stack

patches:
  - path: sizing.yaml
  - path: settings.yaml

images:
  - name: docker.io/n8nio/n8n
    newTag: 2.48.7@sha256:fabce3e9678a07d2dde83bd8f5124017f3ec457d0a3fc6b63bb4cec465d63861
