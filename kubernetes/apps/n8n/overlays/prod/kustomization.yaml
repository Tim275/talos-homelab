apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - secrets.yaml
  - workflow-creds.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: prod
  - pairs:
      environment: prod
    includeSelectors: true

commonAnnotations:
  environment: prod

components:
  - ../../components/envoy-gateway
  - ../../components/kube-prometheus-stack

configMapGenerator:
  - name: n8n-workflows
    behavior: merge
    files:
      - workflows/github-homelab-auto-updater.json

patches:
  - path: sizing.yaml
  - path: settings.yaml

images:
  - name: docker.io/n8nio/n8n
    newTag: 2.49.2@sha256:ba471f441bcb515aee81eb41f940a924b82da89a93effab9b4d5731dda576081
