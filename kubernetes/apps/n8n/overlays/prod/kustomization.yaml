apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - secrets.yaml
  - workflow-creds.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: prod
  - pairs:
      environment: prod
    includeSelectors: true

commonAnnotations:
  environment: prod

components:
  - ../../components/envoy-gateway
  - ../../components/kube-prometheus-stack

configMapGenerator:
  - name: n8n-workflows
    behavior: merge
    files:
      - workflows/github-homelab-auto-updater.json

patches:
  - path: sizing.yaml
  - path: settings.yaml

images:
  - name: ghcr.io/n8n-io/n8n
    newTag: 2.48.7  # renovate: github-releases=n8n-io/n8n
  - name: ghcr.io/n8n-io/runners
    newTag: 2.48.7  # renovate: github-releases=n8n-io/n8n
