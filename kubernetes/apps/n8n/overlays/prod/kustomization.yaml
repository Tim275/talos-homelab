apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - secrets.yaml
  - workflow-creds.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: prod
  - pairs:
      environment: prod
    includeSelectors: true

commonAnnotations:
  environment: prod

components:
  - ../../components/envoy-gateway
  - ../../components/kube-prometheus-stack

configMapGenerator:
  - name: n8n-workflows
    behavior: merge
    files:
      - workflows/github-homelab-auto-updater.json

patches:
  - path: sizing.yaml
  - path: settings.yaml

images:
  - name: docker.io/n8nio/n8n
    newTag: 2.49.3@sha256:69f3d3694b42992d7cce232b7ba46f22205e39d5eb61bd235588e4d5d111d8c4
