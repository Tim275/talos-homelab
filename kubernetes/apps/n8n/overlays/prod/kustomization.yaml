apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - secrets.yaml
  - workflow-creds.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: prod
  - pairs:
      environment: prod
    includeSelectors: true

commonAnnotations:
  environment: prod

components:
  - ../../components/envoy-gateway
  - ../../components/kube-prometheus-stack

configMapGenerator:
  - name: n8n-workflows
    behavior: merge
    files:
      - workflows/github-homelab-auto-updater.json

patches:
  - path: sizing.yaml
  - path: settings.yaml

images:
  - name: docker.io/n8nio/n8n
    newTag: 2.49.1@sha256:634c293fee4a4813bbb27b36a3c08d6e1057db0c78e1a83d7734afa3283483f3
