apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-main
  namespace: n8n
spec:
  replicas: 1  # ALWAYS 1 - No leader election in N8N!
  template:
    spec:
      containers:
        - name: n8n
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"     # Homelab: reduced from 500m
            limits:
              memory: "750Mi"
              cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-webhook
  namespace: n8n
spec:
  replicas: 1  # Homelab: reduced from 2 to save resources
  template:
    spec:
      containers:
        - name: n8n-webhook
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"     # Homelab: reduced from 500m
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-worker
  namespace: n8n
spec:
  replicas: 1  # Save resources - HPA can scale up if needed
  template:
    spec:
      containers:
        - name: n8n-worker
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"     # Homelab: reduced from 1000m
            limits:
              memory: "1Gi"
              cpu: "1000m"    # Can burst when needed
---
apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-import-credentials
  namespace: n8n
spec:
  template:
    spec:
      containers:
        - name: import
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-import-workflows
  namespace: n8n
spec:
  template:
    spec:
      containers:
        - name: import
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: n8n-quota
  namespace: n8n
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "20"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: n8n-limits
  namespace: n8n
spec:
  limits:
    - max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 10m
        memory: 32Mi
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
