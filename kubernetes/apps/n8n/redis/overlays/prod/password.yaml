apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-n8n-password
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: redis-n8n-password
  data:
    - secretKey: password
      remoteRef:
        key: n8n-prod/n8n-secrets
        property: QUEUE_BULL_REDIS_PASSWORD
