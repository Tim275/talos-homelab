apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n

resources:
  - namespace.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - configmap.yaml
  - deployment-main.yaml
  - deployment-webhook.yaml
  - deployment-worker.yaml
  - hpa-worker.yaml
  - pdb.yaml
  - service.yaml
  - service-webhook.yaml
  - httproute.yaml
  - import-credentials-job.yaml
  - import-workflows-job.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: prod
      app.kubernetes.io/managed-by: argocd
      criticality: high
  - pairs:
      app.kubernetes.io/name: n8n
      environment: prod
      team: timour
    includeSelectors: true

commonAnnotations:
  environment: prod
  auto-sync: "false"  # Manual approval for prod
  backup.enabled: "true"

configMapGenerator:
  - name: n8n-workflows
    files:
      - workflows/github-homelab-auto-updater.json
    options:
      disableNameSuffixHash: true
