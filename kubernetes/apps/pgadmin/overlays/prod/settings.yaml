apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgadmin
spec:
  hostnames:
    - pgadmin.timourhomelab.org
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: pgadmin
spec:
  template:
    spec:
      containers:
        - name: pgadmin
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@timourhomelab.org
