apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: pgadmin
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "postgres",
          "Group": "homelab",
          "Host": "postgres-rw.postgres.svc",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "pgadmin",
          "SSLMode": "require",
          "PassFile": "/.pgpass"
        }
      }
    }
