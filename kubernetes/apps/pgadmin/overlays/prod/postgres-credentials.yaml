apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-pgpass
  namespace: pgadmin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: pgadmin-pgpass
    template:
      engineVersion: v2
      data:
        pgpass: 'postgres-rw.postgres.svc:5432:*:pgadmin:{{ .password }}'
  data:
    - secretKey: password
      remoteRef:
        key: pgadmin/postgres-credentials
        property: password
