apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: pgadmin-credentials-password
  namespace: pgadmin
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: pgadmin/pgadmin-credentials
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-credentials
  namespace: pgadmin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: pgadmin-credentials
  data:
  - secretKey: password
    remoteRef:
      key: pgadmin/pgadmin-credentials
      property: password
