apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants-config-ml
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    platform.homelab/layer: tenant-config
    team: timour
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  environment: prod
          - list:
              elements:
                - { component: ml,       appName: ml-config,       namespace: ml,       wave: "10" }
  template:
    metadata:
      name: '{{.appName}}'
      labels:
        app.kubernetes.io/managed-by: argocd
        platform.homelab/layer: tenant-config
        platform.homelab/tenant: '{{.component}}'
        team: timour
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: ml
      source:
        repoURL: https://github.com/Tim275/talos-homelab
        targetRevision: main
        path: 'kubernetes/tenants/{{.component}}/overlays/prod'
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        # automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff: { duration: 5s, factor: 2, maxDuration: 3m }
