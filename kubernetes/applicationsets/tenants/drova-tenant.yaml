---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: drova-tenant
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    platform.homelab/tenant: drova
    team: timour
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  drova.tier: enabled
                  environment: prod
          - list:
              elements:
                - component: postgres
                  appName: drova-postgres
                  appProject: platform
                  repoURL: https://github.com/Tim275/talos-homelab
                  path: kubernetes/tenants/drova/postgres/overlays/prod
                  wave: "30"
                - component: kafka
                  appName: drova-kafka
                  appProject: platform
                  repoURL: https://github.com/Tim275/talos-homelab
                  path: kubernetes/tenants/drova/kafka/overlays/prod
                  wave: "30"
                - component: console
                  appName: drova-console
                  appProject: platform
                  repoURL: https://github.com/Tim275/talos-homelab
                  path: kubernetes/tenants/drova/console
                  wave: "60"
                - component: redis
                  appName: redis-drova
                  appProject: platform
                  repoURL: https://github.com/Tim275/talos-homelab
                  path: kubernetes/tenants/drova/redis/overlays/prod
                  wave: "30"
                - component: app
                  appName: drova-prod
                  appProject: apps
                  repoURL: https://github.com/Tim275/drova-gitops
                  path: overlays/production
                  wave: "60"

  template:
    metadata:
      name: '{{.appName}}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: timour-homelab
        platform.homelab/tenant: drova
        platform.homelab/component: '{{.component}}'
        team: timour
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: '{{.appProject}}'
      source:
        repoURL: '{{.repoURL}}'
        targetRevision: main
        path: '{{.path}}'
      destination:
        server: '{{.server}}'
        namespace: drova
      ignoreDifferences:
        - group: bitnami.com
          kind: SealedSecret
          jsonPointers:
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            - /metadata/annotations
            - /metadata/labels
        - group: postgresql.cnpg.io
          kind: Cluster
          managedFieldsManagers:
            - cnpg-controller-manager
        - group: argoproj.io
          kind: Application
          jqPathExpressions:
            - .status
        - group: argoproj.io
          kind: Rollout
          jsonPointers:
            - /spec/replicas
        - kind: Service
          name: api-gateway-canary
          jsonPointers:
            - /spec/selector
        - kind: Service
          name: api-gateway-stable
          jsonPointers:
            - /spec/selector
      syncPolicy:
        syncOptions:
          - CreateNamespace=false
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          - ServerSideDiff=false
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
