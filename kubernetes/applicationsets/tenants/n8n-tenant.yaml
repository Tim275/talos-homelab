---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: n8n-tenant
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    platform.homelab/tenant: n8n
    team: timour
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  n8n.tier: enabled
                  environment: prod
          - list:
              elements:
                - component: postgres
                  appName: n8n-prod-cnpg
                  appProject: platform
                  repoURL: https://github.com/Tim275/talos-homelab
                  path: kubernetes/tenants/n8n-prod/postgres/overlays/prod
                  namespace: n8n-prod
                  wave: "30"
                - component: redis
                  appName: redis-n8n
                  appProject: platform
                  repoURL: https://github.com/Tim275/talos-homelab
                  path: kubernetes/tenants/n8n-prod/redis/overlays/prod
                  namespace: n8n-prod
                  wave: "30"
                - component: app
                  appName: n8n-prod
                  appProject: apps
                  repoURL: https://github.com/Tim275/talos-homelab
                  path: kubernetes/tenants/n8n-prod/app
                  namespace: n8n-prod
                  wave: "60"
  template:
    metadata:
      name: '{{.appName}}'
      labels:
        app.kubernetes.io/managed-by: argocd
        platform.homelab/tenant: n8n
        platform.homelab/component: '{{.component}}'
        team: timour
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: '{{.appProject}}'
      source:
        repoURL: '{{.repoURL}}'
        targetRevision: main
        path: '{{.path}}'
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      ignoreDifferences:
        - group: bitnami.com
          kind: SealedSecret
          jsonPointers:
            - /metadata/annotations
            - /metadata/labels
        - group: postgresql.cnpg.io
          kind: Cluster
          managedFieldsManagers: [cnpg-controller-manager]
        - group: redis.redis.opstreelabs.in
          kind: Redis
          jsonPointers:
            - /spec/kubernetesConfig/updateStrategy
            - /spec/redisExporter/port
            - /spec/storage/volumeClaimTemplate/metadata
            - /spec/storage/volumeClaimTemplate/status
            - /spec/storage/volumeMount
        - group: redis.redis.opstreelabs.in
          kind: RedisReplication
          jsonPointers:
            - /spec/kubernetesConfig/updateStrategy
            - /spec/redisExporter/port
            - /spec/storage/volumeClaimTemplate/metadata
            - /spec/storage/volumeClaimTemplate/status
            - /spec/storage/volumeMount
        - group: apps
          kind: Deployment
          name: n8n-worker
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        # automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=false
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff: { duration: 5s, factor: 2, maxDuration: 3m }
