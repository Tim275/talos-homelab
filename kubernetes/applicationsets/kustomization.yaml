apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

#
resources:
  - infrastructure/operators-stack.yaml   # 17 Apps — infrastructure/operators
  - infrastructure/core-stack.yaml        # 5 Apps — argocd · certs · secrets · mail
  - infrastructure/network-stack.yaml          # 5 Apps (cilium, coredns, gateway, cloudflared, redis-gateway)
  - infrastructure/storage-stack.yaml          # 4 Apps (rook-ceph, rgw, velero, velero-schedules) — velero-ui standalone
  - infrastructure/storage-snapshot.yaml       # csi-snapshot-controller, Project storage
  - infrastructure/observability-stack.yaml    # 15 Apps (prom, loki, tempo, grafana, jaeger, ES, ...)
  - platform/identity-stack.yaml               # 3 Apps (keycloak-db, lldap, keycloak)
  - apps/apps-stack.yaml                       # 2 Apps (audiobookshelf, cloudbeaver)
  - security/security-stack.yaml               # 3 Apps (foundation, compliance, kyverno)

  - tenants/tenants-config.yaml                # 4 Apps namespace+quota+rbac (drova, n8n-prod, keycloak, lldap) @ wave 10
  - tenants/tenants-config-ml.yaml             # ml-config, Project ml
  - tenants/drova-tenant.yaml                  # 4 Apps (postgres, kafka, console, redis)
  - tenants/drova-tenant-app.yaml              # drova-prod, Project apps
  - tenants/n8n-tenant.yaml                    # 2 Apps (postgres, redis)
  - tenants/n8n-tenant-app.yaml                # n8n-prod, Project apps
