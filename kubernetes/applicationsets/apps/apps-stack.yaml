apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-stack
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  environment: prod
          - list:
              elements:
                - { name: pgadmin,     path: kubernetes/apps/pgadmin/overlays/prod,     namespace: pgadmin }
                - { name: uptime-kuma, path: kubernetes/apps/uptime-kuma/overlays/prod, namespace: uptime-kuma }
                - { name: forgejo,     path: kubernetes/apps/forgejo/overlays/prod,     namespace: forgejo }
                - { name: excalidraw,  path: kubernetes/apps/excalidraw/overlays/prod,  namespace: excalidraw }
  template:
    metadata:
      name: '{{.name}}'
      labels:
        app.kubernetes.io/name: '{{.name}}'
        app.kubernetes.io/part-of: apps-stack
        app.kubernetes.io/managed-by: argocd
    spec:
      project: apps
      source:
        repoURL: https://github.com/Tim275/talos-homelab
        targetRevision: main
        path: '{{.path}}'
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: -1
          backoff: { duration: 5s, factor: 2, maxDuration: 3m }
