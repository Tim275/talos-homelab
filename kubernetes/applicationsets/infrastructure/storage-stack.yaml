---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: storage-stack
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    infrastructure.domain: storage
    team: timour
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  storage.tier: enabled
                  environment: prod
          - list:
              elements:
                - { component: rook-ceph,                appName: rook-ceph,                repoURL: https://github.com/Tim275/talos-homelab,     path: kubernetes/infrastructure/storage/rook-ceph/rendered,           namespace: rook-ceph,   wave: "20" }
                - { component: rook-ceph-rgw,            appName: rook-ceph-rgw,            repoURL: https://github.com/Tim275/talos-homelab,     path: kubernetes/infrastructure/storage/radosgateway/overlays/prod,  namespace: rook-ceph,   wave: "20" }
                - { component: velero,                   appName: velero,                   repoURL: https://github.com/Tim275/talos-homelab,     path: kubernetes/infrastructure/storage/velero/overlays/prod,        namespace: velero,      wave: "30" }
                - { component: velero-schedules,         appName: velero-schedules,         repoURL: https://github.com/Tim275/talos-homelab,     path: kubernetes/infrastructure/storage/velero-schedules/overlays/prod,            namespace: velero,      wave: "31" }
                # abgeloest durch rook-ceph, Ordner bleibt als Referenz
                # - { component: minio,                    appName: minio,                    repoURL: https://github.com/Tim275/talos-homelab,     path: kubernetes/infrastructure/storage/minio/overlays/prod,         namespace: minio,       wave: "20" }
                # - { component: proxmox-csi,              appName: proxmox-csi,              repoURL: https://github.com/Tim275/talos-homelab,     path: kubernetes/infrastructure/storage/proxmox-csi/overlays/prod,   namespace: csi-proxmox, wave: "20" }
                # - { component: velero-ui,                appName: velero-ui,                repoURL: https://github.com/Tim275/talos-homelab,     path: kubernetes/infrastructure/storage/velero-ui/overlays/prod,     namespace: velero,      wave: "31" }
  template:
    metadata:
      name: '{{.appName}}'
      labels:
        app.kubernetes.io/managed-by: argocd
        infrastructure.domain: storage
        infrastructure.component: '{{.component}}'
        team: timour
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: infrastructure
      source:
        repoURL: '{{.repoURL}}'
        targetRevision: main
        path: '{{.path}}'
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff: { duration: 5s, factor: 2, maxDuration: 3m }
