apiVersion: v1
kind: ResourceQuota
metadata:
  name: ml-quota
  namespace: ml
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "15"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ml-limits
  namespace: ml
spec:
  limits:
    - max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 20m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
