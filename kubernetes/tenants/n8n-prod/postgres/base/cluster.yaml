---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-postgres
  namespace: n8n-prod
  labels:
    app.kubernetes.io/name: n8n-postgres
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:16.1   # renovate: docker=ghcr.io/cloudnative-pg/postgresql
  postgresql:
    shared_preload_libraries:
      - pgaudit
    parameters:
      pgaudit.log: "ddl,role,write"
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: n8n-postgres-backup-store
      serverName: n8n-postgres
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: n8n-postgres-credentials
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-pool
                operator: In
                values: [stateful]
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: n8n-postgres
          cnpg.io/podRole: instance
