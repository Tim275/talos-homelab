apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-postgres
  namespace: n8n-prod
spec:
  instances: 1
  # Guaranteed QoS — 512Mi = 4x shared_buffers (PG-Default 128MB)
  resources:
    requests:
      memory: 512Mi   # production: 8-16Gi
      cpu: 250m       # production: 2-4 vCPU
    limits:
      memory: 512Mi
      cpu: 250m
  storage:
    size: 8Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: n8n-postgres-pooler
  namespace: n8n-prod
spec:
  instances: 2
