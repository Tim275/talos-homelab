apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: n8n-postgres-credentials-password
  namespace: n8n-prod
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: n8n-prod/n8n-postgres-credentials
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-postgres-credentials
  namespace: n8n-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: n8n-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: n8n
        password: '{{ .password }}'
  data:
  - secretKey: password
    remoteRef:
      key: n8n-prod/n8n-postgres-credentials
      property: password
