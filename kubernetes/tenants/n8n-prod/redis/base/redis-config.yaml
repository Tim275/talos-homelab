# - AOF disabled to prevent fsync timeouts
# - RDB-only snapshots enabled
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-n8n-external-config
  namespace: n8n-prod
data:
  redis.conf: |
    appendonly no
    save 900 1
    save 300 10
    save 60 10000
    # ohne maxmemory laeuft Redis ins Container-Limit und wird OOM-gekillt,
    # statt Keys zu verdraengen. 75% des 1Gi-Limits, wie bei redis-drova.
    maxmemory 768mb
    maxmemory-policy allkeys-lru
