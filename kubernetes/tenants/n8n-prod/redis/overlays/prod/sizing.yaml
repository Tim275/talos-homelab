apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: redis-n8n
  namespace: n8n-prod
spec:
  kubernetesConfig:
    resources:
      requests:
        cpu: 50m     # krr: 8m real
        memory: 128Mi   # 7d max 22Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  redisExporter:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  storage:
    volumeClaimTemplate:
      spec:
        resources:
          requests:
            storage: 1Gi  # Reduced from 8Gi - Redis queue needs minimal storage
