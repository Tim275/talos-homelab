apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: n8n-secrets-n8n-encryption-key
  namespace: n8n-prod
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: n8n-prod/n8n-secrets
        property: N8N_ENCRYPTION_KEY
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: n8n-secrets-queue-bull-redis-password
  namespace: n8n-prod
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
  - name: openbao
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: n8n-prod/n8n-secrets
        property: QUEUE_BULL_REDIS_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: n8n-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: n8n-secrets
  data:
  - secretKey: DB_POSTGRESDB_PASSWORD
    remoteRef:
      key: n8n-prod/n8n-postgres-credentials
      property: password
  - secretKey: N8N_ENCRYPTION_KEY
    remoteRef:
      key: n8n-prod/n8n-secrets
      property: N8N_ENCRYPTION_KEY
  - secretKey: QUEUE_BULL_REDIS_PASSWORD
    remoteRef:
      key: n8n-prod/n8n-secrets
      property: QUEUE_BULL_REDIS_PASSWORD
