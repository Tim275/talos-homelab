apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: n8n-websocket-policy
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    environment: prod
    team: timour
    app.kubernetes.io/environment: prod
    app.kubernetes.io/managed-by: argocd
    criticality: high
  annotations:
    environment: prod
    auto-sync: "false"
    backup.enabled: "true"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: n8n
  timeout:
    http:
      connectionIdleTimeout: 3600s
      maxConnectionDuration: 0s
    tcp:
      connectTimeout: 15s
  connection:
    bufferLimit: 32768
  rateLimit:
    type: Global
    global:
      rules:
        - limit:
            requests: 300
            unit: Minute
          clientSelectors:
            - sourceCIDR:
                value: 0.0.0.0/0
                type: Distinct
        - limit:
            requests: 300
            unit: Minute
          clientSelectors:
            - sourceCIDR:
                value: ::/0
                type: Distinct
