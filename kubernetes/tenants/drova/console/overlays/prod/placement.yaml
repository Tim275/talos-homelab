apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: drova
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: NotIn
                    values: [nipogi]
