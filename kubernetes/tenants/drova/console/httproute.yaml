apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redpanda-console
  namespace: drova
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=redpanda-console"
    gethomepage.dev/name: Redpanda Console
    gethomepage.dev/description: Kafka UI (VPN-only via NetBird)
    gethomepage.dev/group: Data
    # kein redpanda in dashboard-icons/simpleicons — offizielles Logo via GitHub-Org-Avatar
    gethomepage.dev/icon: https://github.com/redpanda-data.png
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - "redpanda.timourhomelab.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: redpanda-console
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: redpanda-basic-auth
  namespace: drova
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: redpanda-console
  basicAuth:
    users:
      name: redpanda-basic-auth
