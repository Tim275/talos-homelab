apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: drova-postgres
  namespace: drova
spec:
  instances: 3
  # Guaranteed QoS (requests == limits): nur so setzt CNPG PG_OOM_ADJUST_VALUE, der OOM-Killer
  # trifft dann die Child-Prozesse vor dem postmaster. 512Mi = 4x shared_buffers (CNPG-Regel).
  resources:
    requests:
      memory: 512Mi   # production: 16-32Gi (shared_buffers 4-8GB)
      cpu: 250m       # production: 4-8 vCPU
    limits:
      memory: 512Mi
      cpu: 250m
  storage:
    size: 10Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: drova-postgres-pooler
  namespace: drova
spec:
  instances: 2
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: drova-postgres-pooler-ro
  namespace: drova
spec:
  instances: 2
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-dr-verify
  namespace: drova
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: verify
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: 1500m, memory: 512Mi}
