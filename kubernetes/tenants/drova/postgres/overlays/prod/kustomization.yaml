apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - grafana-reader-sealed.yaml

components:
  - ../../components/rook-ceph

  - ../../components/dr-verify
patches:
  - path: sizing.yaml
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Pooler
      name: drova-postgres-pooler
      namespace: drova
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            memory: "128Mi"
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Pooler
      name: drova-postgres-pooler-ro
      namespace: drova
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            memory: "128Mi"
