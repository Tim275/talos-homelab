---
apiVersion: v1
kind: Namespace
metadata:
  name: dr-verify
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-dr-verify
  namespace: dr-verify
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-dr-verify
  namespace: dr-verify
subjects:
  - kind: ServiceAccount
    name: cnpg-dr-verify
    namespace: drova
roleRef:
  kind: Role
  name: cnpg-dr-verify
  apiGroup: rbac.authorization.k8s.io
