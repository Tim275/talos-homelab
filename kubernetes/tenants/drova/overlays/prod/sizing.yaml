apiVersion: v1
kind: ResourceQuota
metadata:
  name: drova-quota
  namespace: drova
spec:
  hard:
    requests.cpu: "24"
    requests.memory: 48Gi
    limits.cpu: "48"
    limits.memory: 80Gi
    persistentvolumeclaims: "30"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: drova-limits
  namespace: drova
spec:
  limits:
    - max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 20m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-allowlist-sync
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: sync
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
