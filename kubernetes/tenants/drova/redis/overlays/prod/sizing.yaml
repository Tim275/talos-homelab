apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: redis-drova
  namespace: drova
spec:
  clusterSize: 2
  kubernetesConfig:
    resources:
      requests:
        cpu: 50m
        memory: 96Mi    # 7d max 22Mi
      limits:
        cpu: 500m
        memory: 512Mi
  redisExporter:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m       # was 100m, throttled 33%
        memory: 128Mi
  storage:
    volumeClaimTemplate:
      spec:
        resources:
          requests:
            storage: 2Gi
