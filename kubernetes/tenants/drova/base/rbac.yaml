apiVersion: v1
kind: ServiceAccount
metadata:
  name: drova-admin-sa
  namespace: drova
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-admins
  namespace: drova
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: drova-admin-sa
    namespace: drova
  - kind: Group
    name: "oidc-grp:drova-admins"
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-viewers
  namespace: drova
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: "oidc-grp:drova-viewers"
    apiGroup: rbac.authorization.k8s.io
