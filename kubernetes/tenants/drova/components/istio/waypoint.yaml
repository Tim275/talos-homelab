apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: drova
  labels:
    istio.io/waypoint-for: service
    app.kubernetes.io/managed-by: argocd
    platform.homelab/tenant: drova
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
