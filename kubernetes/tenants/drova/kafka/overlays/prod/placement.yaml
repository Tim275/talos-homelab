apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  namespace: drova
spec:
  template:
    pod:
      tolerations:
        - key: nipogi
          operator: Exists
          effect: PreferNoSchedule
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: drova
spec:
  template:
    pod:
      tolerations:
        - key: nipogi
          operator: Exists
          effect: PreferNoSchedule
