apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/kube-prometheus-stack

patches:
  - path: sizing.yaml
  - target:
      group: kafka.strimzi.io
      version: v1
      kind: KafkaNodePool
      name: controller
      namespace: drova
    patch: |
      - op: add
        path: /spec/storage/volumes/0/size
        value: 2Gi
  - target:
      group: kafka.strimzi.io
      version: v1
      kind: KafkaNodePool
      name: broker
      namespace: drova
    patch: |
      - op: add
        path: /spec/storage/volumes/0/size
        value: 10Gi
