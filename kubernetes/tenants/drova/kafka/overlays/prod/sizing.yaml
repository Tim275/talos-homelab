apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  namespace: drova
spec:
  replicas: 3
  resources:
    requests:
      memory: "512Mi"  # prod: 1Gi
      cpu: "100m"
    limits:
      memory: "1Gi"  # prod: 1500Mi
      cpu: "1000m"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: drova
spec:
  replicas: 3
  resources:
    requests:
      memory: "2Gi"
      cpu: "200m"
    limits:
      memory: "3Gi"
      cpu: "1500m"
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: drova-kafka
  namespace: drova
spec:
  kafkaExporter:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        memory: "256Mi"
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "250m"
    userOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "250m"
---
apiVersion: kafka.strimzi.io/v1
