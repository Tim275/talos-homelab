apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: mm2
  namespace: drova
  labels:
    strimzi.io/cluster: drova-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: [All]
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations: [All]
      - resource:
          type: cluster
        operations: [All]
