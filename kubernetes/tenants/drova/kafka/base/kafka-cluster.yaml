#
# - 3 dedicated controllers (light pods, hold metadata quorum)
# - 3 dedicated brokers (heavy pods, handle data + replication)
# - Dual-role 3pods previously caused KRaft quorum deadlock in Strimzi 0.51 + Kafka 4.1.1
#
#  - Controllers have small, fast-fsync workload (metadata-only)
#  - Brokers have large, throughput-heavy workload (data replication)
#  - Failure-domain separation: broker crash doesn't kill quorum

apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  namespace: drova
  labels:
    strimzi.io/cluster: drova-kafka
    platform.homelab/tenant: drova
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        class: rook-ceph-block-kafka
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      memory: "512Mi"  # prod: 1Gi
      cpu: "100m"
    limits:
      memory: "1Gi"  # prod: 1500Mi
      cpu: "1000m"
  jvmOptions:
    "-Xms": "256m"  # prod: 512m
    "-Xmx": "384m"  # prod: 768m
  template:
    pod:
      priorityClassName: platform-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: node-pool, operator: In, values: [stateful] }
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  strimzi.io/cluster: drova-kafka
                  strimzi.io/controller-role: "true"
              topologyKey: kubernetes.io/hostname
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: drova
  labels:
    strimzi.io/cluster: drova-kafka
    platform.homelab/tenant: drova
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: rook-ceph-block-kafka
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      memory: "2Gi"
      cpu: "200m"
    limits:
      memory: "3Gi"
      cpu: "1500m"
  jvmOptions:
    "-Xms": "1g"
    "-Xmx": "1g"
  template:
    pod:
      priorityClassName: platform-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: node-pool, operator: In, values: [stateful] }
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    strimzi.io/cluster: drova-kafka
                    strimzi.io/broker-role: "true"
                topologyKey: kubernetes.io/hostname
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: drova-kafka
  namespace: drova
  labels:
    platform.homelab/tenant: drova
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.1-IV1
    livenessProbe:
      initialDelaySeconds: 180
      timeoutSeconds: 30
      periodSeconds: 30
      failureThreshold: 20
    readinessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 30
      periodSeconds: 30
      failureThreshold: 20
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: drova-kafka-metrics
          key: kafka-metrics-config.yml
    listeners:
      - name: sasl
        port: 9095
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: "false"
      controller.quorum.election.timeout.ms: 10000
      controller.quorum.fetch.timeout.ms: 20000
      controller.quorum.election.backoff.max.ms: 1000
      num.io.threads: 16
      socket.send.buffer.bytes: 1048576
      socket.receive.buffer.bytes: 1048576
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        memory: "256Mi"
    template:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
  entityOperator:
    template:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
      topicOperatorContainer:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      userOperatorContainer:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    topicOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "250m"
    userOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "250m"
