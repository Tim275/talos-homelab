apiVersion: v1
kind: ResourceQuota
metadata:
  name: lldap-quota
  namespace: lldap
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    persistentvolumeclaims: "5"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lldap-limits
  namespace: lldap
spec:
  limits:
    - max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 10m
        memory: 32Mi
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      type: Container
