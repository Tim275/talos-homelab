apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: audiobookshelf-prod
commonLabels:
  app.kubernetes.io/name: audiobookshelf
  environment: production
  team: timour
commonAnnotations:
  argocd.argoproj.io/sync-wave: "60"

resources:
  - ../../base
  - namespace.yaml

components:
  - ../../components/velero
  - ../../components/envoy-gateway
  - ../../components/rook-ceph

patches:
  - path: sizing.yaml
  - path: settings.yaml
