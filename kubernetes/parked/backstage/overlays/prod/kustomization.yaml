apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backstage
commonAnnotations:
  argocd.argoproj.io/sync-wave: "15"

resources:
  - ../../base

components:
  - ../../components/cilium
  - ../../components/cnpg
  - ../../components/envoy-gateway
  - ../../components/rook-ceph

helmCharts:
  - name: backstage
    repo: https://backstage.github.io/charts
    version: 2.8.0
    releaseName: backstage
    namespace: backstage
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - ../../components/kube-prometheus-stack/values.yaml
      - values.yaml

patches:
  - path: settings.yaml
