apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ml
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: timour-homelab
    app.kubernetes.io/layer: ml
    team: timour
spec:
  description: "ML Department - Training, Serving, Experiment-Tracking"

  syncWindows:
    - kind: deny
      schedule: '0 2 * * *'
      duration: 3h
      timeZone: Europe/Berlin
      applications:
        - '*'
      manualSync: true

  sourceRepos:
    - 'https://github.com/Tim275/talos-homelab'

  destinations:
    - namespace: ml
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  roles:
    - name: ml-admin
      description: "Full access to ml workloads"
      policies:
        - p, proj:ml:ml-admin, applications, *, ml/*, allow
        - p, proj:ml:ml-admin, exec, *, ml/*, allow
      groups:
        - ml-engineers

    - name: ml-operator
      description: "Operational access to ml workloads"
      policies:
        - p, proj:ml:ml-operator, applications, get, ml/*, allow
        - p, proj:ml:ml-operator, applications, sync, ml/*, allow
      groups:
        - sre-team
  orphanedResources:
    warn: true
    ignore:
      - kind: Secret
        name: sh.helm.release.v1.*
      - kind: ConfigMap
        name: sh.helm.release.v1.*
      - kind: ConfigMap
        name: kube-root-ca.crt
      - kind: ConfigMap
        name: istio-ca-root-cert
      - kind: ConfigMap
        name: istio-ca-crl
      - kind: ServiceAccount
        name: default
