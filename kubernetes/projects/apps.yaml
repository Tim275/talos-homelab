apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: timour-homelab
    app.kubernetes.io/layer: apps
    team: timour
spec:
  description: " Enterprise Applications Layer - User-Facing Services"

  syncWindows:
    - kind: deny
      schedule: '0 2 * * *'
      duration: 3h
      timeZone: Europe/Berlin
      applications:
        - '*'
      manualSync: true

  sourceRepos:
    - 'https://github.com/Tim275/talos-homelab'
    - 'https://github.com/Tim275/drova'
    - 'https://github.com/Tim275/drova-gitops'

  destinations:
    - namespace: '*-dev'
      server: 'https://kubernetes.default.svc'
    - namespace: '*-staging'
      server: 'https://kubernetes.default.svc'
    - namespace: '*-prod'
      server: 'https://kubernetes.default.svc'
    - namespace: 'cloudbeaver'
      server: 'https://kubernetes.default.svc'
    - namespace: 'pgadmin'
      server: 'https://kubernetes.default.svc'
    - namespace: 'drova'
      server: 'https://kubernetes.default.svc'
    - namespace: 'uptime-kuma'
      server: 'https://kubernetes.default.svc'
    - namespace: 'forgejo'
      server: 'https://kubernetes.default.svc'

  clusterResourceWhitelist:
    - group: ''
      kind: '*'
    - group: 'apps'
      kind: '*'

    - group: 'rbac.authorization.k8s.io'
      kind: 'Role'
    - group: 'rbac.authorization.k8s.io'
      kind: 'RoleBinding'

    - group: 'networking.k8s.io'
      kind: 'NetworkPolicy'
    - group: 'networking.k8s.io'
      kind: 'Ingress'

    - group: 'networking.istio.io'
      kind: 'VirtualService'
    - group: 'networking.istio.io'
      kind: 'Gateway'
    - group: 'networking.istio.io'
      kind: 'DestinationRule'

  namespaceResourceBlacklist:
    - group: 'rbac.authorization.k8s.io'
      kind: 'ClusterRole'
    - group: 'rbac.authorization.k8s.io'
      kind: 'ClusterRoleBinding'
    - group: ''
      kind: 'Namespace'
    - group: ''
      kind: 'ResourceQuota'
    - group: ''
      kind: 'LimitRange'

  roles:
    - name: apps-admin
      description: "Full apps management access"
      policies:
        - p, proj:apps:apps-admin, applications, *, apps/*, allow
        - p, proj:apps:apps-admin, applicationsets, *, apps/*, allow
        - p, proj:apps:apps-admin, exec, *, apps/*, allow
        - p, proj:apps:apps-admin, logs, *, apps/*, allow
      groups:
        - developers

    - name: apps-operator
      description: "Apps monitoring and troubleshooting"
      policies:
        - p, proj:apps:apps-operator, applications, get, apps/*, allow
        - p, proj:apps:apps-operator, applications, sync, apps/*, allow
        - p, proj:apps:apps-operator, logs, get, apps/*, allow
      groups:
        - sre-team

    - name: apps-viewer
      description: "Read-only apps access"
      policies:
        - p, proj:apps:apps-viewer, applications, get, apps/*, allow
        - p, proj:apps:apps-viewer, logs, get, apps/*, allow
      groups:
        - viewers

  orphanedResources:
    warn: false  # Disable warnings - resources managed via excludes
    ignore:
      - kind: Secret
        name: sh.helm.release.v1.*
      - kind: ConfigMap
        name: sh.helm.release.v1.*
      - kind: Secret
        name: "*-app-*"
      - kind: ConfigMap
        name: "*-app-*"
      - kind: Secret
        name: "*-db-*"
      - kind: ConfigMap
        name: "*-db-*"
      - kind: Secret
        name: "*-n8n-*"
      - kind: ConfigMap
        name: "*-n8n-*"
      - kind: Pod
        name: "*-n8n-*"
      - kind: Secret
        name: "*-mealie-*"
      - kind: ConfigMap
        name: "*-mealie-*"
      - kind: Secret
        name: "*-monitoring-*"
      - kind: ConfigMap
        name: "*-monitoring-*"
      - kind: Pod
        name: "*-istio-proxy-*"
      - kind: ConfigMap
        name: "*-istio-*"
