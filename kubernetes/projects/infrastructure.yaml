apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  labels:

    security.level: high
    team: timour
spec:
  description: "Infrastructure Layer - Core Cluster Services"

  syncWindows:
    - kind: deny
      schedule: '0 2 * * *'
      duration: 3h
      timeZone: Europe/Berlin
      applications:
        - '*'
      manualSync: true
  sourceRepos:
    - 'https://github.com/Tim275/talos-homelab'
    # - 'https://victoriametrics.github.io/helm-charts'  # VictoriaMetrics Helm Repository
    # - 'https://helm.otwld.com/'  # OTWLD Velero UI Helm Repository
    # - 'https://pkgs.tailscale.com/helmcharts'  # Tailscale Operator Helm Repository
    - 'https://ot-container-kit.github.io/helm-charts/'  # OpsTree Redis Operator
    - 'https://kubernetes-sigs.github.io/external-dns/'  # external-dns Helm Repository

  destinations:
    - namespace: 'kube-system'
      server: 'https://kubernetes.default.svc'
    - namespace: 'argocd'
      server: 'https://kubernetes.default.svc'

    - namespace: 'cert-manager'
      server: 'https://kubernetes.default.svc'
    - namespace: 'sealed-secrets'
      server: 'https://kubernetes.default.svc'
    - namespace: 'openbao'
      server: 'https://kubernetes.default.svc'
    - namespace: 'argo-rollouts'
      server: 'https://kubernetes.default.svc'
    # - namespace: 'cloudnative-pg'
    #   server: 'https://kubernetes.default.svc'

    # - namespace: 'cilium'
    #   server: 'https://kubernetes.default.svc'
    # - namespace: 'cilium-spire'
    #   server: 'https://kubernetes.default.svc'
    - namespace: 'cilium-secrets'
      server: 'https://kubernetes.default.svc'
    - namespace: 'istio-system'
      server: 'https://kubernetes.default.svc'
    # - namespace: 'istio-base'
    #   server: 'https://kubernetes.default.svc'
    - namespace: 'istio-cni'
      server: 'https://kubernetes.default.svc'
    # - namespace: 'istio-control-plane'
    #   server: 'https://kubernetes.default.svc'
    # - namespace: 'istio-gateway'
    #   server: 'https://kubernetes.default.svc'
    - namespace: 'gateway'
      server: 'https://kubernetes.default.svc'
    # - namespace: 'metallb'
    #   server: 'https://kubernetes.default.svc'
    - namespace: 'sail-operator'
      server: 'https://kubernetes.default.svc'
    - namespace: 'cloudflared'
      server: 'https://kubernetes.default.svc'

    - namespace: 'rook-ceph'
      server: 'https://kubernetes.default.svc'
    # - namespace: 'rook-ceph-rgw'
    #   server: 'https://kubernetes.default.svc'
    # - namespace: 'proxmox-csi'
    #   server: 'https://kubernetes.default.svc'
    # - namespace: 'csi-drivers'
    #   server: 'https://kubernetes.default.svc'
    - namespace: 'velero'
      server: 'https://kubernetes.default.svc'
    # - namespace: 'longhorn'
    #   server: 'https://kubernetes.default.svc'
    # - namespace: 'minio'
    #   server: 'https://kubernetes.default.svc'

    # - namespace: 'prometheus'
    #   server: 'https://kubernetes.default.svc'
    - namespace: 'grafana'
      server: 'https://kubernetes.default.svc'
    - namespace: 'homepage'
      server: 'https://kubernetes.default.svc'
    # - namespace: 'alertmanager'
    #   server: 'https://kubernetes.default.svc'
    - namespace: 'jaeger'
      server: 'https://kubernetes.default.svc'
    # - namespace: 'metrics-server'
    #   server: 'https://kubernetes.default.svc'
    # - namespace: 'opencost'
    #   server: 'https://kubernetes.default.svc'
    # - namespace: 'loki'
    #   server: 'https://kubernetes.default.svc'
    # - namespace: 'hubble'
    #   server: 'https://kubernetes.default.svc'

    # - namespace: 'vector'
    #   server: 'https://kubernetes.default.svc'
    # - namespace: 'elasticsearch'
    #   server: 'https://kubernetes.default.svc'
    # - namespace: 'kibana'
    #   server: 'https://kubernetes.default.svc'
    # - namespace: 'fluent-bit'
    #   server: 'https://kubernetes.default.svc'
    # - namespace: 'fluentd'
    #   server: 'https://kubernetes.default.svc'
    - namespace: 'opentelemetry'
      server: 'https://kubernetes.default.svc'

    # - namespace: 'tailscale'
    #   server: 'https://kubernetes.default.svc'

    - namespace: 'cnpg-system'
      server: 'https://kubernetes.default.svc'
    - namespace: 'kafka'
      server: 'https://kubernetes.default.svc'
    - namespace: 'keycloak'
      server: 'https://kubernetes.default.svc'
    - namespace: 'monitoring'
      server: 'https://kubernetes.default.svc'
    - namespace: 'elastic-system'
      server: 'https://kubernetes.default.svc'
    - namespace: 'netbird'
      server: 'https://kubernetes.default.svc'
    - namespace: 'external-dns'
      server: 'https://kubernetes.default.svc'
    - namespace: 'redis-operator-system'
      server: 'https://kubernetes.default.svc'
    - namespace: 'reloader'
      server: 'https://kubernetes.default.svc'
    - namespace: 'renovate-operator'
      server: 'https://kubernetes.default.svc'
    - namespace: 'arc-systems'
      server: 'https://kubernetes.default.svc'
    - namespace: 'arc-runners'
      server: 'https://kubernetes.default.svc'
    - namespace: 'keda'
      server: 'https://kubernetes.default.svc'
    - namespace: 'mail'
      server: 'https://kubernetes.default.svc'

  clusterResourceWhitelist:
    - group: ''
      kind: '*'
    - group: 'apps'
      kind: '*'

    - group: 'rbac.authorization.k8s.io'
      kind: '*'

    - group: 'networking.k8s.io'
      kind: '*'
    - group: 'cilium.io'
      kind: '*'
    - group: 'install.istio.io'
      kind: '*'
    - group: 'security.istio.io'
      kind: '*'
    - group: 'networking.istio.io'
      kind: '*'
    - group: 'gateway.networking.k8s.io'
      kind: '*'
    - group: 'sailoperator.io'
      kind: '*'

    - group: 'storage.k8s.io'
      kind: '*'
    - group: 'ceph.rook.io'
      kind: '*'
    - group: 'rook.io'
      kind: '*'
    - group: 'objectbucket.io'
      kind: '*'

    - group: 'monitoring.coreos.com'
      kind: '*'
    - group: 'grafana.integreatly.org'
      kind: '*'
    - group: 'operator.victoriametrics.com'  # VictoriaMetrics Operator CRDs
      kind: '*'

    - group: 'cert-manager.io'
      kind: '*'
    - group: 'acme.cert-manager.io'
      kind: '*'

    - group: 'argoproj.io'
      kind: '*'

    - group: 'bitnami.com'
      kind: '*'

    - group: 'postgresql.cnpg.io'
      kind: '*'

    - group: 'tailscale.com'
      kind: '*'

    - group: 'apiextensions.k8s.io'
      kind: 'CustomResourceDefinition'

    - group: 'apiregistration.k8s.io'
      kind: '*'

    - group: 'admissionregistration.k8s.io'
      kind: '*'

    - group: 'scheduling.k8s.io'
      kind: '*'

  namespaceResourceBlacklist:
    - group: ''
      kind: 'Namespace'
    - group: ''
      kind: 'ResourceQuota'
    - group: ''
      kind: 'LimitRange'

  roles:
    - name: infrastructure-admin
      description: "Full infrastructure management access"
      policies:
        - p, proj:infrastructure:infrastructure-admin, applications, *, infrastructure/*, allow
        - p, proj:infrastructure:infrastructure-admin, applicationsets, *, infrastructure/*, allow
        - p, proj:infrastructure:infrastructure-admin, exec, *, infrastructure/*, allow
        - p, proj:infrastructure:infrastructure-admin, logs, *, infrastructure/*, allow
      groups:
        - platform-engineers

    - name: infrastructure-operator
      description: "Infrastructure monitoring and troubleshooting"
      policies:
        - p, proj:infrastructure:infrastructure-operator, applications, get, infrastructure/*, allow
        - p, proj:infrastructure:infrastructure-operator, applications, sync, infrastructure/*, allow
        - p, proj:infrastructure:infrastructure-operator, logs, get, infrastructure/*, allow
      groups:
        - sre-team

    - name: infrastructure-viewer
      description: "Read-only infrastructure access"
      policies:
        - p, proj:infrastructure:infrastructure-viewer, applications, get, infrastructure/*, allow
        - p, proj:infrastructure:infrastructure-viewer, logs, get, infrastructure/*, allow
      groups:
        - developers
        - viewers

  orphanedResources:
    warn: false  # Disable warnings - resources managed via excludes
    ignore:
      - kind: Secret
        name: sh.helm.release.v1.*
      - kind: ConfigMap
        name: sh.helm.release.v1.*
      - kind: Secret
        name: "*-cnpg-*"
      - kind: ConfigMap
        name: "*-cnpg-*"
      - kind: Pod
        name: "*-cnpg-*"
      - kind: Secret
        name: "*-tls"
      - kind: Certificate
      - kind: Challenge
      - kind: Order
      - kind: Secret
        name: "*-tunnel-*"
      - kind: ConfigMap
        name: "*-tunnel-*"
      - kind: ConfigMap
        name: "rook-*"
      - kind: Secret
        name: "rook-*"
      - kind: Pod
        name: "rook-*"
      - kind: Secret
        name: "argocd-*"
      - kind: ConfigMap
        name: "argocd-*"
