apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: timour-homelab
    app.kubernetes.io/layer: security
    team: timour
spec:
  description: " Enterprise Security Foundation - Zero Trust Architecture"

  syncWindows:
    - kind: deny
      schedule: '0 2 * * *'
      duration: 3h
      timeZone: Europe/Berlin
      applications:
        - '*'
      manualSync: true

  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: security
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: honeytoken
      server: https://kubernetes.default.svc
    - namespace: drova
      server: https://kubernetes.default.svc
    - namespace: gateway
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: grafana
      server: https://kubernetes.default.svc
    - namespace: jaeger
      server: https://kubernetes.default.svc
    - namespace: keycloak
      server: https://kubernetes.default.svc
    - namespace: elastic-system
      server: https://kubernetes.default.svc
    - namespace: uptime-kuma
      server: https://kubernetes.default.svc
    - namespace: opentelemetry
      server: https://kubernetes.default.svc

  sourceRepos:
    - 'https://github.com/Tim275/talos-homelab'

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: kyverno.io
      kind: '*'
    - group: cilium.io
      kind: TracingPolicy

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  roles:
    - name: security-admin
      description: "Full access to security policies"
      policies:
        - p, proj:security:security-admin, applications, *, security/*, allow
        - p, proj:security:security-admin, exec, *, security/*, allow
      groups:
        - security-team

    - name: security-operator
      description: "Operational access to security policies"
      policies:
        - p, proj:security:security-operator, applications, get, security/*, allow
        - p, proj:security:security-operator, applications, sync, security/*, allow
      groups:
        - sre-team

  orphanedResources:
    warn: false  # Disable warnings - resources managed via excludes
    ignore:
      - kind: Secret
        name: sh.helm.release.v1.*
      - kind: ConfigMap
        name: sh.helm.release.v1.*
      - kind: Secret
        name: "*-kyverno-*"
      - kind: ConfigMap
        name: "*-kyverno-*"
      - kind: Pod
        name: "*-kyverno-*"
      - kind: Secret
        name: "*-falco-*"
      - kind: ConfigMap
        name: "*-falco-*"
      - kind: Secret
        name: "*-gatekeeper-*"
      - kind: ConfigMap
        name: "*-gatekeeper-*"
      - kind: Secret
        name: "*-trivy-*"
      - kind: ConfigMap
        name: "*-trivy-*"
      - kind: Secret
        name: "*-pss-*"
      - kind: ConfigMap
        name: "*-pss-*"
