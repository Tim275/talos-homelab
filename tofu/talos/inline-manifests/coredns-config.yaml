# CoreDNS ConfigMap Override
# Day-0 only — applied via Talos inline-manifest at cluster bootstrap.
# Day-2 ownership: ArgoCD (kubernetes/infrastructure/network/coredns/)
# Sync content with kubernetes/infrastructure/network/coredns/base/coredns-config.yaml
# Reason: talosctl upgrade-k8s overrides this; ArgoCD selfHeal restores it.
#
# Forward target:
# Gateway 192.168.0.1 first because UDP 53 to public DNS (8.8.8.8) times out
# from pods in this Proxmox setup. Public DNS kept as fallback only.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class denial
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }

        rewrite name exact iam.timourhomelab.org envoy-gateway-envoy-gateway-ee418b6e.gateway.svc.cluster.local
        # n8n: gleiches Muster — Homepage-Statuscheck (Node-Fetch, kein Browser-UA)
        rewrite name exact n8n.timourhomelab.org envoy-gateway-envoy-gateway-ee418b6e.gateway.svc.cluster.local

        forward . 192.168.0.1 8.8.8.8 1.1.1.1 {
           max_concurrent 1000
           policy sequential
           # ohne das bleibt ein flappender Router "gesund"
           health_check 5s
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
