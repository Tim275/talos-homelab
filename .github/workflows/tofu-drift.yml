name: tofu-drift

# Nightly plan gegen netbird, state, uptime-kuma, harbor und cluster — faengt manuelle Aenderungen
# ausserhalb Git (Drift). Exit 2 = Drift -> Job faellt (sichtbar/notifiziert).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_AZUREAD: true
  ARM_USE_OIDC: true
  TOFU_VERSION: v1.13.9 # renovate: github-releases=opentofu/opentofu

jobs:
  drift:
    name: drift (${{ matrix.module }})
    runs-on: ${{ (matrix.module == 'netbird' || matrix.module == 'state') && 'ubuntu-latest' || 'tofu' }}
    env:
      TF_ENCRYPTION: ${{ matrix.module == 'netbird' && secrets.TF_ENCRYPTION_NETBIRD || matrix.module == 'harbor' && secrets.TF_ENCRYPTION_HARBOR || matrix.module == 'state' && secrets.TF_ENCRYPTION_STATE || secrets.TF_ENCRYPTION_UPTIME_KUMA }}
    strategy:
      fail-fast: false
      matrix:
        module: [netbird, state, uptime-kuma, harbor]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "v1.13.9"
          tofu_wrapper: false

      - name: tofu init
        working-directory: tofu/stacks/${{ matrix.module }}
        run: tofu init -input=false

      - name: tofu plan (detect drift)
        working-directory: tofu/stacks/${{ matrix.module }}
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_publish_apex: true
          TF_VAR_netbird_api_token: ${{ secrets.NETBIRD_API_TOKEN }}
          TF_VAR_uptime_kuma_url: http://uptime-kuma.uptime-kuma.svc.cluster.local:3001
          TF_VAR_harbor_url: http://harbor.harbor.svc.cluster.local
          TF_VAR_harbor_password: ${{ secrets.HARBOR_ADMIN_PASSWORD }}
          TF_VAR_uptime_kuma_password: ${{ secrets.UPTIME_KUMA_PASSWORD }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode -no-color -lock=false | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "2" ]; then
            { echo "### Drift in \`${{ matrix.module }}\`"; echo '```'; tail -60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          [ "$code" = "0" ] && echo "no drift" || { echo "plan error"; exit 1; }

  drift-cluster:
    name: drift (cluster)
    runs-on: tofu
    env:
      TF_ENCRYPTION: ${{ secrets.TF_ENCRYPTION_CLUSTER }}
    steps:
      - name: checkout
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: install opentofu
        run: |
          V="${TOFU_VERSION#v}"
          cd /tmp
          curl -sSfLO "https://github.com/opentofu/opentofu/releases/download/v$V/tofu_${V}_linux_amd64.tar.gz"
          curl -sSfL "https://github.com/opentofu/opentofu/releases/download/v$V/tofu_${V}_SHA256SUMS" | grep " tofu_${V}_linux_amd64.tar.gz$" | sha256sum -c -
          mv "tofu_${V}_linux_amd64.tar.gz" /tmp/tofu.tar.gz
          cd - >/dev/null
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/tofu.tar.gz -C "$HOME/.local/bin" tofu
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: tofu init
        working-directory: tofu/stacks/cluster
        run: tofu init -input=false

      - name: tofu plan (detect drift)
        working-directory: tofu/stacks/cluster
        env:
          TF_VAR_proxmox: ${{ secrets.PROXMOX_CONFIG }}
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
        run: |
          set -o pipefail
          tofu plan -input=false -no-color -lock=false -var 'openbao_seal_config=null' -var 'openbao_values_config=null' -var 'rook_external=null' -out=tfplan | tee plan.txt
          # local_file = kubeconfig/talosconfig, auf einem frischen Clone immer "create"
          n=$(tofu show -json tfplan | jq '[.resource_changes[]?
                | select(.type != "local_file")
                | select(.change.actions != ["no-op"] and .change.actions != ["read"])] | length')
          if [ "$n" -gt 0 ]; then
            { echo "### Drift in \`cluster\` ($n Ressourcen)"; echo '```'; grep -E '^  # |^Plan:' plan.txt | tail -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "no drift"
