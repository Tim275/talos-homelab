name: tofu-root-cd

# Root-Cluster-Modul (tofu/, ohne cloudflare/netbird) — braucht Proxmox + Talos +
# K8s-API, alle nur im LAN erreichbar. Laeuft auf einem self-hosted Runner (ARC,
# kubernetes/infrastructure/operators/github-runner-*) statt GitHub-Cloud-Runnern.
#
# Kein pull_request-Trigger (public Repo, self-hosted Runner — Fork-PRs sollen
# diesen Job nie automatisch anstossen). Nur push zu main + manueller
# workflow_dispatch — passt zur bestehenden Azure-Federated-Credential
# (repo:Tim275/talos-homelab:ref:refs/heads/main), keine neue Azure-Aenderung
# noetig. apply ist noch nicht verdrahtet — erst nach validierten plan-Laeufen.
#
# Checkout/OpenTofu-Install als Shell statt Action: Runner-Image hat kein
# node (actions/runner#4623, offen).

on:
  push:
    branches: [main]
    paths:
      - "tofu/**"
      - "!tofu/cloudflare/**"
      - "!tofu/netbird/**"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_AZUREAD: true
  ARM_USE_OIDC: true

jobs:
  plan:
    name: plan (root)
    runs-on: tofu
    steps:
      - name: checkout
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: install opentofu
        run: |
          curl -sSLo /tmp/tofu.tar.gz https://github.com/opentofu/opentofu/releases/download/v1.12.3/tofu_1.12.3_linux_amd64.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/tofu.tar.gz -C "$HOME/.local/bin" tofu
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: tofu init
        working-directory: tofu
        run: tofu init -input=false

      - name: tofu plan
        working-directory: tofu
        env:
          TF_VAR_proxmox: ${{ secrets.PROXMOX_CONFIG }}
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
        run: tofu plan -input=false -no-color
