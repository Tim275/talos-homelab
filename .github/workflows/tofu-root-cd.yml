name: tofu-root-cd

# LAN-only (Proxmox/Talos/K8s) -> self-hosted Runner
# Runner-Image ohne node -> shell statt JS-Actions (actions/runner#4623)

on:
  pull_request:
    branches: [main]
    paths:
      - "tofu/**"
      - "!tofu/cloudflare/**"
      - "!tofu/netbird/**"
  push:
    branches: [main]
    paths:
      - "tofu/**"
      - "!tofu/cloudflare/**"
      - "!tofu/netbird/**"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_AZUREAD: true
  ARM_USE_OIDC: true

jobs:
  plan:
    # kein Fork-PR auf dem self-hosted Runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: plan (root)
    runs-on: tofu
    steps:
      - name: checkout
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.event.pull_request.head.sha }}
            git checkout ${{ github.event.pull_request.head.sha }}
          else
            git checkout ${{ github.sha }}
          fi

      - name: install opentofu
        run: |
          curl -sSLo /tmp/tofu.tar.gz https://github.com/opentofu/opentofu/releases/download/v1.12.3/tofu_1.12.3_linux_amd64.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/tofu.tar.gz -C "$HOME/.local/bin" tofu
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: tofu init
        working-directory: tofu
        run: tofu init -input=false

      - name: tofu plan
        working-directory: tofu
        env:
          TF_VAR_proxmox: ${{ secrets.PROXMOX_CONFIG }}
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
        run: tofu plan -input=false -no-color | tee plan_output.txt

      # kein gh im Runner-Image
      - name: comment plan on pr
        if: github.event_name == 'pull_request'
        working-directory: tofu
        env:
          GH_TOKEN: ${{ github.token }}
          API: https://api.github.com/repos/${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "#### tofu plan — \`root\`"
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```'
            tail -c 60000 plan_output.txt
            echo '```'
            echo "</details>"
          } > pr_comment.md

          jq -Rs '{body: .}' < pr_comment.md > payload.json

          existing=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "$API/issues/$PR/comments" \
            | jq -r '[.[] | select(.body | startswith("#### tofu plan — `root`")) | .id] | last // empty')

          if [ -n "$existing" ]; then
            curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
              "$API/issues/comments/$existing" -d @payload.json -o /dev/null
          else
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
              "$API/issues/$PR/comments" -d @payload.json -o /dev/null
          fi

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan
    name: apply (root)
    runs-on: tofu
    environment: tofu-apply # Required-Reviewer-Gate
    concurrency:
      group: tofu-apply-root
      cancel-in-progress: false # laufenden apply nie abbrechen
    steps:
      - name: checkout
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: install opentofu
        run: |
          curl -sSLo /tmp/tofu.tar.gz https://github.com/opentofu/opentofu/releases/download/v1.12.3/tofu_1.12.3_linux_amd64.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/tofu.tar.gz -C "$HOME/.local/bin" tofu
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: tofu init
        working-directory: tofu
        run: tofu init -input=false

      - name: tofu apply
        working-directory: tofu
        env:
          TF_VAR_proxmox: ${{ secrets.PROXMOX_CONFIG }}
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
        run: tofu apply -input=false -auto-approve -no-color
