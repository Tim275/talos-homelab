name: tofu-lint

on:
  pull_request:
    paths:
      - "tofu/**/*.tofu"
      - "tofu/**/*.tf"

permissions:
  contents: read

jobs:
  fmt-validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "cloudflare", "netbird", "uptime-kuma"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "1.12.3"

      - name: tofu fmt -check
        working-directory: tofu/${{ matrix.module }}
        run: tofu fmt -check -recursive

      # providers.tofu liest den Proxmox-SSH-Key schon bei validate; der echte Key
      # darf nie ins CI. Ein Wegwerf-Key erfuellt file() und wird nie benutzt.
      - name: Dummy-SSH-Key fuer das root-Modul
        if: matrix.module == '.'
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -q -t ed25519 -f ~/.ssh/id_rsa_proxmox -N "" -C ci-dummy

      - name: tofu validate
        working-directory: tofu/${{ matrix.module }}
        # -backend=false: kein Azure-Login noetig, nur Syntax/Schema-Check.
        # Kein Provider-Token noetig (kein plan/apply) -> keine Secrets in CI.
        run: |
          tofu init -backend=false -input=false
          tofu validate
