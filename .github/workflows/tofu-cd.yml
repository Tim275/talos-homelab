name: tofu-cd

# NUR cloudflare/ + netbird/ — der root-Cluster-Modul (tofu/) braucht Proxmox +
# Talos + K8s-API, alle nur im LAN erreichbar. Ein GitHub-Runner (Cloud) kommt da
# nie hin -> root bleibt bewusst manual-apply (siehe tofu-lint.yml fuer fmt/validate).
#
# Azure-Auth: OIDC (Workload Identity Federation) — keine gespeicherten Azure-
# Secrets. ARM_USE_OIDC=true + die 3 Werte reichen, GitHub liefert das ID-Token
# automatisch ueber die id-token:write-Permission. Kein azure/login-Step noetig
# (der loggt nur die az-CLI ein, das propagiert NICHT zu Terraforms azurerm-
# Backend — offizielles Microsoft-Sample bestaetigt: nur Env-Vars, kein Login-Step).

on:
  pull_request:
    paths:
      - "tofu/cloudflare/**"
      - "tofu/netbird/**"
      - "tofu/uptime-kuma/**"
      - "tofu/uptimerobot/**"
  push:
    branches: [main]
    paths:
      - "tofu/cloudflare/**"
      - "tofu/netbird/**"
      - "tofu/uptime-kuma/**"
      - "tofu/uptimerobot/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_AZUREAD: true
  ARM_USE_OIDC: true

jobs:
  # ohne das lief die Matrix immer ueber alle Module
  changes:
    name: geaenderte Module
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: set
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch) CHANGED="tofu/cloudflare/ tofu/netbird/ tofu/uptime-kuma/" ;;
            pull_request)      CHANGED=$(git diff --name-only "origin/$BASE...HEAD") ;;
            *)
              # $BEFORE ist bei Branch-Erstellung/Force-Push unbrauchbar
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                CHANGED=$(git diff --name-only "$BEFORE" "$SHA")
              else
                CHANGED=$(git diff --name-only "$SHA~1" "$SHA")
              fi
              ;;
          esac

          LIST=""
          for m in cloudflare netbird uptime-kuma uptimerobot; do
            grep -q "^tofu/$m/" <<<"$CHANGED" && LIST="$LIST\"$m\","
          done
          echo "matrix=[${LIST%,}]" >> "$GITHUB_OUTPUT"
          echo "betroffene Module: [${LIST%,}]"

  plan:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.matrix != '[]'
    name: plan (${{ matrix.module }})
    # uptime-kuma ist LAN-only und braucht den in-cluster Runner (ARC scale set "tofu")
    runs-on: ${{ matrix.module == 'uptime-kuma' && 'tofu' || 'ubuntu-latest' }}
    strategy:
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "1.12.3"
          tofu_wrapper: false  # self-hosted runner hat kein node

      - name: tofu init
        working-directory: tofu/${{ matrix.module }}
        run: tofu init -input=false

      - name: tofu plan
        working-directory: tofu/${{ matrix.module }}
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_publish_apex: true
          TF_VAR_netbird_api_token: ${{ secrets.NETBIRD_API_TOKEN }}
          TF_VAR_uptime_kuma_url: http://uptime-kuma.uptime-kuma.svc.cluster.local:3001
          TF_VAR_uptime_kuma_password: ${{ secrets.UPTIME_KUMA_PASSWORD }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          TF_VAR_uptimerobot_api_key: ${{ secrets.UPTIMEROBOT_API_KEY }}
        run: tofu plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt

      # kein Artefakt: die Plan-Datei enthaelt Tokens im Klartext
      - name: Plan-Hash
        id: hash
        working-directory: tofu/${{ matrix.module }}
        run: |
          set -euo pipefail
          H=$(tofu show -json tfplan | jq -S -c '.resource_changes // []' | sha256sum | cut -d' ' -f1)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "Plan-Hash: $H"

      - name: Comment plan on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('tofu/${{ matrix.module }}/plan_output.txt', 'utf8').slice(-60000);
            const body = `#### tofu plan — \`${{ matrix.module }}\`\nplan-hash: \`${{ steps.hash.outputs.hash }}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${output}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const marker = `tofu plan — \`${{ matrix.module }}\``;
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  apply:
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.changes.outputs.matrix != '[]'
    name: apply (${{ matrix.module }})
    runs-on: ${{ matrix.module == 'uptime-kuma' && 'tofu' || 'ubuntu-latest' }}
    environment: tofu-apply # Required-Reviewer-Gate, nur main
    concurrency:
      group: tofu-apply-${{ matrix.module }}
      cancel-in-progress: false # laufenden apply nie abbrechen
    strategy:
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "1.12.3"
          tofu_wrapper: false  # self-hosted runner hat kein node

      - name: tofu init
        working-directory: tofu/${{ matrix.module }}
        run: tofu init -input=false

      - name: tofu plan
        id: replan
        working-directory: tofu/${{ matrix.module }}
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_publish_apex: true
          TF_VAR_netbird_api_token: ${{ secrets.NETBIRD_API_TOKEN }}
          TF_VAR_uptime_kuma_url: http://uptime-kuma.uptime-kuma.svc.cluster.local:3001
          TF_VAR_uptime_kuma_password: ${{ secrets.UPTIME_KUMA_PASSWORD }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          TF_VAR_uptimerobot_api_key: ${{ secrets.UPTIMEROBOT_API_KEY }}
        run: |
          set -euo pipefail
          tofu plan -input=false -no-color -lock-timeout=5m -out=tfplan
          H=$(tofu show -json tfplan | jq -S -c '.resource_changes // []' | sha256sum | cut -d' ' -f1)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "Plan-Hash beim apply: $H"

      # Abweichung = die Welt hat sich seit dem Review geaendert
      - name: Hash gegen den freigegebenen Plan pruefen
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const mod = '${{ matrix.module }}';
            const applyHash = '${{ steps.replan.outputs.hash }}';
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha,
            });
            if (prs.length === 0) {
              core.warning(`Kein PR zu ${context.sha} gefunden — Hash nicht pruefbar, apply laeuft weiter.`);
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prs[0].number,
            });
            const c = comments.find(x => x.body.includes(`tofu plan — \`${mod}\``));
            const m = c && c.body.match(/plan-hash: `([a-f0-9]{64})`/);
            if (!m) {
              core.warning(`Kein plan-hash im PR #${prs[0].number} fuer ${mod} — apply laeuft weiter.`);
              return;
            }
            if (m[1] !== applyHash) {
              core.setFailed(`Plan hat sich seit der Freigabe geaendert.\n  freigegeben: ${m[1]}\n  jetzt:       ${applyHash}`);
            } else {
              core.info(`Plan unveraendert seit der Freigabe (${applyHash.slice(0, 12)}...)`);
            }

      - name: tofu apply
        working-directory: tofu/${{ matrix.module }}
        run: tofu apply -input=false -no-color -lock-timeout=5m tfplan
