name: customer

on:
  workflow_dispatch:
    inputs:
      action:
        description: create, cancel (keeps the databases) or invite (send the invitation again)
        type: choice
        options: [create, cancel, invite]
        default: create
      customer:
        description: Customer number, 1-5 letters then 2-12 digits, e.g. k100
        required: true
      services:
        description: Comma separated, e.g. n8n
        required: false
        default: n8n
      address:
        description: Name chosen by the customer, hosts become <address>-<service> (needed for create)
        required: false
      email:
        description: Contact of the customer, gets the invitation
        required: false

permissions:
  contents: read

jobs:
  order:
    if: inputs.action != 'invite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ vars.CUSTOMER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUSTOMER_APP_PRIVATE_KEY }}
          repositories: talos-homelab-customers
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Tim275/talos-homelab-customers
          token: ${{ steps.app.outputs.token }}
          path: orders
      - run: .github/scripts/customer.sh
        env:
          ACTION: ${{ inputs.action }}
          CUSTOMER: ${{ inputs.customer }}
          ADDRESS: ${{ inputs.address }}
          SERVICES: ${{ inputs.services }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GIT_NAME: ${{ github.actor }}
          GIT_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com

  access:
    needs: order
    if: ${{ !cancelled() && needs.order.result != 'failure' && (inputs.action == 'cancel' || inputs.email != '') }}
    runs-on: tofu
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: .github/scripts/customer-access.sh
        env:
          ACTION: ${{ inputs.action }}
          CUSTOMER: ${{ inputs.customer }}
          ADDRESS: ${{ inputs.address }}
          SERVICES: ${{ inputs.services }}
