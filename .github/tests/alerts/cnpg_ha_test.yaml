rule_files:
  - .rules.generated.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_streaming_replicas{cluster="prod-talos",namespace="postgres",pod="postgres-1"}'
        values: '2x10 1x10 0x20'
      - series: 'cnpg_pg_replication_is_wal_receiver_up{cluster="prod-talos",namespace="postgres",pod="postgres-1"}'
        values: '0x40'
      - series: 'cnpg_pg_replication_streaming_replicas{cluster="prod-talos",namespace="postgres",pod="postgres-2"}'
        values: '0x40'
      - series: 'cnpg_pg_replication_is_wal_receiver_up{cluster="prod-talos",namespace="postgres",pod="postgres-2"}'
        values: '1x40'
      - series: 'cnpg_cluster_spec_instances{cluster="prod-talos",namespace="postgres",cnpg_cluster="postgres"}'
        values: '3x40'
      - series: 'cnpg_pg_replication_streaming_replicas{cluster="prod-talos",namespace="dr-verify",pod="postgres-restore-1"}'
        values: '0x40'
      - series: 'cnpg_pg_replication_is_wal_receiver_up{cluster="prod-talos",namespace="dr-verify",pod="postgres-restore-1"}'
        values: '0x40'
      - series: 'cnpg_cluster_spec_instances{cluster="prod-talos",namespace="dr-verify",cnpg_cluster="postgres-restore"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: CNPGClusterHAWarning
        exp_alerts: []
      - eval_time: 9m
        alertname: CNPGClusterHACritical
        exp_alerts: []
      - eval_time: 18m
        alertname: CNPGClusterHAWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              component: data
              namespace: postgres
              cnpg_cluster: postgres
            exp_annotations:
              runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/docs/runbooks/data.md#cnpgclusterhawarning"
              dashboard_url: "/d/cnpg-postgres?var-namespace=postgres&var-cluster=postgres"
              summary: "CNPG nur noch mit einem Standby: postgres/postgres"
              description: "Ein weiterer Ausfall und es gibt kein Failover-Ziel mehr."
              action: "kubectl cnpg status postgres -n postgres"
      - eval_time: 30m
        alertname: CNPGClusterHACritical
        exp_alerts:
          - exp_labels:
              severity: critical
              component: data
              namespace: postgres
              cnpg_cluster: postgres
            exp_annotations:
              runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/docs/runbooks/data.md#cnpgclusterhacritical"
              dashboard_url: "/d/cnpg-postgres?var-namespace=postgres&var-cluster=postgres"
              summary: "CNPG ohne bereiten Standby: postgres/postgres"
              description: "Kein Standby streamt mehr. Faellt der Primary aus, gibt es kein Failover-Ziel."
              action: "kubectl cnpg status postgres -n postgres"
      - eval_time: 30m
        alertname: CNPGClusterHAWarning
        exp_alerts: []
