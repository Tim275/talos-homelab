rule_files:
  - .rules.generated.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="istio-system",daemonset="ztunnel"}'
        values: '7x30'
      - series: 'kube_daemonset_status_number_ready{namespace="istio-system",daemonset="ztunnel"}'
        values: '7x5 6x25'
    alert_rule_test:
      - eval_time: 5m
        alertname: ZtunnelNodeDown
        exp_alerts: []
      - eval_time: 20m
        alertname: ZtunnelNodeDown
        exp_alerts:
          - exp_labels:
              severity: warning
              component: network
              namespace: istio-system
              daemonset: ztunnel
            exp_annotations:
              runbook_url: "https://github.com/Tim275/talos-homelab/blob/main/kubernetes/scripts/runbooks/network.md#ztunnelnodedown"
              dashboard_url: "https://grafana.timourhomelab.org/d/istio-ztunnel"
              summary: "ztunnel fehlt auf 1 Node(s)"
              description: "Ambient-mTLS-Datapath auf betroffenem Node tot — enrollte Pods dort verlieren Mesh-Traffic."
              action: "kubectl -n istio-system get pods -l app=ztunnel -o wide; DaemonSet-Events pruefen."
