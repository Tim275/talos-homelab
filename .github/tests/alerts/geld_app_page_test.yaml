rule_files:
  - .rules.generated.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="drova", pod="payment-service-1", container="payment", reason="CrashLoopBackOff"}'
        values: '1x15'
      - series: 'kube_pod_container_status_waiting_reason{namespace="drova", pod="redpanda-console-1", container="console", reason="CrashLoopBackOff"}'
        values: '1x15'
      - series: 'kube_pod_container_status_waiting_reason{namespace="n8n-prod", pod="n8n-1", container="n8n", reason="CrashLoopBackOff"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: PodCrashLooping
        exp_alerts:
          - exp_labels: {severity: critical, component: application, namespace: drova, pod: payment-service-1, container: payment, reason: CrashLoopBackOff}
            exp_annotations:
              dashboard_url: "https://grafana.timourhomelab.org/d/k8s-pod-overview"
              summary: "Revenue app pod drova/payment-service-1 is crash looping"
              description: "Container payment of the revenue app in CrashLoopBackOff >5min."
              action: "kubectl logs -n drova payment-service-1 --previous; describe for the crash reason; fix config/image/resources."
          - exp_labels: {severity: warning, component: application, namespace: drova, pod: payment-service-1, container: payment, reason: CrashLoopBackOff}
            exp_annotations:
              dashboard_url: "https://grafana.timourhomelab.org/d/k8s-pod-overview"
              summary: "Pod drova/payment-service-1 is crash looping"
              description: "Container payment in CrashLoopBackOff >5min."
              action: "kubectl logs -n drova payment-service-1 --previous; describe for the crash reason; fix config/image/resources."
          - exp_labels: {severity: warning, component: application, namespace: drova, pod: redpanda-console-1, container: console, reason: CrashLoopBackOff}
            exp_annotations:
              dashboard_url: "https://grafana.timourhomelab.org/d/k8s-pod-overview"
              summary: "Pod drova/redpanda-console-1 is crash looping"
              description: "Container console in CrashLoopBackOff >5min."
              action: "kubectl logs -n drova redpanda-console-1 --previous; describe for the crash reason; fix config/image/resources."
          - exp_labels: {severity: warning, component: application, namespace: n8n-prod, pod: n8n-1, container: n8n, reason: CrashLoopBackOff}
            exp_annotations:
              dashboard_url: "https://grafana.timourhomelab.org/d/k8s-pod-overview"
              summary: "Pod n8n-prod/n8n-1 is crash looping"
              description: "Container n8n in CrashLoopBackOff >5min."
              action: "kubectl logs -n n8n-prod n8n-1 --previous; describe for the crash reason; fix config/image/resources."

  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-homelab", instance="https://drova.timourhomelab.org"}'
        values: '0x10'
      - series: 'probe_success{job="blackbox-homelab", instance="https://homepage.timourhomelab.org"}'
        values: '0x10'
      - series: 'probe_success{job="blackbox-homelab", instance="https://n8n.timourhomelab.org"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: HomelabPublicServiceDown
        exp_alerts:
          - exp_labels: {severity: critical, component: ingress, job: blackbox-homelab, instance: "https://drova.timourhomelab.org"}
            exp_annotations:
              dashboard_url: "https://grafana.timourhomelab.org/d/blackbox-exporter"
              summary: "Public service unreachable: https://drova.timourhomelab.org"
              description: "Blackbox probe to https://drova.timourhomelab.org returned no valid HTTP response for >3min (refused/timeout/5xx)."
              action: "Public URL gives 530 but curl --resolve HOST:443:192.168.0.152 https://HOST/ works -> kubectl -n cloudflared get pods,logs. Otherwise check app pod + HTTPRoute + Envoy filter-chain."
          - exp_labels: {severity: critical, component: ingress, job: blackbox-homelab, instance: "https://homepage.timourhomelab.org"}
            exp_annotations:
              dashboard_url: "https://grafana.timourhomelab.org/d/blackbox-exporter"
              summary: "Public service unreachable: https://homepage.timourhomelab.org"
              description: "Blackbox probe to https://homepage.timourhomelab.org returned no valid HTTP response for >3min (refused/timeout/5xx)."
              action: "Public URL gives 530 but curl --resolve HOST:443:192.168.0.152 https://HOST/ works -> kubectl -n cloudflared get pods,logs. Otherwise check app pod + HTTPRoute + Envoy filter-chain."
      - eval_time: 6m
        alertname: HomelabPublicServiceDown
        exp_alerts:
          - exp_labels: {severity: critical, component: ingress, job: blackbox-homelab, instance: "https://drova.timourhomelab.org"}
            exp_annotations:
              dashboard_url: "https://grafana.timourhomelab.org/d/blackbox-exporter"
              summary: "Public service unreachable: https://drova.timourhomelab.org"
              description: "Blackbox probe to https://drova.timourhomelab.org returned no valid HTTP response for >3min (refused/timeout/5xx)."
              action: "Public URL gives 530 but curl --resolve HOST:443:192.168.0.152 https://HOST/ works -> kubectl -n cloudflared get pods,logs. Otherwise check app pod + HTTPRoute + Envoy filter-chain."
          - exp_labels: {severity: critical, component: ingress, job: blackbox-homelab, instance: "https://homepage.timourhomelab.org"}
            exp_annotations:
              dashboard_url: "https://grafana.timourhomelab.org/d/blackbox-exporter"
              summary: "Public service unreachable: https://homepage.timourhomelab.org"
              description: "Blackbox probe to https://homepage.timourhomelab.org returned no valid HTTP response for >3min (refused/timeout/5xx)."
              action: "Public URL gives 530 but curl --resolve HOST:443:192.168.0.152 https://HOST/ works -> kubectl -n cloudflared get pods,logs. Otherwise check app pod + HTTPRoute + Envoy filter-chain."
          - exp_labels: {severity: warning, component: ingress, job: blackbox-homelab, instance: "https://drova.timourhomelab.org"}
            exp_annotations:
              dashboard_url: "https://grafana.timourhomelab.org/d/blackbox-exporter"
              summary: "Homelab service unreachable: https://drova.timourhomelab.org"
              description: "Blackbox probe to https://drova.timourhomelab.org returned no valid HTTP response for >5min (refused/timeout/5xx)."
              action: "curl --resolve HOST:443:192.168.0.152 https://HOST/ ; check app pod + HTTPRoute + Envoy filter-chain."
          - exp_labels: {severity: warning, component: ingress, job: blackbox-homelab, instance: "https://homepage.timourhomelab.org"}
            exp_annotations:
              dashboard_url: "https://grafana.timourhomelab.org/d/blackbox-exporter"
              summary: "Homelab service unreachable: https://homepage.timourhomelab.org"
              description: "Blackbox probe to https://homepage.timourhomelab.org returned no valid HTTP response for >5min (refused/timeout/5xx)."
              action: "curl --resolve HOST:443:192.168.0.152 https://HOST/ ; check app pod + HTTPRoute + Envoy filter-chain."
          - exp_labels: {severity: warning, component: ingress, job: blackbox-homelab, instance: "https://n8n.timourhomelab.org"}
            exp_annotations:
              dashboard_url: "https://grafana.timourhomelab.org/d/blackbox-exporter"
              summary: "Homelab service unreachable: https://n8n.timourhomelab.org"
              description: "Blackbox probe to https://n8n.timourhomelab.org returned no valid HTTP response for >5min (refused/timeout/5xx)."
              action: "curl --resolve HOST:443:192.168.0.152 https://HOST/ ; check app pod + HTTPRoute + Envoy filter-chain."
