config: kube-prometheus-stack/overlays/prod/alertmanager-prod.yaml
cases:
  - labels: {alertname: LogsAuditClusterAdminBinding, severity: critical, component: security}
    receivers: [telegram-oncall, slack-critical, slack-security]
  - labels: {alertname: LogsAuditBreakGlassUse, severity: critical, component: security}
    receivers: [telegram-oncall, slack-critical, slack-security]
  - labels: {alertname: LogsKeycloakMasterRealmLogin, severity: critical, component: security}
    receivers: [telegram-oncall, slack-critical, slack-security]
  - labels: {alertname: LogsAuditBreakGlassAutomation, severity: warning, component: security}
    receivers: [jira-ticket, slack-security]
  - labels: {alertname: LogsAppSpawnedShell, severity: warning, component: security}
    receivers: [jira-ticket, slack-security]
  - labels: {alertname: KyvernoAdmissionDenied, severity: warning, component: kyverno}
    receivers: [jira-ticket, slack-security]
  - labels: {alertname: HomelabPublicServiceDown, severity: critical, component: ingress}
    receivers: [telegram-oncall, slack-critical]
  - labels: {alertname: HomelabPublicServiceDown, severity: warning, component: ingress}
    receivers: [jira-ticket, slack-default]
  - labels: {alertname: PodCrashLooping, severity: critical, component: application}
    receivers: [telegram-oncall, slack-critical]
  - labels: {alertname: PodCrashLooping, severity: warning, component: application}
    receivers: [jira-ticket, slack-default]
  - labels: {alertname: AlertmanagerFailedReload, severity: warning, component: monitoring}
    receivers: [jira-ticket, slack-default]
  - labels: {alertname: PrometheusTargetSyncFailure, severity: critical, component: monitoring}
    receivers: [telegram-oncall, slack-critical]
  - labels: {alertname: KubePersistentVolumeErrors, severity: critical, component: storage}
    receivers: [telegram-oncall, slack-critical]
  - labels: {alertname: CPUThrottlingHigh, severity: info}
    receivers: ["null"]
  - labels: {alertname: Watchdog, severity: none}
    receivers: [watchdog-heartbeat]
  - labels: {alertname: KubeNodeEviction, severity: warning, component: platform}
    receivers: [jira-ticket, slack-default]
  - labels: {alertname: TrivyConfigAuditInfo, severity: info, component: security}
    receivers: ["null"]
