apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: customer
spec:
  compositeTypeRef:
    apiVersion: customers.tim275.github.io/v1alpha1
    kind: Customer
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- if has "n8n" $xr.spec.services }}
            ---
            apiVersion: customers.tim275.github.io/v1alpha1
            kind: N8nInstance
            metadata:
              name: {{ $xr.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: n8n
            spec:
              address: {{ $xr.spec.address | default $xr.metadata.name }}
            {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
