apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: customers.customers.tim275.github.io
spec:
  scope: Cluster
  group: customers.tim275.github.io
  names:
    kind: Customer
    plural: customers
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [services]
              properties:
                address:
                  description: Hosts are <service>-<address>, empty means the customer number.
                  type: string
                  maxLength: 40
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                services:
                  type: array
                  minItems: 1
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    enum: [n8n]
