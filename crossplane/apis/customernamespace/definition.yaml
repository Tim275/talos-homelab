apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: customernamespaces.platform.tim275.github.io
spec:
  scope: Cluster
  group: platform.tim275.github.io
  names:
    kind: CustomerNamespace
    plural: customernamespaces
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                postgres:
                  description: Allows the namespace to reach the central Postgres.
                  type: boolean
                  default: false
                quota:
                  description: Namespace totals, defaults 1 CPU and 2Gi requested, 4Gi memory limit.
                  type: object
                  properties:
                    requestsCpu:
                      type: string
                    requestsMemory:
                      type: string
                    limitsMemory:
                      type: string
