apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresdatabases.platform.tim275.github.io
spec:
  scope: Cluster
  group: platform.tim275.github.io
  names:
    kind: PostgresDatabase
    plural: postgresdatabases
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [namespace]
              properties:
                namespace:
                  description: Namespace that gets the <name>-postgres secret.
                  type: string
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                secretStore:
                  description: ClusterSecretStore for the password, default openbao.
                  type: string
                appSecretStore:
                  description: ClusterSecretStore for the app secret in spec.namespace, default secretStore.
                  type: string
                secretKey:
                  description: OpenBao key for the password, default platform/<namespace>/<name>-postgres-credentials.
                  type: string
                reclaimPolicy:
                  description: What happens to database, role and password when this object is deleted.
                  type: string
                  enum: [Retain, Delete]
                  default: Retain
                connectionLimit:
                  type: integer
                  default: 10
                  minimum: 1
                  maximum: 100
