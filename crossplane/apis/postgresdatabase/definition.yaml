apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresdatabases.platform.tim275.github.io
spec:
  scope: Cluster
  group: platform.tim275.github.io
  names:
    kind: PostgresDatabase
    plural: postgresdatabases
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [namespace]
              properties:
                namespace:
                  description: Namespace that gets the <name>-postgres secret.
                  type: string
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                secretStore:
                  description: ClusterSecretStore for the password, default openbao.
                  type: string
                secretKey:
                  description: OpenBao key for the password, default <namespace>/<name>-postgres-credentials.
                  type: string
                connectionLimit:
                  type: integer
                  default: 10
                  minimum: 1
                  maximum: 100
