apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: n8ninstance
spec:
  compositeTypeRef:
    apiVersion: customers.tim275.github.io/v1alpha1
    kind: N8nInstance
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: customers
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $env := index .context "apiextensions.crossplane.io/environment" }}
            {{- $id := $xr.metadata.name }}
            {{- $ns := printf "n8n-%s" $id }}
            {{- $vault := printf "customers/%s/n8n" $id }}
            {{- $host := printf "n8n-%s.%s" ($xr.spec.address | default $id) $env.domain }}
            ---
            apiVersion: platform.tim275.github.io/v1alpha1
            kind: CustomerNamespace
            metadata:
              name: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: namespace
            spec:
              postgres: true
            ---
            apiVersion: platform.tim275.github.io/v1alpha1
            kind: PostgresDatabase
            metadata:
              name: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: database
            spec:
              namespace: {{ $ns }}
              secretStore: openbao-customers
              secretKey: {{ $vault }}/postgres
            ---
            apiVersion: external-secrets.io/v1alpha1
            kind: PushSecret
            metadata:
              name: n8n-encryption-key
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: encryption-key-seed
            spec:
              refreshInterval: 1h
              updatePolicy: IfNotExists
              secretStoreRefs:
                - name: openbao-customers
                  kind: ClusterSecretStore
              selector:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: password
              data:
                - match:
                    secretKey: password
                    remoteRef:
                      remoteKey: {{ $vault }}/encryption-key
                      property: key
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: n8n-encryption-key
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: encryption-key
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: openbao-customers
                kind: ClusterSecretStore
              target:
                name: n8n-encryption-key
              data:
                - secretKey: N8N_ENCRYPTION_KEY
                  remoteRef:
                    key: {{ $vault }}/encryption-key
                    property: key
            ---
            apiVersion: external-secrets.io/v1alpha1
            kind: PushSecret
            metadata:
              name: n8n-runners-auth-token
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: runners-token-seed
            spec:
              refreshInterval: 1h
              updatePolicy: IfNotExists
              secretStoreRefs:
                - name: openbao-customers
                  kind: ClusterSecretStore
              selector:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: password
              data:
                - match:
                    secretKey: password
                    remoteRef:
                      remoteKey: {{ $vault }}/runners-auth-token
                      property: token
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: n8n-runners-auth-token
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: runners-token
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: openbao-customers
                kind: ClusterSecretStore
              target:
                name: n8n-runners-auth-token
              data:
                - secretKey: token
                  remoteRef:
                    key: {{ $vault }}/runners-auth-token
                    property: token
            ---
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: n8n
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: deployment
            spec:
              replicas: 1
              strategy:
                type: Recreate
              selector:
                matchLabels:
                  app: n8n
              template:
                metadata:
                  labels:
                    app: n8n
                spec:
                  securityContext:
                    runAsUser: 1000
                    runAsGroup: 1000
                    fsGroup: 1000
                    runAsNonRoot: true
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: n8n
                      image: ghcr.io/n8n-io/n8n:2.48.7  # renovate: github-releases=n8n-io/n8n
                      ports:
                        - name: http
                          containerPort: 5678
                      securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop: [ALL]
                      env:
                        - name: N8N_HOST
                          value: {{ $host }}
                        - name: N8N_PROTOCOL
                          value: https
                        - name: N8N_WEBHOOK_URL
                          value: https://{{ $host }}/
                        - name: N8N_PROXY_HOPS
                          value: "1"
                        - name: N8N_SECURE_COOKIE
                          value: "true"
                        - name: EXECUTIONS_DATA_PRUNE
                          value: "true"
                        - name: EXECUTIONS_DATA_MAX_AGE
                          value: "168"
                        - name: DB_TYPE
                          value: postgresdb
                        - name: DB_POSTGRESDB_HOST
                          valueFrom: {secretKeyRef: {name: {{ $ns }}-postgres, key: host}}
                        - name: DB_POSTGRESDB_PORT
                          valueFrom: {secretKeyRef: {name: {{ $ns }}-postgres, key: port}}
                        - name: DB_POSTGRESDB_DATABASE
                          valueFrom: {secretKeyRef: {name: {{ $ns }}-postgres, key: dbname}}
                        - name: DB_POSTGRESDB_USER
                          valueFrom: {secretKeyRef: {name: {{ $ns }}-postgres, key: username}}
                        - name: DB_POSTGRESDB_PASSWORD
                          valueFrom: {secretKeyRef: {name: {{ $ns }}-postgres, key: password}}
                        - name: N8N_ENCRYPTION_KEY
                          valueFrom: {secretKeyRef: {name: n8n-encryption-key, key: N8N_ENCRYPTION_KEY}}
                        - name: N8N_RUNNERS_MODE
                          value: external
                        - name: N8N_RUNNERS_TASK_TIMEOUT
                          value: "300"
                        - name: N8N_UNVERIFIED_PACKAGES_ENABLED
                          value: "false"
                        - name: N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES
                          value: "268435456"
                        - name: N8N_RUNNERS_AUTH_TOKEN
                          valueFrom: {secretKeyRef: {name: n8n-runners-auth-token, key: token}}
                      resources:
                        requests:
                          cpu: 100m
                          memory: 256Mi
                        limits:
                          memory: 1Gi
                      readinessProbe:
                        httpGet:
                          path: /healthz
                          port: http
                        periodSeconds: 10
                      livenessProbe:
                        httpGet:
                          path: /healthz
                          port: http
                        initialDelaySeconds: 60
                        periodSeconds: 30
                    - name: task-runners
                      image: ghcr.io/n8n-io/runners:2.48.7  # renovate: github-releases=n8n-io/n8n
                      securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop: [ALL]
                      env:
                        - name: N8N_RUNNERS_TASK_BROKER_URI
                          value: http://127.0.0.1:5679
                        - name: N8N_RUNNERS_AUTH_TOKEN
                          valueFrom: {secretKeyRef: {name: n8n-runners-auth-token, key: token}}
                      ports:
                        - name: launcher-health
                          containerPort: 5680
                      readinessProbe:
                        tcpSocket:
                          port: launcher-health
                        periodSeconds: 10
                      resources:
                        requests:
                          cpu: 50m
                          memory: 128Mi
                        limits:
                          memory: 512Mi
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: n8n
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service
            spec:
              selector:
                app: n8n
              ports:
                - name: http
                  port: 5678
                  targetPort: http
            ---
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: n8n
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: route
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              parentRefs:
                - name: envoy-gateway
                  namespace: gateway
                  sectionName: https
              hostnames:
                - {{ $host }}
              rules:
                - backendRefs:
                    - name: n8n
                      port: 5678
    - step: ready
      functionRef:
        name: function-auto-ready
