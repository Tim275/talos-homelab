apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: n8ninstances.customers.tim275.github.io
spec:
  scope: Cluster
  group: customers.tim275.github.io
  names:
    kind: N8nInstance
    plural: n8ninstances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                address:
                  description: Host is n8n-<address>, empty means the customer number.
                  type: string
                  maxLength: 40
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
